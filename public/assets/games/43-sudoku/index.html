}, 250);
newGame();

/* ---------- deterministic test hooks ---------- */
function gameState() {
  return {
    mode: gm, clues, difficulty, selected: sel, notesOn, mistakes: mist, hints: hintsUsed,
    elapsed: Math.round(elapsedMs() / 1000), clock: Math.round(blitzLeft() / 1000), filled: val.filter(Boolean).length,
    done, won: done && lastWin, score: lastScore, menuPaused, digits: val.slice(),
    achievements: typeof Save !== 'undefined' && Save.load ? (Save.load(GAME_ID).achievements || []) : [],
  };
}
function setRun(o) {
  const src = o || {};
  if (src.mistakes != null) mist = Math.max(0, Number(src.mistakes) || 0);
  if (src.hints != null) hintsUsed = Math.max(0, Number(src.hints) || 0);
  if (src.elapsed != null) { clockAccum = Math.max(0, Number(src.elapsed) || 0); clockSince = null; }
  if (src.selected != null) sel = Math.max(0, Math.min(80, Number(src.selected) || 0));
  if (src.notesMode != null) notesOn = !!src.notesMode;
  render(); return gameState();
}
if (/(\?|&)test=1(?:&|$)/.test(location.search)) {
  window.SudokuTest = {
    state: gameState,
    modes: () => MODES.map((m) => m.id),
    setMode: (id) => GameUI.setMode(id),
    getMode: () => gm,
    restart: () => { ApexGameMenuActions.restart(); return gameState(); },
    setRun,
    complete: () => { val = sol.slice(); nts = Array(81).fill(0); finishRun(true); render(); return gameState(); },
    fail: () => { finishRun(false); return gameState(); },
    tick: (ms) => { clockAccum = Math.max(0, clockAccum + (Number(ms) || 0)); clockSince = null; if (!done && gm === 'blitz' && blitzLeft() <= 0) finishRun(false); else render(); return gameState(); },
    place: (n) => { put(Number(n)); return gameState(); },
    select: (i) => { sel = Math.max(0, Math.min(80, Number(i) || 0)); render(); return gameState(); },
    hint: () => { hint(); return gameState(); },
    erase: () => { erase(); return gameState(); },
    undo: () => { undo(); return gameState(); },
    toggleNotes: () => { setNotes(); return gameState(); },
    solution: () => sol.slice(),
    puzzle: () => val.map((v, i) => giv[i] ? v : 0),
    close: () => { const d = document.getElementById('bk-dlg'); if (d && d.open) d.close(); return true; },
    modalOpen: () => { const d = document.getElementById('bk-dlg'); return !!(d && d.open); },
    cosmetic: (slot, id) => { applyCosmetic(slot, id); return { slot, id: cosmeticKey(id) }; },
    cosmeticList: () => (window.Meta && Meta.getCosmetics ? Meta.getCosmetics(GAME_ID) : []),
    colors: () => ({ skin: look.skin, user: SKINS[look.skin], palette: look.palette, cell: bd.style.getPropertyValue('--sd-cell').trim(), peer: bd.style.getPropertyValue('--sd-peer').trim(), effect: look.effect, theme: look.theme, selected: bd.style.getPropertyValue('--sd-sel').trim(), frame: bd.style.getPropertyValue('--sd-frame').trim(), aura: bd.style.getPropertyValue('--sd-aura').trim() }),
    stats: () => GameUI.stats(),
    achievements: () => (Save.load(GAME_ID).achievements || []),
    menuPaused: (value) => { menuPaused = !!value; return menuPaused; },
    start: () => { resumeClock(); return gameState(); },
  };
}
</script>
