<script>
/* Ember Serpent — grid-snake with smooth movement, bonus fruit, levels and rock hazards.
   Two skins share the same rules (press K, or the paint button on touch, to switch; the choice is remembered):
     "ember"   — lava-forged obsidian board, glowing fire serpent, ember trail, flame bite.
     "classic" — the original green serpent on the dark garden board. */
const A = Arcade;
const GAME_ID = 'ember-serpent';
const COLS = 25, ROWS = 16, C = 28, OX = 10, OY = 46, W = 720, H = 520, PER_LEVEL = 6, MAX_LEVEL = 10;
const DIRS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
const SKIN_KEY = 'ember-serpent-skin';
const COMBO_WINDOW = 200;
const MODE_INFO = {
  classic: { label: 'CLASSIC', fixedWrap: false },
  gate: { label: 'SERPENT GATE', fixedWrap: true },
  gauntlet: { label: 'MOLTEN GAUNTLET', fixedWrap: false },
  daily: { label: 'DAILY EMBER', fixedWrap: true },
};
const LOOKS = {
  ember: { outline: '#3b0d06', headA: '#fdba74', headB: '#ea580c', bodyA: '#fb923c', bodyB: '#b91c1c', belly: '253,230,138', core: '253,224,71', horn: '#7c2d12', eye: '#fde047', pupil: '#1c0a05', aura: 'rgba(251,146,60,.16)', flameA: '253,186,116', flameB: '254,240,138', trail: ['#fb923c', '#fbbf24', '#f87171'], sparkA: '251,146,60', sparkB: '253,224,71', flash: '253,230,138' },
  solar: { outline: '#3f2a05', headA: '#fef3c7', headB: '#f59e0b', bodyA: '#fbbf24', bodyB: '#b45309', belly: '255,247,205', core: '255,236,150', horn: '#78350f', eye: '#fff7ed', pupil: '#2a1703', aura: 'rgba(251,191,36,.18)', flameA: '253,230,138', flameB: '255,255,235', trail: ['#fbbf24', '#fde68a', '#f97316'], sparkA: '251,191,36', sparkB: '254,240,138', flash: '253,230,138' },
  venom: { outline: '#052e22', headA: '#a7f3d0', headB: '#059669', bodyA: '#34d399', bodyB: '#065f46', belly: '190,255,220', core: '167,243,208', horn: '#064e3b', eye: '#d9f99d', pupil: '#04231a', aura: 'rgba(52,211,153,.16)', flameA: '110,231,183', flameB: '209,250,229', trail: ['#34d399', '#a7f3d0', '#22d3ee'], sparkA: '52,211,153', sparkB: '167,243,208', flash: '167,243,208' },
  frost: { outline: '#0b2440', headA: '#bae6fd', headB: '#0284c7', bodyA: '#38bdf8', bodyB: '#1e40af', belly: '219,234,254', core: '224,242,254', horn: '#0c2d48', eye: '#e0f2fe', pupil: '#061a2e', aura: 'rgba(56,189,248,.18)', flameA: '125,211,252', flameB: '224,242,254', trail: ['#38bdf8', '#a5f3fc', '#818cf8'], sparkA: '56,189,248', sparkB: '165,243,252', flash: '186,230,253' },
};
const PALETTES = { 'ember-serpent:solar-palette': LOOKS.solar, 'ember-serpent:venom-palette': LOOKS.venom, 'ember-serpent:frost-palette': LOOKS.frost };
let look = LOOKS.ember;
let cur, prev, dir, queue, grow, tickT, interval, food, bonus, rocks, level, eaten, wrap, flick, dead;
let eatFlash = 0, flash = 0;
let skin = 'ember';
let activeMode = 'classic', endless = false, dailySeed = 0, rng = Math.random, lastInitMode = null, lastInitSeed = null;
let combo = 0, comboT = 0, runEaten = 0, gems = 0, trailBoost = false, speedScale = 1, shakeScale = 1;
let preferredWrap = false;
try {
  const storedSkin = localStorage.getItem(SKIN_KEY); if (storedSkin === 'classic' || storedSkin === 'ember') skin = storedSkin;
  const saved = window.Save && Save.load ? Save.load(GAME_ID) : {};
  preferredWrap = !!(saved.settings && saved.settings.wrap);
} catch (e) { /* storage blocked: stay on the defaults */ }
function setSkin(G, s) {
  skin = s; try { localStorage.setItem(SKIN_KEY, s); } catch (e) { /* ignore */ }
  A.sfx('select'); G.popup(W / 2, 70, 'Skin: ' + (s === 'ember' ? 'Ember (fire serpent)' : 'Classic (green serpent)'), '#fde68a', 18);
}

function makeRng(seed) {
  if (!seed) return Math.random;
  let a = seed >>> 0;
  return function () {
    a += 0x6d2b79f5;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function readSeed() {
  try {
    const raw = new URLSearchParams(location.search).get('seed');
    const value = Number(raw);
    return raw !== null && raw !== '' && Number.isFinite(value) ? Math.floor(value) : 0;
  } catch (e) { return 0; }
}
function todaySeed() {
  const d = new Date(), stamp = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  let x = stamp ^ 0x5f3759df;
  for (const ch of GAME_ID) x = Math.imul(x ^ ch.charCodeAt(0), 16777619);
  return x >>> 0 || 1;
}
function seedFor(modeId) { return modeId === 'daily' ? todaySeed() : readSeed(); }
const rnd = (a, b) => a + rng() * (b - a);
const rndi = (a, b) => Math.floor(a + rng() * (b - a + 1));
function comboMult() { return 1 + Math.min(9, combo) * 0.15; }
function bumpCombo() {
  combo = Math.min(9, combo + 1);
  comboT = COMBO_WINDOW;
  if (combo >= 5) unlock('combo-five');
}
function unlock(id) {
  const saved = Save.load(GAME_ID);
  if ((Array.isArray(saved.achievements) ? saved.achievements : []).includes(id)) return;
  Save.update(GAME_ID, { achievements: [id] });
  if (window.Apex && Apex.unlockAchievement) Apex.unlockAchievement(id, GAME_ID);
  if (window.UI && UI.toast) UI.toast(id.replace(/-/g, ' '), { color: '#fb923c' });
}
function persistProgress(G, lvl) {
  const saved = Save.load(GAME_ID);
  const best = Math.max(Number((saved.stats || {}).bestLevel) || 0, lvl);
  const patch = { stats: { bestLevel: best } };
  if (lvl > Number(saved.level || 0)) patch.level = lvl;
  Save.update(GAME_ID, patch);
  if (window.Apex && Apex.report) Apex.report({ gameId: GAME_ID, type: 'level_complete', level: lvl, score: G.score, mode: activeMode });
}
function hudText() {
  const lv = endless ? 'LV ' + level : 'LV ' + level + '/' + MAX_LEVEL;
  return lv + ' · ' + eaten + '/' + PER_LEVEL + ' · COMBO ' + (combo > 0 ? '×' + comboMult().toFixed(1) : '—');
}
function modeLabel() {
  const info = MODE_INFO[activeMode] || MODE_INFO.classic;
  if (activeMode === 'daily') return info.label + ' · seed ' + String(dailySeed).slice(-5);
  if (activeMode === 'gauntlet') return info.label + ' · endless';
  if (activeMode === 'gate') return info.label + ' · always wraps';
  return info.label + ' · ' + (wrap ? 'wrap' : 'solid walls');
}

const px = (x) => OX + (x + 0.5) * C, py = (y) => OY + (y + 0.5) * C;
const occupied = (x, y) => cur.some((s) => s.x === x && s.y === y) || rocks.some((r) => r.x === x && r.y === y) ||
  (food && food.x === x && food.y === y) || (bonus && bonus.x === x && bonus.y === y);
function freeCell() {
  for (let i = 0; i < 400; i++) { const x = rndi(0, COLS - 1), y = rndi(0, ROWS - 1); if (!occupied(x, y)) return { x, y }; }
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!occupied(x, y)) return { x, y }; // crowded board: scan for any free cell
  return null;
}
function speedFor(l) { return Math.max(4, 10 - Math.floor((l - 1) * 0.7)); }
function tickInterval(l) { return Math.max(3, Math.round(speedFor(l) / speedScale)); }
function buildRocks() {
  rocks = [];
  const n = Math.min(endless ? 40 : 26, (level - 1) * 3), h = cur[0];
  for (let i = 0; i < n; i++) {
    for (let k = 0; k < 60; k++) {
      const x = rndi(0, COLS - 1), y = rndi(0, ROWS - 1);
      let ok = !occupied(x, y) && Math.abs(x - h.x) + Math.abs(y - h.y) > 5;
      for (let s = 1; s <= 6 && ok; s++) if (x === h.x + dir[0] * s && y === h.y + dir[1] * s) ok = false;
      if (ok) { rocks.push({ x, y, v: rndi(0, 2) }); break; }
    }
  }
}

/* ---------- baked art (ember skin) ---------- */
function bgSprite() {
  return Fx.bake('ember-bg', W, H, (c) => {
    A.sky(c, W, H, ['#0e0508', '#1a0a0a', '#2a0e07']);
    c.fillStyle = '#12080a';
    c.beginPath(); c.moveTo(0, 46);
    for (let x = 0; x <= W; x += 24) c.lineTo(x, 40 - Math.abs(Math.sin(x * 0.013)) * 22 - Math.sin(x * 0.04 + 1) * 4);
    c.lineTo(W, 46); c.closePath(); c.fill();
    const cg = c.createRadialGradient(W * 0.72, 24, 2, W * 0.72, 24, 70);
    cg.addColorStop(0, 'rgba(251,146,60,.4)'); cg.addColorStop(1, 'rgba(251,146,60,0)');
    c.fillStyle = cg; c.fillRect(W * 0.72 - 70, 0, 140, 80);
    const lg = c.createLinearGradient(0, H - 40, 0, H);
    lg.addColorStop(0, 'rgba(249,115,22,0)'); lg.addColorStop(1, 'rgba(249,115,22,.2)');
    c.fillStyle = lg; c.fillRect(0, H - 40, W, 40);
  });
}
function boardSprite() {
  return Fx.bake('ember-board', COLS * C + 8, ROWS * C + 8, (c, w, h) => {
    c.fillStyle = '#100808'; c.fillRect(0, 0, w, h);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const ox = 4 + x * C, oy = 4 + y * C, v = A.hash(x, y);
      c.fillStyle = (x + y) % 2 ? '#1b1211' : '#150e0e'; c.fillRect(ox, oy, C, C);
      c.fillStyle = 'rgba(255,255,255,' + (0.025 + v * 0.03).toFixed(3) + ')'; c.fillRect(ox + 1, oy + 1, C - 2, 2);
      c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(ox, oy + C - 2, C, 2);
      if (v > 0.8) {
        c.strokeStyle = 'rgba(251,146,60,' + (0.14 + v * 0.16).toFixed(2) + ')'; c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(ox + 4, oy + C - 6); c.lineTo(ox + C * 0.5, oy + C * 0.5); c.lineTo(ox + C - 5, oy + 6); c.stroke();
      }
    }
    const g = c.createRadialGradient(w / 2, h + 40, 10, w / 2, h + 40, w * 0.6);
    g.addColorStop(0, 'rgba(249,115,22,.2)'); g.addColorStop(1, 'rgba(249,115,22,0)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  });
}

function init(G) {
  cur = [{ x: 12, y: 8 }, { x: 11, y: 8 }, { x: 10, y: 8 }, { x: 9, y: 8 }];
  prev = cur.map((s) => ({ ...s }));
  dir = [1, 0]; queue = []; grow = 0; tickT = 0; level = 1; eaten = 0; interval = tickInterval(1);
  rocks = []; bonus = null; food = null; flick = 0; dead = false; eatFlash = 0; flash = 0;
  endless = activeMode === 'gauntlet';
  combo = 0; comboT = 0; runEaten = 0; gems = 0;
  wrap = activeMode === 'gate' ? true : activeMode === 'daily' ? false : preferredWrap;
  lastInitMode = activeMode;
  lastInitSeed = dailySeed;
  food = freeCell();
  if (G) { G.hudL = hudText(); G.hudR = 'SCORE 0 · BEST ' + Math.max(G.hi || 0, 0); }
}

function levelUp(G) {
  if (!endless && level >= MAX_LEVEL) {
    G.addScore(500);
    persistProgress(G, MAX_LEVEL);
    if (activeMode === 'classic') unlock('serpent-supreme');
    if (activeMode === 'daily') unlock('daily-ember');
    return G.win('Serpent Supreme!', 'You cleared all ' + MAX_LEVEL + ' levels');
  }
  level++; eaten = 0; interval = tickInterval(level);
  buildRocks();
  persistProgress(G, level);
  if (level >= 5) unlock('rockfall');
  if (endless && level >= 10) unlock('gauntlet-ten');
  A.sfx('power'); G.shake(5); flash = 1;
  G.popup(W / 2, H / 2 - 20, 'LEVEL ' + level, '#fde68a', 34);
  G.ring(px(cur[0].x), py(cur[0].y), '#fde68a', 110, 34);
  if (skin === 'ember') G.ring(px(cur[0].x), py(cur[0].y), look.bodyA, 70, 24);
}

function die(G) {
  dead = true; A.sfx('hurt'); A.sfx('boom'); G.shake(14); G.freeze(8);
  for (const s of cur) G.burst(px(s.x), py(s.y), 4, { color: look.trail, speed: 4, glow: true, life: 36, grav: 0.05 });
  if (activeMode === 'daily') {
    const saved = Save.load(GAME_ID);
    Save.update(GAME_ID, { stats: { dailyBest: Math.max(Number((saved.stats || {}).dailyBest) || 0, G.score) } });
    unlock('daily-ember');
  }
  G.over('Burned Out', modeLabel() + ' · level ' + level + ' · length ' + cur.length);
}

function tick(G) {
  if (queue.length) dir = queue.shift();
  const old = cur.map((s) => ({ ...s }));
  let nx = cur[0].x + dir[0], ny = cur[0].y + dir[1];
  if (wrap) { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }
  else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return die(G);
  const body = grow > 0 ? cur : cur.slice(0, -1);
  if (body.some((s) => s.x === nx && s.y === ny) || rocks.some((r) => r.x === nx && r.y === ny)) return die(G);
  cur.unshift({ x: nx, y: ny });
  if (grow > 0) grow--; else cur.pop();
  prev = cur.map((s, i) => (old[i] ? old[i] : { ...s }));
  const hx = px(nx), hy = py(ny);
  if (skin === 'ember') {
    const tl = cur[cur.length - 1];
    const trailCount = trailBoost ? 2 : 1;
    G.burst(px(tl.x), py(tl.y), trailCount, { color: look.trail, speed: 0.9, min: 0.2, glow: true, life: 26, size: 2, grav: -0.03 });
  }
  if (food && nx === food.x && ny === food.y) {
    const mult = comboMult();
    const pts = Math.round(10 * level * (wrap ? 1 : 1.5) * mult);
    G.addScore(pts); grow++; eaten++; runEaten++; bumpCombo(); A.sfx('eat');
    G.popup(hx, hy - 14, '+' + pts + (combo > 1 ? '  ×' + mult.toFixed(1) : ''), '#fecaca', 16);
    if (skin === 'ember') {
      eatFlash = 1; Fx.squash.punch('head', { sx: 1.28, sy: 0.82 });
      G.burst(hx, hy, 14, { color: ['#34d399', '#a7f3d0', '#fff'], speed: 3.5, glow: true, life: 26 });
      G.ring(hx, hy, '#34d399', 44, 18);
    } else G.burst(hx, hy, 14, { color: ['#f87171', '#fca5a5', '#fff'], speed: 3.5, glow: true, life: 26 });
    if (runEaten === 1) unlock('first-bite');
    if (runEaten >= 10) unlock('ten-catch');
    food = freeCell();
    if (!food) return G.win('Board Cleared!', 'The serpent fills the whole board');
    if (eaten % 5 === 0 && !bonus) { const b = freeCell(); if (b) { bonus = { ...b, t: 540 }; A.sfx('select'); } }
    if (eaten >= PER_LEVEL) levelUp(G);
  } else if (bonus && nx === bonus.x && ny === bonus.y) {
    const mult = comboMult();
    const pts = Math.round(50 * level * mult);
    G.addScore(pts); grow += 2; gems++; bumpCombo(); A.sfx('gem'); A.sfx('coin');
    if (gems >= 3) unlock('gem-collector');
    if (skin === 'ember') { eatFlash = 1; Fx.squash.punch('head', { sx: 1.32, sy: 0.78 }); }
    G.popup(hx, hy - 14, 'BONUS +' + pts + (combo > 1 ? '  ×' + mult.toFixed(1) : ''), '#fde68a', 18);
    G.burst(hx, hy, 24, { color: ['#fde68a', '#fbbf24', '#fff'], speed: 4.5, glow: true, life: 34 });
    G.ring(hx, hy, '#fde68a', 70); bonus = null;
  }
}

function update(G) {
  Fx.update(1);
  eatFlash *= 0.9; flash *= 0.92;
  for (const k in DIRS) {
    if (A.hit(k)) {
      const d = DIRS[k], last = queue.length ? queue[queue.length - 1] : dir;
      if (queue.length < 3 && !(d[0] === -last[0] && d[1] === -last[1]) && !(d[0] === last[0] && d[1] === last[1])) { queue.push(d); A.sfx('tick'); }
    }
  }
  if (A.hit('KeyT')) {
    const info = MODE_INFO[activeMode] || MODE_INFO.classic;
    if (info.fixedWrap) {
      A.sfx('blip');
      G.popup(W / 2, 70, activeMode === 'gate' ? 'Serpent Gate always wraps' : 'Daily Ember keeps solid walls', '#a5f3fc', 16);
    } else {
      wrap = !wrap; preferredWrap = wrap;
      try { Save.update(GAME_ID, { settings: { wrap } }); } catch (e) { /* ignore */ }
      A.sfx('select'); G.popup(W / 2, 70, wrap ? 'Wrap-around ON' : 'Solid walls (+50% score)', '#a5f3fc', 18);
    }
  }
  if (A.hit('KeyK')) setSkin(G, skin === 'ember' ? 'classic' : 'ember');
  flick++;
  if (comboT > 0 && --comboT === 0) combo = 0;
  if (bonus && --bonus.t <= 0) bonus = null;
  if (++tickT >= interval) { tickT = 0; tick(G); }
  if (activeMode === 'gate' && G.score >= 500) unlock('gate-runner');
  G.hudL = hudText();
  G.hudR = 'SCORE ' + G.score + ' · BEST ' + Math.max(G.hi || 0, G.score);
}

function seg(c, p0, p1, f) {
  let dx = p1.x - p0.x, dy = p1.y - p0.y;
  if (Math.abs(dx) > 1.5 || Math.abs(dy) > 1.5) { dx = 0; dy = 0; f = 1; } // wrapped: snap
  return { x: px(p0.x + dx * f), y: py(p0.y + dy * f) };
}

function drawCombo(c, G) {
  if (G.state !== 'playing' || combo <= 0) return;
  const hx = px(cur[0].x), hy = py(cur[0].y), k = Math.max(0, comboT / COMBO_WINDOW);
  c.save();
  c.globalAlpha = 0.55 + 0.35 * Math.min(1, combo / 5);
  A.glowText(c, '×' + comboMult().toFixed(1), hx, hy - 27, 15, '#fde68a', 'center', 8);
  c.strokeStyle = 'rgba(253,230,138,.75)'; c.lineWidth = 2;
  c.beginPath(); c.arc(hx, hy, 19, -Math.PI / 2, -Math.PI / 2 + A.TAU * k); c.stroke();
  c.restore();
}

/* ================= CLASSIC SKIN (the original look) ================= */
function drawClassic(G, c) {
  const t = G.clock, f = G.state === 'playing' ? tickT / interval : 1;
  A.sky(c, W, H, ['#0b1220', '#101a2e']);
  c.save(); c.shadowColor = wrap ? '#38bdf8' : '#fb923c'; c.shadowBlur = 20;
  c.fillStyle = '#0a1a14'; c.fillRect(OX - 4, OY - 4, COLS * C + 8, ROWS * C + 8); c.restore();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { c.fillStyle = (x + y) % 2 ? '#10281f' : '#0d2219'; c.fillRect(OX + x * C, OY + y * C, C, C); }
  c.strokeStyle = wrap ? 'rgba(56,189,248,.7)' : 'rgba(251,146,60,.8)'; c.lineWidth = 3;
  if (wrap) c.setLineDash([10, 8]); c.strokeRect(OX - 2, OY - 2, COLS * C + 4, ROWS * C + 4); c.setLineDash([]);
  for (const r of rocks) {
    const x = OX + r.x * C + 2, y = OY + r.y * C + 6;
    A.shadow(c, x + C / 2 + 4, y + C - 2, 12, 4, 0.35);
    A.block3d(c, x, y, C - 8, C - 10, 7, ['#64748b', '#78716c', '#6b7280'][r.v]);
  }
  const pulse = 1 + Math.sin(t * 0.12) * 0.08;
  if (food) {
    const x = px(food.x), y = py(food.y);
    A.shadow(c, x + 3, y + 11, 9, 3, 0.35);
    c.save(); c.shadowColor = '#f87171'; c.shadowBlur = 16;
    const g = c.createRadialGradient(x - 3, y - 3, 1, x, y, 11 * pulse); g.addColorStop(0, '#fecaca'); g.addColorStop(1, '#dc2626');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, 10 * pulse, 0, A.TAU); c.fill(); c.restore();
    c.fillStyle = '#4ade80'; c.beginPath(); c.ellipse(x + 3, y - 11, 5, 2.5, -0.5, 0, A.TAU); c.fill();
  }
  if (bonus) {
    const x = px(bonus.x), y = py(bonus.y), k = bonus.t / 540;
    c.save(); c.shadowColor = '#fde68a'; c.shadowBlur = 22;
    c.fillStyle = '#fbbf24'; c.beginPath(); c.moveTo(x, y - 13 * pulse); c.lineTo(x + 10, y); c.lineTo(x, y + 13 * pulse); c.lineTo(x - 10, y); c.closePath(); c.fill();
    c.fillStyle = '#fff7c2'; c.beginPath(); c.moveTo(x, y - 8); c.lineTo(x + 4, y); c.lineTo(x, y + 8); c.lineTo(x - 4, y); c.closePath(); c.fill();
    c.strokeStyle = k < 0.25 && t % 20 < 10 ? '#f87171' : '#fde68a'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 17, -Math.PI / 2, -Math.PI / 2 + A.TAU * k); c.stroke();
    c.restore();
  }
  const pts = cur.map((s, i) => seg(c, prev[i] || s, s, f));
  for (const p of pts) A.shadow(c, p.x + 3, p.y + 9, 10, 4, 0.3);

    const base = h * (0.65 + layer * 0.11), amp = h * (0.035 + layer * 0.013), drift = motion ? frame.time * (0.00008 + layer * 0.00004) : 0;

  c.shadowColor = '#fb923c'; c.shadowBlur = frame.quality.glow ? 18 : 5;

  c.strokeStyle = '#7c2d12'; c.lineWidth = Math.max(14, h * 0.045); c.beginPath();

      const back = doc.createElement('button'); back.type = 'button'; back.className = 'apex-menu-back'; back.setAttribute('data-menu-back', 'true'); back.textContent = 'Back'; back.addEventListener('click', view.back); view.panel.appendChild(back);
    },
    customize: function (view) {
      const doc = view.panel.ownerDocument, meta = window.Meta;
      const heading = doc.createElement('h1'); heading.className = 'apex-menu-title'; heading.textContent = 'Customize'; view.panel.appendChild(heading);
      const wallet = meta && meta.read ? meta.read().sparks : 0;
      const balance = doc.createElement('p'); balance.className = 'apex-menu-tagline'; balance.textContent = 'Sparks: ' + wallet + ' · Owned items are saved on this device.'; view.panel.appendChild(balance);
      (meta && meta.getCosmetics ? meta.getCosmetics(GAME_ID) : []).forEach(function (item) {
        const button = doc.createElement('button'); button.type = 'button'; button.className = 'apex-menu-action';
        button.textContent = item.name + ' · ' + (item.equipped ? 'Equipped' : item.owned ? 'Equip' : item.cost + ' Sparks');
        button.disabled = item.equipped || (!item.owned && wallet < item.cost);
        button.addEventListener('click', function () {
          const result = item.owned ? meta.equipCosmetic(GAME_ID, item.id) : meta.purchaseCosmetic(GAME_ID, item.id);
          if (result && result.ok && item.owned) applyCosmetic(item.slot, item.id);
          view.refresh();
        });
        view.panel.appendChild(button);
      });
      const back = doc.createElement('button'); back.type = 'button'; back.className = 'apex-menu-back'; back.setAttribute('data-menu-back', 'true'); back.textContent = 'Back'; back.addEventListener('click', view.back); view.panel.appendChild(back);
    },
    stats: function (view) {
      const doc = view.panel.ownerDocument, save = Save.load(GAME_ID);
      const heading = doc.createElement('h1'); heading.className = 'apex-menu-title'; heading.textContent = 'Serpent records'; view.panel.appendChild(heading);
      const result = doc.createElement('p'); result.className = 'apex-menu-tagline'; result.textContent = 'Best score: ' + emberSerpentGame.hi + ' · Runs played: ' + ((save.stats && save.stats.plays) || 0); view.panel.appendChild(result);
      const progress = doc.createElement('p'); progress.className = 'apex-menu-tagline'; progress.textContent = 'Best level: ' + (Number((save.stats || {}).bestLevel) || 0) + ' of ' + MAX_LEVEL + ' · Daily best: ' + (Number((save.stats || {}).dailyBest) || 0); view.panel.appendChild(progress);
      const earned = doc.createElement('p'); earned.className = 'apex-menu-caption'; earned.textContent = 'Achievements earned: ' + ((save.achievements || []).length) + ' of ' + ((emberSerpentUIConfig && emberSerpentUIConfig.achievements.length) || 0); view.panel.appendChild(earned);
      const back = doc.createElement('button'); back.type = 'button'; back.className = 'apex-menu-back'; back.setAttribute('data-menu-back', 'true'); back.textContent = 'Back'; back.addEventListener('click', view.back); view.panel.appendChild(back);
    },
    about: function (view) {
      const doc = view.panel.ownerDocument;
      const heading = doc.createElement('h1'); heading.className = 'apex-menu-title'; heading.textContent = 'Into the ember caverns'; view.panel.appendChild(heading);
      const story = doc.createElement('p'); story.className = 'apex-menu-tagline'; story.textContent = 'Eat fruit to grow, collect timed golden gems, and climb through ten increasingly dangerous levels. Chain fruit quickly to heat up a combo multiplier.'; view.panel.appendChild(story);
      const controls = doc.createElement('p'); controls.className = 'apex-menu-tagline'; controls.textContent = 'Steer with Arrow keys or WASD. Turns queue up. T switches walls or wrap where the mode allows it; K changes the serpent skin. P pauses, M mutes.'; view.panel.appendChild(controls);
      const modes = doc.createElement('p'); modes.className = 'apex-menu-tagline'; modes.textContent = 'Serpent Gate always wraps. Molten Gauntlet never ends and unlocks at level 5. Daily Ember plays the same seeded board for everyone today.'; view.panel.appendChild(modes);
      const note = doc.createElement('p'); note.className = 'apex-menu-caption'; note.textContent = 'Solid walls award a 50% food bonus. The Classic skin and palettes change the look only.'; view.panel.appendChild(note);
      const back = doc.createElement('button'); back.type = 'button'; back.className = 'apex-menu-back'; back.setAttribute('data-menu-back', 'true'); back.textContent = 'Back'; back.addEventListener('click', view.back); view.panel.appendChild(back);
    }
  }
});
emberSerpentGame.inputLocked = true;
</script>
