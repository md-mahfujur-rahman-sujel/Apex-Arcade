    cx.fillStyle = 'rgba(255,255,255,.07)'; cx.beginPath(); cx.arc(sx, sy, 24, 0, 6.3); cx.fill();
    const t = tray[i]; if (!t) continue;
    const k = Math.min(1, (now - t.t0) / 260), e = 1 - Math.pow(1 - k, 3);
    bolt(t.x0 + (sx - t.x0) * e, t.y0 + (sy - t.y0) * e, t.c, 12 + 8 * e, 1);
  }
}
(function loop() { requestAnimationFrame(loop); if (!Board.paused()) draw(); })();
cv.addEventListener('pointerdown', (e) => { const r = cv.getBoundingClientRect(); tap((e.clientX - r.left) * 480 / r.width, (e.clientY - r.top) * 640 / r.height); });
$('#undo').onclick = (e) => { e.target.blur(); undo(); };
$('#rst').onclick = (e) => { e.target.blur(); restart(); };
$('#nxt').onclick = (e) => { e.target.blur(); startLevel(level); };
$('#jump').onchange = (e) => { startLevel(+e.target.value); e.target.blur(); };
document.addEventListener('keydown', (e) => {
  if (menuPaused || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || document.getElementById('bk-dlg')?.open) return;
  const k = e.key.toLowerCase();
  if (k === 'u') undo(); else if (k === 'r') restart(); else if (k === 'n') startLevel(level);
});
window.addEventListener('apex:board-pause', (e) => { if (e.detail?.paused) pauseClock(); else resumeClock(); });
setInterval(() => {
  if (state !== 'play') return;
  if (cfg().limit) {
    const leftMs = timeLeft();
    $('#tm').textContent = fmt(leftMs);
    if (started && leftMs <= 0) finishRun(false, 'time');
  } else if (started) $('#tm').textContent = fmt(elapsedMs());
}, 250);
newGame();

/* ---------- deterministic test hooks ---------- */
function gameState() {
  return {
    mode: gm, level, state, bolts: left(), trayUsed: tray.filter(Boolean).length, trayCap: trCap,
    runBolts, runMatches, runUndos, started, time: Math.round(elapsedMs() / 1000), clock: Math.round(timeLeft() / 1000),
    score: lastScore, done: state !== 'play', won: state === 'won', overReason, menuPaused,
    achievements: typeof Save !== 'undefined' && Save.load ? (Save.load(GAME_ID).achievements || []) : [],
  };
}
if (/(\?|&)test=1(?:&|$)/.test(location.search)) {
  window.BoltsTest = {
    state: gameState,
    board: () => JSON.parse(JSON.stringify(planks)),
    tray: () => tray.map((t) => (t ? t.c : null)),
    modes: () => MODES.map((m) => m.id),
    setMode: (id) => GameUI.setMode(id),
    getMode: () => gm,
    restart: () => { restart(); return gameState(); },
    newGame: () => { newGame(); return gameState(); },
    startLevel: (n) => { startLevel(Number(n) || 1); return gameState(); },
    setBoard: (o) => {
      const src = o || {};
      if (Array.isArray(src.planks)) planks = JSON.parse(JSON.stringify(src.planks));
      if (src.level != null) level = Math.max(1, Number(src.level) || 1);
      trCap = cfg().tray; tray = Array(trCap).fill(null); falling = []; hist = [];
      runBolts = runMatches = runUndos = 0; lastScore = 0; overReason = ''; state = 'play';
      started = true; clockAccum = Number(src.elapsed) || 0; clockSince = null;
      seedLevel = JSON.stringify(planks); upd(); return gameState();
    },
    setRun: (o) => {
      const src = o || {};
      if (src.bolts != null) runBolts = Math.max(0, Number(src.bolts) || 0);
      if (src.matches != null) runMatches = Math.max(0, Number(src.matches) || 0);
      if (src.undos != null) runUndos = Math.max(0, Number(src.undos) || 0);
      if (src.elapsed != null) { clockAccum = Math.max(0, Number(src.elapsed) || 0); clockSince = null; }
      if (src.started != null) started = !!src.started;
      upd(); return gameState();
    },
    tap: (x, y) => { tap(Number(x) || 0, Number(y) || 0); return gameState(); },
    take: (i, j) => { take(Number(i) || 0, Number(j) || 0); return gameState(); },
    boltAt: (i, j) => { const p = planks[Number(i) || 0]; if (!p || !p.h[Number(j) || 0]) return null; return boltPos(Number(i) || 0, Number(j) || 0); },
    blocked: (i, j) => { const p = planks[Number(i) || 0]; if (!p) return false; const h = p.h[Number(j) || 0]; if (!h) return false; return blocked(Number(i) || 0, h); },
    undo: () => { undo(); return gameState(); },
    tick: (ms) => { clockAccum = Math.max(0, clockAccum + (Number(ms) || 0)); clockSince = null; if (state === 'play' && cfg().limit && timeLeft() <= 0) finishRun(false, 'time'); else upd(); return gameState(); },
    complete: () => { finishRun(true, 'clear'); return gameState(); },
    close: () => { const d = document.getElementById('bk-dlg'); if (d && d.open) d.close(); return true; },
    modalOpen: () => { const d = document.getElementById('bk-dlg'); return !!(d && d.open); },
    cosmetic: (slot, id) => { applyCosmetic(slot, id); return { slot, id: cosmeticKey(id) }; },
    cosmeticList: () => (window.Meta && Meta.getCosmetics ? Meta.getCosmetics(GAME_ID) : []),
    colors: () => ({ skin: look.skin, light: SKINS[look.skin][0], dark: SKINS[look.skin][1], palette: look.palette, top: PALETTES[look.palette][0], bottom: PALETTES[look.palette][1], effect: look.effect, glow: EFFECTS[look.effect], theme: look.theme, tray: THEMES[look.theme] }),
    stats: () => GameUI.stats(),
    achievements: () => (Save.load(GAME_ID).achievements || []),
    menuPaused: (value) => { menuPaused = !!value; return menuPaused; },
    start: () => { resumeClock(); return gameState(); },
  };
}
</script>
