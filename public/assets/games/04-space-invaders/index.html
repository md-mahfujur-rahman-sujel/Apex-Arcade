<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hivefall Defense</title>
<script src="../../kits/music-kit.js"></script><script src="../../kits/menu-kit.js"></script>
</head>
<body>

<script src="../../kits/perf-kit.js"></script>
<script src="../../kits/save-kit.js"></script>
<script src="../../kits/meta-config.js"></script>
<script src="../../kits/meta-kit.js"></script>
<script src="../../kits/arcade-core.js"></script>
<script src="../../kits/score-bridge.js"></script>
<script src="../../kits/ui-kit.js"></script>
<script>
/* Hivefall Defense — fixed-shooter: stop the descending hive swarm before it lands. */
const A = Arcade;
const W = 640, H = 520, COLS = 10, ROWS = 5, SX = 46, SY = 36, AW = 30, AH = 24, PY = 474, MAX_WAVE = 10;
const SCW = 14, SCH = 10, CELL = 4, SHY = 396;
let ship, fleet, shields, pBul, eBul, saucer, saucerT, wave, lives, inv, stepT, frame, alive, waveT, nextLife, stars, deadT, fireCd;

function makeShield(x) {
  const cells = new Uint8Array(SCW * SCH);
  for (let r = 0; r < SCH; r++) for (let c = 0; c < SCW; c++) {
    let on = 1;
    if (r === 0 && (c < 2 || c > SCW - 3)) on = 0;
    if (r === 1 && (c < 1 || c > SCW - 2)) on = 0;
    if (r >= 7 && c >= 5 && c <= 8) on = 0;
    cells[r * SCW + c] = on;
  }
  return { x, cells };
}
function buildWave() {
  fleet = { x: 62, y: 84 + Math.min(5, wave - 1) * 14, dir: 1, a: [] };
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) fleet.a.push({ r, c, live: true, hit: 0 });
  shields = [0, 1, 2, 3].map((i) => makeShield(66 + i * 140));
  pBul = []; eBul = []; stepT = 0; waveT = 100; saucer = null; saucerT = A.randi(500, 900);
}
function init(G) {
  ship = { x: W / 2, vx: 0 }; wave = 1; lives = 3; inv = 0; frame = 0; nextLife = 1500; deadT = 0; fireCd = 0;
  stars = A.makeStars(70, W, H);
  buildWave();
}
const fx = (a) => fleet.x + a.c * SX, fy = (a) => fleet.y + a.r * SY;
const liveList = () => fleet.a.filter((a) => a.live);

function eraseAt(sh, wx, wy, rad) {
  const cx = Math.floor((wx - sh.x) / CELL), cy = Math.floor((wy - SHY) / CELL);
  for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
    const x = cx + dx, y = cy + dy;
    if (x < 0 || y < 0 || x >= SCW || y >= SCH || dx * dx + dy * dy > rad * rad + 1) continue;
    if (Math.random() > 0.78 && Math.abs(dx) + Math.abs(dy) > 1) continue;
    sh.cells[y * SCW + x] = 0;
  }
}
function shieldHit(b, rad) {
  for (const sh of shields) {
    if (b.x < sh.x || b.x >= sh.x + SCW * CELL) continue;
    for (const yy of [b.y, b.y + (b.vy > 0 ? 10 : -10)]) {
      if (yy < SHY || yy >= SHY + SCH * CELL) continue;
      const cx = Math.floor((b.x - sh.x) / CELL), cy = Math.floor((yy - SHY) / CELL);
      if (sh.cells[cy * SCW + cx]) { eraseAt(sh, b.x, yy, rad); return true; }
    }
  }
  return false;
}

function killAlien(G, a, pts) {
  a.live = false;
  const x = fx(a) + AW / 2, y = fy(a) + AH / 2, col = ['#e879f9', '#fbbf24', '#34d399'][[0, 1, 1, 2, 2][a.r]];
  G.addScore(pts); A.sfx('explode'); G.freeze(1);
  G.burst(x, y, 16, { color: [col, '#fff'], speed: 4, glow: true, life: 28, grav: 0.04 });
  G.ring(x, y, col, 34, 18);
  G.popup(x, y - 10, '+' + pts, '#fff', 14);
  if (G.score >= nextLife) { nextLife += 1500; lives++; A.sfx('heal'); G.popup(W / 2, 200, '1UP', '#4ade80', 28); }
}
function hurtPlayer(G) {
  if (inv > 0) return;
  lives--; A.sfx('boom'); G.shake(14); G.freeze(10);
  G.burst(ship.x, PY, 40, { color: ['#60a5fa', '#fff', '#f87171'], speed: 6, glow: true, life: 44, grav: 0.06 });
  G.ring(ship.x, PY, '#60a5fa', 90, 30);
  eBul = []; inv = 130;
  if (lives <= 0) return G.over('Defenders Down', 'Reached wave ' + wave);
  ship.x = W / 2;
}

function update(G) {
  frame++;
  if (inv > 0) inv--;
  // player
  const ax = A.axisX();
  ship.vx = A.approach(ship.vx, ax * 4.2, 0.7); ship.x = A.clamp(ship.x + ship.vx, 24, W - 24);
  if (fireCd > 0) fireCd--;
  if (A.held('Space') && fireCd === 0 && pBul.length < 2 && waveT < 90) {
    pBul.push({ x: ship.x, y: PY - 18, vy: -9 }); fireCd = 16; A.sfx('shoot');
    G.burst(ship.x, PY - 16, 4, { color: '#fde68a', speed: 2, glow: true, life: 10, angle: -Math.PI / 2, spread: 0.7 });
  }
  for (let i = pBul.length - 1; i >= 0; i--) {
    const b = pBul[i]; b.y += b.vy; let gone = b.y < 40;
    if (!gone && shieldHit(b, 1)) gone = true;
    if (!gone && saucer && b.x > saucer.x - 22 && b.x < saucer.x + 22 && b.y < 82 && b.y > 52) {
      const pts = A.pick([50, 100, 150, 300]); G.addScore(pts); A.sfx('power'); G.shake(6);
      G.burst(saucer.x, 66, 36, { color: ['#fde68a', '#f472b6', '#fff'], speed: 5, glow: true, life: 40 });
      G.ring(saucer.x, 66, '#fde68a', 80); G.popup(saucer.x, 50, 'UFO +' + pts, '#fde68a', 20); saucer = null; gone = true;
    }
    if (!gone) for (const a of fleet.a) {
      if (a.live && b.x > fx(a) - 3 && b.x < fx(a) + AW + 3 && b.y > fy(a) - 4 && b.y < fy(a) + AH + 4) { killAlien(G, a, [30, 20, 20, 10, 10][a.r] * (1 + Math.floor((wave - 1) / 3))); gone = true; break; }
    }
    if (gone) pBul.splice(i, 1);
  }
  // wave intro / clear
  if (waveT > 0) { waveT--; return; }
  alive = liveList();
  if (!alive.length) {
    if (wave >= MAX_WAVE) { G.addScore(1000); return G.win('Hive Destroyed!', 'All ' + MAX_WAVE + ' waves cleared'); }
    G.addScore(100 * wave); wave++; A.sfx('power'); buildWave();
    G.popup(W / 2, H / 2, 'WAVE ' + wave, '#67e8f9', 34); return;
  }
  // fleet step
  const interval = Math.max(4, Math.round(alive.length * 0.85 * Math.pow(0.93, wave - 1)));
  if (++stepT >= interval) {
    stepT = 0; frame = frame; fleet.frame = !fleet.frame;
    const minX = Math.min(...alive.map((a) => fx(a))), maxX = Math.max(...alive.map((a) => fx(a))) + AW;
    if ((fleet.dir > 0 && maxX + 10 > W - 14) || (fleet.dir < 0 && minX - 10 < 14)) { fleet.dir *= -1; fleet.y += 16; A.tone(70, 0.1, 'sawtooth', 0.05); }
    else fleet.x += fleet.dir * 10;
    A.tone(fleet.frame ? 98 : 82, 0.07, 'square', 0.045);
    for (const a of alive) for (const sh of shields) if (fx(a) + AW > sh.x && fx(a) < sh.x + SCW * CELL && fy(a) + AH > SHY) for (let k = 0; k < 4; k++) eraseAt(sh, fx(a) + AW / 2, SHY + k * 8 + 2, 3);
    if (Math.max(...alive.map((a) => fy(a))) + AH > PY - 14) { G.shake(14); return G.over('Hive Landed', 'The swarm reached the ground at wave ' + wave); }
  }
  // enemy fire (bottom-most in a random column)
  const cap = Math.min(6, 2 + wave), chance = 0.012 + wave * 0.003;
  if (eBul.length < cap && Math.random() < chance) {
    const col = A.randi(0, COLS - 1), shooters = alive.filter((a) => a.c === col);
    if (shooters.length) {
      const a = shooters.reduce((m, s) => (s.r > m.r ? s : m));
      const kind = wave >= 4 && Math.random() < 0.2 ? 'f' : Math.random() < 0.4 ? 'z' : 's';
      eBul.push({ x: fx(a) + AW / 2, x0: fx(a) + AW / 2, y: fy(a) + AH, vy: kind === 'f' ? 6 : kind === 'z' ? 2.6 : 3.2, kind, t: 0 });
      A.sfx('laser');
    }
  }
  for (let i = eBul.length - 1; i >= 0; i--) {
    const b = eBul[i]; b.t++; b.y += b.vy; if (b.kind === 'z') b.x = b.x0 + Math.sin(b.t * 0.22) * 14;
    let gone = b.y > H;
    if (!gone && shieldHit(b, b.kind === 'f' ? 3 : 2)) { gone = true; G.burst(b.x, b.y, 6, { color: '#86efac', speed: 2, life: 14 }); A.sfx('hit'); }
    if (!gone && Math.abs(b.x - ship.x) < 18 && b.y > PY - 12 && b.y < PY + 12) { gone = true; hurtPlayer(G); }
    for (const p of pBul) if (!gone && Math.abs(p.x - b.x) < 6 && Math.abs(p.y - b.y) < 10) { gone = true; p.y = -50; G.burst(b.x, b.y, 6, { color: '#fff', speed: 2.5, glow: true, life: 14 }); }
    if (gone) eBul.splice(i, 1);
    if (G.state !== 'playing') return;
  }
  // saucer
  if (saucer) { saucer.x += saucer.dir * 2; if (saucer.x < -40 || saucer.x > W + 40) saucer = null; else if (frame % 14 === 0) A.tone(640 + Math.sin(frame * 0.2) * 120, 0.1, 'sine', 0.03); }
  else if (--saucerT <= 0 && alive.length > 6) { const d = Math.random() < 0.5 ? 1 : -1; saucer = { x: d > 0 ? -30 : W + 30, dir: d }; saucerT = A.randi(900, 1500); }
}

function drawAlien(c, a, t, f) {
  const x = fx(a) + AW / 2, y = fy(a) + AH / 2 + Math.sin(t * 0.06 + a.c) * 1.5;
  const type = [0, 1, 1, 2, 2][a.r], col = ['#e879f9', '#fbbf24', '#34d399'][type], s = f ? 1 : -1;
  A.shadow(c, x + 4, y + 16, 12, 3, 0.25);
  c.save(); c.translate(x, y); c.shadowColor = col; c.shadowBlur = 10;
  c.fillStyle = col; c.strokeStyle = col; c.lineWidth = 3; c.lineCap = 'round';
  if (type === 0) { // jelly: dome with tendrils
    c.beginPath(); c.arc(0, -2, 11, Math.PI, 0); c.lineTo(11, 6); c.lineTo(-11, 6); c.fill();
    for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 5, 6); c.quadraticCurveTo(i * 5 + s * 4, 11, i * 5, 14); c.stroke(); }
  } else if (type === 1) { // wasp: hex body with wings
    c.beginPath(); c.moveTo(-9, -2); c.lineTo(-4, -9); c.lineTo(4, -9); c.lineTo(9, -2); c.lineTo(4, 7); c.lineTo(-4, 7); c.closePath(); c.fill();
    c.globalAlpha = 0.7; c.beginPath(); c.moveTo(-9, -4); c.lineTo(-18, s > 0 ? -12 : 2); c.lineTo(-8, 2); c.fill();
    c.beginPath(); c.moveTo(9, -4); c.lineTo(18, s > 0 ? -12 : 2); c.lineTo(8, 2); c.fill(); c.globalAlpha = 1;
  } else { // drone: flat diamond pod with legs
    c.beginPath(); c.moveTo(-14, 2); c.lineTo(0, -9); c.lineTo(14, 2); c.lineTo(0, 9); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(-8, 7); c.lineTo(-12 + s * 3, 14); c.moveTo(8, 7); c.lineTo(12 - s * 3, 14); c.stroke();
  }
  c.shadowBlur = 0; c.fillStyle = '#0b1020'; c.fillRect(-6, -3, 4, 5); c.fillRect(2, -3, 4, 5);
  c.fillStyle = '#fff'; c.fillRect(-5, -2, 2, 2); c.fillRect(3, -2, 2, 2);
  c.restore();
}

function draw(G, c) {
  const t = G.clock;
  A.sky(c, W, H, ['#05030f', '#0b1030', '#1a1347']);
  A.drawStars(c, stars, t, W, H, 0.15, '#c7d2fe');
  // planet horizon
  c.save(); c.fillStyle = A.vgrad(c, 470, H, ['#1b2a5c', '#0a0f26']);
  c.beginPath(); c.ellipse(W / 2, H + 380, 760, 420, 0, 0, A.TAU); c.fill();
  c.strokeStyle = 'rgba(103,232,249,.25)'; c.lineWidth = 3; c.beginPath(); c.ellipse(W / 2, H + 380, 760, 420, 0, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); c.restore();
  A.grid3d(c, W, H, 494, t, 'rgba(99,102,241,.22)');
  // shields
  for (const sh of shields) for (let r = 0; r < SCH; r++) for (let q = 0; q < SCW; q++) if (sh.cells[r * SCW + q]) {
    const top = r === 0 || !sh.cells[(r - 1) * SCW + q];
    c.fillStyle = top ? '#86efac' : A.mix('#22c55e', '#14532d', r / SCH);
    c.fillRect(sh.x + q * CELL, SHY + r * CELL, CELL, CELL);
  }
  // fleet
  for (const a of fleet.a) if (a.live) drawAlien(c, a, t, fleet.frame);
  // saucer
  if (saucer) {
    c.save(); c.translate(saucer.x, 66); c.shadowColor = '#f472b6'; c.shadowBlur = 16;
    c.fillStyle = '#f472b6'; c.beginPath(); c.ellipse(0, 3, 22, 8, 0, 0, A.TAU); c.fill();
    c.fillStyle = '#fbcfe8'; c.beginPath(); c.ellipse(0, -2, 10, 8, 0, Math.PI, 0); c.fill();
    for (let i = -2; i <= 2; i++) { c.fillStyle = (Math.floor(t / 6) + i) % 2 ? '#fde68a' : '#fff'; c.fillRect(i * 8 - 1.5, 2, 3, 3); }
    c.restore();
  }
  // bullets
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const b of pBul) { c.fillStyle = '#fde68a'; c.shadowColor = '#fde68a'; c.shadowBlur = 12; c.fillRect(b.x - 2, b.y - 8, 4, 16); }
  for (const b of eBul) {
    const col = b.kind === 'f' ? '#f87171' : b.kind === 'z' ? '#c084fc' : '#4ade80';
    c.fillStyle = col; c.shadowColor = col; c.shadowBlur = 12;
    if (b.kind === 'z') { c.beginPath(); c.arc(b.x, b.y, 4, 0, A.TAU); c.fill(); } else c.fillRect(b.x - (b.kind === 'f' ? 1.5 : 2), b.y - 7, b.kind === 'f' ? 3 : 4, b.kind === 'f' ? 18 : 14);
  }
  c.restore();
  // ship
  if (!(inv > 0 && Math.floor(t / 5) % 2 === 0) && G.state !== 'over') {
    const x = ship.x, y = PY;
    A.shadow(c, x + 4, y + 16, 22, 5, 0.35);
    c.save(); c.translate(x, y);
    c.fillStyle = '#60a5fa'; c.beginPath(); c.moveTo(0, -18); c.lineTo(-20, 12); c.lineTo(0, 6); c.closePath(); c.fill();
    c.fillStyle = '#2563eb'; c.beginPath(); c.moveTo(0, -18); c.lineTo(20, 12); c.lineTo(0, 6); c.closePath(); c.fill();
    c.fillStyle = '#bfdbfe'; c.beginPath(); c.ellipse(0, -2, 4, 7, 0, 0, A.TAU); c.fill();
    c.globalCompositeOperation = 'lighter'; c.fillStyle = 'rgba(251,191,36,' + (0.6 + Math.sin(t) * 0.3) + ')';
    c.beginPath(); c.moveTo(-4, 8); c.lineTo(0, 16 + Math.sin(t * 1.3) * 3); c.lineTo(4, 8); c.fill();
    c.restore();
  }
  // lives
  for (let i = 0; i < lives - 1; i++) { c.fillStyle = '#60a5fa'; c.beginPath(); c.moveTo(W - 20 - i * 20, 502); c.lineTo(W - 30 - i * 20, 514); c.lineTo(W - 10 - i * 20, 514); c.fill(); }
  if (waveT > 0 && G.state === 'playing') A.glowText(c, 'WAVE ' + wave, W / 2, 250, 38, '#67e8f9', 'center', 18);
  A.vignette(c, W, H, 0.35);
  G.drawFX(c);
  G.hudL = 'SCORE ' + G.score + '  ·  WAVE ' + wave + '  ·  LIVES ' + lives;
}

Arcade.game({
  id: 'hivefall', title: 'Hivefall Defense', subtitle: 'Hold the line against ten waves', color: '#818cf8',
  help: '←/→ or A/D move, hold Space to fire (two shots at a time). Bunkers erode from both sides. Shoot the passing saucer for bonus points. Extra life every 1500 points. P pauses, M mutes.',
  w: W, h: H, touchL: [['◀', 'ArrowLeft'], ['▶', 'ArrowRight']], touchR: [['●', 'Space']], init, update, draw,
});
</script>
<script src="../../kits/menu-bootstrap.js"></script>
</body>
</html>
