  const d = document.createElement('div'); d.dataset.k = k; d.innerHTML = '<span class="pc"></span>';
  if (k % 8 === 0) d.insertAdjacentHTML('beforeend', '<b class="co r"></b>');
  if (k >= 56) d.insertAdjacentHTML('beforeend', '<b class="co f"></b>');
  boardEl.appendChild(d); sqs.push(d);
}
const idx = (k) => (flipped ? 63 - k : k);
const isHumanColor = (c) => (mode === 'puzzle' || mode === 'endgame') ? c === 'w' : (side === 'two' || c === side);
const humanTurn = () => (mode === 'puzzle' || mode === 'endgame') ? S.turn === 'w' : (side === 'two' || S.turn === side);
const posKey = (s) => s.b.map((p) => p || '.').join('') + s.turn + s.cr.K + s.cr.Q + s.cr.k + s.cr.q + s.ep;
const fmtClock = (sec) => { const v = Math.max(0, Math.ceil(sec)); return Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0'); };
const scoreMult = () => mode === 'grandmaster' ? 1.5 : 1;

function addScore(n) { if (!n) return; score += Math.round(n * scoreMult()); }

function newGame() {
  genId++;
  const d = document.getElementById('bk-dlg'); if (d && d.open) d.close();
  const solo = mode === 'puzzle' || mode === 'endgame';
  side = solo ? 'w' : $('#side').value;
  hist = []; sel = -1; tg = []; last = null; over = null; moves = []; caps = { w: [], b: [] };
  thinking = false; hintSq = null; flipped = side === 'b';
  score = 0; humanMoves = 0; endgameMoves = 0; settled = false; puzzleMsg = '';
  clockW = 300; clockB = 300; clockOn = mode === 'blitz'; clockStarted = false; clockLast = Board.now();
  puzzleIndex = 0; puzzlesSolved = 0; puzzleMisses = 0;
  if (mode === 'puzzle') loadPuzzle(0);
  else {
    S = mode === 'endgame' ? parseFen(ENDGAME_START) : startPos();
    reps = {}; reps[posKey(S)] = 1;
  }
  syncControls(); render(); if (!menuPaused) maybeCpu();
}

function loadPuzzle(i) {
  puzzleIndex = i;
  const p = PUZZLES[i] || PUZZLES[0];
  S = parseFen(p.fen); hist = []; sel = -1; tg = []; last = null; over = null; moves = []; caps = { w: [], b: [] };
  reps = {}; reps[posKey(S)] = 1; hintSq = null; thinking = false; flipped = false; puzzleMsg = '';
  render();
}

function syncControls() {
  const solo = mode === 'puzzle' || mode === 'endgame';
  $('#side').disabled = solo;
  if (solo) $('#side').value = 'w';
  $('#undo').disabled = mode === 'puzzle';
}

function maybeCpu() {
  if (menuPaused || over || thinking || humanTurn()) return;
  thinking = true; render();
  const g = genId, level = LEVELS[+$('#lvl').value] || LEVELS[1];
  const depth = mode === 'grandmaster' ? 4 : level.d;
  const noise = mode === 'grandmaster' ? 0 : level.n;
  const cap = mode === 'grandmaster' ? 250000 : 400000;
  Board.think(() => bestMove(S, depth, noise, cap), 1100).then(async (m) => {
    if (g !== genId || !m) return;
    const el = (i) => sqs[flipped ? 63 - i : i];
    sel = m.f; render(); await Board.sleep(Board.pace(380));
    if (g !== genId) return;
    await Board.glide(el(m.f), el(m.t), 480);
    if (g !== genId) return;
    sel = -1; thinking = false; play(m);
  });
}

function resultWinner() {
  if (!over) return 'draw';
  if (over.startsWith('White wins')) return 'w';
  if (over.startsWith('Black wins')) return 'b';
  if (over.startsWith('Puzzle')) return 'w';
  return 'draw';
}

function conclude(kind, winner) {
  if (settled) return;
  settled = true; clockOn = false;
  const humanWon = winner !== 'draw' && isHumanColor(winner);
  const ownClock = winner === 'b' ? clockB : clockW;
  if (humanWon) {
    if (kind === 'classic') addScore(800);
    else if (kind === 'blitz') addScore(1000 + Math.round(ownClock));
    else if (kind === 'grandmaster') addScore(1500);
    else if (kind === 'endgame') addScore(600 + Math.max(0, 30 - endgameMoves) * 20);
  } else if (winner === 'draw') addScore(100);
  const stats = GameUI.stats(), prevBest = Number(stats.bestScore) || 0;
  const ids = [];
  if (humanWon && side !== 'two' && mode !== 'puzzle') ids.push('first-win');
  if (mode === 'classic' && humanWon && moves.length <= 20) ids.push('scholar');
  if (mode === 'blitz' && humanWon) { ids.push('blitz-clear'); if (ownClock >= 120) ids.push('blitz-fast'); }
  if (mode === 'puzzle' && puzzlesSolved >= PUZZLES.length) { ids.push('puzzle-clear'); if (puzzleMisses === 0) ids.push('puzzle-perfect'); }
  if (mode === 'endgame' && humanWon && endgameMoves <= 20) ids.push('endgame-clear');
  if (mode === 'grandmaster' && humanWon) ids.push('grandmaster-clear');
  if (score > prevBest && score > 0) ids.push('personal-best');
  const records = {}, counters = {}, mins = {};
  records['best' + MODE_NAMES[mode].replace(/\s+/g, '') + 'Score'] = score;
  if (humanWon) {
    counters.wins = 1;
    if (mode === 'classic') counters.classicWins = 1;
    if (mode === 'blitz') counters.blitzWins = 1;
    if (mode === 'endgame') counters.endgameWins = 1;
    if (mode === 'grandmaster') counters.grandmasterWins = 1;
    if (mode !== 'puzzle' && moves.length) mins.fastestMate = moves.length;
  }
  if (mode === 'puzzle') counters.puzzlesSolved = puzzlesSolved;
  GameUI.record({ score, result: over, records, mins, counters, achievements: ids });
  paintScore(); render();
  let title;
  if (mode === 'puzzle') title = puzzleMisses === 0 ? 'Perfect sprint!' : 'Puzzle sprint complete';
  else if (winner === 'draw') title = mode === 'endgame' ? 'Endgame lab — draw' : 'Draw';
  else if (humanWon) title = side === 'two' ? 'Checkmate!' : 'You won!';
  else title = over.includes('time') ? 'Time out' : 'Checkmate — computer wins';
  Board.modal(title, `${over}. Score ${score}.`, [['New game', newGame], ['Close']]);
  Board.sfx(winner === 'draw' ? 'draw' : humanWon ? 'win' : 'lose');
}

function play(m) {
  if (over || !S) return;
  const p = S.b[m.f], t = p.toUpperCase(), mover = S.turn;
  const cap = S.b[m.t] || (m.fl === 'ep' ? (isW(p) ? 'p' : 'P') : null);
  hist.push({ S, last, caps: { w: caps.w.slice(), b: caps.b.slice() }, moves: moves.slice(), score, endgameMoves });
  let txt = m.fl === 'cK' ? 'O-O' : m.fl === 'cQ' ? 'O-O-O' : (t === 'P' ? '' : t) + sqName(m.f) + (cap ? 'x' : '-') + sqName(m.t) + (m.pr ? '=' + m.pr : '');
  S = apply(S, m); last = [m.f, m.t]; hintSq = null;
  if (cap) caps[isW(cap) ? 'b' : 'w'].push(cap);
  const k = posKey(S); reps[k] = (reps[k] || 0) + 1;
  if (clockOn) { clockStarted = true; clockLast = Board.now(); }
  if (mode === 'endgame' && mover === 'w') endgameMoves++;
  if (isHumanColor(mover)) { humanMoves++; if (humanMoves === 1) GameUI.unlock('first-move'); }
  if (m.fl === 'cK' || m.fl === 'cQ') GameUI.unlock('castle');
  if (m.pr) GameUI.unlock('promotion');
  if (m.fl === 'ep') GameUI.unlock('en-passant');
  moves.push(txt);
  if (cap) addScore(VAL[cap.toUpperCase()] / 10);
  if (m.pr) addScore(50);
  if (m.fl === 'cK' || m.fl === 'cQ') addScore(20);
  if (inCheck(S, S.turn === 'w')) addScore(10);
  Board.sfx(cap ? 'capture' : inCheck(S, S.turn === 'w') ? 'check' : 'move');
  const ml = legal(S), chk = inCheck(S, S.turn === 'w');
  if (mode === 'puzzle') {
    if (!ml.length && chk) {
      puzzlesSolved++; addScore(300); over = 'Puzzle ' + (puzzleIndex + 1) + ' solved';
      Board.sfx('win'); render();
      if (puzzlesSolved >= PUZZLES.length) {
        if (puzzleMisses === 0) addScore(300);
        over = 'Puzzle sprint complete' + (puzzleMisses === 0 ? ' — perfect' : '');
        return conclude('puzzle', 'w');
      }
      const want = puzzleIndex + 1;
      Board.after(Board.pace(700), () => { if (mode === 'puzzle' && !over && puzzleIndex === want - 1) loadPuzzle(want); });
      return;
    }
  }
  if (!ml.length) {
    over = chk ? (S.turn === 'w' ? 'Black wins by checkmate' : 'White wins by checkmate') : 'Draw by stalemate';
    render(); return conclude(mode, resultWinner());
  }
  if (S.hm >= 100) { over = 'Draw by the 50-move rule'; render(); return conclude(mode, 'draw'); }
  if (reps[k] >= 3) { over = 'Draw by threefold repetition'; render(); return conclude(mode, 'draw'); }
  const pcs = S.b.filter(Boolean).map((x) => x.toUpperCase()).filter((x) => x !== 'K');
  if (pcs.length === 0 || (pcs.length === 1 && (pcs[0] === 'B' || pcs[0] === 'N'))) { over = 'Draw: not enough material to checkmate'; render(); return conclude(mode, 'draw'); }
  if (mode === 'endgame' && endgameMoves >= 30) { over = '30 moves are up — the endgame lab ends in a draw'; render(); return conclude(mode, 'draw'); }
  render();
  maybeCpu();
}

function tryPuzzle(m) {
  const next = apply(S, m);
  const mate = !legal(next).length && inCheck(next, next.turn === 'w');
  if (!mate) { puzzleMisses++; puzzleMsg = 'Not mate — look again.'; Board.sfx('error'); render(); return; }
  play(m);
}
function attemptMove(m) {
  if (over) return;
  if (mode === 'puzzle' && S.turn === 'w') { tryPuzzle(m); return; }
  play(m);
}
function clickSq(i) {
  if (menuPaused || over || thinking || !humanTurn()) return;
  const p = S.b[i], w = S.turn === 'w';
  if (sel >= 0) { const ms = tg.filter((m) => m.t === i); if (ms.length) { choose(ms); return; } }
  if (p && isW(p) === w) { sel = i; tg = legal(S).filter((m) => m.f === i); Board.sfx('click'); } else { sel = -1; tg = []; }
  render();
}
function choose(ms) {
  if (ms[0].pr) Board.modal('Promote your pawn to…', '', ['Queen', 'Rook', 'Bishop', 'Knight'].map((n, j) => [n, () => finish(ms.find((m) => m.pr === 'QRBN'[j]))]));
  else finish(ms[0]);
}
function finish(m) { sel = -1; tg = []; attemptMove(m); }
function undo() {
  if (thinking || !hist.length || mode === 'puzzle') return;
  const pop = () => { const h = hist.pop(); S = h.S; last = h.last; caps = h.caps; moves = h.moves; score = h.score; endgameMoves = h.endgameMoves; };
  pop(); if (side !== 'two' && mode !== 'endgame' && !humanTurn() && hist.length) pop();
  over = null; settled = false; sel = -1; tg = []; hintSq = null; reps = {};
  for (const h of hist) reps[posKey(h.S)] = (reps[posKey(h.S)] || 0) + 1;
  reps[posKey(S)] = (reps[posKey(S)] || 0) + 1;
  render(); maybeCpu();
}
function hint() {
  if (over || thinking || !humanTurn()) return;
  if (mode === 'puzzle') { const p = PUZZLES[puzzleIndex]; hintSq = [sqIndex(p.from), sqIndex(p.to)]; Board.sfx('hint'); render(); return; }
  const m = bestMove(S, 3, 0); if (m) { hintSq = [m.f, m.t]; Board.sfx('hint'); render(); }
}

function paintScore() { $('#score').textContent = score; $('#best').textContent = Number(GameUI.stats().bestScore) || 0; }
function paintClocks() {
  $('#clocks').classList.toggle('hide', !clockOn);
  $('#clkW').classList.toggle('on', clockOn && S && S.turn === 'w' && !over);
  $('#clkB').classList.toggle('on', clockOn && S && S.turn === 'b' && !over);
  $('#clkW').querySelector('b').textContent = fmtClock(clockW);
  $('#clkB').querySelector('b').textContent = fmtClock(clockB);
}
function render() {
  if (!S) return;
  const w = S.turn === 'w', chk = inCheck(S, w), ksq = chk ? kingAt(S.b, w) : -1, tset = new Set(tg.map((m) => m.t));
  sqs.forEach((d, k) => {
    const i = idx(k), p = S.b[i], pc = d.firstChild;
    d.className = 'sq ' + ((row(i) + col(i)) % 2 ? 'd' : 'l') + (i === sel ? ' sel' : '') + (last && (i === last[0] || i === last[1]) ? ' last' : '') + (i === ksq ? ' chk' : '') +
      (tset.has(i) ? ' tg' + (p || (S.b[sel] && S.b[sel].toUpperCase() === 'P' && col(i) !== col(sel)) ? ' cp' : '') : '') + (hintSq && (i === hintSq[0] || i === hintSq[1]) ? ' hint' : '');
    pc.className = 'pc ' + (p ? (isW(p) ? 'w' : 'b') : ''); pc.textContent = p ? GL[p.toUpperCase()] + '\uFE0E' : '';
    const r = d.querySelector('.r'), f = d.querySelector('.f');
    if (r) r.textContent = 8 - row(i); if (f) f.textContent = 'abcdefgh'[col(i)];
  });
  const who = w ? 'White' : 'Black';
  let status;
  if (over) status = over;
  else if (thinking) status = who + ' (computer) is thinking…';
  else if (mode === 'puzzle') status = 'Mate in one — find the finish' + (puzzleMsg ? ' · ' + puzzleMsg : '');
  else if (mode === 'endgame') status = 'Mate within ' + Math.max(0, 30 - endgameMoves) + ' moves' + (chk ? ' · check!' : '');
  else status = (chk ? 'Check! ' : '') + who + ' to move' + (side !== 'two' && humanTurn() ? ' — your turn' : '');
  if (clockOn && !over) status = MODE_NAMES[mode] + ' · ' + status;
  $('#status').textContent = status;
  const sum = (a) => a.reduce((t, x) => t + VAL[x.toUpperCase()], 0), diff = (sum(caps.w) - sum(caps.b)) / 100;
  const show = (a) => a.slice().sort((x, y) => VAL[y.toUpperCase()] - VAL[x.toUpperCase()]).map((x) => GL[x.toUpperCase()] + '\uFE0E').join('');
  $('#capt').innerHTML = `White has taken <span>${show(caps.w) || '—'}</span><br>Black has taken <span>${show(caps.b) || '—'}</span>` + (diff ? `<br><b>${diff > 0 ? 'White' : 'Black'} is up ${Math.abs(diff)}</b>` : '');
  let h = ''; for (let j = 0; j < moves.length; j += 2) h += `<div><b>${j / 2 + 1}.</b>${moves[j]}${moves[j + 1] ? '&nbsp;&nbsp;' + moves[j + 1] : ''}</div>`;
  $('#moves').innerHTML = h || '<span style="color:var(--muted)">Moves will appear here.</span>'; $('#moves').scrollTop = 1e6;
  const pz = $('#puzzle');
  pz.hidden = mode !== 'puzzle';
  if (mode === 'puzzle') pz.innerHTML = `<b>Puzzle ${Math.min(puzzleIndex + 1, 5)}/5 · ${PUZZLES[puzzleIndex].name}</b><br>Solved ${puzzlesSolved} · Misses ${puzzleMisses}${puzzleMsg ? '<br>' + puzzleMsg : ''}`;
  paintClocks(); paintScore();
}

function clockTick() {
  if (!clockOn || !clockStarted || over || menuPaused || !S) return;
  const now = Board.now(), dt = (now - clockLast) / 1000;
  clockLast = now;
  if (dt <= 0) return;
  if (S.turn === 'w') clockW = Math.max(0, clockW - dt); else clockB = Math.max(0, clockB - dt);
  paintClocks();
  if (clockW <= 0 || clockB <= 0) flag(clockW <= 0 ? 'w' : 'b');
}
function flag(flagged) {
  if (over) return;
  const winner = flagged === 'w' ? 'b' : 'w';
  if (flagged === 'w') clockW = 0; else clockB = 0;
  clockOn = false;
  over = (winner === 'w' ? 'White' : 'Black') + ' wins on time';
  render(); conclude('blitz', winner);
}

/* ---------------- shared menu contract ---------------- */
const GameUI = Board.ui({
  id: 'chess', title: 'Chess', subtitle: 'The royal game in five modes.', accent: '#f59e0b',
  modes: MODES, achievements: ACHIEVEMENTS,
  tutorial: { type: 'interactive', steps: [
    { text: 'Select a piece, then click a highlighted square to move.' },
    { text: 'Move the king two squares to castle; pawns promote on the far rank.' },
    { text: 'In Blitz your clock runs on every move — keep it above zero.' },
    { text: 'Puzzle Sprint asks for mate in one; solve all five without a miss.' },
  ] },
  hooks: {
    applyMode: (next) => {
      mode = MODES.some((m) => m.id === next) ? next : 'classic';
      if (S) newGame();
    },
    applyCosmetic,
    onStart: () => { menuPaused = false; clockLast = Board.now(); maybeCpu(); },
  },
});

/* ---------------- input ---------------- */
boardEl.addEventListener('click', (e) => { const d = e.target.closest('.sq'); if (d) clickSq(idx(+d.dataset.k)); });
$('#new').onclick = newGame; $('#undo').onclick = undo; $('#hint').onclick = hint;
$('#flip').onclick = () => { flipped = !flipped; render(); };
$('#side').onchange = newGame;
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey) return;
  if (menuPaused) return;
  const k = e.key.toLowerCase();
  if (k === 'n') newGame(); else if (k === 'u') undo(); else if (k === 'f') { flipped = !flipped; render(); } else if (k === 't') hint();
});
window.ApexGameMenuActions = {
  play: function () { menuPaused = false; clockLast = Board.now(); maybeCpu(); },
  pause: function (value) {
    menuPaused = !!value;
    if (menuPaused && thinking) { genId++; thinking = false; render(); }
    else if (!menuPaused) { clockLast = Board.now(); maybeCpu(); }
  },
  resume: function () { menuPaused = false; clockLast = Board.now(); maybeCpu(); },
  restart: function () { menuPaused = false; newGame(); }
};
Board.every(200, clockTick);

newGame();

if (/(\?|&)test=1(?:&|$)/.test(location.search)) {
  window.ChessTest = {
    state: () => ({
      mode, side, turn: S.turn, over, thinking, menuPaused, score, fen: toFen(S),
      moves: moves.length, legalCount: legal(S).length, check: inCheck(S, S.turn === 'w'),
      clockW, clockB, clockOn, clockStarted, puzzlesSolved, puzzleIndex, puzzleMisses, endgameMoves, humanMoves,
      best: Number(GameUI.stats().bestScore) || 0, saves: JSON.parse(JSON.stringify(Save.load('chess'))),
    }),
    modes: () => MODES.map((m) => m.id),
    setMode: (id) => GameUI.setMode(id),
    getMode: () => GameUI.getMode(),
    restart: () => newGame(),
    setSide: (s) => { $('#side').value = s; newGame(); },
    setLevel: (n) => { $('#lvl').value = String(n); },
    setDifficulty: (d) => Board.setDifficulty(d),
    level: () => Board.level(),
    award: (n) => addScore(n),
    legal: () => legal(S).map((m) => ({ f: sqName(m.f), t: sqName(m.t), pr: m.pr || '', fl: m.fl || '' })),
    play: (f, t, pr) => {
      const ms = legal(S).filter((m) => m.f === sqIndex(f) && m.t === sqIndex(t) && (!pr || m.pr === pr));
      if (!ms.length) return false;
      attemptMove(ms[0]); return true;
    },
    fen: () => toFen(S),
    setFen: (fen) => {
      S = parseFen(fen); hist = []; sel = -1; tg = []; last = null; over = null; moves = []; caps = { w: [], b: [] };
      reps = {}; reps[posKey(S)] = 1; hintSq = null; thinking = false; endgameMoves = 0; render();
    },
    grid: () => S.b.map((p) => p || '.').join(''),
    moves: () => moves.slice(),
    clock: (w, b) => { clockW = Number(w); clockB = Number(b); clockOn = true; clockStarted = true; clockLast = Board.now(); paintClocks(); },
    tick: (ms) => {
      const sec = Math.max(0, Number(ms) || 0) / 1000;
      if (S.turn === 'w') clockW = Math.max(0, clockW - sec); else clockB = Math.max(0, clockB - sec);
      clockOn = true; clockStarted = true; paintClocks();
      if (clockW <= 0 || clockB <= 0) flag(clockW <= 0 ? 'w' : 'b');
      return { clockW, clockB, over };
    },
    flag: () => flag(S.turn),
    solvePuzzle: () => {
      const p = PUZZLES[puzzleIndex]; if (mode !== 'puzzle') return false;
      return window.ChessTest.play(p.from, p.to);
    },
    failPuzzle: () => {
      if (mode !== 'puzzle') return false;
      const m = legal(S).find((cand) => { const n = apply(S, cand); return legal(n).length || !inCheck(n, n.turn === 'w'); });
      if (!m) return false;
      attemptMove(m); return puzzleMisses;
    },
    setPuzzle: (i) => { if (mode !== 'puzzle') return false; loadPuzzle(Math.max(0, Math.min(PUZZLES.length - 1, i))); return true; },
    advancePuzzle: () => { if (mode !== 'puzzle' || puzzleIndex >= PUZZLES.length - 1) return false; loadPuzzle(puzzleIndex + 1); return true; },
    puzzleNames: () => PUZZLES.map((p) => p.name),
    puzzleFens: () => PUZZLES.map((p) => p.fen),
    undo: () => undo(),
    hint: () => hint(),
    menuPaused: (value) => { menuPaused = !!value; clockLast = Board.now(); return menuPaused; },
    start: () => { menuPaused = false; clockLast = Board.now(); },
    colors: () => {
      const cs = getComputedStyle(document.documentElement);
      return { w: cs.getPropertyValue('--ch-w').trim(), b: cs.getPropertyValue('--ch-b').trim(), light: cs.getPropertyValue('--ch-light').trim(), dark: cs.getPropertyValue('--ch-dark').trim(), frame: cs.getPropertyValue('--ch-frame').trim(), last: cs.getPropertyValue('--ch-last').trim(), theme: document.body.style.background || 'auto' };
    },
    cosmetic: (slot, id) => { applyCosmetic(slot, id); return window.ChessTest.colors(); },
    cosmeticList: () => (window.Meta && Meta.getCosmetics ? Meta.getCosmetics('chess') : []).map((item) => ({ id: item.id, slot: item.slot })),
    achievements: () => (Save.load('chess').achievements || []).slice(),
    stats: () => Save.load('chess').stats || {},
    modalOpen: () => { const d = document.getElementById('bk-dlg'); return !!(d && d.open); },
    closeModal: () => { const d = document.getElementById('bk-dlg'); if (d && d.open) d.close(); },
    isHumanTurn: () => humanTurn(),
  };
}
</script>
<script src="../../kits/menu-bootstrap.js"></script>
</body>
