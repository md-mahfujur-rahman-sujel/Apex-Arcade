<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glow Beetle</title>
<script src="../../kits/music-kit.js"></script><script src="../../kits/menu-kit.js"></script>
</head>
<body>

<script src="../../kits/perf-kit.js"></script>
<script src="../../kits/save-kit.js"></script>
<script src="../../kits/meta-config.js"></script>
<script src="../../kits/meta-kit.js"></script>
<script src="../../kits/arcade-core.js"></script>
<script src="../../kits/score-bridge.js"></script>
<script src="../../kits/ui-kit.js"></script>
<script>
/* Glow Beetle — neon maze chase. A beetle gathers energy seeds while four patrol drones hunt it,
   each with its own targeting habit. Scatter/chase waves, glow cores, tunnels, bonus gems, lives, levels. */
(function () {
  const A = Arcade;
  const T = 24, COLS = 21, ROWS = 23, OX = 8, OY = 46, TUN = 10;
  const MAP = [
    '#####################',
    '#o........#........o#',
    '#.###.###.#.###.###.#',
    '#...................#',
    '#.###.#.#####.#.###.#',
    '#.....#...#...#.....#',
    '#####.###.#.###.#####',
    '#####.#.......#.#####',
    '#####.#.##-##.#.#####',
    '#####.#.#   #.#.#####',
    '     ...#   #...     ',
    '#####.#.#####.#.#####',
    '#####.#.......#.#####',
    '#.....#...#...#.....#',
    '#.###.###.#.###.###.#',
    '#o.................o#',
    '###.#.#.#####.#.#.###',
    '#.....#.......#.....#',
    '#.###.#.#####.#.###.#',
    '#.....#...#...#.....#',
    '#.###.###.#.###.###.#',
    '#...................#',
    '#####################',
  ];
  const DIRS = [[0, -1], [-1, 0], [0, 1], [1, 0]];
  const PAL = [210, 150, 280, 25, 335, 190];
  const GEMS = [['#fb7185', 100], ['#fbbf24', 300], ['#34d399', 500], ['#60a5fa', 700], ['#c084fc', 1000], ['#f8fafc', 2000]];
  const DRONES = [
    { name: 'dart', col: '#fb7185', corner: [19, -2], rel: 0 },
    { name: 'lurk', col: '#a78bfa', corner: [1, -2], rel: 160 },
    { name: 'flank', col: '#2dd4bf', corner: [19, 25], rel: 420 },
    { name: 'drift', col: '#fbbf24', corner: [1, 25], rel: 700 },
  ];
  let M, mazeCv, pl, gh, seeds, eaten, lives, level, ph, phT, modeIdx, modeT, frT, combo, gem, nextLife, tog, flashT;
  let activeMode = 'classic', difficulty = 'normal', campaignStage = 1, sectorLives = 3, dailySeed = 0, rngState = 0;
  let beetleColor = '#84cc16', effectColor = '#67e8f9', wallHue = null, mazeBackground = '#060818', shakeScale = 1;

  function award(points) { Arcade.G.addScore(Math.round(points * (activeMode === 'last-light' ? 1.25 : difficulty === 'hard' ? 1.25 : 1))); }
  function unlock(id) {
    const saved = Save.load('glow-beetle');
    if ((Array.isArray(saved.achievements) ? saved.achievements : []).includes(id)) return;
    Save.update('glow-beetle', { achievements: [id] });
    if (window.Apex && Apex.unlockAchievement) Apex.unlockAchievement(id, 'glow-beetle');
    UI.toast(id.replace(/-/g, ' '), { color: '#a3e635' });
  }
  function seedForToday() {
    const date = new Date(), stamp = date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
    let hash = stamp ^ 0x6d2b79f5; for (const ch of 'glow-beetle') hash = Math.imul(hash ^ ch.charCodeAt(0), 16777619);
    return hash >>> 0 || 1;
  }
  function seededPick(items) {
    if (activeMode !== 'daily') return A.pick(items);
    rngState ^= rngState << 13; rngState ^= rngState >>> 17; rngState ^= rngState << 5;
    return items[(rngState >>> 0) % items.length];
  }

  const wrapx = (x) => (x < 0 ? COLS - 1 : x >= COLS ? 0 : x);
  function cell(x, y) { if (y < 0 || y >= ROWS) return '#'; if (x < 0 || x >= COLS) return y === TUN ? ' ' : '#'; return M[y][x]; }
  function open(cx, cy, dx, dy, gate) { const c = cell(cx + dx, cy + dy); return c !== '#' && (c !== '-' || gate); }

  function buildMaze() {
    if (!mazeCv) mazeCv = document.createElement('canvas');
    mazeCv.width = COLS * T; mazeCv.height = ROWS * T;
    const c = mazeCv.getContext('2d'), hue = wallHue == null ? PAL[(level - 1) % PAL.length] : wallHue;
    const wall = (x, y) => cell(x, y) === '#';
    c.fillStyle = mazeBackground; c.fillRect(0, 0, mazeCv.width, mazeCv.height);
    // floor shadows under walls (depth)
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (wall(x, y)) continue;
      if (wall(x, y - 1)) { const g = c.createLinearGradient(0, y * T, 0, y * T + 9); g.addColorStop(0, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(x * T, y * T, T, 9); }
      if (wall(x - 1, y)) { const g = c.createLinearGradient(x * T, 0, x * T + 7, 0); g.addColorStop(0, 'rgba(0,0,0,.4)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(x * T, y * T, 7, T); }
    }
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (!wall(x, y)) continue;
      const g = c.createLinearGradient(0, y * T, 0, y * T + T);
      g.addColorStop(0, 'hsl(' + hue + ',55%,24%)'); g.addColorStop(1, 'hsl(' + hue + ',60%,12%)');
      c.fillStyle = g; c.fillRect(x * T, y * T, T, T);
    }
    c.save(); c.strokeStyle = 'hsl(' + hue + ',95%,66%)'; c.lineWidth = 2; c.shadowColor = 'hsl(' + hue + ',100%,60%)'; c.shadowBlur = 7; c.lineCap = 'round';
    c.beginPath();
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (!wall(x, y)) continue;
      const px = x * T, py = y * T;
      if (!wall(x, y - 1)) { c.moveTo(px + 1, py + 1.5); c.lineTo(px + T - 1, py + 1.5); }
      if (!wall(x, y + 1)) { c.moveTo(px + 1, py + T - 1.5); c.lineTo(px + T - 1, py + T - 1.5); }
      if (!wall(x - 1, y)) { c.moveTo(px + 1.5, py + 1); c.lineTo(px + 1.5, py + T - 1); }
      if (!wall(x + 1, y)) { c.moveTo(px + T - 1.5, py + 1); c.lineTo(px + T - 1.5, py + T - 1); }
    }
    c.stroke(); c.restore();
    c.fillStyle = '#f0abfc'; c.shadowColor = '#e879f9'; c.shadowBlur = 8; c.fillRect(10 * T + 2, 8 * T + T / 2 - 2, T - 4, 4);
  }

  function loadSeeds() {
    M = MAP.map((r) => r.split(''));
    eaten = 0; seeds = 0; gem = null;
    for (const r of M) for (const ch of r) if (ch === '.' || ch === 'o') seeds++;
  }
  function resetActors() {
    pl = { cx: 10, cy: 15, dx: 0, dy: 0, p: 0, want: [-1, 0], face: Math.PI, mouth: 0 };
    gh = DRONES.map((d, i) => ({ ...d, cx: i === 0 ? 10 : 9 + (i - 1), cy: i === 0 ? 7 : 10, dx: i === 0 ? -1 : 0, dy: 0, p: 0, state: i === 0 ? 'out' : 'house', fr: false, rev: false, bob: i * 1.7 }));
    modeIdx = 0; modeT = 0; frT = 0; combo = 0; ph = 'intro'; phT = 110;
  }
  function startLevel() { loadSeeds(); buildMaze(); resetActors(); }

  const gSpeed = () => Math.min(0.125, 0.092 + level * 0.005) * (difficulty === 'easy' ? 0.8 : difficulty === 'hard' ? 1.35 : 1) * (activeMode === 'last-light' ? 1.1 : 1);
  const schedule = () => [Math.max(160, (difficulty === 'hard' ? 360 : 460) - level * 40), 1200, Math.max(160, 460 - level * 40), 1200, 300, 1200, 300, 1e9];
  const chasing = () => modeIdx % 2 === 1;

  function stepEnt(e, sp, choose) {
    let rem = sp, guard = 0;
    while (rem > 1e-6 && guard++ < 5) {
      if (!e.dx && !e.dy) { choose(e); if (!e.dx && !e.dy) return; }
      const need = 1 - e.p;
      if (rem >= need) { rem -= need; e.cx = wrapx(e.cx + e.dx); e.cy += e.dy; e.p = 0; if (e.arrive) e.arrive(e); choose(e); if (!e.dx && !e.dy) return; }
      else { e.p += rem; rem = 0; }
    }
  }
  function reverse(e) { if (!e.dx && !e.dy) return; e.cx = wrapx(e.cx + e.dx); e.cy += e.dy; e.p = 1 - e.p; e.dx = -e.dx; e.dy = -e.dy; }
  const pos = (e) => [e.cx + e.dx * e.p, e.cy + e.dy * e.p];

  function plChoose(e) {
    const w = e.want;
    if (w && open(e.cx, e.cy, w[0], w[1], false)) { e.dx = w[0]; e.dy = w[1]; }
    else if (!(e.dx || e.dy) || !open(e.cx, e.cy, e.dx, e.dy, false)) { e.dx = 0; e.dy = 0; }
    if (e.dx || e.dy) e.face = Math.atan2(e.dy, e.dx);
  }
  function eatAt(G, x, y) {
    const ch = M[y][x]; if (ch !== '.' && ch !== 'o') return;
    M[y][x] = ' '; seeds--; eaten++;
    if (eaten === 1) unlock('first-seed');
    const sx = OX + (x + 0.5) * T, sy = OY + (y + 0.5) * T;
    if (ch === '.') { award(10); A.tone((tog = !tog) ? 260 : 340, 0.05, 'triangle', 0.045); G.burst(sx, sy, 2, { color: '#fde68a', speed: 1.2, life: 12, size: 2 }); }
    else {
      unlock('core-charge'); award(50); A.sfx('power'); G.ring(sx, sy, effectColor, 90); G.shake(3 * shakeScale);
      frT = Math.max(100, 440 - level * 55); combo = 0;
      for (const g of gh) if (g.state !== 'eyes') { g.fr = true; if (g.state !== 'house') g.rev = true; }
    }
    if (eaten === 60 || eaten === 150) { const q = GEMS[Math.min(level - 1, GEMS.length - 1)]; gem = { col: q[0], pts: q[1], life: 660 }; }
  }

  function gArrive(g) {
    if (g.state === 'eyes' && g.cx === 10 && g.cy === 9) { g.state = 'leave'; g.fr = false; }
    else if (g.state === 'leave' && g.cx === 10 && g.cy === 7) { g.state = 'out'; g.dx = 0; g.dy = 0; }
  }
  function target(g) {
    if (g.state === 'eyes') return [10, 9];
    if (g.state === 'leave') return [10, 7];
    if (!chasing()) return g.corner;
    const px = pl.cx, py = pl.cy, ax = pl.dx, ay = pl.dy;
    if (g.name === 'dart') return [px, py];
    if (g.name === 'lurk') return [px + ax * 4, py + ay * 4];
    if (g.name === 'flank') { const r = gh[0], vx = px + ax * 2, vy = py + ay * 2; return [r.cx + (vx - r.cx) * 2, r.cy + (vy - r.cy) * 2]; }
    return Math.hypot(g.cx - px, g.cy - py) > 8 ? [px, py] : g.corner;
  }
  function gChoose(g) {
    const gate = g.state === 'leave' || g.state === 'eyes';
    const moving = g.dx || g.dy;
    if (g.rev) { g.rev = false; if (moving && open(g.cx, g.cy, -g.dx, -g.dy, gate)) { g.dx = -g.dx; g.dy = -g.dy; return; } }
    const opts = DIRS.filter((d) => !(moving && d[0] === -g.dx && d[1] === -g.dy) && open(g.cx, g.cy, d[0], d[1], gate));
    if (!opts.length) { if (moving && open(g.cx, g.cy, -g.dx, -g.dy, gate)) { g.dx = -g.dx; g.dy = -g.dy; } else { g.dx = 0; g.dy = 0; } return; }
    let pick;
    if (g.fr && g.state === 'out') pick = seededPick(opts);
    else {
      const t = target(g); let bd = 1e9;
      for (const d of opts) { const v = (g.cx + d[0] - t[0]) ** 2 + (g.cy + d[1] - t[1]) ** 2; if (v < bd) { bd = v; pick = d; } }
    }
    g.dx = pick[0]; g.dy = pick[1];
  }
  function moveDrone(G, g) {
    if (g.state === 'house') {
      g.bob += 0.12;
      const t = g.rel / (1 + (level - 1) * 0.25);
      if (G.t > t && (eaten >= (g.name === 'flank' ? 25 : g.name === 'drift' ? 45 : 0) || G.t > 1500)) { g.state = 'leave'; g.dx = 0; g.dy = 0; g.p = 0; }
      return;
    }
    let sp = gSpeed();
    if (g.state === 'eyes') sp = 0.23; else if (g.fr) sp = sp * 0.55; else if (g.state === 'leave') sp = 0.07;
    if (g.cy === TUN && (g.cx < 5 || g.cx > 15) && g.state !== 'eyes') sp *= 0.55;
    g.arrive = gArrive;
    stepEnt(g, sp, gChoose);
  }

  function drawBeetle(c, G) {
    const [tx, ty] = pos(pl), x = OX + (tx + 0.5) * T, y = OY + (ty + 0.5) * T;
    const dead = ph === 'dying', k = dead ? 1 - phT / 100 : 0;
    A.shadow(c, x + 2, y + 11, 10, 3.5, 0.4);
    c.save(); c.translate(x, y);
    if (dead) { c.rotate(k * 9); c.scale(1 - k * 0.9, 1 - k * 0.9); c.globalAlpha = 1 - k * 0.6; }
    c.rotate(pl.face + Math.PI / 2);
    const run = (pl.dx || pl.dy) && ph === 'run' ? G.clock * 0.6 : 0;
    c.strokeStyle = '#3f2a14'; c.lineWidth = 2; c.lineCap = 'round';
    for (let i = -1; i <= 1; i++) for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 5, i * 5); c.lineTo(s * (11 + Math.sin(run + i * 2 + s) * 1.5), i * 5 + Math.cos(run + i + s) * 3); c.stroke(); }
    c.strokeStyle = '#fde68a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-2, -9); c.quadraticCurveTo(-6, -15, -9, -13); c.moveTo(2, -9); c.quadraticCurveTo(6, -15, 9, -13); c.stroke();
    c.shadowColor = '#a3e635'; c.shadowBlur = 12;
    const g = c.createRadialGradient(-3, -3, 2, 0, 0, 13); g.addColorStop(0, '#f7fee7'); g.addColorStop(0.55, beetleColor); g.addColorStop(1, A.shade(beetleColor, -0.55));
    c.fillStyle = g; c.beginPath(); c.ellipse(0, 1, 9, 11.5, 0, 0, A.TAU); c.fill(); c.shadowBlur = 0;
    c.fillStyle = '#1a2e05'; c.beginPath(); c.arc(0, -9, 5, 0, A.TAU); c.fill();
    c.strokeStyle = 'rgba(20,40,5,.7)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, -8); c.lineTo(0, 12); c.stroke();
    c.fillStyle = '#facc15'; c.globalAlpha *= 0.5 + 0.5 * Math.sin(G.clock * 0.2); c.beginPath(); c.arc(0, 7, 3, 0, A.TAU); c.fill();
    c.restore();
  }
  function drawDrone(c, g, G) {
    const [tx, ty] = pos(g), x = OX + (tx + 0.5) * T, bob = Math.sin(G.clock * 0.12 + g.bob) * 1.8, y = OY + (ty + 0.5) * T + bob + (g.state === 'house' ? Math.sin(g.bob) * 2 : 0);
    const eyes = g.state === 'eyes';
    if (!eyes) {
      A.shadow(c, x + 2, OY + (ty + 0.5) * T + 12, 10 - bob, 3.5, 0.35);
      let col = g.col;
      if (g.fr) col = frT < 120 && ((G.clock >> 3) & 1) ? '#f8fafc' : '#4466d8';
      c.save(); c.shadowColor = col; c.shadowBlur = 12;
      const gr = c.createLinearGradient(0, y - 11, 0, y + 10); gr.addColorStop(0, A.shade(col, 0.3)); gr.addColorStop(1, A.shade(col, -0.35));
      c.fillStyle = gr; A.roundRect(c, x - 11, y - 8, 22, 17, 7); c.fill(); c.restore();
      // rotor
      const sp = G.clock * 0.9;
      c.strokeStyle = 'rgba(230,240,255,.8)'; c.lineWidth = 2; c.beginPath(); c.moveTo(x - 12 * Math.cos(sp), y - 12); c.lineTo(x + 12 * Math.cos(sp), y - 12); c.stroke();
      c.fillStyle = '#334155'; c.fillRect(x - 1.5, y - 12, 3, 5);
      // belly lights
      c.fillStyle = 'rgba(255,255,255,.55)'; for (let i = -1; i <= 1; i++) c.fillRect(x + i * 6 - 1.5, y + 5, 3, 2);
    }
    if (g.fr && !eyes) {
      c.fillStyle = '#fde68a'; c.fillRect(x - 6, y - 3, 3, 3); c.fillRect(x + 3, y - 3, 3, 3);
      c.strokeStyle = '#fde68a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x - 6, y + 3); c.lineTo(x - 3, y + 1); c.lineTo(x, y + 3); c.lineTo(x + 3, y + 1); c.lineTo(x + 6, y + 3); c.stroke();
      return;
    }
    // single glowing visor eye that tracks direction
    c.save(); c.shadowColor = '#fff'; c.shadowBlur = eyes ? 14 : 8;
    c.fillStyle = '#0b1020'; A.roundRect(c, x - 8, y - 5, 16, 8, 4); c.fill();
    c.fillStyle = eyes ? '#67e8f9' : '#fef08a'; c.beginPath(); c.arc(x + g.dx * 4, y - 1 + g.dy * 1.5, 2.8, 0, A.TAU); c.fill(); c.restore();
  }
  function drawGem(c, q, x, y, G) {
    c.save(); c.translate(x, y + Math.sin(G.clock * 0.1) * 2); c.shadowColor = q.col; c.shadowBlur = 12;
    c.fillStyle = q.col; c.beginPath(); c.moveTo(0, -9); c.lineTo(8, -2); c.lineTo(5, 8); c.lineTo(-5, 8); c.lineTo(-8, -2); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.moveTo(0, -9); c.lineTo(-3, -1); c.lineTo(0, 8); c.lineTo(3, -1); c.closePath(); c.fill(); c.restore();
  }

  const glowBeetleGame = Arcade.game({
    id: 'glow-beetle', title: 'Glow Beetle', subtitle: 'Neon maze chase · gather every seed, outwit the patrol drones', color: '#a3e635',
    help: 'Arrow keys or W/A/S/D to steer · eat all seeds · glow cores stun drones so you can zap them · side tunnels wrap around · P pause, M mute',
    w: 520, h: 640,
    touchL: [['◀', 'ArrowLeft'], ['▲', 'ArrowUp']], touchR: [['▼', 'ArrowDown'], ['▶', 'ArrowRight']],
    init(G) {
      const saved = Save.load('glow-beetle');
      level = 1; lives = activeMode === 'last-light' ? 1 : 3; nextLife = 10000; tog = false; flashT = 0;
      campaignStage = activeMode === 'campaign' ? Math.max(1, Math.min(5, Number(saved.stats && saved.stats.glowBeetleStage) || 1)) : 1;
      level = campaignStage; sectorLives = lives;
      dailySeed = activeMode === 'daily' ? seedForToday() : 0; rngState = dailySeed || 1;
      startLevel();
    },
    update(G) {
      let w = null;
      if (A.hit('ArrowUp', 'KeyW')) w = DIRS[0]; else if (A.hit('ArrowLeft', 'KeyA')) w = DIRS[1]; else if (A.hit('ArrowDown', 'KeyS')) w = DIRS[2]; else if (A.hit('ArrowRight', 'KeyD')) w = DIRS[3];
      else if (A.held('ArrowUp', 'KeyW')) w = DIRS[0]; else if (A.held('ArrowLeft', 'KeyA')) w = DIRS[1]; else if (A.held('ArrowDown', 'KeyS')) w = DIRS[2]; else if (A.held('ArrowRight', 'KeyD')) w = DIRS[3];
      if (w) pl.want = w;
      G.hudR = 'LV ' + level + '  ♥' + lives;
      if (ph === 'intro') { if (--phT <= 0) ph = 'run'; return; }
      if (ph === 'dying') { if (--phT <= 0) { if (lives <= 0) G.over('Caught!', 'Reached level ' + level); else resetActors(); } return; }
      if (ph === 'clear') {
        flashT++;
        if (--phT <= 0) {
          if (lives >= sectorLives) unlock('clean-sector');
          if (activeMode === 'daily') { unlock('daily-glow'); const d = new Date(), day = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); const old = Save.load('glow-beetle'); Save.update('glow-beetle', { daily: { day: day, best: Math.max(G.score, Number(old.daily && old.daily.best) || 0) } }); G.win('Daily Circuit complete!', 'Seed ' + dailySeed + ' · score ' + G.score); }
          else if (activeMode === 'last-light') { unlock('last-light'); G.win('Last Light clear!', 'One life · score ' + G.score); }
          else if (activeMode === 'campaign') {
            if (campaignStage >= 5) { unlock('beetle-legend'); Save.update('glow-beetle', { stats: { glowBeetleStage: 1 } }); G.win('Sector Campaign complete!', 'All five sectors illuminated'); }
            else { campaignStage++; level = campaignStage; sectorLives = lives; Save.update('glow-beetle', { stats: { glowBeetleStage: campaignStage } }); startLevel(); G.popup(260, OY + 11.5 * T, 'SECTOR ' + campaignStage, '#a3e635', 26); }
          } else { level++; if (level >= 5) unlock('deep-descent'); startLevel(); G.popup(260, OY + 11.5 * T, 'LEVEL ' + level, '#a3e635', 26); }
        }
        return;
      }
      if (activeMode !== 'last-light' && G.score >= nextLife) { lives++; nextLife += 10000; A.sfx('power'); G.popup(260, OY + 11.5 * T, '1UP!', '#a3e635', 24); }
      // waves
      if (frT > 0) { if (--frT === 0) { for (const g of gh) g.fr = false; combo = 0; } }
      else { const s = schedule(); if (++modeT >= s[modeIdx]) { modeIdx = Math.min(modeIdx + 1, s.length - 1); modeT = 0; for (const g of gh) if (g.state === 'out') g.rev = true; } }
      // beetle (instant reverse allowed)
      if (pl.want && (pl.dx || pl.dy) && pl.want[0] === -pl.dx && pl.want[1] === -pl.dy) { reverse(pl); pl.face = Math.atan2(pl.dy, pl.dx); }
      pl.arrive = (e) => eatAt(G, e.cx, e.cy);
      const psp = 0.112 * (difficulty === 'easy' ? 0.8 : 1) * (frT > 0 ? 1.06 : 1);
      stepEnt(pl, psp, plChoose);
      for (const g of gh) moveDrone(G, g);
      // gem
      if (gem) { gem.life--; const [px, py] = pos(pl); if (gem.life <= 0) gem = null; else if (Math.hypot(px - 10, py - 12) < 0.7) { unlock('gem-hunter'); award(gem.pts); A.sfx('coin'); G.popup(OX + 10.5 * T, OY + 12 * T, '+' + gem.pts, '#fde047', 18); G.burst(OX + 10.5 * T, OY + 12.5 * T, 18, { color: [gem.col, '#fff'], speed: 4, glow: true }); gem = null; } }
      // collisions
      const [px, py] = pos(pl);
      for (const g of gh) {
        if (g.state === 'house' || g.state === 'eyes' || g.state === 'leave') continue;
        const [gx, gy] = pos(g);
        if (Math.abs(gx - px) < 0.6 && Math.abs(gy - py) < 0.6) {
          const sx = OX + (gx + 0.5) * T, sy = OY + (gy + 0.5) * T;
          if (g.fr) {
            combo++; if (combo === 1) unlock('drone-tamer'); if (combo >= 4) unlock('combo-four'); const pts = 100 * 2 ** combo; award(pts); g.state = 'eyes'; g.fr = false; A.sfx('boom'); G.freeze(12); G.shake(5 * shakeScale);
            G.popup(sx, sy - 10, '+' + pts, '#67e8f9', 20); G.burst(sx, sy, 24, { color: ['#60a5fa', '#fff', g.col], speed: 4.5, glow: true, life: 34 }); G.ring(sx, sy, '#67e8f9', 70);
          } else {
            lives--; ph = 'dying'; phT = 100; A.sfx('ko'); G.shake(10 * shakeScale); G.freeze(8);
            G.burst(OX + (px + 0.5) * T, OY + (py + 0.5) * T, 32, { color: ['#d9f99d', '#fff', '#84cc16'], speed: 5, glow: true, life: 40 });
            return;
          }
        }
      }
      if (seeds <= 0) { ph = 'clear'; phT = 90; flashT = 0; A.sfx('win'); award(500); }
    },
    draw(G, c) {
      A.sky(c, 520, 640, ['#05060f', '#0a0f2a', '#070a1c']);
      c.save(); c.translate(OX, OY);
      if (ph === 'clear' && (flashT >> 3) & 1) c.filter = 'brightness(2.2)';
      c.drawImage(mazeCv, 0, 0); c.filter = 'none'; c.restore();
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        const ch = M[y][x]; if (ch !== '.' && ch !== 'o') continue;
        const cx = OX + (x + 0.5) * T, cy = OY + (y + 0.5) * T;
        if (ch === '.') { c.fillStyle = '#fde68a'; c.beginPath(); c.arc(cx, cy, 2.4, 0, A.TAU); c.fill(); }
        else { c.save(); c.shadowColor = '#67e8f9'; c.shadowBlur = 14; c.fillStyle = '#cffafe'; c.beginPath(); c.arc(cx, cy, 6.5 + Math.sin(G.clock * 0.15) * 1.5, 0, A.TAU); c.fill(); c.restore(); }
      }
      if (gem) drawGem(c, gem, OX + 10.5 * T, OY + 12.5 * T, G);
      const ents = gh.map((g) => ({ y: pos(g)[1], f: () => drawDrone(c, g, G) }));
      ents.push({ y: pos(pl)[1], f: () => drawBeetle(c, G) });
      ents.sort((a, b) => a.y - b.y).forEach((e) => e.f());
      G.drawFX(c);
      for (let i = 0; i < lives; i++) { c.save(); c.translate(26 + i * 28, OY + ROWS * T + 22); c.scale(0.55, 0.55); c.fillStyle = '#84cc16'; c.beginPath(); c.ellipse(0, 0, 9, 11.5, 0, 0, A.TAU); c.fill(); c.fillStyle = '#1a2e05'; c.beginPath(); c.arc(0, -9, 5, 0, A.TAU); c.fill(); c.restore(); }
      for (let i = 0; i < Math.min(level, 6); i++) drawGem(c, { col: GEMS[i][0] }, 500 - i * 26, OY + ROWS * T + 22, { clock: 0 });
      if (ph === 'intro') A.glowText(c, 'READY!', 260, OY + 12.35 * T, 24, '#a3e635', 'center', 14);
      A.vignette(c, 520, 640, 0.3);
    },
  });
  const beetleShake = glowBeetleGame.shake.bind(glowBeetleGame);
  glowBeetleGame.shake = (amount) => beetleShake(amount * shakeScale);
  glowBeetleGame.ui = UI.mountGame(glowBeetleGame, {
    id: 'glow-beetle', title: 'Glow Beetle', subtitle: 'Illuminate the maze. Outsmart the sentries.', accent: '#a3e635',
    modes: [
      { id: 'classic', name: 'Classic Maze', blurb: 'The original maze chase, with escalating levels.', seasonTargets: [2500, 7000, 14000] },
      { id: 'campaign', name: 'Sector Campaign', blurb: 'Clear five saved sectors while carrying your remaining lives forward.', seasonTargets: [3500, 8000, 16000] },
      { id: 'daily', name: 'Daily Circuit', blurb: 'A deterministic patrol pattern for today. Retries share the same seed.', seeded: true, seasonTargets: [2000, 5000, 10000] },
      { id: 'last-light', name: 'Last Light', blurb: 'One life, faster patrols, and a 1.25× score bonus.', seasonTargets: [3000, 7500, 15000] },
    ],
    settings: [
      { key: 'difficulty', label: 'Difficulty', type: 'select', options: ['easy', 'normal', 'hard'], default: 'normal' },
      { key: 'shake', label: 'Screen shake', type: 'slider', min: 0, max: 1, step: 0.1, default: 1 },
      { key: 'particles', label: 'Particles', type: 'select', options: ['lite', 'standard', 'ultra'], default: 'standard' },
    ],
    achievements: [
      { id: 'first-seed', name: 'First Seed', desc: 'Eat a maze seed.', rarity: 'common' },
      { id: 'core-charge', name: 'Core Charge', desc: 'Eat a power core.', rarity: 'common' },
      { id: 'drone-tamer', name: 'Drone Tamer', desc: 'Tag a frightened drone.', rarity: 'common' },
      { id: 'gem-hunter', name: 'Gem Hunter', desc: 'Collect a bonus gem.', rarity: 'rare' },
      { id: 'combo-four', name: 'Combo Four', desc: 'Tag four drones in a power window.', rarity: 'epic' },
      { id: 'clean-sector', name: 'Clean Sector', desc: 'Clear a sector without losing a life.', rarity: 'rare' },
      { id: 'deep-descent', name: 'Deep Descent', desc: 'Reach level five.', rarity: 'rare' },
      { id: 'daily-glow', name: 'Daily Glow', desc: 'Finish a Daily Circuit.', rarity: 'rare' },
      { id: 'last-light', name: 'Last Light', desc: 'Clear a sector in Last Light.', rarity: 'epic' },
      { id: 'beetle-legend', name: 'Beetle Legend', desc: 'Complete the Sector Campaign.', rarity: 'legendary' },
    ],
    tutorial: { type: 'interactive', steps: [
      { text: 'Steer with the arrow keys or WASD. Turns can be queued before a corner.', hold: 'ArrowLeft' },
      { text: 'Eat a glowing core to turn the patrol drones vulnerable.', hold: 'ArrowUp' },
      { text: 'Use the side tunnels to cross the maze and gather every seed.', hold: 'ArrowRight' },
    ] },
    hooks: {
      applyMode: (mode) => { activeMode = mode; },
      applySetting: (key, value) => {
        if (key === 'difficulty') difficulty = value;
        if (key === 'shake') shakeScale = Number(value);
        if (key === 'particles' && window.Perf && Perf.setTier) Perf.setTier(value);
      },
      applyCosmetic: (slot, id) => {
        if (slot === 'skin') beetleColor = id.includes('amber') ? '#f59e0b' : id.includes('rose') ? '#fb7185' : id.includes('ice') ? '#67e8f9' : id.includes('violet') ? '#a78bfa' : '#84cc16';
        if (slot === 'palette') wallHue = id.includes('ember') ? 18 : id.includes('ocean') ? 195 : id.includes('violet') ? 275 : id.includes('mono') ? 0 : 92;
        if (slot === 'trail') effectColor = id.includes('gold') ? '#facc15' : id.includes('rose') ? '#fb7185' : id.includes('violet') ? '#a78bfa' : '#67e8f9';
        if (slot === 'theme') mazeBackground = id.includes('dawn') ? '#171326' : id.includes('deep') ? '#02040b' : '#060818';
        if (M) buildMaze();
      },
      getResult: () => ({ score: glowBeetleGame.score, win: glowBeetleGame.state === 'won', mode: activeMode, level: level }),
    },
  });
})();
</script>
