<script>
/* Lanternbound — gothic action platformer: a lantern-bearing knight, a flicking chain-whip, candles that
   drop ammo for the throwing axe, three haunted stages and a floating duke at the end. Built on act-kit.js. */
const A = Arcade, K = Act, TAU = Math.PI * 2, GAME_ID = 'lanternbound';
const NATIVE_RANDOM = Math.random.bind(Math);

let activeMode = 'story', difficulty = 'normal', dailySeed = 0, rngState = 1, lastInitMode = null;
let runStarted = 0, runActive = false, runEnded = false, runKills = 0, runCandles = 0, runBossKills = 0;
let runDeaths = 0, lastLives = 3, hurtThisStage = false, stageSeen = -1, startBest = 0, shakeScale = 1;
let G0 = null, game = null, act = null, currentStage = 0;
let skin = { armor: '#94a3b8', trim: '#64748b', plume: '#7f1d1d', cloth: '#1e293b' };
let whipColor = '#fef3c7', effectColor = '#fbbf24', skyTheme = 'courtyard';

const MODES = {
  story: { label: 'STORY HUNT' },
  'relic-hunt': { label: 'RELIC HUNT' },
  'boss-rush': { label: "DUKE'S GAUNTLET" },
  daily: { label: 'DAILY CRYPT' },
  'nocturne-plus': { label: 'NOCTURNE+' },
};
const STORY_NAMES = ['Stage 1 · Moonlit Courtyard', 'Stage 2 · Haunted Library', 'Stage 3 · Clock Tower'];
const ARENA_NAMES = ['Duel 1 · Belfry Ascent', 'Duel 2 · Broken Nave', "Duel 3 · Duke's Court"];

/* ---------- daily seed and records ---------- */
function seedForToday() {
  const d = new Date(), key = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  let x = key ^ 0x6d2b79f5;
  for (const ch of GAME_ID) x = Math.imul(x ^ ch.charCodeAt(0), 16777619);
  return x >>> 0 || 1;
}
function dailySequence(n, seed) {
  let s = (seed || dailySeed || 1) >>> 0; const out = [];
  for (let i = 0; i < n; i++) { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; out.push(Number(((s >>> 0) / 4294967296).toFixed(6))); }
  return out;
}
function applyRng() {
  if (activeMode !== 'daily') { Math.random = NATIVE_RANDOM; return; }
  rngState = dailySeed || seedForToday();
  Math.random = () => { rngState ^= rngState << 13; rngState ^= rngState >>> 17; rngState ^= rngState << 5; return (rngState >>> 0) / 4294967296; };
}
function saved() { return (window.Save && Save.load(GAME_ID)) || {}; }
function stats() { const s = saved(); return s.stats || {}; }
function award(id, label) {
  const s = saved(), earned = Array.isArray(s.achievements) ? s.achievements : [];
  if (earned.includes(id)) return;
  Save.update(GAME_ID, { achievements: [id] });
  if (window.Apex && Apex.unlockAchievement) Apex.unlockAchievement(id, GAME_ID);
  UI.toast(label || id.replace(/-/g, ' '), { color: '#f59e0b' });
}
function stageNeed() { return activeMode === 'relic-hunt' ? 4 : 0; }
function stageName() { const n = act ? act.level : 0; return (activeMode === 'boss-rush' ? ARENA_NAMES : STORY_NAMES)[n] || STORY_NAMES[0]; }

function recordRun(won, coins, sec) {
  const st = stats(), stage = act ? act.level + 1 : 1, deaths = Math.max(runDeaths, act ? Math.max(0, 3 - act.lives) : 0);
  const patch = {
    runs: (st.runs || 0) + 1,
    seconds: (st.seconds || 0) + sec,
    kills: (st.kills || 0) + runKills,
    candles: (st.candles || 0) + runCandles,
    deaths: (st.deaths || 0) + deaths,
    highestStage: Math.max(st.highestStage || 0, stage),
    bestScore: Math.max(st.bestScore || 0, G0 ? G0.score : 0),
    lastMode: activeMode,
    bossesFelled: (st.bossesFelled || 0) + runBossKills,
    storyCompletions: (st.storyCompletions || 0) + (won && activeMode === 'story' ? 1 : 0),
    relicCompletions: (st.relicCompletions || 0) + (won && activeMode === 'relic-hunt' ? 1 : 0),
    dailyCompletions: (st.dailyCompletions || 0) + (won && activeMode === 'daily' ? 1 : 0),
    nocturneCompletions: (st.nocturneCompletions || 0) + (won && activeMode === 'nocturne-plus' ? 1 : 0),
    bossRushCompletions: (st.bossRushCompletions || 0) + (won && activeMode === 'boss-rush' ? 1 : 0),
    dailyBest: activeMode === 'daily' ? Math.max(st.dailyBest || 0, G0 ? G0.score : 0) : (st.dailyBest || 0),
  };
  if (won && activeMode === 'story') patch.bestTimeSec = Math.min(st.bestTimeSec || 99999, sec);
  Save.update(GAME_ID, { stats: patch });
  void coins;
}
function finishRun(G, won, coins) {
  if (runEnded) return won ? 'Score ' + G.score : 'Score ' + G.score;
  const sec = Math.max(1, Math.round((Date.now() - (runStarted || Date.now())) / 1000));
  recordRun(won, coins, sec);
  if (won) {
    if (!hurtThisStage) award('untouched', 'Untouched');
    if (activeMode === 'story') {
      award('story-clear', 'The Manor Is Silent');
      if (G.score > startBest) award('personal-best', 'Personal Best');
      const deaths = Math.max(runDeaths, act ? Math.max(0, 3 - act.lives) : 0);
      if (deaths === 0) award('iron-lantern', 'Iron Lantern');
      if (sec <= 360) award('speed-run', 'Lantern Sprint');
    }
    if (activeMode === 'relic-hunt') award('relic-keeper', 'Relic Keeper');
    if (activeMode === 'daily') award('daily-player', 'Daily Cryptographer');
    if (activeMode === 'nocturne-plus') award('nocturne-clear', 'Nocturne Adept');
    if (activeMode === 'boss-rush') award('gauntlet-clear', 'Gauntlet Run');
  }
  runEnded = true;
  return won
    ? 'Score ' + G.score + ' · ' + coins + ' relics · ' + sec + 's'
    : 'Score ' + G.score + ' · reached ' + stageName();
}
function trackStage()
{
  if (!act) return;
  const lvl = act.level;
  if (lvl === stageSeen) return;
  if (stageSeen >= 0 && !hurtThisStage) award('untouched', 'Untouched');
  stageSeen = lvl; hurtThisStage = false; currentStage = lvl;
  const st = stats();
  if ((st.highestStage || 0) < lvl + 1) Save.update(GAME_ID, { stats: { highestStage: lvl + 1 } });
}
function checkMilestones() {
  if (G0 && G0.score >= 10000) award('score-10000', 'Candlelight Legend');
}
function onKill(e, G) {
  runKills++;
  if (runKills >= 1) award('first-light', 'First Light');
  if (runKills >= 25) award('hunter', 'Relentless Hunter');
  if (e.d && e.d.ai === 'boss') { runBossKills++; award('duke-slayer', 'Hollow Duke Slain'); }
  checkMilestones();
}
function onBreak(ch) {
  if (ch !== 'i') return;
  runCandles++;
  if (runCandles >= 10) award('candlelight', 'Candle Lighter');
}
function onHurt() { hurtThisStage = true; }
function onToken(tokens) { if (tokens >= 4) UI.toast('Reliquary charged — find the gate', { color: '#f0abfc' }); }

/* ---------- cosmetics ---------- */
function applyCosmetic(slot, id) {
  const key = String(id || '').split(':').pop();
  if (slot === 'skin') {
    const skins = {
      'knight-ivory': { armor: '#94a3b8', trim: '#64748b', plume: '#7f1d1d', cloth: '#1e293b' },
      'knight-crimson': { armor: '#b91c1c', trim: '#fca5a5', plume: '#fde047', cloth: '#450a0a' },
      'knight-azure': { armor: '#38bdf8', trim: '#bae6fd', plume: '#f0abfc', cloth: '#082f49' },
      'knight-verdant': { armor: '#34d399', trim: '#a7f3d0', plume: '#fbbf24', cloth: '#064e3b' },
      'knight-obsidian': { armor: '#475569', trim: '#cbd5e1', plume: '#ef4444', cloth: '#0f172a' },
    };
    if (skins[key]) skin = Object.assign({}, skins[key]);
  } else if (slot === 'palette') {
    whipColor = key.includes('frost') ? '#a5f3fc' : key.includes('blood') ? '#fb7185' : key.includes('prism') ? '#e879f9' : '#fef3c7';
  } else if (slot === 'effect') {
    effectColor = key === 'ash' ? '#cbd5e1' : key === 'embers' ? '#fb923c' : key === 'moonlight' ? '#93c5fd' : '#fbbf24';
  } else if (slot === 'theme') {
    skyTheme = key.includes('bloodmoon') ? 'bloodmoon' : key.includes('frostfall') ? 'frostfall' : key.includes('belfry') ? 'belfry' : 'courtyard';
  }
}

function arenaStage(n) {
  const g = K.make(ARENA_NAMES[n], 40, 15, (g) => {
    g.ground(0, 40);
    g.set(2, 11, 'P'); g.set(6, 11, 'C');
    g.set(9, 11, 'i'); g.set(12, 11, 'i'); g.set(15, 11, 'i');
    g.plat(8, 9, 3); g.plat(16, 7, 3); g.plat(27, 9, 3);

function buildLevel(i) { return activeMode === 'boss-rush' ? arenaStage(i) : [stageOne, stageTwo, stageThree][i](); }

/* ---------- enemy defs (Nocturne scales HP and rewards) ---------- */
const ENEMY_BASE = {
  k: { w: 24, h: 32, hp: 2, ai: 'walk', sp: 0.8, sight: 140, score: 100, color: '#e5e7eb' },
  v: { w: 26, h: 18, hp: 1, ai: 'fly', sp: 1.6, sight: 200, range: 70, bob: 22, score: 80, color: '#7c3aed' },
  w: { w: 28, h: 32, hp: 3, ai: 'fly', sp: 0.9, sight: 260, range: 40, bob: 30, score: 200, color: '#a5b4fc', shoot: { speed: 2.6, color: '#a5b4fc' }, every: 120, aim: true },
  u: { w: 28, h: 30, hp: 4, ai: 'turret', fixed: true, score: 150, color: '#64748b', sight: 380, shoot: { speed: 3.2, color: '#f87171' }, every: 100, aim: true },
  B: { w: 56, h: 74, hp: 30, ai: 'boss', name: 'THE HOLLOW DUKE', wake: 380, grav: false, score: 3000, color: '#7c3aed', dmg: 2 },
};
const enemies = {};
for (const key of Object.keys(ENEMY_BASE)) {
  Object.defineProperty(enemies, key, {
    enumerable: true, configurable: true,
    get() {
      const base = ENEMY_BASE[key];
      if (activeMode !== 'nocturne-plus') return base;
      if (base.ai === 'boss') return Object.assign({}, base, { hp: Math.round(base.hp * 1.5), dmg: 3, score: Math.round(base.score * 1.5) });
      return Object.assign({}, base, { hp: Math.ceil(base.hp * 1.5), sp: (base.sp || 1) * 1.15, score: Math.round((base.score || 100) * 1.5) });
    },
  });
}

/* ---------- backdrop ---------- */
const SKY = {
  courtyard: [['#0b1026', '#2a1b4a', '#6d3a5a'], ['#1a0f0a', '#3b1d12', '#7c3a1a'], ['#050816', '#1b2559', '#3f2b79']],
  bloodmoon: [['#17040c', '#3f0d1d', '#7f1d1d'], ['#1a0a06', '#451a03', '#9a3412'], ['#140412', '#3b0764', '#831843']],
  frostfall: [['#050d1a', '#0c1e3a', '#1e40af'], ['#071018', '#0e2a33', '#155e75'], ['#040a14', '#111c3d', '#312e81']],
  belfry: [['#0b0718', '#1e1b4b', '#4c1d95'], ['#0d0710', '#3b0764', '#7e22ce'], ['#080412', '#1e1b4b', '#9d174d']],
};
function bg(c, cam, t, lvl, G) {
  const pal = SKY[skyTheme] || SKY.courtyard, band = pal[Math.min(2, Math.max(0, lvl))];
  A.sky(c, 800, 480, band);
  A.drawStars(c, bg.st || (bg.st = A.makeStars(70, 800, 300)), t, 800, 480, 0.04, '#fef3c7');
  c.fillStyle = skyTheme === 'bloodmoon' ? '#fca5a5' : '#fef9c3'; c.beginPath(); c.arc(620, 90, 34, 0, TAU); c.fill();
  c.fillStyle = band[1]; c.beginPath(); c.arc(634, 82, 30, 0, TAU); c.fill();
  K.ridge(c, 330, 30, 2 + lvl, cam.x * 0.12, 'rgba(10,8,25,.7)');
  for (let i = 0; i < 6; i++) {
    const x = ((i * 300 - cam.x * 0.3) % 1800 + 1800) % 1800 - 150;
    c.fillStyle = '#0c0a1f'; c.fillRect(x, 260, 70, 220); c.fillRect(x + 10, 230, 14, 40); c.fillRect(x + 46, 240, 14, 30);
    c.beginPath(); c.moveTo(x + 7, 230); c.lineTo(x + 17, 205); c.lineTo(x + 27, 230); c.fill();
    c.fillStyle = effectColor + '88'; c.fillRect(x + 28, 300, 8, 14);
  }
  K.ridge(c, 400, 22, 6 + lvl, cam.x * 0.4, '#0a0818');
  if (skyTheme === 'frostfall') { c.fillStyle = 'rgba(191,219,254,.35)'; for (let i = 0; i < 40; i++) { const x = (i * 97 + t * 0.4) % 800, y = (i * 61 + t * 1.1) % 480; c.fillRect(x, y, 2, 2); } }
  if (skyTheme === 'bloodmoon') { c.fillStyle = 'rgba(248,113,113,.10)'; c.fillRect(0, 0, 800, 480); }
  if (G && G.state === 'playing' && !runActive) { runActive = true; runStarted = Date.now(); runEnded = false; }
  if (G && (G.state === 'ready' || G.state === 'over' || G.state === 'won')) runActive = false;
  if (act) {
    if (act.lives < lastLives) { runDeaths += lastLives - act.lives; lastLives = act.lives; }
    else if (act.lives > lastLives) lastLives = act.lives;
  }
  trackStage();
  checkMilestones();
}
function drawKnight(c, p, G, wp) {
  const cx = p.x + p.w / 2, f = p.face, b = p.y + p.h, run = p.ground ? Math.sin(p.walk) : 0, air = !p.ground;
  A.shadow(c, cx, b + 1, 11, 3, 0.25);
  c.save(); c.translate(cx, b); c.scale(f * (1 + p.sq * 0.4), 1 - p.sq * 0.4);
  c.fillStyle = skin.plume; c.beginPath(); c.moveTo(-5, -24); c.lineTo(-15 - Math.min(5, Math.abs(p.vx) * 1.5), air ? -10 : -4); c.lineTo(-4, -4); c.fill();
  c.fillStyle = skin.cloth; c.fillRect(-7 + (air ? 0 : run * 3), -9, 6, 9); c.fillRect(1 - (air ? 3 : run * 3), -9, 6, 9);
  c.fillStyle = skin.armor; A.roundRect(c, -8, -25, 16, 17, 4); c.fill(); c.fillStyle = skin.trim; c.fillRect(-8, -14, 16, 3);
  c.fillStyle = skin.trim; A.roundRect(c, -7, -34, 14, 11, 4); c.fill(); c.fillStyle = '#0f172a'; c.fillRect(0, -30, 7, 3);
  c.fillStyle = skin.plume; c.fillRect(-3, -39, 5, 6);
  c.fillStyle = '#92400e'; c.fillRect(6, -22, 3, 8); const fl = Math.sin(G.clock * 0.3) * 1.5;
  c.save(); c.shadowColor = effectColor; c.shadowBlur = 14; c.fillStyle = effectColor; c.beginPath(); c.arc(8, -12 + fl * 0.3, 4.2, 0, TAU); c.fill(); c.restore();
  if (p.atk > 0 && wp.type === 'melee') {
