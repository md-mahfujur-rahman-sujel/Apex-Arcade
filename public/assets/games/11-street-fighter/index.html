<script>
/* Iron Circuit — a six-rival tournament fighter with rotating circuits, seeded
   daily duels, best-of rounds, Rift Rush meter, records and cosmetics. */
(function () {
  'use strict';
  const A = Arcade, TAU = A.TAU, W = 800, H = 450, FLOOR = 388;
  const GAME_ID = 'iron-circuit';
  const MODE_LABEL = { campaign: 'CAMPAIGN', blitz: 'BLITZ RUN', daily: 'DAILY DUEL', endless: 'ENDLESS CIRCUIT', overdrive: 'OVERDRIVE' };
  const MODES = {
    campaign: { lives: 3, bestOf: 2, timer: 60, mult: 1, rivals: 3 },
    blitz: { lives: 2, bestOf: 1, timer: 40, mult: 1.1, rivals: 6 },
    daily: { lives: 2, bestOf: 1, timer: 50, mult: 1.25, rivals: 6 },
    endless: { lives: 3, bestOf: 1, timer: 50, mult: 1.1, rivals: 12 },
    overdrive: { lives: 1, bestOf: 1, timer: 45, mult: 1.5, rivals: 6 },
  };
  const FORCED_SEED = (() => { try { return Number(new URLSearchParams(location.search).get('seed')) || 0; } catch (e) { return 0; } })();
  const MOVES = {
    punch: { su: 4, ac: 4, rc: 9, dmg: 7, reach: 80, y1: -124, y2: -84, stun: 15, kb: 3, meter: 7, id: 0 },
    kick: { su: 8, ac: 5, rc: 14, dmg: 12, reach: 102, y1: -98, y2: -34, stun: 19, kb: 6, meter: 10, id: 1 },
    spec: { su: 13, ac: 14, rc: 19, dmg: 24, reach: 112, y1: -126, y2: -28, stun: 32, kb: 11, meter: 0, lunge: 7, id: 2 },
  };
  const PLAYER = { name: 'Kestrel', title: 'Circuit Rookie', look: 'kestrel', skin: '#f0c9a0', cloth: '#0ea5e9', trim: '#fde047', spd: 4.2, dmgMul: 1, bulk: 1 };
  const ROSTER = [
    { name: 'Brakk', title: 'Dockyard Bruiser', look: 'brakk', skin: '#d9a273', cloth: '#b4452f', trim: '#f4c04b', spd: 2.9, dmgMul: 0.95, aggr: 0.45, blk: 0.22, react: 24, bg: 0, bulk: 1.2 },
    { name: 'Sable', title: 'Rooftop Phantom', look: 'sable', skin: '#e7c3a0', cloth: '#6d3bd1', trim: '#22d3ee', spd: 3.7, dmgMul: 1.05, aggr: 0.62, blk: 0.42, react: 15, bg: 1 },
    { name: 'Warden Orlo', title: 'Ember Champion', look: 'orlo', skin: '#8a5a3b', cloth: '#27303f', trim: '#fb923c', spd: 4.1, dmgMul: 1.2, aggr: 0.8, blk: 0.58, react: 9, bg: 2 },
    { name: 'Vex', title: 'Signal Duelist', look: 'vex', skin: '#f3c6a5', cloth: '#0f766e', trim: '#5eead4', spd: 4.6, dmgMul: 0.9, aggr: 0.68, blk: 0.34, react: 12, bg: 1 },

    { name: 'Ash', title: 'Furnace Warden', look: 'ash', skin: '#a97c5a', cloth: '#1f2937', trim: '#f97316', spd: 3.2, dmgMul: 1.35, aggr: 0.86, blk: 0.5, react: 11, bg: 2, bulk: 1.15 },
  ];
  const ENDLESS_SUFFIX = ['II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'];

  let G, M, F = [], bgs = [];
  let activeMode = 'campaign', difficulty = 'normal', rngState = 0, runSeed = 0, lastInitMode = null;
  let shakeScale = 1, skinId = 'kestrel', paletteId = 'sunset', trailColor = '', themeTint = null;
  let accent = '#f59e0b', accent2 = '#fde047', meterColor = '#38bdf8';

  function random() { if (!rngState) return Math.random(); rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0; return rngState / 4294967296; }
  function dailySeed() {

  function refreshPalette() {

  }
  function scaleRival(base, tier) {
    if (!tier) return Object.assign({}, base);

    c.name = base.name + ' ' + ENDLESS_SUFFIX[Math.min(ENDLESS_SUFFIX.length - 1, tier - 1)];
    c.title = 'Circuit Elite';
    c.cloth = A.shade(base.cloth, -Math.min(0.3, 0.12 * tier));
    c.spd = Math.min(5.6, base.spd + 0.18 * tier);

  }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(random() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  }
  function buildOrder() {
    let order;
    if (activeMode === 'campaign') order = ROSTER.slice(0, 3);
    else if (activeMode === 'endless') {
      order = [];
      for (let i = 0; i < MODES.endless.rivals; i++) order.push(scaleRival(ROSTER[i % ROSTER.length], Math.floor(i / ROSTER.length)));
    } else if (activeMode === 'daily') { rngState = runSeed; order = shuffle(ROSTER.slice()); }
    else order = ROSTER.slice();
    return order.map(applyDifficulty);
  }

  /* ---------------- backgrounds (pre-rendered once) ---------------- */

  }
  function bg0(c) {

    c.beginPath(); c.moveTo(330, 262); c.lineTo(470, 262); c.lineTo(450, 236); c.lineTo(350, 236); c.fill(); c.fillRect(380, 200, 40, 36);
    for (let i = 0; i < 3; i++) A.block3d(c, 30 + i * 60, 322 - (i % 2) * 22, 50, 50 + (i % 2) * 22, 8, ['#92400e', '#78350f', '#a16207'][i]);

  function bg1(c) {

    c.fillStyle = '#050816'; c.beginPath(); c.arc(140, 74, 24, 0, TAU); c.fill();

    }
    for (const [x, y, col, t] of [[90, 150, '#f0abfc', 'NOVA'], [600, 120, '#22d3ee', 'BAR'], [700, 210, '#fb7185', 'CASH']]) {
      c.save(); c.shadowColor = col; c.shadowBlur = 20; c.strokeStyle = col; c.lineWidth = 3; c.strokeRect(x, y, 80, 30); A.text(c, t, x + 40, y + 22, 18, col, 'center', '800'); c.restore();
    }
    c.fillStyle = '#0a0d26'; c.fillRect(0, 340, W, 32); c.fillStyle = '#22d3ee'; c.fillRect(0, 340, W, 2);
    floorBase(c, '#1e2442', 'rgba(34,211,238,.35)');
    c.fillStyle = '#22d3ee'; c.fillRect(0, 372, W, 3);
  }
  function bg2(c) {
    A.sky(c, 372, 372, ['#12040a', '#4c0d12', '#9a2a10']);
    const g = c.createRadialGradient(400, 372, 20, 400, 372, 420); g.addColorStop(0, 'rgba(251,146,60,.6)'); g.addColorStop(1, 'rgba(251,146,60,0)'); c.fillStyle = g; c.fillRect(0, 0, W, 372);
    for (let i = 0; i < 7; i++) {
      const x = 30 + i * 118, d = Math.abs(i - 3);
      c.fillStyle = A.shade('#3a1a1a', -0.1 - d * 0.08); c.fillRect(x, 70 + d * 6, 44, 302 - d * 6);
      c.fillStyle = A.shade('#5a2a24', -d * 0.08); c.fillRect(x - 6, 62 + d * 6, 56, 14); c.fillRect(x - 6, 360, 56, 12);
      c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x + 30, 76 + d * 6, 14, 290 - d * 6);
    }
    c.fillStyle = '#2b1010'; c.fillRect(0, 40, W, 24);
    floorBase(c, '#3a2a28', 'rgba(251,146,60,.28)');
    c.strokeStyle = '#fb923c'; c.lineWidth = 2; c.beginPath();
    for (let i = 0; i < 9; i++) { let x = 40 + i * 90, y = 380 + (i % 3) * 20; c.moveTo(x, y); c.lineTo(x + 18, y + 6); c.lineTo(x + 30, y - 2); } c.stroke();
  }
  function makeBGs() {
    [bg0, bg1, bg2].forEach((fn, i) => { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; fn(cv.getContext('2d')); bgs[i] = cv; });
  }

  /* ---------------- fighters ---------------- */
  function mk(o, x, face, isP) {
    return Object.assign({}, o, { x, y: FLOOR, vx: 0, vy: 0, face, hp: 100, ghost: 100, meter: 0, st: 'idle', t: 0, mv: null, mvKey: '', hitDone: false, cancelOK: false, stun: 0, down: false, blocking: false, combo: 0, comboT: 0, buf: {}, isP, walkT: 0, flash: 0, bflash: 0, aid: 0, ai: { t: 20, mode: 'wait', fired: false, seen: 0 } });
  }
  function startRound() {
    const cfg = modeCfg(), rival = M.order[M.mi] || ROSTER[0];
    F = [mk(playerDef(), 270, 1, true), mk(rival, 530, -1, false)];
    M.phase = 'intro'; M.pt = 0; M.timer = cfg.timer; M.ft = 0; M.winner = null; M.why = ''; M.roundHit = false;
  }
  function startAtk(f, key) {
    const mv = MOVES[key];
    f.st = 'atk'; f.mv = mv; f.mvKey = key; f.t = 0; f.hitDone = false; f.cancelOK = false; f.buf = {}; f.aid++;
    if (key === 'spec') { A.sfx('charge'); G.ring(f.x, f.y - 70, fxColor(f), 50, 18); } else A.sfx(key === 'kick' ? 'dash' : 'slash');
  }
  function tryHit(f, o) {
    const mv = f.mv;
    if (o.st === 'ko' || (o.st === 'hurt' && o.down)) return;
    const x1 = f.x + f.face * 8, x2 = f.x + f.face * mv.reach;
    const hx1 = Math.min(x1, x2), hx2 = Math.max(x1, x2), hy1 = f.y + mv.y1, hy2 = f.y + mv.y2;
    if (hx2 < o.x - 24 || hx1 > o.x + 24 || hy2 < o.y - 134 || hy1 > o.y) return;
    f.hitDone = true;
    const cx = (x2 + o.x) / 2, cy = (hy1 + hy2) / 2;
    const atWall = o.x < 46 || o.x > W - 46;
    if (o.blocking) {
      const chip = Math.max(1, Math.round(mv.dmg * (f.mvKey === 'spec' ? 0.3 : 0.1) * f.dmgMul));
      o.hp = Math.max(1, o.hp - chip); o.stun = 9; o.st = 'hurt'; o.mv = null; o.down = false; o.bflash = 8;
      o.vx = f.face * mv.kb * 0.7; if (atWall) f.vx = -f.face * mv.kb * 0.8;
      if (o.isP) { M.roundHit = true; M.parries++; if (M.parries >= 5) unlock('parry-master'); }
      G.burst(cx, cy, 6, { color: ['#e5e7eb', '#fde047'], speed: 3, life: 14, shape: 'l' });
      A.sfx('parry'); G.freeze(3); G.shake(2);
      return;
    }
    const scale = Math.max(0.45, 1 - f.combo * 0.12);
    const dmg = Math.max(1, Math.round(mv.dmg * f.dmgMul * scale));
    o.hp -= dmg; o.st = 'hurt'; o.mv = null; o.stun = mv.stun; o.flash = 8; o.t = 0;
    o.down = f.mvKey === 'spec' || o.hp <= 0;
    o.vx = f.face * mv.kb; if (o.down) { o.vy = -9; } if (atWall) f.vx = -f.face * mv.kb * 0.8;
    f.meter = Math.min(100, f.meter + mv.meter); o.meter = Math.min(100, o.meter + mv.meter * 0.6);
    f.combo++; f.comboT = 70; f.cancelOK = true;
    if (o.isP) M.roundHit = true;
    G.burst(cx, cy, f.mvKey === 'spec' ? 22 : 12, { color: [fxColor(f), '#fff', '#fb7185'], speed: f.mvKey === 'spec' ? 6 : 4, life: 22, glow: true, shape: 'l' });
    G.ring(cx, cy, '#fff', f.mvKey === 'spec' ? 60 : 32, 14);
    A.sfx(f.mvKey === 'spec' ? 'explode' : 'hit'); G.freeze(f.mvKey === 'spec' ? 9 : 5); G.shake(mv.dmg / 3);
    if (f.isP) {
      G.addScore(dmg * 10 + f.combo * 5);
      M.maxCombo = Math.max(M.maxCombo, f.combo);
      if (f.combo >= 5) unlock('combo-5');
      if (f.mvKey === 'spec') { M.rifts++; unlock('rift-rush'); }
      if (f.combo >= 2) G.popup(o.x, o.y - 150, f.combo + ' HIT COMBO', '#fde047', 18);
    }
    if (o.hp <= 0) { o.hp = 0; o.st = 'ko'; o.stun = 99999; o.vx = f.face * 7; o.vy = -10; endRound(f, 'K.O.'); }
  }
  function stepF(f, o, inp) {
    if (f.flash > 0) f.flash--; if (f.bflash > 0) f.bflash--;
    for (const k in f.buf) if (f.buf[k] > 0) f.buf[k]--;
    if (f.comboT > 0 && --f.comboT === 0) f.combo = 0;
    let grounded = f.y >= FLOOR;
    f.blocking = false;
    if (f.st === 'hurt' || f.st === 'ko') {
      f.stun--;
      if (f.st === 'hurt' && f.stun <= 0 && grounded) { f.st = 'idle'; f.down = false; }
    } else if (f.st === 'atk') {
      const mv = f.mv; f.t++;
      const active = f.t > mv.su && f.t <= mv.su + mv.ac;
      if (mv.lunge && active) f.vx = f.face * mv.lunge; else if (grounded) f.vx *= 0.7;
      if (active && !f.hitDone) tryHit(f, o);
      if (f.cancelOK && f.st === 'atk') {
        if (f.buf.spec && f.meter >= 50 && f.mvKey !== 'spec') { f.meter -= 50; startAtk(f, 'spec'); }
        else if (f.buf.kick && f.mvKey === 'punch') startAtk(f, 'kick');
      }
      if (f.st === 'atk' && f.t >= mv.su + mv.ac + mv.rc) { f.st = 'idle'; f.mv = null; }
    } else {
      if (grounded) { const s = Math.sign(o.x - f.x); if (s) f.face = s; }
      if (grounded) {
        const back = inp.dir === -f.face;
        f.blocking = !!(inp.block || back);
        f.vx = inp.block ? 0 : inp.dir * (back ? f.spd * 0.65 : f.spd);
        if (f.buf.jump) { f.buf.jump = 0; f.vy = -15; f.vx = inp.dir * f.spd * 1.1; f.blocking = false; A.sfx('jump'); }
        f.walkT += Math.abs(f.vx) * 0.12;
      }
      if (f.buf.spec) { if (grounded && f.meter >= 50) { f.meter -= 50; startAtk(f, 'spec'); } f.buf.spec = 0; }
      else if (f.buf.kick) startAtk(f, 'kick');
      else if (f.buf.punch) startAtk(f, 'punch');
    }
    f.x += f.vx;
    if (f.y < FLOOR || f.vy < 0) {
      f.vy += 0.75; f.y += f.vy;
      if (f.y >= FLOOR) {
        f.y = FLOOR; f.vy = 0; A.sfx('land');
        if (f.st === 'idle' || f.st === 'atk') f.vx = 0;
        if (f.down) { G.shake(4); G.burst(f.x, FLOOR, 8, { color: '#d6c7ae', speed: 2.5, life: 20, grav: 0.1, size: 3 }); }
      }
    } else if (f.st === 'hurt' || f.st === 'ko') f.vx *= 0.85;
    if (f.x < 36) { f.x = 36; if (f.st !== 'idle') f.vx = 0; }
    if (f.x > W - 36) { f.x = W - 36; if (f.st !== 'idle') f.vx = 0; }
    f.ghost += (f.hp - f.ghost) * 0.06; if (f.ghost < f.hp) f.ghost = f.hp;
  }
  function playerInput(f) {
    const L = A.held('KeyA', 'ArrowLeft'), R = A.held('KeyD', 'ArrowRight');
    if (A.hit('KeyW', 'ArrowUp', 'Space')) f.buf.jump = 6;
    if (A.hit('KeyF')) f.buf.punch = 6;
    if (A.hit('KeyG')) f.buf.kick = 6;
    if (A.hit('KeyH')) f.buf.spec = 6;
    return { dir: (R ? 1 : 0) - (L ? 1 : 0), block: A.held('KeyS', 'ArrowDown') };
  }
  function aiInput(f, o) {
    const a = f.ai, i = { dir: 0, block: false }, dx = o.x - f.x, d = Math.abs(dx), tw = Math.sign(dx) || f.face;
    if (o.st === 'atk' && o.aid !== a.seen) { a.seen = o.aid; if (d < o.mv.reach + 45 && Math.random() < f.blk) { a.mode = 'block'; a.t = o.mv.su + o.mv.ac + 8; } }
    if (--a.t <= 0) {
      a.fired = false; const r = Math.random();
      if (d > 170) a.mode = r < 0.55 ? 'approach' : r < 0.7 ? 'wait' : r < 0.8 ? 'jump' : (f.meter >= 50 && r < 0.95 ? 'spec' : 'approach');
      else if (d > 95) a.mode = r < f.aggr * 0.6 ? 'kick' : r < 0.6 ? 'approach' : r < 0.72 ? 'retreat' : r < 0.88 ? 'punch' : 'wait';
      else a.mode = r < f.aggr * 0.55 ? 'punch' : r < f.aggr * 0.9 ? 'kick' : r < 0.82 ? 'block' : 'retreat';
      if (a.mode === 'retreat' && (f.x < 70 || f.x > W - 70)) a.mode = 'punch';
      a.t = Math.round(f.react * (0.6 + Math.random() * 0.8)) + 4;
    }

      else banner(c, 'FIGHT!', '', '#fb7185', (M.pt - 70) / 60);

    else if (M.phase === 'result') banner(c, M.winner ? (M.winner.isP ? 'YOU WIN' : 'YOU LOSE') : 'DRAW', M.winner ? M.winner.name + ' takes the round' : 'Round replayed', M.winner && M.winner.isP ? '#34d399' : '#fb7185', Math.min(1, M.pt / 20));
    A.vignette(c, W, H, 0.4);
  }

  /* ---------------- lifecycle ---------------- */
  function newRun() {
    const cfg = modeCfg();
    M = {
      mi: 0, round: 1, pw: 0, ow: 0, phase: 'intro', pt: 0, timer: cfg.timer, ft: 0,
      winner: null, why: '', order: buildOrder(), beaten: 0, total: cfg.rivals, lives: cfg.lives,
      parries: 0, maxCombo: 0, rifts: 0, roundHit: false, recorded: false,
    };
    startRound();
  }
  function init(g) {
    G = g;
    if (!bgs.length) makeBGs();
    runSeed = activeMode === 'daily' ? dailySeed() : (FORCED_SEED || (((Date.now() & 0x7fffffff) ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0) || 1);
    rngState = runSeed;
    newRun();
    lastInitMode = activeMode;
  }

  const game = Arcade.game({
    id: GAME_ID, title: 'Iron Circuit', subtitle: 'Six rivals \u00b7 rotating circuits \u00b7 best-of rounds', color: '#f59e0b', w: W, h: H, hud: false,
    controls: [['A D / \u2190 \u2192', 'Move'], ['W / \u2191 / Space', 'Jump'], ['S / \u2193 / hold back', 'Block'], ['F', 'Punch'], ['G', 'Kick'], ['H', 'Rift Rush (50 meter)']],
    help: 'A/D or \u2190/\u2192 move \u00b7 W/\u2191/Space jump \u00b7 S/\u2193 or hold back to block \u00b7 F punch \u00b7 G kick \u00b7 H Rift Rush (costs half the meter). Chain punch \u2192 kick \u2192 Rush for combos and survive the circuit.',
    touchL: [['\u25c0', 'ArrowLeft'], ['\u25b6', 'ArrowRight']],
    touchR: [['P', 'KeyF'], ['K', 'KeyG'], ['R', 'KeyH'], ['\u25b2', 'KeyW'], ['B', 'KeyS']],
    init, update, draw,
  });
  const originalShake = game.shake.bind(game);
  game.shake = (amount) => originalShake(amount * shakeScale);

  function applyCosmetic(slot, id) {
    const key = String(id || '').split(':').pop();
    if (slot === 'skin') {
      skinId = key;
      const p = playerDef();
      if (F[0] && F[0].isP) { F[0].cloth = p.cloth; F[0].trim = p.trim; }
    }
    else if (slot === 'palette') { paletteId = key; }
    else if (slot === 'trail') { trailColor = key.includes('violet') ? '#c084fc' : key.includes('cyan') ? '#67e8f9' : key.includes('gold') ? '#fde047' : ''; }
    else if (slot === 'theme') { themeTint = key.includes('dunes') ? 'rgba(251,191,36,.08)' : key.includes('neon') ? 'rgba(34,211,238,.10)' : key.includes('midnight') ? 'rgba(76,29,149,.16)' : null; }
    refreshPalette();
  }

  game.ui = UI.mountGame(game, {
    id: GAME_ID, title: 'Iron Circuit', subtitle: 'Outfight six rivals across best-of rounds and circuit modes.', accent: '#f59e0b',
    modes: [
      { id: 'campaign', name: 'Campaign', blurb: 'Three rivals, three lives, best of three rounds.', seasonTargets: [3600, 7600, 13000] },
      { id: 'blitz', name: 'Blitz Run', blurb: 'Six rivals, one round each, only two lives.', seasonTargets: [4200, 8600, 15000] },
      { id: 'daily', name: 'Daily Duel', blurb: 'A seeded six-rival order, same for everyone today.', seeded: true, seasonTargets: [4800, 9600, 16000] },
      { id: 'endless', name: 'Endless Circuit', blurb: 'Twelve escalating rivals with no round breaks.', seasonTargets: [4200, 9000, 16000] },
      { id: 'overdrive', name: 'Overdrive', blurb: 'One life, six rivals, and a 1.5\u00d7 score bonus.', lockedHint: 'Defeat 6 rivals to unlock', requires: { stat: 'rivalsBeaten', gte: 6 }, seasonTargets: [6000, 12000, 19000] },
    ],
    settings: [
      { key: 'difficulty', label: 'Difficulty', type: 'select', options: ['easy', 'normal', 'hard'], default: 'normal' },
      { key: 'shake', label: 'Screen shake', type: 'slider', min: 0, max: 1, step: 0.1, default: 1 },
      { key: 'particles', label: 'Particles', type: 'select', options: ['lite', 'standard', 'ultra'], default: 'standard' },
    ],
    achievements: [
      { id: 'first-blood', name: 'First Blood', desc: 'Win your first round.', rarity: 'common' },
      { id: 'parry-master', name: 'Iron Guard', desc: 'Parry five attacks in one run.', rarity: 'rare' },
      { id: 'combo-5', name: 'Chain Fighter', desc: 'Land a five-hit combo.', rarity: 'rare' },
      { id: 'perfect-round', name: 'Untouched', desc: 'Win a round without taking damage.', rarity: 'rare' },
      { id: 'comeback', name: 'Last Stand', desc: 'Win a round with 15 HP or less.', rarity: 'epic' },
      { id: 'rift-rush', name: 'Rift Rush', desc: 'Land a Rift Rush finisher.', rarity: 'common' },
      { id: 'circuit-clear', name: 'Circuit Champion', desc: 'Clear the three-rival campaign.', rarity: 'epic' },
      { id: 'blitz-clear', name: 'Blitz Breaker', desc: 'Clear a Blitz Run.', rarity: 'epic' },
      { id: 'daily-duel', name: 'Daily Duelist', desc: 'Win the Daily Duel.', rarity: 'rare' },
      { id: 'endless-six', name: 'Six Deep', desc: 'Defeat six rivals in Endless Circuit.', rarity: 'epic' },
      { id: 'overdrive-clear', name: 'Overdrive', desc: 'Clear Overdrive on a single life.', rarity: 'legendary' },
      { id: 'score-20000', name: 'Circuit Legend', desc: 'Score 20,000 in one run.', rarity: 'legendary' },
    ],
    tutorial: { type: 'interactive', steps: [
      { text: 'Move with A/D or the arrow keys and block by holding back or S.', hold: 'KeyD' },
      { text: 'Press F to punch and G to kick. Chain them together.', hold: 'KeyF' },
      { text: 'Fill the meter, then press H for a Rift Rush finisher.', hold: 'KeyH' },
    ] },
    chapter: 'IRON CIRCUIT \u00b7 6 RIVALS', levels: [{}, {}, {}],
    hooks: {
      applyMode: (mode) => {
        activeMode = MODES[mode] ? mode : 'campaign';
        if (game && lastInitMode !== activeMode) game.restart(false);
      },
      applySetting: (key, value) => {
        if (key === 'difficulty') difficulty = value;
        if (key === 'shake') shakeScale = Number(value);
        if (key === 'particles' && window.Perf && Perf.setTier) Perf.setTier(value);
      },
      applyCosmetic,
      getResult: () => ({ score: game.score, win: game.state === 'won', mode: activeMode, rival: M.beaten + 1, lives: M.lives }),
    },
  });

  if (/(\?|&)test=1(?:&|$)/.test(location.search)) {
    window.IronCircuitTest = {
      state() {
        const p = F[0], e = F[1];
        return {
          mode: activeMode, difficulty, phase: M.phase, state: game.state,
          rival: e ? e.name : '', rivalIndex: M.mi, rivalTotal: M.total, round: M.round,
          pw: M.pw, ow: M.ow, lives: M.lives, beaten: M.beaten,
          score: game.score, hi: game.hi, timer: M.timer,
          hp: p ? p.hp : 0, oppHp: e ? e.hp : 0, meter: p ? p.meter : 0,
          combo: p ? p.combo : 0, parries: M.parries, rifts: M.rifts, maxCombo: M.maxCombo,
          seed: runSeed, title: game.title, sub: game.sub,
        };
      },
      rosterNames() { return M.order.map((r) => r.name); },
      sequence(n) {
        let s = runSeed >>> 0; const out = [];
        for (let i = 0; i < n; i++) { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; out.push(Number((s / 4294967296).toFixed(6))); }
        return out;
      },
      setMode(mode) { return game.ui.setMode(mode); },
      setDifficulty(level) { difficulty = level; Arcade.difficulty = level; Arcade.speedMult = level === 'easy' ? 0.8 : level === 'hard' ? 1.35 : 1; },
      restart(autostart) { game.restart(autostart === true); },
      award(points) { award(points); },
      cosmetic: applyCosmetic,
      colors() { return { cloth: playerDef().cloth, trim: playerDef().trim, skin: playerDef().skin, accent: accent, accent2: accent2, meter: meterColor, trail: trailColor, theme: themeTint }; },
      stats() { return window.Save && Save.load ? Save.load(GAME_ID) : {}; },
      setHp(n) { if (F[0]) { F[0].hp = n == null ? 100 : n; F[0].ghost = F[0].hp; } },
      setMeter(n) { if (F[0]) F[0].meter = n == null ? 50 : n; },
      setLives(n) { M.lives = n == null ? 3 : n; },
      setTimer(n) { M.timer = n == null ? 30 : n; },
      setParries(n) { M.parries = n == null ? 5 : n; if (M.parries >= 5) unlock('parry-master'); },
      setCombo(n) { if (F[0]) { F[0].combo = n == null ? 5 : n; F[0].comboT = 999; M.maxCombo = Math.max(M.maxCombo, F[0].combo); if (F[0].combo >= 5) unlock('combo-5'); } },
      winRound() { if (!F[0] || !F[1]) return; M.phase = 'fight'; F[1].hp = 0; F[1].st = 'ko'; endRound(F[0], 'K.O.'); },
      loseRound() { if (!F[0] || !F[1]) return; M.phase = 'fight'; F[0].hp = 0; F[0].st = 'ko'; endRound(F[1], 'K.O.'); },
      finishRival() { if (M.phase !== 'result') M.phase = 'result'; defeatRival(); },
      advanceNow() { M.phase = 'result'; M.pt = 999; advance(); },
    };
  }
})();
</script>
<script src="../../kits/menu-bootstrap.js"></script>
</body>
</html>
