<script>
/* Iron Circuit — a three-opponent tournament fighter (original characters and move names). */
(function () {
  const A = Arcade, TAU = A.TAU, W = 800, H = 450, FLOOR = 388;
  const MOVES = {

    kick: { su: 8, ac: 5, rc: 14, dmg: 12, reach: 102, y1: -98, y2: -34, stun: 19, kb: 6, meter: 10, id: 1 },
    spec: { su: 13, ac: 14, rc: 19, dmg: 24, reach: 112, y1: -126, y2: -28, stun: 32, kb: 11, meter: 0, lunge: 7, id: 2 },
  };
  const PLAYER = { name: 'Kestrel', title: 'Circuit Rookie', look: 'kestrel', skin: '#f0c9a0', cloth: '#0ea5e9', trim: '#fde047', spd: 4.2, dmgMul: 1 };
  const OPPS = [
    { name: 'Brakk', title: 'Dockyard Bruiser', look: 'brakk', skin: '#d9a273', cloth: '#b4452f', trim: '#f4c04b', spd: 2.9, dmgMul: 0.95, aggr: 0.45, blk: 0.22, react: 24, bg: 0 },
    { name: 'Sable', title: 'Rooftop Phantom', look: 'sable', skin: '#e7c3a0', cloth: '#6d3bd1', trim: '#22d3ee', spd: 3.7, dmgMul: 1.05, aggr: 0.62, blk: 0.42, react: 15, bg: 1 },
    { name: 'Warden Orlo', title: 'Ember Champion', look: 'orlo', skin: '#8a5a3b', cloth: '#27303f', trim: '#fb923c', spd: 4.1, dmgMul: 1.2, aggr: 0.8, blk: 0.58, react: 9, bg: 2 },
  ];
  let G, M, F = [], bgs = [];

  /* ---------------- backgrounds (pre-rendered once) ---------------- */
  function floorBase(c, col, line) {
    c.fillStyle = A.vgrad(c, 372, H, [col, A.shade(col, -0.5)]); c.fillRect(0, 372, W, H - 372);
    c.strokeStyle = line; c.lineWidth = 1; c.beginPath();

  }
  function bg0(c) {

    c.beginPath(); c.moveTo(330, 262); c.lineTo(470, 262); c.lineTo(450, 236); c.lineTo(350, 236); c.fill(); c.fillRect(380, 200, 40, 36);
    for (let i = 0; i < 3; i++) A.block3d(c, 30 + i * 60, 322 - (i % 2) * 22, 50, 50 + (i % 2) * 22, 8, ['#92400e', '#78350f', '#a16207'][i]);
    A.block3d(c, 700, 330, 60, 42, 8, '#7c2d12');

  }
  function bg1(c) {
    A.sky(c, 372, 372, ['#050816', '#14123a', '#2a1752']);
    c.fillStyle = '#e0e7ff'; c.beginPath(); c.arc(130, 80, 26, 0, TAU); c.fill();
    c.fillStyle = '#050816'; c.beginPath(); c.arc(140, 74, 24, 0, TAU); c.fill();
    for (let i = 0; i < 16; i++) {
      const x = i * 52 - 10, h = 110 + A.hash(i, 3) * 170, y = 372 - h;
      c.fillStyle = i % 2 ? '#0b1030' : '#0f1440'; c.fillRect(x, y, 48, h);
      for (let wy = y + 10; wy < 360; wy += 16) for (let wx = x + 6; wx < x + 42; wx += 12) if (A.hash(wx, wy) > 0.55) { c.fillStyle = A.hash(wy, wx) > 0.7 ? '#f0abfc' : '#fde68a'; c.fillRect(wx, wy, 5, 7); }
    }
    for (const [x, y, col, t] of [[90, 150, '#f0abfc', 'NOVA'], [600, 120, '#22d3ee', 'BAR'], [700, 210, '#fb7185', 'CASH']]) {
      c.save(); c.shadowColor = col; c.shadowBlur = 20; c.strokeStyle = col; c.lineWidth = 3; c.strokeRect(x, y, 80, 30); A.text(c, t, x + 40, y + 22, 18, col, 'center', '800'); c.restore();
    }
    c.fillStyle = '#0a0d26'; c.fillRect(0, 340, W, 32); c.fillStyle = '#22d3ee'; c.fillRect(0, 340, W, 2);
    floorBase(c, '#1e2442', 'rgba(34,211,238,.35)');
    c.fillStyle = '#22d3ee'; c.fillRect(0, 372, W, 3);
  }
  function bg2(c) {
    A.sky(c, 372, 372, ['#12040a', '#4c0d12', '#9a2a10']);
    const g = c.createRadialGradient(400, 372, 20, 400, 372, 420); g.addColorStop(0, 'rgba(251,146,60,.6)'); g.addColorStop(1, 'rgba(251,146,60,0)'); c.fillStyle = g; c.fillRect(0, 0, W, 372);
    for (let i = 0; i < 7; i++) {
      const x = 30 + i * 118, d = Math.abs(i - 3);
      c.fillStyle = A.shade('#3a1a1a', -0.1 - d * 0.08); c.fillRect(x, 70 + d * 6, 44, 302 - d * 6);
      c.fillStyle = A.shade('#5a2a24', -d * 0.08); c.fillRect(x - 6, 62 + d * 6, 56, 14); c.fillRect(x - 6, 360, 56, 12);
      c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x + 30, 76 + d * 6, 14, 290 - d * 6);
    }
    c.fillStyle = '#2b1010'; c.fillRect(0, 40, W, 24);
    floorBase(c, '#3a2a28', 'rgba(251,146,60,.28)');
    c.strokeStyle = '#fb923c'; c.lineWidth = 2; c.beginPath();
    for (let i = 0; i < 9; i++) { let x = 40 + i * 90, y = 380 + (i % 3) * 20; c.moveTo(x, y); c.lineTo(x + 18, y + 6); c.lineTo(x + 30, y - 2); } c.stroke();
  }
  function makeBGs() {
    [bg0, bg1, bg2].forEach((fn, i) => { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; fn(cv.getContext('2d')); bgs[i] = cv; });
  }

  /* ---------------- fighters ---------------- */
  function mk(o, x, face, isP) {
    return Object.assign({}, o, { x, y: FLOOR, vx: 0, vy: 0, face, hp: 100, ghost: 100, meter: 0, st: 'idle', t: 0, mv: null, mvKey: '', hitDone: false, cancelOK: false, stun: 0, down: false, blocking: false, combo: 0, comboT: 0, buf: {}, isP, walkT: 0, flash: 0, bflash: 0, aid: 0, ai: { t: 20, mode: 'wait', fired: false, seen: 0 } });
  }
  function startRound() {
    F = [mk(PLAYER, 270, 1, true), mk(OPPS[M.opp], 530, -1, false)];
    M.phase = 'intro'; M.pt = 0; M.timer = 60; M.ft = 0; M.winner = null;
  }
  function startAtk(f, key) {
    const mv = MOVES[key];
    f.st = 'atk'; f.mv = mv; f.mvKey = key; f.t = 0; f.hitDone = false; f.cancelOK = false; f.buf = {}; f.aid++;
    if (key === 'spec') { A.sfx('charge'); G.ring(f.x, f.y - 70, f.trim, 50, 18); } else A.sfx(key === 'kick' ? 'dash' : 'slash');
  }
  function tryHit(f, o) {
    const mv = f.mv;
    if (o.st === 'ko' || (o.st === 'hurt' && o.down)) return;
    const x1 = f.x + f.face * 8, x2 = f.x + f.face * mv.reach;
    const hx1 = Math.min(x1, x2), hx2 = Math.max(x1, x2), hy1 = f.y + mv.y1, hy2 = f.y + mv.y2;
    if (hx2 < o.x - 24 || hx1 > o.x + 24 || hy2 < o.y - 134 || hy1 > o.y) return;
    f.hitDone = true;
    const cx = (x2 + o.x) / 2, cy = (hy1 + hy2) / 2;
    const atWall = o.x < 46 || o.x > W - 46;
    if (o.blocking) {
      const chip = Math.max(1, Math.round(mv.dmg * (f.mvKey === 'spec' ? 0.3 : 0.1) * f.dmgMul));
      o.hp = Math.max(1, o.hp - chip); o.stun = 9; o.st = 'hurt'; o.mv = null; o.down = false; o.bflash = 8;
      o.vx = f.face * mv.kb * 0.7; if (atWall) f.vx = -f.face * mv.kb * 0.8;
      G.burst(cx, cy, 6, { color: ['#e5e7eb', '#fde047'], speed: 3, life: 14, shape: 'l' });
      A.sfx('parry'); G.freeze(3); G.shake(2);
      return;
    }
    const scale = Math.max(0.45, 1 - f.combo * 0.12);
    const dmg = Math.max(1, Math.round(mv.dmg * f.dmgMul * scale));
    o.hp -= dmg; o.st = 'hurt'; o.mv = null; o.stun = mv.stun; o.flash = 8; o.t = 0;
    o.down = f.mvKey === 'spec' || o.hp <= 0;
    o.vx = f.face * mv.kb; if (o.down) { o.vy = -9; } if (atWall) f.vx = -f.face * mv.kb * 0.8;
    f.meter = Math.min(100, f.meter + mv.meter); o.meter = Math.min(100, o.meter + mv.meter * 0.6);
    f.combo++; f.comboT = 70; f.cancelOK = true;
    G.burst(cx, cy, f.mvKey === 'spec' ? 22 : 12, { color: [f.trim, '#fff', '#fb7185'], speed: f.mvKey === 'spec' ? 6 : 4, life: 22, glow: true, shape: 'l' });
    G.ring(cx, cy, '#fff', f.mvKey === 'spec' ? 60 : 32, 14);
    A.sfx(f.mvKey === 'spec' ? 'explode' : 'hit'); G.freeze(f.mvKey === 'spec' ? 9 : 5); G.shake(mv.dmg / 3);
    if (f.isP) { G.addScore(dmg * 10 + f.combo * 5); if (f.combo >= 2) G.popup(o.x, o.y - 150, f.combo + ' HIT COMBO', '#fde047', 18); }
    if (o.hp <= 0) { o.hp = 0; o.st = 'ko'; o.stun = 99999; o.vx = f.face * 7; o.vy = -10; endRound(f, 'K.O.'); }
  }
  function stepF(f, o, inp) {
    if (f.flash > 0) f.flash--; if (f.bflash > 0) f.bflash--;
    for (const k in f.buf) if (f.buf[k] > 0) f.buf[k]--;
    if (f.comboT > 0 && --f.comboT === 0) f.combo = 0;
    let grounded = f.y >= FLOOR;
    f.blocking = false;
    if (f.st === 'hurt' || f.st === 'ko') {
      f.stun--;
      if (f.st === 'hurt' && f.stun <= 0 && grounded) { f.st = 'idle'; f.down = false; }
    } else if (f.st === 'atk') {
      const mv = f.mv; f.t++;
      const active = f.t > mv.su && f.t <= mv.su + mv.ac;
      if (mv.lunge && active) f.vx = f.face * mv.lunge; else if (grounded) f.vx *= 0.7;
      if (active && !f.hitDone) tryHit(f, o);
      if (f.cancelOK && f.st === 'atk') {
        if (f.buf.spec && f.meter >= 50 && f.mvKey !== 'spec') { f.meter -= 50; startAtk(f, 'spec'); }
        else if (f.buf.kick && f.mvKey === 'punch') startAtk(f, 'kick');
      }
      if (f.st === 'atk' && f.t >= mv.su + mv.ac + mv.rc) { f.st = 'idle'; f.mv = null; }
    } else {
      if (grounded) { const s = Math.sign(o.x - f.x); if (s) f.face = s; }
      if (grounded) {
        const back = inp.dir === -f.face;
        f.blocking = !!(inp.block || back);
        f.vx = inp.block ? 0 : inp.dir * (back ? f.spd * 0.65 : f.spd);
        if (f.buf.jump) { f.buf.jump = 0; f.vy = -15; f.vx = inp.dir * f.spd * 1.1; f.blocking = false; A.sfx('jump'); }
        f.walkT += Math.abs(f.vx) * 0.12;
      }
      if (f.buf.spec) { if (grounded && f.meter >= 50) { f.meter -= 50; startAtk(f, 'spec'); } f.buf.spec = 0; }
      else if (f.buf.kick) startAtk(f, 'kick');
      else if (f.buf.punch) startAtk(f, 'punch');
    }
    f.x += f.vx;
    if (f.y < FLOOR || f.vy < 0) {
      f.vy += 0.75; f.y += f.vy;
      if (f.y >= FLOOR) {
        f.y = FLOOR; f.vy = 0; A.sfx('land');
        if (f.st === 'idle' || f.st === 'atk') f.vx = 0;
        if (f.down) { G.shake(4); G.burst(f.x, FLOOR, 8, { color: '#d6c7ae', speed: 2.5, life: 20, grav: 0.1, size: 3 }); }
      }
    } else if (f.st === 'hurt' || f.st === 'ko') f.vx *= 0.85;
    if (f.x < 36) { f.x = 36; if (f.st !== 'idle') f.vx = 0; }
    if (f.x > W - 36) { f.x = W - 36; if (f.st !== 'idle') f.vx = 0; }
    f.ghost += (f.hp - f.ghost) * 0.06; if (f.ghost < f.hp) f.ghost = f.hp;
  }
  function playerInput(f) {
    const L = A.held('KeyA', 'ArrowLeft'), R = A.held('KeyD', 'ArrowRight');
    if (A.hit('KeyW', 'ArrowUp', 'Space')) f.buf.jump = 6;
    if (A.hit('KeyF')) f.buf.punch = 6;
    if (A.hit('KeyG')) f.buf.kick = 6;
    if (A.hit('KeyH')) f.buf.spec = 6;
    return { dir: (R ? 1 : 0) - (L ? 1 : 0), block: A.held('KeyS', 'ArrowDown') };
  }
  function aiInput(f, o) {
    const a = f.ai, i = { dir: 0, block: false }, dx = o.x - f.x, d = Math.abs(dx), tw = Math.sign(dx) || f.face;
    if (o.st === 'atk' && o.aid !== a.seen) { a.seen = o.aid; if (d < o.mv.reach + 45 && Math.random() < f.blk) { a.mode = 'block'; a.t = o.mv.su + o.mv.ac + 8; } }
    if (--a.t <= 0) {
      a.fired = false; const r = Math.random();
      if (d > 170) a.mode = r < 0.55 ? 'approach' : r < 0.7 ? 'wait' : r < 0.8 ? 'jump' : (f.meter >= 50 && r < 0.95 ? 'spec' : 'approach');
      else if (d > 95) a.mode = r < f.aggr * 0.6 ? 'kick' : r < 0.6 ? 'approach' : r < 0.72 ? 'retreat' : r < 0.88 ? 'punch' : 'wait';
      else a.mode = r < f.aggr * 0.55 ? 'punch' : r < f.aggr * 0.9 ? 'kick' : r < 0.82 ? 'block' : 'retreat';
      if (a.mode === 'retreat' && (f.x < 70 || f.x > W - 70)) a.mode = 'punch';
      a.t = Math.round(f.react * (0.6 + Math.random() * 0.8)) + 4;
    }
    switch (a.mode) {
      case 'approach': i.dir = tw; break;
      case 'retreat': i.dir = -tw; break;
      case 'block': i.block = true; break;
      case 'jump': if (!a.fired) { f.buf.jump = 3; a.fired = true; } i.dir = tw; break;
      case 'punch': case 'kick': case 'spec':
        if (d > MOVES[a.mode].reach - 14) i.dir = tw;
        else if (!a.fired) { f.buf[a.mode] = 3; a.fired = true; a.t = Math.min(a.t, 10); }
    }
    if (o.y < FLOOR - 40 && d < 120 && Math.random() < 0.04 * f.aggr) f.buf.punch = 3;
    if (f.cancelOK && f.mvKey === 'punch' && Math.random() < 0.3 * f.aggr) f.buf.kick = 3;
    if (f.cancelOK && f.mvKey !== 'spec' && f.meter >= 50 && Math.random() < 0.25 * f.aggr) f.buf.spec = 3;
    return i;
  }
  function endRound(w, why) {
    if (M.phase !== 'fight') return;
    M.phase = 'ko'; M.pt = 0; M.winner = w; M.why = why;
    if (w) { if (w.isP) M.pw++; else M.ow++; }
    if (w && w.isP) { const b = 300 + Math.round(w.hp) * 6 + M.timer * 8; G.addScore(b); G.popup(W / 2, 250, '+' + b, '#fbbf24', 22); }
    G.freeze(12); G.shake(10); A.sfx('ko');
  }
  function advance() {
    const w = M.winner;
    if (w && ((w.isP && M.pw >= 2) || (!w.isP && M.ow >= 2))) {
      if (w.isP) {
        M.opp++;
        if (M.opp >= OPPS.length) { G.state === 'playing' && G.win('Grand Champion!', 'All three rivals defeated'); return; }
        M.pw = 0; M.ow = 0; M.round = 1; startRound(); M.intro2 = true;
      } else { G.over('Defeated', 'Beaten by ' + F[1].name + ' · ' + OPPS[M.opp].title); }
      return;
    }
    if (w) M.round++;
    startRound();
  }

  /* ---------------- update ---------------- */
  function update(g) {
    G = g; const p = F[0], e = F[1];
    M.pt++;
    const none = { dir: 0, block: false };
    if (M.phase === 'intro') {
      if (M.pt === 70) { A.sfx('wave'); } if (M.pt === 72) A.sfx('power');
      if (M.pt >= 130) { M.phase = 'fight'; M.pt = 0; }
      for (const f of F) { f.buf = {}; }
      stepF(p, e, none); stepF(e, p, none);
    } else if (M.phase === 'fight') {
      const pi = playerInput(p), ei = aiInput(e, p);
      stepF(p, e, pi); if (M.phase === 'fight') stepF(e, p, ei);
      if (M.phase === 'fight' && ++M.ft >= 60) { M.ft = 0; M.timer--; if (M.timer <= 0) { endRound(p.hp === e.hp ? null : p.hp > e.hp ? p : e, 'TIME'); } else if (M.timer <= 5) A.sfx('tick'); }
    } else {
      if (M.phase === 'ko') { if (G.t % 3 === 0) { p.buf = {}; e.buf = {}; stepF(p, e, none); stepF(e, p, none); } if (M.pt > 95) { M.phase = 'result'; M.pt = 0; if (M.winner && M.winner.isP) A.sfx('win'); } }
      else { stepF(p, e, none); stepF(e, p, none); if (M.pt > 110) advance(); }
    }
    if (M.phase !== 'intro' || true) {
      const dx = e.x - p.x, air = p.y < FLOOR - 50 || e.y < FLOOR - 50;
      if (Math.abs(dx) < 42 && !air && p.st !== 'ko' && e.st !== 'ko') {

  }

  /* ---------------- drawing ---------------- */
  function seg(c, pts, w, col) { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.stroke(); }
  function drawFighter(c, f) {
    const grounded = f.y >= FLOOR - 0.5, k = f.st === 'atk' ? f.mv : null;
    A.shadow(c, f.x, FLOOR + 8, Math.max(14, 34 - (FLOOR - f.y) * 0.1), 8, 0.4);
    c.save(); c.translate(f.x, f.y); c.scale(f.face, 1);
    if (f.down || f.st === 'ko') { const kk = grounded ? 1 : 0.55; c.translate(0, -14 * kk); c.rotate(-Math.PI / 2 * kk); }
    else if (f.st === 'hurt') c.rotate(-0.22);
    let e = 0;
    if (k) { const t = f.t; e = t <= k.su ? t / k.su : t <= k.su + k.ac ? 1 : 1 - (t - k.su - k.ac) / k.rc; }
    const flash = f.flash > 0 && f.flash % 4 < 2, cloth = flash ? '#fff' : f.cloth, dark = flash ? '#fff' : A.shade(f.cloth, -0.4), skin = flash ? '#fff' : f.skin;
    const bulk = f.look === 'brakk' ? 1.2 : 1;
    const hip = [0, -62], sh = [2, -106];
    const ph = Math.sin(f.walkT) * 11;
    let lf = [14 + ph, 0], bf = [-14 - ph, 0], air = !grounded && !f.down;
    if (air) { lf = [14, -24]; bf = [-8, -38]; }
    if (f.blocking) { lf = [16, 0]; bf = [-16, 0]; }
    if (k && f.mvKey === 'kick') { lf = [22 + (k.reach - 22) * e, -66 * e]; }
    if (k && f.mvKey === 'spec') { lf = [26 + 20 * e, 0]; bf = [-26, 0]; }
    const kneeOf = (a, b, bend) => [(a[0] + b[0]) / 2 + bend, (a[1] + b[1]) / 2 - 2];
    seg(c, [hip, kneeOf(hip, bf, -6), bf], 15 * bulk, dark); seg(c, [bf, [bf[0] + 8, bf[1]]], 10, f.trim);
    seg(c, [hip, kneeOf(hip, lf, 10), lf], 15 * bulk, cloth); seg(c, [lf, [lf[0] + 9, lf[1]]], 11, f.trim);
    // torso
    seg(c, [hip, sh], 27 * bulk, cloth); seg(c, [[-8, -68], [10, -68]], 6, f.trim);
    c.fillStyle = f.trim; c.beginPath(); c.arc(sh[0] - 8, sh[1] + 4, 9 * bulk, 0, TAU); c.fill(); c.beginPath(); c.arc(sh[0] + 9, sh[1] + 4, 9 * bulk, 0, TAU); c.fill();
    if (f.look === 'orlo') { c.fillStyle = f.trim; for (const x of [-10, 10]) { c.beginPath(); c.moveTo(sh[0] + x - 6, sh[1] - 2); c.lineTo(sh[0] + x, sh[1] - 22); c.lineTo(sh[0] + x + 6, sh[1] - 2); c.fill(); } }
    // head
    const hd = [5, -127];
    seg(c, [sh, [4, -116]], 10, skin);
    c.fillStyle = skin; c.beginPath(); c.arc(hd[0], hd[1], 14, 0, TAU); c.fill();
    if (f.look === 'kestrel') { c.fillStyle = f.trim; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(hd[0] - 12 + i * 4, hd[1] - 8); c.lineTo(hd[0] - 22 + i * 5, hd[1] - 22 - i * 3); c.lineTo(hd[0] - 6 + i * 4, hd[1] - 12); c.fill(); } c.fillStyle = '#0891b2'; c.fillRect(hd[0] - 2, hd[1] - 6, 16, 7); c.fillStyle = '#a5f3fc'; c.fillRect(hd[0] + 6, hd[1] - 4, 7, 3); }
    else if (f.look === 'brakk') { c.fillStyle = skin; c.fillStyle = '#4a2a1a'; c.beginPath(); c.arc(hd[0] + 6, hd[1] + 9, 8, 0, Math.PI); c.fill(); c.fillStyle = '#fff'; c.fillRect(hd[0] + 3, hd[1] - 5, 9, 4); c.fillStyle = '#111'; c.fillRect(hd[0] + 9, hd[1] - 4, 3, 3); c.strokeStyle = '#8b3a2a'; c.lineWidth = 2; c.beginPath(); c.moveTo(hd[0] - 4, hd[1] - 12); c.lineTo(hd[0] + 2, hd[1] + 2); c.stroke(); }
    else if (f.look === 'sable') { c.fillStyle = cloth; c.beginPath(); c.arc(hd[0] - 1, hd[1] - 2, 16, Math.PI * 0.85, Math.PI * 2.1); c.lineTo(hd[0] + 6, hd[1] - 4); c.fill(); c.fillStyle = dark; c.fillRect(hd[0] - 2, hd[1] + 2, 18, 11); c.fillStyle = f.trim; c.fillRect(hd[0] + 4, hd[1] - 5, 9, 3); }
    else { c.fillStyle = f.trim; for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(hd[0] - 10 + i * 6, hd[1] - 11); c.lineTo(hd[0] - 8 + i * 6 + 3, hd[1] - 26 - (i % 2) * 8); c.lineTo(hd[0] - 3 + i * 6, hd[1] - 11); c.fill(); } c.fillStyle = '#fff'; c.fillRect(hd[0] + 3, hd[1] - 4, 9, 4); c.fillStyle = '#7c2d12'; c.fillRect(hd[0] + 8, hd[1] - 3, 3, 3); }
    // arms
    let hf = [26, -100], hb = [12, -96], elf = [14, -88], elb = [2, -86];
    if (f.blocking) { hf = [24, -118]; hb = [20, -106]; elf = [18, -96]; elb = [10, -92]; }
    if (k && f.mvKey === 'punch') { hf = [26 + (k.reach - 26) * e, -103]; elf = [(sh[0] + hf[0]) / 2, -100]; }
    if (k && f.mvKey === 'spec') { hf = [30 + (k.reach - 30) * e, -96]; hb = [26 + (k.reach - 40) * e, -108]; elf = [(sh[0] + hf[0]) / 2, -94]; elb = [(sh[0] + hb[0]) / 2, -104]; }
    if (k && f.mvKey === 'kick') { hf = [8, -92]; elf = [10, -84]; hb = [-14, -110]; elb = [-12, -94]; }
    if (f.down || f.st === 'hurt') { hf = [-6, -84]; elf = [-4, -94]; hb = [-14, -92]; elb = [-12, -100]; }
    seg(c, [[sh[0] - 6, sh[1] + 2], elb, hb], 11 * bulk, dark); c.fillStyle = f.trim; c.beginPath(); c.arc(hb[0], hb[1], 7, 0, TAU); c.fill();
    seg(c, [[sh[0] + 6, sh[1] + 2], elf, hf], 11 * bulk, skin); c.fillStyle = f.trim; c.beginPath(); c.arc(hf[0], hf[1], 8 * bulk, 0, TAU); c.fill();
    // attack trail
    if (k && f.t > k.su && f.t <= k.su + k.ac + 3) {
      c.save(); c.globalCompositeOperation = 'lighter'; c.strokeStyle = A.alpha(f.trim, 0.7); c.lineWidth = f.mvKey === 'spec' ? 14 : 6; c.lineCap = 'round';
      c.beginPath(); if (f.mvKey === 'kick') c.arc(0, -64, k.reach * 0.7, -0.9, 0.5); else c.arc(0, -96, k.reach * 0.75, -0.35, 0.3); c.stroke(); c.restore();
    }
    if (f.bflash > 0) { c.strokeStyle = A.alpha('#93c5fd', f.bflash / 8); c.lineWidth = 4; c.beginPath(); c.arc(24, -88, 44, -1.2, 1.2); c.stroke(); }
    c.restore();
  }
  function bar(c, x, y, w, h, f, rightAnchor) {
    c.fillStyle = 'rgba(0,0,0,.65)'; c.fillRect(x - 3, y - 3, w + 6, h + 6);
    const pw = w * Math.max(0, f.hp) / 100, gw = w * Math.max(0, f.ghost) / 100;
    c.fillStyle = '#b91c1c'; c.fillRect(rightAnchor ? x + w - gw : x, y, gw, h);
    c.fillStyle = f.hp > 30 ? '#22c55e' : '#f59e0b'; c.fillRect(rightAnchor ? x + w - pw : x, y, pw, h);
    c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(rightAnchor ? x + w - pw : x, y, pw, h / 3);
  }
  function banner(c, txt, sub, col, k) {
    const sc = 1 + Math.max(0, 1 - k * 4) * 0.8;
    c.save(); c.translate(W / 2, 190); c.scale(sc, sc); c.globalAlpha = Math.min(1, k * 6);
    A.glowText(c, txt, 0, 0, 64, col, 'center', 24); if (sub) A.text(c, sub, 0, 34, 20, '#fff', 'center', '700'); c.restore();
  }
  function draw(g, c) {
    G = g; const p = F[0], e = F[1];
    c.drawImage(bgs[OPPS[M.opp].bg], 0, 0, W, H);
    const bi = OPPS[M.opp].bg;
    if (bi === 1) { c.strokeStyle = 'rgba(180,200,255,.35)'; c.lineWidth = 1; c.beginPath(); for (let i = 0; i < 50; i++) { const x = (i * 97 + G.clock * 4) % W, y = (i * 53 + G.clock * 14) % H; c.moveTo(x, y); c.lineTo(x - 3, y + 12); } c.stroke(); }
    if (bi === 2) { c.fillStyle = '#fdba74'; for (let i = 0; i < 30; i++) { const x = (i * 83) % W + Math.sin(G.clock * 0.03 + i) * 12, y = H - ((G.clock * (0.6 + (i % 5) * 0.3) + i * 37) % H); c.globalAlpha = 0.7; c.fillRect(x, y, 2, 2); } c.globalAlpha = 1; }
    if (bi === 0) { c.fillStyle = 'rgba(255,255,255,.55)'; for (let i = 0; i < 4; i++) { const x = (G.clock * (0.5 + i * 0.2) + i * 220) % (W + 40) - 20, y = 70 + i * 22 + Math.sin(G.clock * 0.05 + i) * 5; c.fillRect(x, y, 8, 2); c.fillRect(x + 8, y - 2, 6, 2); } }
    const order = p.y < e.y || p.st === 'atk' ? [e, p] : [p, e];
    order.forEach((f) => drawFighter(c, f));
    G.drawFX(c);
    // HUD
    bar(c, 20, 22, 340, 20, p, true); bar(c, 440, 22, 340, 20, e, false);
    A.text(c, p.name.toUpperCase(), 20, 62, 15, '#fff', 'left', '800'); A.text(c, e.name.toUpperCase(), 780, 62, 15, '#fff', 'right', '800');
    A.text(c, e.title, 780, 78, 11, '#cbd5e1', 'right', '600');
    for (let i = 0; i < 2; i++) { c.fillStyle = i < M.pw ? '#fbbf24' : 'rgba(255,255,255,.2)'; c.beginPath(); c.arc(372 - i * 16, 58, 5, 0, TAU); c.fill(); c.fillStyle = i < M.ow ? '#fb7185' : 'rgba(255,255,255,.2)'; c.beginPath(); c.arc(428 + i * 16, 58, 5, 0, TAU); c.fill(); }
    c.fillStyle = 'rgba(0,0,0,.6)'; A.roundRect(c, 368, 18, 64, 30, 6); c.fill();
    A.text(c, String(Math.max(0, M.timer)), W / 2, 42, 26, M.timer <= 10 ? '#fb7185' : '#fff', 'center', '800', A.MONO);
    const mw = 150;
    c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(20, 68, mw, 8); c.fillRect(780 - mw, 68, mw, 8);
    const ready = G.clock % 20 < 10;
    c.fillStyle = p.meter >= 50 ? (ready ? '#fde047' : '#f59e0b') : '#38bdf8'; c.fillRect(20, 68, mw * p.meter / 100, 8);
    c.fillStyle = e.meter >= 50 ? '#fb923c' : '#a78bfa'; c.fillRect(780 - mw * e.meter / 100, 68, mw * e.meter / 100, 8);
    c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(20 + mw / 2, 66, 2, 12);
    if (p.meter >= 50) A.text(c, 'RIFT RUSH READY [H]', 20, 92, 11, '#fde047', 'left', '800');
    A.text(c, 'SCORE ' + G.score + '   BEST ' + G.hi, W / 2, 74, 12, '#fbbf24', 'center', '800', A.MONO);
    A.text(c, 'MATCH ' + (M.opp + 1) + '/3 · ROUND ' + M.round, W / 2, 90, 11, '#cbd5e1', 'center', '700');
    if (p.combo >= 2 && p.comboT > 0) A.text(c, p.combo + ' HITS', 90, 140, 24, '#fde047', 'left', '900');
    // banners
    if (M.phase === 'intro') {
      if (M.pt < 70) banner(c, 'ROUND ' + M.round, M.round === 1 ? 'vs ' + e.name + ' — ' + e.title : (M.pw === 1 && M.ow === 1 ? 'FINAL ROUND' : ''), '#fbbf24', M.pt / 70);
      else banner(c, 'FIGHT!', '', '#fb7185', (M.pt - 70) / 60);
    } else if (M.phase === 'ko') banner(c, M.why === 'TIME' ? 'TIME!' : 'K.O.!', '', '#fb7185', Math.min(1, M.pt / 20));
    else if (M.phase === 'result') banner(c, M.winner ? (M.winner.isP ? 'YOU WIN' : 'YOU LOSE') : 'DRAW', M.winner ? M.winner.name + ' takes the round' : 'Round replayed', M.winner && M.winner.isP ? '#34d399' : '#fb7185', Math.min(1, M.pt / 20));
    A.vignette(c, W, H, 0.4);
  }

  Arcade.game({
    id: 'iron-circuit', title: 'Iron Circuit', subtitle: 'Three-rival tournament · best of three rounds', color: '#f59e0b', w: W, h: H, hud: false,
    help: 'A/D or ←/→ move · W/↑/Space jump · S/↓ or hold back to block · F punch · G kick · H Rift Rush (costs half the meter). Chain punch → kick → Rush for combos.',
    touchL: [['◀', 'ArrowLeft'], ['▶', 'ArrowRight']],
    touchR: [['P', 'KeyF'], ['K', 'KeyG'], ['R', 'KeyH'], ['▲', 'KeyW'], ['B', 'KeyS']],
    init(g) { G = g; if (!bgs.length) makeBGs(); M = { opp: 0, round: 1, pw: 0, ow: 0, phase: 'intro', pt: 0, timer: 60, ft: 0 }; startRound(); },
    update, draw,
  });
})();
</script>
