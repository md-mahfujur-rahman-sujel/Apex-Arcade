<script>
/* Ashen Descent — a roguelite brawler: every run builds three fresh biomes from random rooms,
   chests swap your weapon, the dodge-roll makes you invulnerable, and the Warden waits below.
   One life per run. Five modes, records, achievements, cosmetics, and a test hook. */
const A = Arcade, K = Act, TAU = Math.PI * 2, GAME_ID = 'ashen-descent';
const NATIVE_RANDOM = Math.random.bind(Math);

let activeMode = 'story', difficulty = 'normal', dailySeed = 0, rngState = 1, lastInitMode = null;
let runStarted = 0, runActive = false, runEnded = false, runKills = 0, runChests = 0;
let runBossKills = 0, runDeaths = 0, hurtThisStage = false, deadSeen = false, stageSeen = -1, startBest = 0;
let shakeScale = 1, wname = 'Rusty Sword', game = null, act = null, G0 = null;

let look = { cloth: '#374151', trim: '#6b7280', head: '#111827', flame: '#fb923c', core: '#fde68a' };
let weaponTint = '#e5e7eb', effectColor = '#fb923c', themeKey = 'auto';

const MODES = {
  story: 'ASHEN RUN',
  daily: 'DAILY DESCENT',
  'no-heal': 'CURSED RUN',
  'boss-rush': 'WARDEN GAUNTLET',
  plus: 'ASHEN+',
};
const MODE_MULT = { story: 1, daily: 1, 'no-heal': 1.3, 'boss-rush': 1.4, plus: 1.6 };
const MODE_BONUS = { story: 6000, daily: 5000, 'no-heal': 6500, 'boss-rush': 8000, plus: 9000 };
const STORY_NAMES = ["Prisoner's Quarter", 'Toxic Sewers', "The Warden's Spire"];
const ARENA_NAMES = ['Duel 1 · Ash Gate', 'Duel 2 · Sunken Ossuary', 'Duel 3 · Warden Keep'];

/* ---------- daily seed and records ---------- */
function seedForToday() {
  const d = new Date(), key = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  let x = key ^ 0x6d2b79f5;
  for (const ch of GAME_ID) x = Math.imul(x ^ ch.charCodeAt(0), 16777619);
  return x >>> 0 || 1;
}
function dailySequence(n, seed) {
  let s = (seed || dailySeed || 1) >>> 0; const out = [];
  for (let i = 0; i < n; i++) { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; out.push(Number(((s >>> 0) / 4294967296).toFixed(6))); }
  return out;
}
function applyRng() {
  if (activeMode !== 'daily') { Math.random = NATIVE_RANDOM; return; }
  rngState = dailySeed || seedForToday();
  Math.random = () => { rngState ^= rngState << 13; rngState ^= rngState >>> 17; rngState ^= rngState << 5; return (rngState >>> 0) / 4294967296; };
}
function saved() { return (window.Save && Save.load(GAME_ID)) || {}; }
function stats() { const s = saved(); return s.stats || {}; }
function award(id, label) {
  const s = saved(), earned = Array.isArray(s.achievements) ? s.achievements : [];
  if (earned.includes(id) || !window.Save) return;
  Save.update(GAME_ID, { achievements: [id] });
  if (window.Apex && Apex.unlockAchievement) Apex.unlockAchievement(id, GAME_ID);
  UI.toast(label || id.replace(/-/g, ' '), { color: '#fb923c' });
}
function stageName() { const n = act ? act.level : 0; return (activeMode === 'boss-rush' ? ARENA_NAMES : STORY_NAMES)[n] || STORY_NAMES[0]; }

function recordRun(won, sec) {
  const st = stats(), stage = act ? act.level + 1 : 1;
  const patch = {
    runs: (st.runs || 0) + 1,
    seconds: (st.seconds || 0) + sec,
    kills: (st.kills || 0) + runKills,
    chests: (st.chests || 0) + runChests,
    deaths: (st.deaths || 0) + runDeaths,
    highestStage: Math.max(st.highestStage || 0, stage),
    bestScore: Math.max(st.bestScore || 0, G0 ? G0.score : 0),
    lastMode: activeMode,
    bossesFelled: (st.bossesFelled || 0) + runBossKills,
    storyCompletions: (st.storyCompletions || 0) + (won && activeMode === 'story' ? 1 : 0),
    dailyCompletions: (st.dailyCompletions || 0) + (won && activeMode === 'daily' ? 1 : 0),
    noHealCompletions: (st.noHealCompletions || 0) + (won && activeMode === 'no-heal' ? 1 : 0),
    bossRushCompletions: (st.bossRushCompletions || 0) + (won && activeMode === 'boss-rush' ? 1 : 0),
    plusCompletions: (st.plusCompletions || 0) + (won && activeMode === 'plus' ? 1 : 0),
    dailyBest: activeMode === 'daily' ? Math.max(st.dailyBest || 0, G0 ? G0.score : 0) : (st.dailyBest || 0),
  };
  if (won && activeMode === 'story') patch.bestTimeSec = Math.min(st.bestTimeSec || 99999, sec);
  Save.update(GAME_ID, { stats: patch });
}
function finishRun(G, won, coins) {
  if (runEnded) return 'Score ' + G.score;
  const sec = Math.max(1, Math.round((Date.now() - (runStarted || Date.now())) / 1000));
  if (won && MODE_BONUS[activeMode]) G.addScore(MODE_BONUS[activeMode]);
  recordRun(won, sec);
  if (won) {
    if (!hurtThisStage) award('untouched', 'Untouched');
    if (activeMode === 'story') {
      award('story-clear', 'Ashen Descent');
      if (G.score > startBest) award('personal-best', 'Personal Best');
      if (act && act.player && act.player.hp >= 4) award('iron-heart', 'Iron Heart');
      if (sec <= 240) award('speed-run', 'Quick Descent');
    }
    if (activeMode === 'daily') award('daily-clear', 'Daily Descent');
    if (activeMode === 'no-heal') award('no-heal-clear', 'Cursed Survivor');
    if (activeMode === 'boss-rush') award('gauntlet-clear', 'Three Doors');
    if (activeMode === 'plus') award('plus-clear', 'Ashen Adept');
  }
  runEnded = true;
  return won
    ? 'Score ' + G.score + ' · ' + sec + 's · ' + runKills + (runKills === 1 ? ' kill' : ' kills')
    : 'Score ' + G.score + ' · reached ' + stageName();
}
function trackStage() {
  if (!act) return;
  const lvl = act.level;
  if (lvl === stageSeen) return;
  if (stageSeen >= 0 && !hurtThisStage) award('untouched', 'Untouched');
  stageSeen = lvl; hurtThisStage = false;
  const st = stats();
  if ((st.highestStage || 0) < lvl + 1) Save.update(GAME_ID, { stats: { highestStage: lvl + 1 } });
}
function checkMilestones() {
  if (G0 && G0.score >= 15000) award('score-15000', 'Ash Legend');
}
function onKill(e, G) {
  runKills++;
  award('first-blood', 'First Blood');
  if (runKills >= 25) award('hunter', 'Room Clearer');
  if (e.d && e.d.ai === 'boss') { runBossKills++; award('warden-slayer', 'Warden Slain'); }
  checkMilestones();
}
function onHurt() { hurtThisStage = true; }

/* ---------- cosmetics ---------- */
const SKINS = {
  prisoner: { cloth: '#374151', trim: '#6b7280', head: '#111827', flame: '#fb923c', core: '#fde68a' },
  sentinel: { cloth: '#1d4ed8', trim: '#93c5fd', head: '#0c1a3a', flame: '#38bdf8', core: '#e0f2fe' },
  alchemist: { cloth: '#166534', trim: '#86efac', head: '#052e16', flame: '#a3e635', core: '#ecfccb' },
  wraith: { cloth: '#5b21b6', trim: '#c4b5fd', head: '#1e1b4b', flame: '#a78bfa', core: '#ede9fe' },
  gilded: { cloth: '#92400e', trim: '#fcd34d', head: '#451a03', flame: '#fbbf24', core: '#fef3c7' },
};
const PALETTES = { 'blade-steel': '#e5e7eb', 'blade-ember': '#fb923c', 'blade-frost': '#a5f3fc', 'blade-venom': '#a3e635' };
const EFFECTS = { 'ash-orange': '#fb923c', 'ash-mint': '#5eead4', 'ash-violet': '#a78bfa', 'ash-gold': '#fde047' };
const THEME_KEYS = { 'theme-quarters': 'quarters', 'theme-sewers': 'sewers', 'theme-spire': 'spire' };
const cosmeticKey = (id) => String(id || '').split(':').pop();
function applyCosmetic(slot, id) {
  const key = cosmeticKey(id);
  if (slot === 'skin' && SKINS[key]) look = Object.assign({}, SKINS[key]);
  else if (slot === 'palette' && PALETTES[key]) weaponTint = PALETTES[key];
  else if (slot === 'effect' && EFFECTS[key]) effectColor = EFFECTS[key];
  else if (slot === 'theme' && THEME_KEYS[key]) themeKey = THEME_KEYS[key];
}

/* ---------- weapons and stages ---------- */
const WEAPONS = [
  { name: 'Rusty Sword', type: 'melee', dmg: 1, range: 50, h: 34, cd: 18, dur: 9, color: '#e5e7eb' },
  { name: 'Twin Daggers', type: 'melee', dmg: 1, range: 36, h: 30, cd: 9, dur: 6, color: '#fde68a' },
  { name: 'Broadsword', type: 'melee', dmg: 3, range: 66, h: 44, cd: 34, dur: 12, color: '#fca5a5' },
  { name: 'Spear', type: 'melee', dmg: 2, range: 84, h: 18, cd: 26, dur: 10, color: '#a7f3d0' },
  { name: 'Frost Bow', type: 'shot', dmg: 2, speed: 10, cd: 24, life: 55, size: 4, color: '#7dd3fc' },
  { name: 'Ember Sling', type: 'shot', dmg: 1, speed: 8, cd: 11, life: 45, size: 5, color: '#fb923c' },
];
const POOLS = [['k', 'k', 'v'], ['k', 'v', 'h', 'u'], ['k', 'v', 'h', 'u', 'u']];
const TH = [
  { solid: '#3a3f58', top: '#6b7390', plat: '#586079', accent: '#fb923c', spike: '#e2e8f0' },
  { solid: '#25432e', top: '#65a30d', plat: '#3f6b3a', accent: '#a3e635', spike: '#bef264' },
  { solid: '#41284d', top: '#c084fc', plat: '#6b3f7a', accent: '#fbbf24', spike: '#f0abfc' },
];
const SKY = [['#0e1020', '#1c2038', '#2c3050'], ['#08150c', '#12301c', '#1e4a2c'], ['#12071f', '#2b1043', '#4a1d6a']];
const THEME_SKY = {
  quarters: ['#0e1020', '#1c2038', '#2c3050'],
  sewers: ['#08150c', '#12301c', '#1e4a2c'],
  spire: ['#12071f', '#2b1043', '#4a1d6a'],
};
const HINTS = [
  'Chests give new weapons — roll through danger',
  'Archers and hoppers lurk in the green',
  'The Warden waits at the end — spend your dashes well',
];

function build(name, theme, hint, nSeg, boss, lvl) {
  const segs = [{ t: 'start', w: 14 }], types = ['flat', 'pit', 'steps', 'arena', 'flat', 'pit', 'chest', 'steps'];
  for (let i = 0; i < nSeg; i++) { const t = A.pick(types); segs.push({ t, w: t === 'pit' ? 13 : A.randi(15, 21) }); }
  if (!segs.some((s) => s.t === 'chest')) segs[2].t = 'chest';
  segs.push(boss ? { t: 'boss', w: 36 } : { t: 'end', w: 14 });
  const cols = segs.reduce((acc, s) => acc + s.w, 0), pool = POOLS[lvl];
  const L = K.make(name, cols, 15, (g) => {
    let x = 0;
    const foes = (x0, w, n) => { for (let i = 0; i < n; i++) { const ch = A.pick(pool), cx = x0 + 3 + Math.floor(Math.random() * (w - 6)); g.set(cx, ch === 'v' ? 8 : 12, ch); } };
    segs.forEach((s, i) => {
      const w = s.w;
      if (i > 0 && i % 3 === 0) g.set(x + 1, 12, 'C');
      if (s.t === 'start') { g.ground(x, x + w, 13); g.set(x + 2, 12, 'P'); }
      else if (s.t === 'flat') { g.ground(x, x + w, 13); foes(x, w, 2 + lvl); g.coins(x + 4, 10, 3); if (Math.random() < 0.5) g.set(x + A.randi(4, w - 4), 12, 'i'); }
      else if (s.t === 'pit') { g.ground(x, x + 4, 13); g.ground(x + 9, x + w, 13); g.plat(x + 5, 10, 3); g.coins(x + 5, 9, 3); foes(x + 9, w - 9, 1); }
      else if (s.t === 'steps') { g.ground(x, x + w, 13); g.plat(x + 4, 10, 4); g.plat(x + 9, 8, 4); g.plat(x + 14, 10, 3); g.set(x + 10, 7, 'v'); g.coins(x + 9, 7, 3); foes(x, w, 2 + lvl); }
      else if (s.t === 'arena') { g.ground(x, x + w, 13); foes(x, w, 4 + lvl * 2); g.set(x + w - 3, 12, 'K'); }
      else if (s.t === 'chest') { g.ground(x, x + w, 13); g.set(x + (w >> 1), 12, 'K'); g.set(x + 2, 12, 'C'); foes(x + 6, w - 6, 1 + lvl); }
      else if (s.t === 'boss') { g.ground(x, x + w, 13); g.set(x + 1, 12, 'C'); g.set(x + 3, 12, 'K'); g.set(x + 26, 12, 'B'); g.set(x + 33, 12, 'F'); }
      else { g.ground(x, x + w, 13); g.set(x + 10, 12, 'F'); }
      x += w;
    });
  });
  L.theme = theme; L.hint = hint; return L;
}
function arenaStage(n) {
  const g = K.make(ARENA_NAMES[n], 40, 15, (g) => {
    g.ground(0, 40);
    g.set(2, 11, 'P'); g.set(6, 11, 'C');
    g.set(9, 11, 'k'); g.set(14, 11, 'h'); g.set(20, 11, 'u'); g.set(26, 11, 'k');
    g.plat(8, 9, 3); g.plat(16, 7, 3); g.plat(27, 9, 3);
    g.set(31, 10, 'B'); g.set(37, 11, 'F');
  });
  g.theme = n === 0 ? TH[0] : n === 1 ? TH[1] : TH[2];
  g.hint = n === 0 ? 'Three wardens. No quarter. Keep the roll ready'
    : n === 1 ? 'The warden remembers your blade'
      : 'End the gauntlet and open the ash gate';
  return g;
}
function buildLevel(i) {
  if (activeMode === 'daily') rngState = (dailySeed ^ Math.imul(i + 1, 0x9e3779b1)) >>> 0;
  return activeMode === 'boss-rush'
    ? arenaStage(i)
    : build('Biome ' + (i + 1) + ' · ' + STORY_NAMES[i], TH[i], HINTS[i], [6, 7, 6][i], i === 2, i);
}
const levels = [0, 1, 2].map((i) => () => buildLevel(i));

/* ---------- enemy defs (Ashen+ scales HP, speed, and rewards) ---------- */
const ENEMY_BASE = {
  k: { w: 24, h: 32, hp: 2, ai: 'walk', sp: 0.8, sight: 150, score: 80, color: '#65a30d' },
  v: { w: 26, h: 18, hp: 1, ai: 'fly', sp: 1.6, sight: 200, range: 70, bob: 22, score: 80, color: '#4b5563' },
  h: { w: 24, h: 26, hp: 2, ai: 'hop', sp: 2.4, jump: 9, every: 70, score: 100, color: '#a16207' },
  u: { w: 22, h: 36, hp: 2, ai: 'walk', sp: 0.4, sight: 320, score: 120, color: '#7c3aed', shoot: { speed: 3.6, color: '#c084fc' }, every: 110, aim: true },
  B: { w: 52, h: 82, hp: 36, ai: 'boss', name: 'THE WARDEN', wake: 380, score: 3000, color: '#6b7280', dmg: 2 },
};
const enemies = {};
for (const key of Object.keys(ENEMY_BASE)) {
  Object.defineProperty(enemies, key, {
    enumerable: true, configurable: true,
    get() {
      const base = ENEMY_BASE[key];
      if (activeMode !== 'plus') return base;
      if (base.ai === 'boss') return Object.assign({}, base, { hp: Math.round(base.hp * 1.5), dmg: 3, score: Math.round(base.score * 1.5) });
      return Object.assign({}, base, { hp: Math.ceil(base.hp * 1.5), sp: (base.sp || 1) * 1.15, score: Math.round((base.score || 100) * 1.5) });
    },
  });
}

/* ---------- backdrop ---------- */
function bg(c, cam, t, lvl, G) {
  const pal = THEME_SKY[themeKey] || SKY[Math.min(2, Math.max(0, lvl))];
  A.sky(c, 800, 480, pal);
  for (let i = 0; i < 8; i++) {
    const x = ((i * 240 - cam.x * 0.25) % 1920 + 1920) % 1920 - 160;
    c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x, 80, 24, 400); c.fillRect(x + 140, 80, 24, 400);
    c.beginPath(); c.moveTo(x, 90); c.quadraticCurveTo(x + 82, -10, x + 164, 90); c.lineTo(x + 164, 130); c.quadraticCurveTo(x + 82, 40, x, 130); c.fill();
  }
  c.fillStyle = 'rgba(251,146,60,.5)';
  for (let i = 0; i < 16; i++) {
    const x = ((i * 113 - cam.x * 0.4) % 900 + 900) % 900 - 50, y = 440 - ((t * 0.4 + i * 71) % 400);
    c.globalAlpha = 0.5 * (y / 440); c.fillRect(x, y, 2, 2);
  }
  c.globalAlpha = 1;
  K.ridge(c, 430, 20, 4 + lvl, cam.x * 0.5, 'rgba(0,0,0,.5)');
  if (G && G.state === 'playing' && !runActive) { runActive = true; runStarted = Date.now(); runEnded = false; }
  if (G && (G.state === 'ready' || G.state === 'over' || G.state === 'won')) runActive = false;
  if (act && act.player) {
    if (act.player.dead > 0 && !deadSeen) { deadSeen = true; runDeaths++; }
    else if (act.player.dead === 0) deadSeen = false;
  }
  trackStage();
  checkMilestones();
}

/* ---------- characters ---------- */
function drawHero(c, p, G, wp) {
  const cx = p.x + p.w / 2, f = p.face, b = p.y + p.h, t = G.clock, run = p.ground ? Math.sin(p.walk) : 0;
  const roll = p.dashT > 0;
  A.shadow(c, cx, b + 1, 11, 3, 0.25);
  if (roll) { c.save(); c.globalAlpha = 0.3; c.fillStyle = effectColor; for (let i = 1; i < 4; i++) { A.roundRect(c, cx - f * i * 10 - 10, p.y, 20, 28, 8); c.fill(); } c.restore(); }
  c.save(); c.translate(cx, roll ? b - 12 : b); c.scale(f * (1 + p.sq * 0.4), 1 - p.sq * 0.4);
  if (roll) { c.rotate(p.dashT * 0.9); c.fillStyle = look.cloth; A.roundRect(c, -11, -11, 22, 22, 9); c.fill(); c.fillStyle = effectColor; c.fillRect(-3, -14, 6, 5); c.restore(); return; }
  c.fillStyle = look.head; c.fillRect(-6 + run * 3, -9, 5, 9); c.fillRect(1 - run * 3, -9, 5, 9);
  c.fillStyle = look.cloth; A.roundRect(c, -9, -25, 18, 17, 5); c.fill(); c.fillStyle = look.trim; c.fillRect(-9, -15, 18, 3);
  c.fillStyle = look.head; c.beginPath(); c.arc(0, -31, 9, 0, TAU); c.fill();
  c.save(); c.shadowColor = look.flame; c.shadowBlur = 16; c.fillStyle = look.flame; const fl = Math.sin(t * 0.4) * 2;
  c.beginPath(); c.moveTo(-6, -33); c.quadraticCurveTo(-5, -44 - fl, 0, -48 - fl); c.quadraticCurveTo(5, -44 + fl, 6, -33); c.quadraticCurveTo(0, -27, -6, -33); c.fill();
  c.fillStyle = look.core; c.beginPath(); c.arc(2, -33, 3, 0, TAU); c.fill(); c.restore();
  const blade = weaponTint || wp.color;
  if (wp.type === 'melee') {
    c.strokeStyle = blade; c.lineWidth = wp.name === 'Spear' ? 3 : 4; c.lineCap = 'round';
    const k = p.atk > 0 ? 1 - p.atk / wp.dur : -1; c.beginPath();
    if (p.atkDir) { c.moveTo(6, -14); c.lineTo(8, -14 + wp.range * 0.7); }
    else if (k >= 0) { c.arc(-2, -16, wp.range * 0.75, -1.2 + k * 1.6, -0.9 + k * 1.8); }
    else { c.moveTo(6, -14); c.lineTo(14, -24); }
    c.stroke();
  } else {
    c.strokeStyle = blade; c.lineWidth = 3; c.beginPath(); c.arc(10, -16, 9, -1.2, 1.2); c.stroke();
    c.lineWidth = 1; c.beginPath(); c.moveTo(10 + 9 * Math.cos(-1.2), -16 + 9 * Math.sin(-1.2)); c.lineTo(10 + 9 * Math.cos(1.2), -16 + 9 * Math.sin(1.2)); c.stroke();
  }
  c.restore();
}
function drawEnemy(c, e, G) {
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2, t = G.clock, f = e.face, hit = e.hurt > 0, k = e.k;
  if (k === 'k') { A.shadow(c, cx, e.y + e.h + 1, 11, 3, 0.25); c.save(); c.translate(cx, e.y + e.h); c.scale(f, 1); const w = Math.sin(t * 0.2 + e.x) * 3; c.fillStyle = hit ? '#fff' : '#65a30d'; c.fillRect(-6 + w, -10, 5, 10); c.fillRect(1 - w, -10, 5, 10); A.roundRect(c, -8, -26, 16, 17, 4); c.fill(); c.beginPath(); c.arc(1, -32, 8, 0, TAU); c.fill(); c.fillRect(6, -22 + Math.sin(t * 0.15) * 2, 12, 4); c.fillStyle = '#7f1d1d'; c.fillRect(2, -34, 3, 3); c.fillRect(-3, -34, 3, 3); c.restore(); return true; }
  if (k === 'v') { const fl = Math.sin(t * 0.4 + e.x) * 9; c.fillStyle = hit ? '#fff' : '#4b5563'; c.beginPath(); c.moveTo(cx - 3, cy); c.lineTo(cx - 19, cy - fl - 5); c.lineTo(cx - 9, cy + 6); c.fill(); c.beginPath(); c.moveTo(cx + 3, cy); c.lineTo(cx + 19, cy - fl - 5); c.lineTo(cx + 9, cy + 6); c.fill(); c.beginPath(); c.arc(cx, cy, 8, 0, TAU); c.fill(); c.fillStyle = '#f87171'; c.fillRect(cx - 4, cy - 2, 3, 3); c.fillRect(cx + 1, cy - 2, 3, 3); return true; }
  if (k === 'h') { c.fillStyle = hit ? '#fff' : '#a16207'; A.roundRect(c, e.x, e.y + (e.ground ? 4 : 0), e.w, e.h - (e.ground ? 4 : 0), 8); c.fill(); c.fillStyle = '#fef08a'; c.fillRect(cx - 7, cy - 3, 5, 6); c.fillRect(cx + 2, cy - 3, 5, 6); return true; }
  if (k === 'u') { A.shadow(c, cx, e.y + e.h + 1, 11, 3, 0.25); c.save(); c.translate(cx, e.y + e.h); c.scale(f, 1); c.fillStyle = hit ? '#fff' : '#7c3aed'; c.beginPath(); c.moveTo(-10, 0); c.lineTo(-7, -26); c.lineTo(7, -26); c.lineTo(10, 0); c.fill(); c.fillStyle = hit ? '#fff' : '#4c1d95'; c.beginPath(); c.arc(0, -30, 8, 0, TAU); c.fill(); c.strokeStyle = '#d1d5db'; c.lineWidth = 2; c.beginPath(); c.arc(12, -18, 10, -1.3, 1.3); c.stroke(); c.restore(); return true; }
  if (k === 'B') {
    c.save(); c.translate(cx, e.y + e.h); c.scale(f, 1); const tell = e.tell && Math.floor(t / 4) % 2;
    c.fillStyle = tell ? '#fecaca' : hit ? '#fff' : '#6b7280';
    A.roundRect(c, -26, -56, 52, 54, 10); c.fill(); c.fillRect(-22, -4, 16, 6); c.fillRect(6, -4, 16, 6);
    c.fillStyle = tell ? '#fff1f2' : '#4b5563'; A.roundRect(c, -18, -80, 36, 30, 8); c.fill();
    c.save(); c.shadowColor = effectColor; c.shadowBlur = 18; c.fillStyle = effectColor; c.fillRect(-10, -68, 20, 6); c.restore();
    c.strokeStyle = '#9ca3af'; c.lineWidth = 8; c.lineCap = 'round'; c.beginPath(); c.moveTo(20, -42); c.lineTo(52, -26 + (e.vx ? -14 : 0)); c.stroke();
    c.fillStyle = '#d1d5db'; c.beginPath(); c.arc(54, -26 + (e.vx ? -14 : 0), 10, 0, TAU); c.fill();

}
function boss(e, x) {
  const p = x.p, low = e.hp < e.hmax * 0.5, per = low ? 100 : 130, ph = e.t % per, d = p.x < e.x ? -1 : 1; e.t++;
  if (!e.ground) e.air = true;
  else if (e.air) { e.air = false; e.vx = 0; x.G.shake(8); A.sfx('thud'); x.shoot(e, 4.4, 0, { color: '#fdba74', r: 9, y: e.y + e.h - 10 }); x.shoot(e, -4.4, 0, { color: '#fdba74', r: 9, y: e.y + e.h - 10 }); }
  e.tell = ph >= 38 && ph < 60;
  if (ph < 38) e.vx = A.approach(e.vx, d * 1.3, 0.2);
  else if (ph < 60) e.vx = 0;
  else if (ph === 60) { e.vx = d * (low ? 8 : 6.8); A.sfx('dash'); }
  else if (ph === 86 && e.ground) { e.vy = -12.5; e.vx = d * 3.4; A.sfx('jump2'); }
  else if (ph > 64 && ph < 84) e.vx *= 0.985; else if (ph > 90 && e.ground) e.vx *= 0.8;
  if (low && ph === 20) { const a = Math.atan2(p.y - e.y, p.x - e.x); for (let i = -1; i <= 1; i++) x.shoot(e, Math.cos(a + i * 0.3) * 3.8, Math.sin(a + i * 0.3) * 3.8, { color: '#fb923c', r: 7 }); A.sfx('shoot'); }
}
function hud(c, G, p) {
  A.text(c, wname.toUpperCase(), 14, 98, 12, effectColor, 'left', '800');
  A.text(c, MODES[activeMode] + (MODE_MULT[activeMode] > 1 ? '  ×' + MODE_MULT[activeMode] : ''), 14, 114, 10, 'rgba(226,232,240,.7)', 'left', '700');
}
function onTile(ch, col, row, x) {
  if (ch !== 'K') return false;
  const cur = x.weapon.name, w = A.pick(WEAPONS.filter((q) => q.name !== cur));
  const keep = { range: 0, h: 0, speed: 9, life: 60, size: 5, dur: 9 };
  x.setWeapon(Object.assign({}, keep, w));
  wname = w.name; runChests++;
  if (activeMode === 'no-heal') x.say('Cursed chest: ' + w.name + ' — no healing');
  else x.say('Found ' + w.name + '  (+2 HP)');
  if (activeMode !== 'no-heal') x.heal(2);
  if (runChests >= 3) award('chest-opener', 'Arsenal');

}
function drawTile(c, ch, x, y, q, r, G, th) {
  if (ch !== 'K') return false;
  const glow = 0.55 + 0.45 * Math.sin(G.clock * 0.08 + q);
  c.save(); c.shadowColor = effectColor; c.shadowBlur = 14;
  c.fillStyle = '#7c2d12'; A.roundRect(c, x + 5, y + 12, 22, 18, 4); c.fill();
  c.fillStyle = '#b45309'; A.roundRect(c, x + 5, y + 8, 22, 8, 3); c.fill();
  c.fillStyle = '#fcd34d'; c.fillRect(x + 14, y + 14, 4, 7);
  c.globalAlpha = glow; c.fillStyle = effectColor; c.fillRect(x + 8, y + 4, 16, 2);
  c.restore();

}

/* ---------- run lifecycle ---------- */
function onInit(G) {
  G0 = G; runStarted = 0; runActive = false; runEnded = false; runKills = 0; runChests = 0;
  runBossKills = 0; runDeaths = 0; deadSeen = false; hurtThisStage = false; stageSeen = -1;
  startBest = Number(stats().bestScore) || 0;
  dailySeed = activeMode === 'daily' ? seedForToday() : 0;
  applyRng();
  if (G) G.scoreMultiplier = MODE_MULT[activeMode] || 1;
  wname = 'Rusty Sword';
  lastInitMode = activeMode;
}

game = K.game({
  id: GAME_ID, title: 'Ashen Descent', subtitle: 'One life · three biomes · a new run every time', color: '#fb923c', lives: 1,
  controls: [['← →  /  A D', 'Run'], ['Space  /  ↑  /  W  /  Z', 'Jump (hold for height)'], ['X  /  J', 'Attack with your current weapon'], ['Shift  /  L', 'Dodge-roll (invulnerable while rolling)'], ['Walk into a chest', 'Swap to a random weapon'], ['↓ + Jump', 'Drop through thin floors'], ['P / M', 'Pause / mute']],
  help: '← → run · Space jump · X attack · Shift dodge-roll (invulnerable) · chests swap your weapon · one life per run — every run is different · beat the Warden',
  levels, bg, hud, onTile, drawTile,
  onKill, onHurt,
  hero: { hp: 8, run: 3.5, jump: 10.6, dashSpd: 8.6, dashT: 12, dashCd: 30, dashInv: true, ab: { dash: true }, weapon: WEAPONS[0] },
  enemies,
  drawEnemy, drawHero, boss, clear: 'DESCENDING…',
  winTitle: 'The Ashen Gate Opens',
  winSub: (G, coins) => finishRun(G, true, coins),
  overTitle: 'You Died',
  overSub: (G, coins) => finishRun(G, false, coins),
  debug: (d) => { act = d; },
  touchL: [['◀', 'ArrowLeft'], ['▶', 'ArrowRight']],
  touchR: [['⚔', 'KeyX'], ['➤', 'ShiftLeft'], ['▲', 'Space']],
  onInit,
});
const originalShake = game.shake.bind(game);
game.shake = (amount) => originalShake(amount * shakeScale);

const ACHIEVEMENTS = [
  { id: 'first-blood', name: 'First Blood', desc: 'Defeat your first enemy.', rarity: 'common' },
  { id: 'chest-opener', name: 'Arsenal', desc: 'Open three weapon chests in one run.', rarity: 'common' },
  { id: 'hunter', name: 'Room Clearer', desc: 'Defeat 25 enemies in one run.', rarity: 'common' },
  { id: 'warden-slayer', name: 'Warden Slain', desc: 'Defeat the Warden.', rarity: 'rare' },
  { id: 'story-clear', name: 'Ashen Descent', desc: 'Finish the Ashen Run.', rarity: 'rare' },
  { id: 'daily-clear', name: 'Daily Descent', desc: 'Finish a Daily Descent.', rarity: 'rare' },
  { id: 'no-heal-clear', name: 'Cursed Survivor', desc: 'Finish the Cursed Run.', rarity: 'epic' },
  { id: 'gauntlet-clear', name: 'Three Doors', desc: 'Clear the Warden Gauntlet.', rarity: 'legendary' },
  { id: 'plus-clear', name: 'Ashen Adept', desc: 'Finish Ashen+.', rarity: 'legendary' },
  { id: 'speed-run', name: 'Quick Descent', desc: 'Finish the Ashen Run in under four minutes.', rarity: 'epic' },
  { id: 'untouched', name: 'Untouched', desc: 'Clear a biome without taking damage.', rarity: 'epic' },
  { id: 'score-15000', name: 'Ash Legend', desc: 'Score 15,000 in one run.', rarity: 'epic' },
  { id: 'personal-best', name: 'Personal Best', desc: 'Finish the Ashen Run with a new best score.', rarity: 'rare' },
  { id: 'iron-heart', name: 'Iron Heart', desc: 'Finish the Ashen Run with at least four health.', rarity: 'rare' },
];

game.ui = UI.mountGame(game, {
  id: GAME_ID, title: 'Ashen Descent', subtitle: 'A roguelite brawl through three shifting biomes.', accent: '#fb923c',
  modes: [
    { id: 'story', name: 'Ashen Run', blurb: 'Three fresh biomes, one life, the Warden below.', seasonTargets: [7000, 13000, 20000] },
    { id: 'daily', name: 'Daily Descent', blurb: "A seeded descent fixed to today's date.", seeded: true, seasonTargets: [7000, 13000, 20000] },
    { id: 'no-heal', name: 'Cursed Run', blurb: 'Chests never heal. 1.3× score.', seasonTargets: [9000, 16000, 24000] },
    { id: 'boss-rush', name: 'Warden Gauntlet', blurb: 'Three warden duels back to back. 1.4× score.', seasonTargets: [10000, 18000, 26000] },
    { id: 'plus', name: 'Ashen+', blurb: 'Stronger foes, 1.6× score, no mercy.', lockedHint: 'Finish the Ashen Run to unlock', requires: { stat: 'storyCompletions', gte: 1 }, seasonTargets: [12000, 22000, 32000] },
  ],
  settings: [
    { key: 'difficulty', label: 'Difficulty', type: 'select', options: ['easy', 'normal', 'hard'], default: 'normal' },
    { key: 'shake', label: 'Screen shake', type: 'slider', min: 0, max: 1, step: 0.1, default: 1 },
    { key: 'particles', label: 'Particles', type: 'select', options: ['lite', 'standard', 'ultra'], default: 'standard' },
  ],
  achievements: ACHIEVEMENTS,
  tutorial: { type: 'interactive', steps: [
    { text: 'Run with A/D or the arrows, and hold jump for extra height.', hold: 'KeyD' },
    { text: 'Press X or J to swing your weapon; walk into a chest to swap it.', hold: 'KeyX' },
    { text: 'Press Shift to dodge-roll through danger — you are invulnerable while rolling.', hold: 'ShiftLeft' },
    { text: 'Reach the gate at the end of each biome and break the Warden.', hold: 'Space' },
  ] },
  chapter: 'ASHEN DESCENT · 3 BIOMES', levels: [{}, {}, {}],
  hooks: {
    applyMode: (mode) => {

}
