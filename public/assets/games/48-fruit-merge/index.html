<script>
/* Orchard Drop — painted dusk orchard backdrop with drifting fireflies, wooden glass-front basket,
   baked glossy fruit sprites, merge shockwaves, juice droplets, score floaters and a soft screen shake. */
const ui = Board.shell({
  id: 'fruit-merge', title: 'Orchard Drop', subtitle: 'Drop fruit, merge matching pairs, grow the biggest melon',
  rules: 'Move left and right, then drop a fruit into the basket. When two fruits of the same kind touch, they merge into the next bigger fruit and score points. Cherry → strawberry → grape → orange → apple → pear → peach → pineapple → melon → watermelon. Two watermelons vanish for a 500-point bonus. Do not let the pile climb above the red line for too long — that ends the run. Classic is the standard basket, Blitz races a 90-second clock, Tiny Basket narrows the walls, Big Harvest drops bigger fruit from the start, and Zen never tops out — finish the run whenever you like.',
  controls: [['Mouse / touch drag', 'Aim the fruit'], ['Click / tap / Space / ↓', 'Drop it'], ['← →  /  A D', 'Move the aim'], ['N', 'New game'], ['H / M', 'Toggle help / mute']],
});
ui.main.innerHTML = `<div class="fm"><canvas id="cv" width="400" height="600"></canvas><div class="side">
  <div class="sc"><div>Score<b id="sc">0</b></div><div>Best<b id="best">0</b></div></div>
  <div class="sc"><div>Time<b id="tm">0:00</b></div><div>Biggest<b id="big">—</b></div></div>
  <div class="bk-status" id="st"></div>
  <div class="bk-status" id="goal"></div>
  <div class="bk-row"><button class="bk-btn" id="finish">Finish run</button><button class="bk-btn bk-primary" id="new">New game</button></div>
  <div><div style="color:var(--muted);font-size:12px;margin-bottom:4px">MERGE CHAIN</div><div class="chain" id="chain"></div></div></div></div>`;
const $ = (s) => ui.main.querySelector(s);
const cv = $('#cv'), cx = cv.getContext('2d');
const F = [['🍒', 15, '#ef4444'], ['🍓', 21, '#fb7185'], ['🍇', 27, '#a855f7'], ['🍊', 33, '#fb923c'], ['🍎', 41, '#dc2626'], ['🍐', 49, '#a3e635'], ['🍑', 58, '#fdba74'], ['🍍', 68, '#facc15'], ['🍈', 80, '#4ade80'], ['🍉', 94, '#16a34a']];
$('#chain').innerHTML = F.map((f, i) => f[0] + (i < F.length - 1 ? '<i>→</i>' : '')).join('');
const FLOOR = 580, LINE = 120, G = 1500;
const GAME_ID = 'fruit-merge';
const MODES = [
  { id: 'classic', name: 'Classic', blurb: 'Standard basket, tiny fruit', wall: 20, spawn: [0, 3], grace: 2.2 },
  { id: 'blitz', name: 'Blitz', blurb: '90-second sprint', wall: 20, spawn: [0, 3], grace: 2.2, limit: 90 },
  { id: 'tiny', name: 'Tiny Basket', blurb: 'Narrow walls, short grace', wall: 60, spawn: [0, 3], grace: 1.8 },
  { id: 'harvest', name: 'Big Harvest', blurb: 'Bigger fruit from the start', wall: 20, spawn: [2, 5], grace: 2.0 },
  { id: 'zen', name: 'Zen', blurb: 'Never tops out — finish when ready', wall: 20, spawn: [0, 3], grace: null, requires: { stat: 'bestScoreClassic', gte: 600 }, lockedHint: 'Score 600 in Classic to unlock' },
];
const ACHIEVEMENTS = [
  { id: 'first-merge', name: 'First Merge', desc: 'Merge a matching pair.' },
  { id: 'pear-tree', name: 'Pear Tree', desc: 'Grow a pear.' },
  { id: 'pineapple', name: 'Pineapple Express', desc: 'Grow a pineapple.' },
  { id: 'melon', name: 'Melon Head', desc: 'Grow a melon.' },
  { id: 'watermelon', name: 'Watermelon Crash', desc: 'Merge two watermelons for the bonus.' },
  { id: 'score-500', name: 'Bushel', desc: 'Score 500 in a run.' },
  { id: 'score-1000', name: 'Bumper Crop', desc: 'Score 1,000 in a run.' },
  { id: 'blitz-run', name: 'Blitz Picker', desc: 'Score 300 in Blitz.' },
  { id: 'tiny-run', name: 'Tight Squeeze', desc: 'Score 300 in Tiny Basket.' },
  { id: 'harvest-run', name: 'Heavy Harvest', desc: 'Score 300 in Big Harvest.' },
  { id: 'zen-run', name: 'Zen Gardener', desc: 'Score 300 in Zen.' },
  { id: 'all-modes', name: 'Every Orchard', desc: 'Play every mode.' },
];
const SKINS = {
  'wood-oak': ['#a8692f', '#7c4a21', '#5a3416'],
  'wood-maple': ['#c08a4a', '#94602f', '#6a4420'],
  'wood-walnut': ['#8a5a34', '#603a1e', '#42250f'],
  'wood-ash': ['#a9a397', '#7b7569', '#514c43'],
  'wood-rose': ['#b9777a', '#8a4c52', '#5c2f36'],

const PALETTES = { 'dusk-default': ['#1b2547', '#3a2b5c', '#1d1530'], 'dusk-night': ['#0f1428', '#221c38', '#0a0914'], 'dusk-violet': ['#241a4d', '#4a2b6b', '#170f2e'], 'dusk-ember': ['#3a1e1e', '#5c3220', '#1d100e'] };
const EFFECTS = { 'aim-cyan': '#67e8f9', 'aim-amber': '#fcd34d', 'aim-lime': '#a3e635', 'aim-rose': '#fb7185' };
const THEMES = { 'pill-slate': 'rgba(10,8,24,.55)', 'pill-rose': 'rgba(48,10,20,.62)', 'pill-mint': 'rgba(6,32,26,.62)' };
const look = { skin: 'wood-oak', palette: 'dusk-default', effect: 'aim-cyan', theme: 'pill-slate' };
const cosmeticKey = (id) => String(id || '').split(':').pop();
function applyCosmetic(slot, id) {
  const key = cosmeticKey(id);
  if (slot === 'skin' && SKINS[key]) look.skin = key;
  else if (slot === 'palette' && PALETTES[key]) look.palette = key;
  else if (slot === 'effect' && EFFECTS[key]) look.effect = key;
  else if (slot === 'theme' && THEMES[key]) look.theme = key;

let gm = 'classic', initialized = false, menuPaused = true;
const GameUI = Board.ui({
  id: GAME_ID, title: 'Orchard Drop', subtitle: 'Merge fruit until the basket overflows.', accent: '#4ade80',
  modes: MODES, achievements: ACHIEVEMENTS,
  tutorial: { type: 'interactive', steps: [
    { text: 'Drag or use the arrow keys to aim, then click, tap or press Space to drop.' },
    { text: 'Two matching fruits that touch merge into the next fruit and score points.' },
    { text: 'The bigger the pair, the bigger the score — two watermelons pay 500.' },
    { text: 'Keep the pile below the red line. Blitz adds a clock, Tiny Basket narrows the walls, Big Harvest starts bigger, and Zen never tops out.' },
  ] },
  hooks: {
    applyMode: (next) => { gm = MODES.some((m) => m.id === next) ? next : 'classic'; if (initialized) newGame(); },
    applyCosmetic,
    onStart: () => resumeClock(),
  },
});
window.ApexGameMenuActions = {
  play: () => resumeClock(),
  pause: (value) => { menuPaused = !!value; },
  resume: () => resumeClock(),
  restart: () => { menuPaused = false; newGame(); },
};
const cfg = () => MODES.find((m) => m.id === gm) || MODES[0];
const fmt = (ms) => { const s = Math.max(0, ms / 1000 | 0); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
let L = 20, R = 380;
let fr, score, over, cur, nextL, aimX, cool, t0, parts, id = 0, overT, overReason = '';
let rings = [], floaters = [], shake = 0, clock = 0, started = false, runMerges = 0, runDrops = 0, runBest = 0, watermelonMerge = false;
let difficulty = Board.difficulty();
window.addEventListener('apex:board-difficulty', (event) => { difficulty = event.detail?.difficulty || 'normal'; });
const still = () => Fx.reducedMotion(GAME_ID);
const timeLeft = () => { const limit = cfg().limit; return limit ? Math.max(0, limit - clock) : 0; };
function resumeClock() {
  menuPaused = false;
  const help = document.getElementById('bk-help'); if (help) help.open = false;
}
function newGame() {
  const c = cfg();
  L = c.wall; R = 400 - c.wall;
  fr = []; score = 0; over = false; parts = []; rings = []; floaters = []; shake = 0;
  aimX = 200; cool = 0; cur = rl(); nextL = rl(); overT = 0; overReason = '';
  clock = 0; started = false; runMerges = 0; runDrops = 0; runBest = 0; watermelonMerge = false;
  initialized = true; upd();
}
const rl = () => { const s = cfg().spawn; return s[0] + Board.rand(s[1] - s[0] + 1); };
function bestForMode() { return Math.max(0, Number(GameUI.stats()['bestScore' + gm.charAt(0).toUpperCase() + gm.slice(1)]) || 0); }
function upd() {
  $('#sc').textContent = score;
  $('#best').textContent = Math.max(bestForMode(), score);
  $('#tm').textContent = fmt((cfg().limit ? timeLeft() : clock) * 1000);
  $('#big').textContent = runBest > 0 ? F[runBest][0] : '—';
  $('#st').textContent = over
    ? (overReason === 'overflow' ? 'The pile is too high — run over' : overReason === 'time' ? 'The clock ran out' : 'Run finished')
    : 'Aim and drop. Biggest so far: ' + (runBest ? F[runBest][0] : '—');
  if (gm === 'blitz') $('#goal').textContent = 'Blitz · ' + fmt(timeLeft() * 1000) + ' left';
  else if (gm === 'tiny') $('#goal').textContent = 'Tiny Basket · narrow walls';
  else if (gm === 'harvest') $('#goal').textContent = 'Big Harvest · starts at grape';
  else if (gm === 'zen') $('#goal').textContent = 'Zen · no top-out · finish when ready';
  else $('#goal').textContent = 'Classic · standard basket';
  const fin = $('#finish'); fin.disabled = over;
}
function drop() {
  if (over || menuPaused || cool > 0) return false;
  const r = F[cur][1];
  fr.push({ id: ++id, l: cur, x: Math.max(L + r, Math.min(R - r, aimX)), y: LINE - 40, vx: 0, vy: 0, r, age: 0, m: r * r });
  runBest = Math.max(runBest, cur); runDrops++; started = true;
  cur = nextL; nextL = rl();
  cool = difficulty === 'easy' ? 0.75 : difficulty === 'hard' ? 0.35 : 0.55;
  Board.sfx('click'); upd();
  return true;
}
function addFruit(l, x, y) {
  l = Math.max(0, Math.min(F.length - 1, Number(l) || 0));
  const r = F[l][1];
  fr.push({ id: ++id, l, x: Number(x) || 200, y: Number(y) || 300, vx: 0, vy: 0, r, age: 1, m: r * r });
  runBest = Math.max(runBest, l);
  return l;
}
function step(dt) {
  const n = fr.length;
  for (const f of fr) { f.vy += G * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.9985; f.age += dt; }
  const merge = [];
  for (let it = 0; it < 4; it++) {
    for (const f of fr) { if (f.x < L + f.r) { f.x = L + f.r; if (f.vx < 0) f.vx *= -0.2; } if (f.x > R - f.r) { f.x = R - f.r; if (f.vx > 0) f.vx *= -0.2; } if (f.y > FLOOR - f.r) { f.y = FLOOR - f.r; if (f.vy > 0) f.vy *= -0.15; f.vx *= 0.985; } }
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = fr[i], b = fr[j]; if (a.dead || b.dead) continue; const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r; if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
      const d2 = dx * dx + dy * dy; if (d2 >= rr * rr) continue; const d = Math.sqrt(d2) || 0.01, nx = dx / d, ny = dy / d, ov = rr - d, im = 1 / a.m + 1 / b.m;
      if (a.l === b.l && a.age > 0.05 && b.age > 0.05) { a.dead = b.dead = true; merge.push([a, b]); continue; }
      a.x -= nx * ov * (1 / a.m) / im; a.y -= ny * ov * (1 / a.m) / im; b.x += nx * ov * (1 / b.m) / im; b.y += ny * ov * (1 / b.m) / im;
      const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny; if (vn < 0) { const j2 = -(1.05) * vn / im; a.vx -= j2 * nx / a.m; a.vy -= j2 * ny / a.m; b.vx += j2 * nx / b.m; b.vy += j2 * ny / b.m; const tx = -ny, ty = nx, vt = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty, jt = vt * 0.04 / im; a.vx += jt * tx / a.m; a.vy += jt * ty / a.m; b.vx -= jt * tx / b.m; b.vy -= jt * ty / b.m; }

      score += 500; watermelonMerge = true;
      pop(x, y, F[a.l][2], 30); ring(x, y, F[a.l][2], 160); ring(x, y, '#fff', 110);
      floaters.push({ x, y, t: 0, txt: '+500', c: '#fde68a' }); shake = Math.max(shake, 8); Board.sfx('win');
    } else {
      const l = a.l + 1, r = F[l][1], gain = (l) * 10;
      fr.push({ id: ++id, l, x, y, vx: (a.vx + b.vx) / 2, vy: (a.vy + b.vy) / 2, r, age: 0, m: r * r, big: 1 });

      pop(x, y, F[l][2], 12 + l * 2); ring(x, y, F[l][2], r * 2.1);
      floaters.push({ x, y: y - r * 0.4, t: 0, txt: '+' + gain, c: '#fff' }); shake = Math.max(shake, Math.min(6, 1 + l * 0.5)); Board.sfx(l > 5 ? 'win' : 'capture');
    }

}
function ring(x, y, c, r) { rings.push({ x, y, c, r, t: 0 }); }
function pop(x, y, c, n) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.3, s = 60 + Math.random() * 190; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: .45 + Math.random() * .35, max: .8, c, sz: 2 + Math.random() * 3.2 }); }
  for (let i = 0; i < Math.ceil(n / 3); i++) { const a = Math.random() * 6.3, s = 30 + Math.random() * 90; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .6, max: .6, c: '#fff', sz: 1.5, spark: 1 }); }
}
function advance(dt) {
  if (over || menuPaused) return;
  cool = Math.max(0, cool - dt);
  for (let k = 0; k < 3; k++) step(dt / 3);
  const grace = cfg().grace;
  if (grace != null && !over) {
    const hi = fr.some((f) => f.age > 1 && f.y - f.r < LINE && Math.hypot(f.vx, f.vy) < 60);
    overT = hi ? overT + dt : Math.max(0, overT - dt * 2);
    if (overT > grace) endRun('overflow');

  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; } parts = parts.filter((p) => p.life > 0);
  for (const r of rings) r.t += dt; rings = rings.filter((r) => r.t < 0.5);

function advanceClock(dt) {

function endRun(reason) {

  const counters = { runs: 1, merges: runMerges, drops: runDrops, [gm + 'Runs']: 1 };

  if (runBest >= 5) achievements.push('pear-tree');
  if (runBest >= 7) achievements.push('pineapple');
  if (runBest >= 8) achievements.push('melon');
  if (watermelonMerge) achievements.push('watermelon');
  if (score >= 500) achievements.push('score-500');
  if (score >= 1000) achievements.push('score-1000');
  if (gm === 'blitz' && score >= 300) achievements.push('blitz-run');
  if (gm === 'tiny' && score >= 300) achievements.push('tiny-run');
  if (gm === 'harvest' && score >= 300) achievements.push('harvest-run');
  if (gm === 'zen' && score >= 300) achievements.push('zen-run');

/* ---------- baked art ---------- */
function shade(hex, amt) {
  const h = hex.replace('#', ''), v = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));

}
function bgSprite() {

    const g = c.createLinearGradient(0, 0, 0, 600); g.addColorStop(0, pal[0]); g.addColorStop(0.45, pal[1]); g.addColorStop(1, pal[2]);
    c.fillStyle = g; c.fillRect(0, 0, 400, 600);
    for (let i = 0; i < 60; i++) { c.fillStyle = 'rgba(255,255,255,' + (0.2 + Math.random() * 0.5).toFixed(2) + ')'; c.fillRect(Math.random() * 400, Math.random() * 180, 1.4, 1.4); }
    const mg = c.createRadialGradient(320, 70, 4, 320, 70, 90); mg.addColorStop(0, 'rgba(253,230,138,.55)'); mg.addColorStop(1, 'rgba(253,230,138,0)');
    c.fillStyle = mg; c.fillRect(220, 0, 180, 170);

function basketSprite() {

    const g = c.createLinearGradient(0, 0, 0, FLOOR); g.addColorStop(0, 'rgba(255,255,255,.04)'); g.addColorStop(1, 'rgba(255,255,255,.10)');

    };

const px = (e) => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) * 400 / r.width; };
