<script>
/* Soccer Pool — visual pass: floodlit night stadium with a reactive crowd, mown-stripe pitch with lit centre,
   glossy emblem discs with turn-hint rings and speed trails, spinning ball with comet trail, goal-net flash,

(function () {
  const A = Arcade, W = 800, H = 480, PX0 = 60, PX1 = 740, PY0 = 80, PY1 = 440, GY0 = 205, GY1 = 315, DR = 20, BR = 11, MAXV = 17, WINS = 5;
  const SEGS = [[PX0, PY0, PX1, PY0], [PX0, PY1, PX1, PY1], [PX0, PY0, PX0, GY0], [PX0, GY1, PX0, PY1], [PX1, PY0, PX1, GY0], [PX1, GY1, PX1, PY1], [30, GY0, PX0, GY0], [30, GY1, PX0, GY1], [30, GY0, 30, GY1], [PX1, GY0, 770, GY0], [PX1, GY1, 770, GY1], [770, GY0, 770, GY1]];
  const MOUTH = [[PX0, GY0, PX0, GY1], [PX1, GY0, PX1, GY1]];
  let G, discs, ball, turn, state, sel = null, drag = null, ptr = { x: 0, y: 0 }, score, wait, msg, msgT, firstTouch, inited = false, hitCd = 0, scored;
  let crowd = 0, ballRot = 0, trailB = [], netFlash = [0, 0], flashA = 0, goalSide = 0;
  const FORM = [[100, 260], [190, 175], [190, 345], [300, 260]];
  function setup() {
    discs = []; FORM.forEach(([x, y]) => { discs.push({ x, y, vx: 0, vy: 0, t: 0, tr: [] }); discs.push({ x: W - x, y, vx: 0, vy: 0, t: 1, tr: [] }); });
    ball = { x: 400, y: 260, vx: 0, vy: 0 }; sel = null; drag = null; trailB = [];
  }
  function init(g) { G = g; score = [0, 0]; turn = 0; setup(); state = 'aim'; wait = 0; msg = 'Your kick-off — drag back from one of your discs and release'; msgT = 220; scored = false; crowd = 0; netFlash = [0, 0]; flashA = 0; if (!inited) { inited = true; bind(); } }
  const pt = (e) => { const r = G.canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  function bind() {
    G.canvas.addEventListener('pointermove', (e) => { ptr = pt(e); });
    G.canvas.addEventListener('pointerdown', (e) => {

      let best = null, bd = DR + 16; for (const d of discs) if (d.t === 0) { const k = Math.hypot(d.x - ptr.x, d.y - ptr.y); if (k < bd) { bd = k; best = d; } }
      if (best) { sel = best; drag = { x: ptr.x, y: ptr.y }; A.sfx('select'); }
    });
    window.addEventListener('pointerup', () => {
      if (!drag || !sel) { drag = null; return; } const d = drag, s = sel; drag = null; sel = null; if (G.state !== 'playing' || state !== 'aim' || turn !== 0) return;
      const dx = d.x - ptr.x, dy = d.y - ptr.y, len = Math.hypot(dx, dy); if (len < 12) return; kick(s, Math.atan2(dy, dx), Math.min(1, len / 150));
    });
  }
  function kick(d, a, p) { const v = Math.max(2, p * MAXV); d.vx = Math.cos(a) * v; d.vy = Math.sin(a) * v; state = 'roll'; firstTouch = null; scored = false; A.sfx('thud'); G.burst(d.x, d.y, 8, { color: ['#e2e8f0', '#fff'], speed: 2.2, life: 16, angle: a + Math.PI, spread: 0.7 }); }
  function hitSeg(o, r, x1, y1, x2, y2, e) {

    const cx = x1 + dx * t, cy = y1 + dy * t; let nx = o.x - cx, ny = o.y - cy; const d = Math.hypot(nx, ny), m = r + 2; if (d >= m || d < 1e-6) return;

  }
  function pair(a, ra, ma, b, rb, mb, e) {

    const rv = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny; if (rv > 0) { const j = ((1 + e) * rv) / (1 / ma + 1 / mb); a.vx -= j / ma * nx; a.vy -= j / ma * ny; b.vx += j / mb * nx; b.vy += j / mb * ny; if (rv > 1.5 && hitCd <= 0) { A.sfx('hit'); hitCd = 4; G.burst((a.x + b.x) / 2, (a.y + b.y) / 2, 5, { color: ['#fff', '#fde68a'], speed: 2.4, glow: true, life: 14 }); if (rv > 5) G.shake(2); } }

  function physics() {

      for (let i = 0; i < discs.length; i++) { for (let j = i + 1; j < discs.length; j++) pair(discs[i], DR, 4, discs[j], DR, 4, 0.85); if (pair(discs[i], DR, 4, ball, BR, 1, 0.92) && firstTouch === null) firstTouch = discs[i].t; }
      for (const d of discs) { for (const s of SEGS.slice(0, 6)) hitSeg(d, DR, s[0], s[1], s[2], s[3], 0.6); for (const s of MOUTH) hitSeg(d, DR, s[0], s[1], s[2], s[3], 0.6); }

    G.burst(gx, 260, 46, { color: ['#22d3ee', '#fbbf24', '#f472b6', '#a3e635', '#fff'], speed: 7, shape: 's', size: 4, life: 60, grav: 0.12, angle: who === 0 ? Math.PI : 0, spread: 1.3 });

    if (who === 0) G.addScore(100); msg = who === 0 ? 'GOAL! You score' : 'Goal for the computer'; msgT = 110; state = 'goal'; wait = 100; turn = 1 - who;

  function settled() { return discs.every((d) => !d.vx && !d.vy) && !ball.vx && !ball.vy; }
  function cpuPlan() {
    const mine = discs.filter((d) => d.t === 1), gx = PX0 - 10, gy = 260; let ux = gx - ball.x, uy = gy - ball.y; const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
    const tx = ball.x - ux * (BR + DR - 3), ty = ball.y - uy * (BR + DR - 3); let best = null, bs = 1e9;
    for (const d of mine) {
      const dx = tx - d.x, dy = ty - d.y, dist = Math.hypot(dx, dy) || 1, cs = (dx / dist) * ux + (dy / dist) * uy;
      let cost = dist + (cs < 0.2 ? 220 : 0) - cs * 60;
      for (const o of discs) { if (o === d) continue; const t = A.clamp(((o.x - d.x) * dx + (o.y - d.y) * dy) / (dist * dist), 0, 1); if (Math.hypot(d.x + dx * t - o.x, d.y + dy * t - o.y) < DR * 2 - 2) cost += 120; }
      if (cost < bs) { bs = cost; best = { d, a: Math.atan2(dy, dx), v: A.clamp(dist * 0.045 + 6, 7, 16) }; }
    }
    return best;
  }
  function fxTick() {
    Fx.update(1);
    crowd = Math.max(0, crowd - 0.012); flashA = Math.max(0, flashA - 0.04); netFlash[0] = Math.max(0, netFlash[0] - 0.03); netFlash[1] = Math.max(0, netFlash[1] - 0.03);
    const sp = Math.hypot(ball.vx, ball.vy); ballRot += sp * 0.05 * (ball.vx >= 0 ? 1 : -1);
    if (sp > 1.5) { trailB.push({ x: ball.x, y: ball.y }); if (trailB.length > 14) trailB.shift(); } else if (trailB.length) trailB.shift();
    for (const d of discs) { if (Math.hypot(d.vx, d.vy) > 1.8) { d.tr.push({ x: d.x, y: d.y }); if (d.tr.length > 8) d.tr.shift(); } else if (d.tr.length) d.tr.shift(); }
  }
  function update(g) {
    if (g.state !== 'playing') return; if (hitCd > 0) hitCd--; if (msgT > 0) msgT--;
    fxTick();
    g.hudL = 'YOU ' + score[0] + ' – ' + score[1] + ' CPU'; g.hudR = 'FIRST TO ' + WINS;
    if (state === 'roll') { physics(); if (state === 'roll' && settled()) { turn = 1 - turn; if (turn === 0) { state = 'aim'; msg = 'Your turn'; msgT = 50; } else { state = 'cpu'; wait = 55; } } }
    else if (state === 'cpu') { physics(); if (--wait <= 0) { const p = cpuPlan(); if (p) kick(p.d, p.a + A.rand(-0.045, 0.045), p.v / MAXV); else state = 'aim'; } }
    else if (state === 'goal') { physics(); if (--wait <= 0) { setup(); if (turn === 0) { state = 'aim'; msg = 'Your kick-off'; msgT = 80; } else { state = 'cpu'; wait = 50; } scored = false; } }
    else if (state === 'end') { if (--wait <= 0) { state = 'done'; if (score[0] > score[1]) g.win('You win ' + score[0] + '–' + score[1] + '!', 'Full time'); else g.over('Computer wins ' + score[1] + '–' + score[0], 'Full time'); } }
  }

  /* ---------- baked art ---------- */
  function stadiumSprite() {
    return Fx.bake('sp-stadium', W, H, (c) => {
      c.fillStyle = A.vgrad(c, 0, H, ['#050813', '#0b1226', '#050813']); c.fillRect(0, 0, W, H);
      // floodlight cones
      for (const [x, y, dx] of [[40, 0, 150], [W - 40, 0, -150], [40, H, 150], [W - 40, H, -150]]) {
        const g = c.createLinearGradient(x, y, x + dx, y === 0 ? 220 : H - 220); g.addColorStop(0, 'rgba(255,248,220,.22)'); g.addColorStop(1, 'rgba(255,248,220,0)');
        c.fillStyle = g; c.beginPath(); c.moveTo(x - 10, y); c.lineTo(x + 10, y); c.lineTo(x + dx + 130, y === 0 ? 260 : H - 260); c.lineTo(x + dx - 130, y === 0 ? 260 : H - 260); c.closePath(); c.fill();
      }
      // stands: rows of fans
      const rows = (y0, y1, dir) => {
        for (let y = y0; y < y1; y += 5) for (let x = 4; x < W; x += 6) {
          const h = A.hash(x, y), col = h > 0.85 ? '#22d3ee' : h > 0.7 ? '#fbbf24' : h > 0.58 ? '#f472b6' : h > 0.4 ? '#475569' : '#1e293b';
          c.fillStyle = col; c.globalAlpha = 0.55 + A.hash(y, x) * 0.35; c.fillRect(x, y, 3, 3);

      };
      rows(2, 50, 1); rows(468, 478, -1);
      // advertising boards
      const ads = ['#0ea5e9', '#f59e0b', '#ec4899', '#22c55e', '#a855f7'];
      for (let x = 0; x < W; x += 80) { c.fillStyle = ads[(x / 80) % ads.length | 0]; c.globalAlpha = 0.85; c.fillRect(x + 2, 52, 76, 6); c.fillRect(x + 2, 462, 76, 5); }
      c.globalAlpha = 1;
    });
  }
  function pitchSprite() {
    return Fx.bake('sp-pitch', W, H, (c) => {
      c.fillStyle = '#0a2418'; c.fillRect(20, 60, 760, 400);
      for (let i = 0; i < 8; i++) { c.fillStyle = i % 2 ? '#1a8c52' : '#1fa05f'; c.fillRect(PX0 + i * 85, PY0, 85, PY1 - PY0); }
      // grass grain
      for (let i = 0; i < 1400; i++) { const x = PX0 + A.hash(i, 1) * (PX1 - PX0), y = PY0 + A.hash(i, 2) * (PY1 - PY0); c.fillStyle = A.hash(i, 3) > 0.5 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.05)'; c.fillRect(x, y, 2, 1); }
      // floodlit centre
      const g = c.createRadialGradient(400, 260, 20, 400, 260, 380); g.addColorStop(0, 'rgba(255,255,220,.16)'); g.addColorStop(1, 'rgba(0,0,0,.28)');
      c.fillStyle = g; c.fillRect(20, 60, 760, 400);
      // markings

      c.strokeRect(PX0, PY0, PX1 - PX0, PY1 - PY0); c.beginPath(); c.moveTo(400, PY0); c.lineTo(400, PY1); c.stroke(); c.beginPath(); c.arc(400, 260, 55, 0, A.TAU); c.stroke();
      c.strokeRect(PX0, 165, 110, 190); c.strokeRect(PX1 - 110, 165, 110, 190);
      c.strokeRect(PX0, 215, 36, 90); c.strokeRect(PX1 - 36, 215, 36, 90);
      c.beginPath(); c.arc(PX0 + 78, 260, 34, -0.95, 0.95); c.stroke(); c.beginPath(); c.arc(PX1 - 78, 260, 34, Math.PI - 0.95, Math.PI + 0.95); c.stroke();
      c.fillStyle = '#fff'; for (const [x, y] of [[400, 260], [PX0 + 78, 260], [PX1 - 78, 260]]) { c.beginPath(); c.arc(x, y, 3.5, 0, A.TAU); c.fill(); }
      for (const [x, y, a0] of [[PX0, PY0, 0], [PX1, PY0, 0.5], [PX1, PY1, 1], [PX0, PY1, 1.5]]) { c.beginPath(); c.arc(x, y, 12, a0 * Math.PI, (a0 + 0.5) * Math.PI); c.stroke(); }
      // goal nets

        c.fillStyle = 'rgba(255,255,255,.1)'; c.fillRect(x0, GY0, x1 - x0, GY1 - GY0);
        c.strokeStyle = 'rgba(255,255,255,.38)'; c.lineWidth = 1;
        for (let x = x0; x <= x1; x += 6) { c.beginPath(); c.moveTo(x, GY0); c.lineTo(x, GY1); c.stroke(); }
        for (let y = GY0; y <= GY1; y += 6) { c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); }
      }

      for (const s of SEGS.slice(6)) { c.beginPath(); c.moveTo(s[0], s[1]); c.lineTo(s[2], s[3]); c.stroke(); }
      c.fillStyle = '#f8fafc'; for (const [x, y] of [[PX0, GY0], [PX0, GY1], [PX1, GY0], [PX1, GY1]]) { c.beginPath(); c.arc(x, y, 5, 0, A.TAU); c.fill(); }

  }
  function discSprite(team) {
    const S = 2, size = (DR + 6) * 2;

  function draw(g, c) {

      c.restore();

    c.drawImage(pitchSprite(), 0, 0, W, H);
    // goal-net flashes

    if (netFlash[1] > 0.02) { c.fillStyle = 'rgba(34,211,238,' + (netFlash[1] * 0.55).toFixed(2) + ')'; c.fillRect(PX1, GY0, 30, GY1 - GY0); }

    A.shadow(c, ball.x + 2, ball.y + 5, BR, BR * 0.45, 0.38);
