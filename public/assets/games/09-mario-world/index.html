<script src="../../kits/perf-kit.js"></script>

<script>
/* Cloudhop Pip — sky-isle platformer: double-jump across floating clouds, ride moving platforms,
   glide on the cape, and reach every flag. Five modes share one seeded engine. */
(function () {
  'use strict';
  const A = Arcade, P = Plat, T = 32, W = 800, H = 480, TAU = Math.PI * 2;
  const GAME_ID = 'cloudhop-pip';
  const MODE_LABEL = { campaign: 'CAMPAIGN', dash: 'BREEZE DASH', daily: 'DAILY DRIFT', endless: 'ENDLESS ASCENT', storm: 'STORMFRONT' };
  const MODES = {
    campaign: { lives: 3, hp: 3, timer: 0, mult: 1, speed: 1 },
    dash: { lives: 2, hp: 3, timer: 140, mult: 1, speed: 1.05 },
    daily: { lives: 3, hp: 3, timer: 0, mult: 1.25, speed: 1 },
    endless: { lives: 3, hp: 3, timer: 0, mult: 1.1, speed: 1 },
    storm: { lives: 1, hp: 2, timer: 0, mult: 1.5, speed: 1.3 },
  };
  const FORCED_SEED = (() => { try { return Number(new URLSearchParams(location.search).get('seed')) || 0; } catch (e) { return 0; } })();

  let grid, rows, cols, p, en, plats, cam, check, doneT, banner, route, courseIndex, courseOffset, spawnPoint;
  let lives, coins, hpMax, timer, timerMode;
  let activeMode = 'campaign', difficulty = 'normal', rngState = 0, runSeed = 0, lastInitMode = null;
  let runRecorded = false, runHit = false, courseHit = false, runLostLife = false, totalCrates = 0, maxCourse = 0, doubleJumps = 0;
  let shakeScale = 1, pal = null, themeOverride = null, starsCache = null;
  let pip = { body: '#22c55e', belly: '#fef08a' };
  let trailColor = '#f43f5e', coinColor = '#fde047', springColor = '#f472b6';

  function random() { if (!rngState) return Math.random(); rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0; return rngState / 4294967296; }
  function randRange(a, b) { return a + random() * (b - a); }
  function randInt(a, b) { return Math.floor(randRange(a, b + 1)); }
  function dailySeed() {
    const d = new Date(), key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() + ':cloudhop-pip'; let hash = 2166136261;
    for (let i = 0; i < key.length; i++) { hash ^= key.charCodeAt(i); hash = Math.imul(hash, 16777619); }
    return (hash >>> 0) || 1;
  }
  function modeCfg() { return MODES[activeMode] || MODES.campaign; }
  function diffMult() { return difficulty === 'hard' ? 1.15 : difficulty === 'easy' ? 0.85 : 1; }
  function enemySpeedScale() { return modeCfg().speed * diffMult(); }
  function modeMult() {
    if (activeMode === 'daily') return 1.25;
    if (activeMode === 'storm') return 1.5;
    if (activeMode === 'endless') return Math.min(1.6, 1.1 + Math.max(0, absoluteCourse() - 1) * 0.05);
    return 1;
  }
  function award(points) { Arcade.G.addScore(Math.round(points * modeMult())); }
  function statsOf() { const save = window.Save && Save.load ? Save.load(GAME_ID) : {}; return save.stats || {}; }
  function savePatch(patch, extra) { if (window.Save && Save.update) Save.update(GAME_ID, Object.assign({ stats: patch }, extra || {})); }
  function unlock(id) {
    const save = window.Save && Save.load ? Save.load(GAME_ID) : {};
    if ((Array.isArray(save.achievements) ? save.achievements : []).includes(id)) return;
    if (window.Save && Save.update) Save.update(GAME_ID, { achievements: [id] });
    if (window.Apex && Apex.unlockAchievement) Apex.unlockAchievement(id, GAME_ID);
    if (window.UI && UI.toast) UI.toast(id.replace(/-/g, ' '), { color: '#fbbf24' });
  }
  function absoluteCourse() { return courseOffset + courseIndex + 1; }
  function courseTotalLabel() { return activeMode === 'endless' ? '\u221e' : activeMode === 'campaign' ? '3' : String(route ? route.length : 3); }

  /* ---------- course definitions ---------- */
  const S1 = P.make('1 \u00b7 Floating Isles', 110, (g) => {
    g.ground(0, 14); g.set(2, 11, 'P'); g.coins(6, 10, 4);
    g.ground(18, 28); g.set(22, 11, 'w'); g.set(24, 8, '?'); g.coins(20, 9, 3);
    g.ground(33, 44); g.set(38, 11, 'S'); g.plat(38, 5, 5); g.coins(38, 4, 5);
    g.ground(49, 62); g.set(52, 11, 'C'); g.set(56, 11, 'h'); g.plat(58, 8, 3); g.coins(58, 7, 3);
    g.set(66, 11, 'M'); g.coins(66, 9, 3);
    g.ground(74, 90); g.set(78, 11, 'w'); g.set(82, 9, 'b'); g.coins(80, 8, 6); g.set(86, 11, '^');
    g.ground(94, 110); g.stairs(97, 3); g.set(106, 11, 'F');
  });
  S1.hint = 'Press jump again in mid-air for a double jump';

  const S2 = P.make('2 \u00b7 Windmill Heights', 120, (g) => {
    g.ground(0, 10); g.set(2, 11, 'P');
    g.plat(13, 10, 3); g.plat(18, 8, 3); g.plat(23, 6, 3); g.coins(23, 5, 3);
    g.ground(28, 40, 8); g.set(32, 7, 'w'); g.set(35, 7, 'C');
    g.set(44, 8, 'M'); g.coins(44, 6, 3);
    g.ground(52, 66, 8); g.set(55, 7, 'h'); g.set(60, 7, 'w'); g.coins(57, 5, 5); g.set(63, 7, 'S'); g.plat(63, 2, 4); g.coins(63, 1, 4);
    g.plat(70, 5, 3); g.plat(75, 8, 3); g.plat(80, 10, 3);
    g.ground(85, 100, 11); g.set(88, 8, 'b'); g.set(92, 10, 's'); g.set(96, 10, 'C'); g.coins(90, 8, 5);
    g.plat(103, 10, 3); g.plat(108, 9, 3);
    g.ground(112, 120, 11); g.set(117, 10, 'F');
  });
  S2.hint = 'Ride the drifting clouds across the gaps';

  const S3 = P.make('3 \u00b7 Starlit Bridge', 120, (g) => {
    g.ground(0, 12); g.set(2, 11, 'P'); g.coins(6, 10, 4);
    g.set(17, 11, 'M'); g.set(28, 11, 'M'); g.coins(17, 9, 3); g.coins(28, 9, 3);
    g.ground(36, 48, 11); g.set(40, 10, 'w'); g.set(44, 10, 'C'); g.coins(38, 8, 5);
    g.plat(52, 10, 2); g.plat(56, 9, 2); g.plat(60, 8, 2); g.plat(64, 9, 2); g.set(58, 6, 'b');
    g.ground(68, 82, 11); g.set(71, 10, 'h'); g.set(75, 10, '^'); g.set(76, 10, '^'); g.set(79, 10, 's');
    g.set(86, 11, 'M'); g.coins(86, 9, 3);
    g.ground(94, 108, 11); g.set(97, 10, 'w'); g.set(100, 8, 'b'); g.set(103, 10, 'C');
    g.plat(110, 10, 3);
    g.ground(114, 120, 11); g.set(117, 10, 'F');
  });
  S3.hint = 'Hold Shift while falling to glide on the cape';

  const PAL = [
    { sky: ['#38bdf8', '#bae6fd', '#fef9c3'], far: '#93c5fd', mid: '#6ee7b7', solid: '#a16207', top: '#86efac', plat: '#d6a56b' },
    { sky: ['#f59e0b', '#fdba74', '#fef3c7'], far: '#fb923c', mid: '#b45309', solid: '#7c2d12', top: '#a3e635', plat: '#92400e' },
    { sky: ['#1e1b4b', '#312e81', '#6d28d9'], far: '#312e81', mid: '#4c1d95', solid: '#312e81', top: '#c4b5fd', plat: '#6366f1' },
    { sky: ['#0ea5e9', '#bfdbfe', '#f0fdf4'], far: '#38bdf8', mid: '#22c55e', solid: '#166534', top: '#86efac', plat: '#a16207' },
    { sky: ['#312e81', '#7e22ce', '#f0abfc'], far: '#4338ca', mid: '#4c1d95', solid: '#3f3f46', top: '#c084fc', plat: '#52525b' },
  ];
  S1.pal = PAL[0]; S2.pal = PAL[1]; S3.pal = PAL[2];
  const STATIC_ROUTE = [S1, S2, S3];
  const STORM = { sky: ['#050816', '#0f172a', '#334155'], far: '#1e293b', mid: '#0f172a' };

  function buildRoute(index) {
    const cols = 126 + Math.min(60, index * 9);
    const course = P.make('Isle ' + (index + 1), cols, (g) => {
      g.ground(0, 5, 12); g.set(2, 11, 'P');
      let x = 6;
      while (x < cols - 16) {
        const len = 8 + Math.floor(random() * 8), end = Math.min(cols, x + len);
        g.ground(x, end, random() < 0.7 ? 12 : 10);
        if (random() < 0.5) g.set(x + 1 + Math.floor(random() * Math.max(1, len - 3)), 11, random() < 0.45 ? 'w' : 'h');
        if (index >= 1 && random() < 0.14) g.set(x + Math.max(1, len - 2), 11, 's');
        if (random() < 0.55) g.coins(x + 1, 9, Math.min(4, Math.max(2, len - 2)), 1);
        if (random() < 0.32) g.set(x + Math.max(1, len - 2), 11, '?');
        if (random() < 0.4) g.plat(x + 1, 8, 3);
        if (random() < 0.26) g.set(x + 1, 7, 'b');
        if (random() < 0.34) g.set(x + Math.max(1, len - 3), 11, 'M');
        if (random() < 0.2) g.set(x + 2, 11, 'S');
        x = end + 3 + Math.floor(random() * 2);
        if (x < cols - 16 && random() < 0.28) g.set(x - 1, 11, '^');
      }
      g.ground(cols - 16, cols, 12);
      const mid = Math.floor(cols / 2);
      g.ground(mid - 2, mid + 3, 12); g.set(mid, 11, 'C'); g.coins(mid - 4, 9, 5, 1);
      g.stairs(cols - 12, 4, 12); g.set(cols - 6, 11, 'F');
    });
    course.pal = PAL[(index + (runSeed % PAL.length)) % PAL.length];
    course.hint = index === 0 ? 'Fresh skies: read the clouds before you leap' : 'The isles keep climbing';
    return course;
  }

  /* ---------- world ---------- */
  function activePal() {
    const base = (route && route[courseIndex] && route[courseIndex].pal) || PAL[0];
    if (activeMode === 'storm') return Object.assign({}, base, STORM);
    if (themeOverride) return Object.assign({}, base, { sky: themeOverride.slice() });
    return base;
  }
  function tile(x, y) { if (x < 0 || x >= cols) return '#'; if (y < 0 || y >= rows) return ' '; return grid[y][x]; }
  function solid(x, y) { return '#?u'.includes(tile(x, y)); }

  function addEnemy(ch, c, r) {
    const scale = enemySpeedScale();
    const d = { w: { w: 26, h: 24, vx: -0.8 }, h: { w: 26, h: 26, vx: 0 }, b: { w: 28, h: 20, vx: 0 }, s: { w: 28, h: 22, vx: -1 } }[ch];
    const x = c * T + (T - d.w) / 2, y = r * T + T - d.h;
    en.push({ kind: ch, x, y, w: d.w, h: d.h, vx: d.vx * scale, vy: 0, x0: x, y0: y, t: Math.floor(random() * 60), ground: false, dead: false });
  }
  function makePlayer() {
    return { x: 0, y: 0, w: 20, h: 28, vx: 0, vy: 0, face: 1, ground: false, coy: 0, jb: 0, jl: 0, jumps: 0, gliding: false, inv: 0, hp: hpMax, dead: 0, walk: 0, sq: 0, riding: null, drop: 0, bump: null };
  }
  function loadCourse(def) {
    rows = def.rows.length; cols = def.rows[0].length;
    plats = []; en = []; check = null; doneT = 0; banner = 150; courseHit = false;
    grid = def.rows.map((row) => row.split(''));
    let spawn = { c: 1, r: rows - 4 };
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const ch = grid[r][c];
      if (ch === 'P') { spawn = { c, r }; grid[r][c] = ' '; }
      else if ('whbs'.includes(ch)) { addEnemy(ch, c, r); grid[r][c] = ' '; }
      else if (ch === 'M') { plats.push({ x: c * T, ox: c * T, y: r * T, w: T * 3, h: 12, r: 90, sp: 0.02, t: c * 7, dx: 0 }); grid[r][c] = ' '; }
    }
    p = makePlayer();
    p.x = spawn.c * T + 6; p.y = spawn.r * T + T - p.h; p.hp = hpMax;
    spawnPoint = { x: p.x, y: p.y };
    cam = { x: Math.max(0, Math.min(cols * T - W, p.x - W * 0.3)) };
  }
  function spawn(fresh) {
    const s = check || spawnPoint;
    p = makePlayer();
    p.x = s.x; p.y = s.y; p.inv = fresh ? 0 : 70; p.hp = hpMax;
    const target = Math.max(0, Math.min(cols * T - W, p.x + p.w / 2 - W / 2 + p.face * 40));
    cam.x = target;
  }

  /* ---------- physics ---------- */
  function moveBody(b, dx, dy) {
    let hitX = 0;
    if (dx) {
      b.x += dx;
      const r0 = Math.floor(b.y / T), r1 = Math.floor((b.y + b.h - 0.01) / T);
      const c = Math.floor((dx > 0 ? b.x + b.w : b.x) / T);
      for (let r = r0; r <= r1; r++) if (solid(c, r)) { b.x = dx > 0 ? c * T - b.w : (c + 1) * T; hitX = dx > 0 ? 1 : -1; b.vx = 0; break; }
    }
    b.ground = false; b.bump = null;
    b.y += dy;
    const c0 = Math.floor(b.x / T), c1 = Math.floor((b.x + b.w - 0.01) / T);
    if (dy > 0) {
      const r = Math.floor((b.y + b.h) / T), pb = b.y + b.h - dy;
      for (let c = c0; c <= c1; c++) {
        if (solid(c, r) || (tile(c, r) === '=' && !(b.drop > 0) && pb <= r * T + 1)) { b.y = r * T - b.h; b.vy = 0; b.ground = true; break; }
      }
    } else if (dy < 0) {
      const r = Math.floor(b.y / T);
      for (let c = c0; c <= c1; c++) if (solid(c, r)) { b.y = (r + 1) * T; b.vy = 0; b.bump = { c, r }; break; }
    }
    return hitX;
  }

  function hurt(dir) {
    if (p.inv > 0 || p.dead) return;
    p.hp--; p.inv = 100; p.vy = -6; p.vx = -dir * 4; runHit = true; courseHit = true;
    Arcade.G.shake(6); Arcade.G.freeze(4); A.sfx('hurt');
    Arcade.G.burst(p.x + p.w / 2, p.y + p.h / 2, 12, { color: ['#fff', '#fca5a5'], speed: 4, life: 24 });
    if (p.hp <= 0) die();
  }
  function die() {
    if (p.dead) return;
    lives--; runLostLife = true; p.dead = 70; A.sfx('ko'); Arcade.G.shake(10);
    Arcade.G.burst(p.x + p.w / 2, p.y + p.h / 2, 28, { color: ['#fff', '#fbbf24', '#fb7185'], speed: 5, glow: true, life: 36 });
  }

  function updEnemy(e) {
    e.t++;
    if (e.kind === 'b') { e.x = e.x0 + Math.sin(e.t * 0.02) * 90; e.y = e.y0 + Math.sin(e.t * 0.05) * 24; e.vx = Math.cos(e.t * 0.02); return; }
    e.vy = Math.min(e.vy + 0.5, 10);
    if (e.kind === 'h') {
      if (e.ground) { e.vx = 0; if (e.t % 75 === 0) { e.vy = -8.5 * Math.min(1.4, enemySpeedScale()); e.vx = (p.x < e.x ? -1.6 : 1.6) * enemySpeedScale(); } }
    } else if (e.ground) {
      const fx = Math.floor((e.vx > 0 ? e.x + e.w + 2 : e.x - 2) / T), fr = Math.floor((e.y + e.h + 4) / T);
      if (!solid(fx, fr) && tile(fx, fr) !== '=') e.vx = -e.vx;
    }
    const sp = e.vx;
    moveBody(e, e.vx, e.vy);
    if (e.kind !== 'h' && e.vx === 0) e.vx = -sp;
    if (e.y > rows * T + 120) e.dead = true;
  }

  function reportCourse(abs) {
    if (window.Apex && Apex.report) Apex.report({ gameId: GAME_ID, type: 'level_complete', level: abs, score: Arcade.G.score, mode: activeMode });
  }
  function recordCourse(abs) {
    const s = statsOf();
    const patch = { coursesCleared: (Number(s.coursesCleared) || 0) + 1, bestCourses: Math.max(Number(s.bestCourses) || 0, abs) };
    if (activeMode === 'campaign') {
      if (abs >= 3) { patch.campaignStage = 1; patch.campaignLives = MODES.campaign.lives; patch.campaignClears = (Number(s.campaignClears) || 0) + 1; }
      else { patch.campaignStage = abs + 1; patch.campaignLives = lives; }
    }
    if (activeMode === 'endless') patch.endlessBest = Math.max(Number(s.endlessBest) || 0, abs);
    if (activeMode === 'daily') patch.dailyCourses = Math.max(Number(s.dailyCourses) || 0, abs);
    if (activeMode === 'storm') patch.stormBest = Math.max(Number(s.stormBest) || 0, abs);
    savePatch(patch);
  }
  function recordRun(win) {
    const s = statsOf(), d = new Date();
    const day = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const patch = {
      runs: (Number(s.runs) || 0) + 1,
      coinsTotal: (Number(s.coinsTotal) || 0) + coins,
      bestCourses: Math.max(Number(s.bestCourses) || 0, maxCourse),
    };
    if (activeMode === 'endless') patch.endlessBest = Math.max(Number(s.endlessBest) || 0, maxCourse);
    if (activeMode === 'storm' && win) patch.stormfrontClears = (Number(s.stormfrontClears) || 0) + 1;
    const extra = {};
    if (activeMode === 'daily') {
      patch.dailyBest = Math.max(Number(s.dailyBest) || 0, Arcade.G.score);
      extra.daily = { day: day, best: Math.max(Arcade.G.score, Number((Save.load(GAME_ID).daily || {}).best) || 0) };
    }
    savePatch(patch, extra);
  }

  function completeCourse() {
    if (!p || p.dead || doneT > 0 || Arcade.G.state !== 'playing') return;
    const abs = absoluteCourse();
    reportCourse(abs);
    recordCourse(abs);
    maxCourse = Math.max(maxCourse, abs);
    if (abs === 1) unlock('first-hop');
    if (!courseHit) unlock('perfect-isle');
    if (coins >= 50) unlock('coin-cloud');
    if (totalCrates >= 5) unlock('crate-catcher');
    if (doubleJumps >= 20) unlock('double-jumper');
    if (activeMode === 'daily' && abs >= 3) unlock('daily-drift');
    if (activeMode === 'endless' && abs >= 6) unlock('endless-six');
    if (activeMode === 'storm' && abs >= 3) unlock('storm-clear');
    if (activeMode === 'storm' && abs >= 3 && !runHit) unlock('untouchable');
    if (activeMode === 'campaign' && abs >= 3) unlock('all-isles');
    if (activeMode === 'campaign' && abs >= 3 && !runLostLife) unlock('no-loss');
    const timeBonus = timerMode ? Math.max(0, Math.floor(timer)) * 10 : 0;
    const bonus = 500 + p.hp * 100 + timeBonus;
    award(bonus);
    Arcade.G.popup(W / 2, 210, 'ISLE ' + abs + ' CLEAR  +' + Math.round(bonus * modeMult()), '#fde047', 20);
    Arcade.G.ring(p.x + p.w / 2, p.y + p.h / 2, '#fde047', 120, 26);
    A.sfx('clear');
    if (timerMode) timer += 15;
    doneT = 90;
  }

  function finishRun(win, reason) {
    if (runRecorded) return;
    runRecorded = true;
    recordRun(win);
    const G = Arcade.G;
    if (win) {
      if (activeMode === 'campaign') G.win('Sky Cleared!', 'All three isles \u00b7 score ' + G.score);
      else if (activeMode === 'daily') G.win('Daily Drift Complete!', 'Seed ' + runSeed + ' \u00b7 score ' + G.score);
      else if (activeMode === 'storm') G.win('Stormfront Cleared!', 'One life, three isles \u00b7 score ' + G.score);
      else if (activeMode === 'dash') G.win('Breeze Delivered!', 'Time left ' + Math.max(0, Math.floor(timer)) + 's \u00b7 score ' + G.score);
      else G.win('Ascent Complete!', 'Score ' + G.score);
    } else {
      G.over(reason || 'The Clouds Took You', 'Reached isle ' + absoluteCourse() + ' \u00b7 ' + MODE_LABEL[activeMode]);
    }
  }

  function advanceAfterClear() {
    const abs = absoluteCourse();
    if (activeMode === 'campaign' && abs >= 3) return finishRun(true);
    if (activeMode === 'storm' && abs >= 3) return finishRun(true);
    if (activeMode === 'daily' && courseIndex + 1 >= route.length) return finishRun(true);
    if (activeMode === 'dash' && courseIndex + 1 >= route.length) return finishRun(true);
    if (activeMode === 'endless') { courseIndex++; route.push(buildRoute(courseIndex)); loadCourse(route[courseIndex]); return; }
    if (courseIndex + 1 < route.length) { courseIndex++; loadCourse(route[courseIndex]); return; }
    finishRun(true);
  }

  /* ---------- input and update ---------- */
  function update(G) {
    G.hudL = 'SCORE ' + G.score + ' \u00b7 COINS ' + coins + ' \u00b7 ISLE ' + absoluteCourse() + '/' + courseTotalLabel();
    G.hudR = '\u2665'.repeat(Math.max(0, p.hp)) + '  LIVES ' + lives + ' \u00b7 ' + MODE_LABEL[activeMode];
    if (banner > 0) banner--;
    for (const m of plats) { const ox = m.x; m.t++; m.x = m.ox + Math.sin(m.t * m.sp) * m.r; m.dx = m.x - ox; }
    if (doneT > 0) { followCam(); if (--doneT === 0) advanceAfterClear(); return; }
    if (p.dead > 0) {
      followCam();
      if (--p.dead === 0) { if (lives <= 0) finishRun(false); else spawn(false); }
      return;
    }
    if (timerMode) {
      if (timer <= 0) { finishRun(false, 'Out of Time'); return; }
      if (G.t % 60 === 0) { timer--; if (timer <= 0) { finishRun(false, 'Out of Time'); return; } }
    }
    const ax = A.axisX(), jh = A.held('Space', 'ArrowUp', 'KeyW', 'KeyZ'), jp = A.hit('Space', 'ArrowUp', 'KeyW', 'KeyZ');
    const glideHeld = A.held('ShiftLeft', 'ShiftRight', 'KeyJ', 'KeyK');
    if (ax) p.face = ax;
    p.vx = A.approach(p.vx, ax * 3.6, ax ? (p.ground ? 0.45 : 0.3) : (p.ground ? 0.55 : 0.12));
    p.coy = p.ground ? 6 : p.coy - 1;
    p.jb = jp ? 7 : p.jb - 1;
    if (p.ground) p.jumps = 0;
    p.gliding = false;

      { id: 'daily', name: 'Daily Drift', blurb: 'The same seeded sky route for everyone today.', seeded: true, seasonTargets: [3000, 6000, 10000] },
      { id: 'endless', name: 'Endless Ascent', blurb: 'Procedural isles that climb higher and wider.', seasonTargets: [3200, 7000, 12000] },
      { id: 'storm', name: 'Stormfront', blurb: 'One life, faster gusts, and a 1.5\u00d7 score bonus.', lockedHint: 'Clear 3 isles to unlock', requires: { stat: 'coursesCleared', gte: 3 }, seasonTargets: [3200, 6500, 11000] },

    settings: [
      { key: 'difficulty', label: 'Difficulty', type: 'select', options: ['easy', 'normal', 'hard'], default: 'normal' },
      { key: 'shake', label: 'Screen shake', type: 'slider', min: 0, max: 1, step: 0.1, default: 1 },
      { key: 'particles', label: 'Particles', type: 'select', options: ['lite', 'standard', 'ultra'], default: 'standard' },
    ],
    achievements: [
      { id: 'first-hop', name: 'First Hop', desc: 'Clear your first sky isle.', rarity: 'common' },
      { id: 'perfect-isle', name: 'Soft Landing', desc: 'Clear an isle without taking damage.', rarity: 'rare' },
      { id: 'crate-catcher', name: 'Crate Catcher', desc: 'Bust five crates in one run.', rarity: 'common' },
      { id: 'spring-step', name: 'Spring Step', desc: 'Launch off a spring.', rarity: 'common' },
      { id: 'checkpoint', name: 'Cloud Anchor', desc: 'Light a checkpoint.', rarity: 'common' },
      { id: 'coin-cloud', name: 'Coin Cloud', desc: 'Collect fifty coins in one run.', rarity: 'rare' },
      { id: 'double-jumper', name: 'Double Jumper', desc: 'Perform twenty double jumps in one run.', rarity: 'rare' },
      { id: 'all-isles', name: 'Sky Cleared', desc: 'Clear the three-isle campaign.', rarity: 'epic' },
      { id: 'daily-drift', name: 'Daily Drifter', desc: 'Clear the Daily Drift.', rarity: 'rare' },
      { id: 'endless-six', name: 'High Climber', desc: 'Reach isle six in Endless Ascent.', rarity: 'epic' },
      { id: 'storm-clear', name: 'Stormbreaker', desc: 'Clear Stormfront.', rarity: 'legendary' },
      { id: 'no-loss', name: 'Flawless Flight', desc: 'Clear the campaign without losing a life.', rarity: 'epic' },
      { id: 'untouchable', name: 'Untouchable', desc: 'Clear Stormfront without taking damage.', rarity: 'legendary' },
      { id: 'score-10000', name: 'Sky High', desc: 'Score 10,000 in one run.', rarity: 'legendary' },
    ],
    tutorial: { type: 'interactive', steps: [
      { text: 'Run with A/D or the arrow keys and jump with Space.', hold: 'ArrowRight' },
      { text: 'Press jump again in mid-air for a double jump.', hold: 'Space' },
      { text: 'Hold Shift while falling to glide, then reach the flag.', hold: 'ShiftLeft' },
    ] },
    chapter: 'SKY ISLES \u00b7 3 COURSES', levels: [{}, {}, {}],
    hooks: {
      applyMode: (mode) => {
        activeMode = MODES[mode] ? mode : 'campaign';
        if (pipGame && lastInitMode !== activeMode) pipGame.restart(false);
      },
      applySetting: (key, value) => {
        if (key === 'difficulty') difficulty = value;
        if (key === 'shake') shakeScale = Number(value);
        if (key === 'particles' && window.Perf && Perf.setTier) Perf.setTier(value);
      },
      applyCosmetic,
      getResult: () => ({ score: pipGame.score, win: pipGame.state === 'won', mode: activeMode, course: absoluteCourse(), lives }),
    },
  });

  if (/(\?|&)test=1(?:&|$)/.test(location.search)) {
    window.CloudhopPipTest = {
      state() {
        return { mode: activeMode, difficulty: Arcade.difficulty, course: absoluteCourse(), courseIndex, courseOffset, total: route.length, lives, hp: p ? p.hp : 0, score: pipGame.score, seed: runSeed, state: pipGame.state, coins, timer, timerMode, check: !!check, title: pipGame.title, sub: pipGame.sub, maxCourse, jumps: p ? p.jumps : 0, doubleJumps, gliding: !!(p && p.gliding), ground: !!(p && p.ground), vy: p ? Math.round(p.vy * 100) / 100 : 0, x: p ? Math.round(p.x) : 0, y: p ? Math.round(p.y) : 0 };
      },
      layout() { return grid.map((row) => row.join('')); },
      sequence(n) { const out = []; for (let i = 0; i < n; i++) out.push(Number(random().toFixed(6))); return out; },
      setMode(mode) { return pipGame.ui.setMode(mode); },
      setDifficulty(level) { difficulty = level; Arcade.difficulty = level; Arcade.speedMult = level === 'easy' ? 0.8 : level === 'hard' ? 1.35 : 1; },
      restart(autostart) { pipGame.restart(autostart === true); },
      award(points) { award(points); },
      cosmetic: applyCosmetic,
      colors() { return { body: pip.body, belly: pip.belly, trail: trailColor, coin: coinColor, spring: springColor, sky: activePal().sky.slice() }; },
      stats() { return window.Save && Save.load ? Save.load(GAME_ID) : {}; },
      clearCourse() { completeCourse(); },
      die() { if (pipGame.state === 'playing' && p && !p.dead) die(); },
      setTimer(n) { timer = n; },
      teleportTile(c, r) { if (p) { p.x = c * T + 4; p.y = r * T + T - p.h; p.vx = 0; p.vy = 0; } },
      spawnEnemy(kind, c, r) { addEnemy(kind || 'w', c == null ? 8 : c, r == null ? 11 : r); },
      grantCoins(n) { coins += n == null ? 50 : n; },
      setHp(n) { if (p) p.hp = n == null ? 3 : n; },
      practiceDoubles(n) { doubleJumps += n == null ? 20 : n; if (doubleJumps >= 20) unlock('double-jumper'); },
      routeNames() { return route.map((item) => item.name); },
    };
  }
})();
