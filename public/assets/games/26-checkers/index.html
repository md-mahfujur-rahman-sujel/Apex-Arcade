<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkers</title>
<style>
  .ck { display: grid; grid-template-columns: auto minmax(240px, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .ck { grid-template-columns: 1fr; } }
  #bd { --s: max(240px, min(100vw - 40px, 600px, 100vh - 200px)); width: var(--s); height: var(--s); flex: none; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); border-radius: 10px; overflow: hidden; box-shadow: 0 20px 50px -20px #000, 0 0 0 6px var(--ck-frame, #2a2f45); user-select: none; touch-action: manipulation; }
  .q { position: relative; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .q.l { background: var(--ck-light, #d9b38c); } .q.d { background: var(--ck-dark, #3f2a1d); }
  .q.lm { background-image: linear-gradient(var(--ck-accent, #f59e0b) 0 100%); opacity: .96; }
  .q.sel { box-shadow: inset 0 0 0 4px var(--ck-sel, #06b6d4); }
  .q.tg::after { content: ""; position: absolute; width: 26%; height: 26%; border-radius: 50%; background: var(--ck-target, rgba(16,185,129,.85)); }
  .q.mv .pc { outline: 3px solid var(--ck-accent, #f59e0b); outline-offset: -3px; }
  .pc { width: 78%; height: 78%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--s) / 8 * .42); color: #fde047; box-shadow: 0 4px 0 rgba(0,0,0,.4), inset 0 0 0 4px rgba(255,255,255,.22), inset 0 0 0 9px rgba(0,0,0,.14); }
  .side { display: grid; gap: 12px; }
  .capt { color: var(--muted); line-height: 1.7; }
  .capt b { color: #e6e9f5; }
  .clock { font: 700 15px ui-monospace, Consolas, monospace; color: #fde047; }
  .clock.low { color: #fb7185; }
</style>
<script src="../../kits/music-kit.js"></script><script src="../../kits/menu-kit.js"></script>
</head>
<body>

<script src="../../kits/perf-kit.js"></script>
<script src="../../kits/save-kit.js"></script>
<script src="../../kits/meta-config.js"></script>
<script src="../../kits/meta-kit.js"></script>
<script src="../../kits/board-kit.js"></script>
<script src="../../kits/score-bridge.js"></script>
<script src="../../kits/ui-kit.js"></script>
<script>
const ui = Board.shell({
  id: 'checkers', cpu: true, title: 'Checkers', subtitle: 'Jump, capture and crown \u2014 captures are mandatory',
  rules: 'Move diagonally forward onto empty dark squares. If you can capture, you must, and you keep jumping while another jump is available. A piece that reaches the far row is crowned a king (\u265B) and may move and capture backwards too. Capture or block every enemy piece to win. Red moves first. Speed Checkers adds a three-minute clock; King Hunt ends when one side crowns two kings; Giveaway flips the objective so you win by losing every piece; Grandmaster is a 1.5\u00d7 match against the deepest search.',
  controls: [['Click', 'Select a piece, then a green square'], ['U', 'Undo'], ['F', 'Flip the board'], ['N', 'New game'], ['H / M', 'Toggle help / mute']],
});
ui.main.innerHTML = `
<div class="ck">
  <div><div id="bd"></div></div>
  <div class="side">
    <div class="bk-status" id="st"></div>
    <div class="bk-row">
      <label>Play <select class="bk-select" id="seat"><option value="r">Red (first) vs computer</option><option value="b">Black vs computer</option><option value="two">Two players</option></select></label>
      <label>Level <select class="bk-select" id="lvl"><option value="0">Easy</option><option value="1" selected>Medium</option><option value="2">Hard</option></select></label>
    </div>
    <div class="bk-row"><button class="bk-btn bk-primary" id="new">New game</button><button class="bk-btn" id="undo">Undo</button><button class="bk-btn" id="flip">Flip</button></div>
    <div class="capt" id="cp"></div>
    <div id="md" style="color:var(--muted);font-size:13px;line-height:1.6"></div>
  </div>
</div>`;
const $ = (s) => ui.main.querySelector(s);

/* ---------------- modes, records, cosmetics ---------------- */
const MODE_NAMES = { classic: 'Classic', speed: 'Speed Checkers', kings: 'King Hunt', giveaway: 'Giveaway', grandmaster: 'Grandmaster' };
const MODE_KEY = { classic: 'Classic', speed: 'Speed', kings: 'Kings', giveaway: 'Giveaway', grandmaster: 'Grandmaster' };
const CFG = {
  classic: { clock: 0, kingTarget: 0, mult: 1, bonus: 1000 },
  speed: { clock: 180000, kingTarget: 0, mult: 1.1, bonus: 900 },
  kings: { clock: 0, kingTarget: 2, mult: 1.2, bonus: 1000 },
  giveaway: { clock: 0, kingTarget: 0, mult: 1.3, bonus: 1200, misere: true },
  grandmaster: { clock: 0, kingTarget: 0, mult: 1.5, bonus: 1500 },
};
const MODES = [
  { id: 'classic', name: 'Classic', blurb: 'The standard rules. Red moves first and captures are mandatory.' },
  { id: 'speed', name: 'Speed Checkers', blurb: 'Three minutes each. Run out of time and you lose. 1.1\u00d7 score.' },
  { id: 'kings', name: 'King Hunt', blurb: 'The first side to crown two kings wins immediately. 1.2\u00d7 score.' },
  { id: 'giveaway', name: 'Giveaway', blurb: 'Mis\u00e8re rules: lose every piece or leave the opponent stuck to win. 1.3\u00d7 score.' },
  { id: 'grandmaster', name: 'Grandmaster', blurb: 'The deepest search at 1.5\u00d7 score.', requires: { stat: 'classicWins', gte: 1 }, lockedHint: 'Win a Classic game to unlock' },
];
const ACHIEVEMENTS = [
  { id: 'first-move', name: 'Opening Move', desc: 'Make a legal move.', rarity: 'common' },
  { id: 'first-capture', name: 'Jumped', desc: 'Capture an enemy piece.', rarity: 'common' },
  { id: 'first-king', name: 'Crowned', desc: 'Crown a king.', rarity: 'common' },
  { id: 'double-jump', name: 'Double Jump', desc: 'Capture two pieces in one move.', rarity: 'rare' },
  { id: 'triple-jump', name: 'Triple Jump', desc: 'Capture three pieces in one move.', rarity: 'epic' },
  { id: 'classic-clear', name: 'Checker Champion', desc: 'Win a Classic game.', rarity: 'common' },
  { id: 'speed-clear', name: 'Beat The Clock', desc: 'Win a Speed Checkers game.', rarity: 'rare' },
  { id: 'kings-clear', name: 'King Hunt Winner', desc: 'Win a King Hunt game.', rarity: 'rare' },
  { id: 'giveaway-clear', name: 'Lost Everything', desc: 'Win a Giveaway game.', rarity: 'epic' },
  { id: 'grandmaster-clear', name: 'Grandmaster', desc: 'Win a Grandmaster game.', rarity: 'legendary' },
  { id: 'flawless', name: 'Flawless Sweep', desc: 'Win without losing a piece.', rarity: 'epic' },
  { id: 'personal-best', name: 'Personal Best', desc: 'Set a new best score.', rarity: 'rare' },
];
const PIECE_SETS = {
  'checkers:pieces-ruby': { r: 'radial-gradient(circle at 35% 30%, #fb7185, #be123c)', b: 'radial-gradient(circle at 35% 30%, #71717a, #09090b)' },
  'checkers:pieces-ivory': { r: 'radial-gradient(circle at 35% 30%, #fde68a, #b45309)', b: 'radial-gradient(circle at 35% 30%, #e2e8f0, #334155)' },
  'checkers:pieces-neon': { r: 'radial-gradient(circle at 35% 30%, #f472b6, #9d174d)', b: 'radial-gradient(circle at 35% 30%, #22d3ee, #0e7490)' },
  'checkers:pieces-jade': { r: 'radial-gradient(circle at 35% 30%, #86efac, #15803d)', b: 'radial-gradient(circle at 35% 30%, #fde047, #a16207)' },
  'checkers:pieces-mono': { r: 'radial-gradient(circle at 35% 30%, #f8fafc, #94a3b8)', b: 'radial-gradient(circle at 35% 30%, #475569, #0f172a)' },
};
const BOARD_SETS = {
  'checkers:board-wood': { light: '#d9b38c', dark: '#3f2a1d', frame: '#2a2f45' },
  'checkers:board-walnut': { light: '#c49a6c', dark: '#2f1b12', frame: '#4a2f1d' },
  'checkers:board-slate': { light: '#cbd5e1', dark: '#334155', frame: '#0f172a' },
  'checkers:board-midnight': { light: '#2a3a5c', dark: '#101a30', frame: '#1e293b' },
};
const ACCENTS = { 'checkers:accent-amber': '#f59e0b', 'checkers:accent-cyan': '#22d3ee', 'checkers:accent-rose': '#fb7185', 'checkers:accent-lime': '#a3e635' };
const THEMES = {
  'checkers:theme-night': '',
  'checkers:theme-forest': 'radial-gradient(1000px 500px at 10% -10%, #14532d, transparent 60%), radial-gradient(800px 500px at 100% 0, #1e3a5f, transparent 55%), #070d09',
  'checkers:theme-sunset': 'radial-gradient(1000px 500px at 12% -8%, #7c2d12, transparent 60%), radial-gradient(800px 500px at 100% 0, #4c1d3d, transparent 55%), #0b0705',
};
const PALETTE = {
  pieces: Object.assign({}, PIECE_SETS['checkers:pieces-ruby']),
  board: Object.assign({}, BOARD_SETS['checkers:board-wood']),
  accent: ACCENTS['checkers:accent-amber'],
};
function paintPalette() {
  const el = document.getElementById('bd'); if (!el) return;
  el.style.setProperty('--ck-light', PALETTE.board.light);
  el.style.setProperty('--ck-dark', PALETTE.board.dark);
  el.style.setProperty('--ck-frame', PALETTE.board.frame);
  el.style.setProperty('--ck-accent', PALETTE.accent);
}
function applyCosmetic(slot, id) {
  if (slot === 'skin' && PIECE_SETS[id]) PALETTE.pieces = Object.assign({}, PIECE_SETS[id]);
  else if (slot === 'palette' && BOARD_SETS[id]) PALETTE.board = Object.assign({}, BOARD_SETS[id]);
  else if (slot === 'effect' && ACCENTS[id]) PALETTE.accent = ACCENTS[id];
  else if (slot === 'theme' && THEMES[id] !== undefined) document.body.style.background = THEMES[id];
  paintPalette(); if (B) render();
}

/* ---- rules: red moves up the board, black moves down; capital letters are kings ---- */
const mk = () => { const b = Array(64).fill(0); for (let i = 0; i < 64; i++) if (((i >> 3) + (i & 7)) % 2) { if (i >> 3 < 3) b[i] = 'b'; else if (i >> 3 > 4) b[i] = 'r'; } return b; };
const opp = (s) => (s === 'r' ? 'b' : 'r');
function jumps(b, i, s, caps, path, out) {
  const p = b[i], K = p < 'a', dirs = K ? [[-1, -1], [-1, 1], [1, -1], [1, 1]] : s === 'r' ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]]; let any = 0;
  for (const [dr, dc] of dirs) {
    const r = (i >> 3) + dr, c = (i & 7) + dc, r2 = r + dr, c2 = c + dc; if (r2 < 0 || r2 > 7 || c2 < 0 || c2 > 7) continue;
    const m = r * 8 + c, l = r2 * 8 + c2, q = b[m];
    if (q && q.toLowerCase() !== s && !b[l]) {
      any = 1; const b2 = b.slice(); b2[l] = p; b2[i] = 0; b2[m] = 0; const nc = [...caps, m], np = [...path, l];
      if (!K && (s === 'r' ? r2 === 0 : r2 === 7)) out.push({ path: np, caps: nc }); else jumps(b2, l, s, nc, np, out);
    }
  }
  if (!any && caps.length) out.push({ path, caps });
}
function moves(b, s) {
  const J = [], M = [];
  for (let i = 0; i < 64; i++) { const p = b[i]; if (p && p.toLowerCase() === s) jumps(b, i, s, [], [i], J); }
  if (J.length) return J;
  for (let i = 0; i < 64; i++) {
    const p = b[i]; if (!p || p.toLowerCase() !== s) continue;
    const K = p < 'a', dirs = K ? [[-1, -1], [-1, 1], [1, -1], [1, 1]] : s === 'r' ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]];
    for (const [dr, dc] of dirs) { const r = (i >> 3) + dr, c = (i & 7) + dc; if (r >= 0 && r < 8 && c >= 0 && c < 8 && !b[r * 8 + c]) M.push({ path: [i, r * 8 + c], caps: [] }); }
  }
  return M;
}
function ap(b, m) {
  const b2 = b.slice(), f = m.path[0], t = m.path[m.path.length - 1]; let p = b2[f]; b2[f] = 0; m.caps.forEach((x) => { b2[x] = 0; });
  if (p >= 'a' && (p === 'r' ? t >> 3 === 0 : t >> 3 === 7)) p = p.toUpperCase(); b2[t] = p; return b2;
}
function ev(b, s) {
  let v = 0;
  for (let i = 0; i < 64; i++) { const p = b[i]; if (!p) continue; const o = p.toLowerCase(), r = i >> 3; let x = p < 'a' ? 170 : 100 + (o === 'r' ? 7 - r : r) * 4; if (p >= 'a' && (o === 'r' ? r === 7 : r === 0)) x += 10; v += o === s ? x : -x; }
  return CFG[mode].misere ? -v : v;
}
function nm(b, s, d, a, be) {
  const ms = moves(b, s);
  if (!ms.length) {
    const wiped = CFG[mode].misere && !b.some((p) => p && p.toLowerCase() === s);
    return wiped ? 1e5 + d : -1e5 - d;
  }
  if (!d) return ev(b, s);
  ms.sort((x, y) => y.caps.length - x.caps.length); let best = -1e9;
  for (const m of ms) { const v = -nm(ap(b, m), opp(s), d - 1, -be, -a); if (v > best) best = v; if (best > a) a = best; if (a >= be) break; }
  return best;
}

/* ---- game state & UI ---- */
let B, turn, sel, tg, lm, over, overSide, flip, mode = 'classic', seat = 'r', busy, hist, np, menuPaused = true, gen = 0;
let PS = { r: { score: 0, caps: 0, kings: 0, lost: 0 }, b: { score: 0, caps: 0, kings: 0, lost: 0 } };
let crowns = { r: 0, b: 0 }, plies = 0, clocks = { r: 0, b: 0 }, clockTimer = null, clockLast = 0;
const bd = $('#bd'), sqs = [];
for (let k = 0; k < 64; k++) { const d = document.createElement('div'); d.dataset.k = k; bd.appendChild(d); sqs.push(d); }
const humanTurn = () => seat === 'two' || turn === seat;
const humanSeatFor = (s) => seat === 'two' || seat === s;
const humanSide = () => (seat === 'two' ? 'r' : seat);
const addScore = (s, n) => { if (PS[s]) PS[s].score += Math.max(0, Math.round(n)); };
const fmt = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

function newGame() {
  gen++; if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
  mode = ['classic', 'speed', 'kings', 'giveaway', 'grandmaster'].includes(mode) ? mode : 'classic';
  seat = $('#seat').value;
  B = mk(); turn = 'r'; sel = -1; tg = []; lm = null; over = null; overSide = null; busy = false; hist = []; np = 0; plies = 0;
  PS = { r: { score: 0, caps: 0, kings: 0, lost: 0 }, b: { score: 0, caps: 0, kings: 0, lost: 0 } };
  crowns = { r: 0, b: 0 }; clocks = { r: CFG[mode].clock, b: CFG[mode].clock }; clockLast = Date.now();
  flip = seat === 'b'; paintPalette(); render();
  if (CFG[mode].clock) clockTimer = setInterval(tickClock, 250);
  cpu();
}
function tickClock(step) {
  if (over) return;
  if (step == null) {
    const now = Date.now(), dt = now - clockLast; clockLast = now;
    if (menuPaused || Board.paused()) return;
    clocks[turn] = Math.max(0, clocks[turn] - dt);
  } else clocks[turn] = Math.max(0, clocks[turn] - step);
  if (clocks[turn] <= 0) { conclude(opp(turn), 'on time'); return; }
  render();
}
function render() {
  if (!B) return;
  const ms = over ? [] : moves(B, turn), from = new Set(ms.map((m) => m.path[0])), tset = new Set(tg.map((m) => m.path[m.path.length - 1]));
  sqs.forEach((d, k) => {
    const i = flip ? 63 - k : k, r = i >> 3, c = i & 7, p = B[i];
    d.className = 'q ' + ((r + c) % 2 ? 'd' : 'l') + (lm && lm.includes(i) ? ' lm' : '') + (i === sel ? ' sel' : '') + (tset.has(i) ? ' tg' : '') + (sel < 0 && !over && !busy && humanTurn() && from.has(i) ? ' mv' : '');
    d.innerHTML = p ? `<div class="pc ${p.toLowerCase()}" style="background:${PALETTE.pieces[p.toLowerCase()]}">${p < 'a' ? '\u265B' : ''}</div>` : '';
  });
  const who = turn === 'r' ? 'Red' : 'Black', cap = ms.length && ms[0].caps.length;
  $('#st').textContent = over || (busy ? who + ' (computer) is thinking\u2026' : who + ' to move' + (cap ? ' \u2014 you must capture!' : '') + (seat !== 'two' && humanTurn() ? ' \u2014 your turn' : ''));
  const n = (s) => B.filter((p) => p && p.toLowerCase() === s).length, k = (s) => B.filter((p) => p === s.toUpperCase()).length;
  const clock = CFG[mode].clock ? `<div class="clock${clocks.r < 30000 || clocks.b < 30000 ? ' low' : ''}">Red ${fmt(clocks.r)} \u00b7 Black ${fmt(clocks.b)}</div>` : '';
  $('#cp').innerHTML = `${clock}Red: <b>${n('r')}</b> pieces (${k('r')} kings)<br>Black: <b>${n('b')}</b> pieces (${k('b')} kings)<br>Captures: Red <b>${PS.r.caps}</b> \u00b7 Black <b>${PS.b.caps}</b>`;
  const target = CFG[mode].kingTarget ? ` \u00b7 first to ${CFG[mode].kingTarget} kings` : '';
  $('#md').textContent = MODE_NAMES[mode] + target + (CFG[mode].misere ? ' \u00b7 lose all your pieces to win' : '') + (CFG[mode].clock ? ' \u00b7 three minutes each' : '');
}
function play(m) {
  if (over || busy) return;
  hist.push({ B, turn, lm, np, PS: { r: Object.assign({}, PS.r), b: Object.assign({}, PS.b) }, crowns: Object.assign({}, crowns), plies });
  const mover = turn, kingBefore = B[m.path[0]] < 'a';
  const newKing = !kingBefore && ((mover === 'r' && m.path[m.path.length - 1] >> 3 === 0) || (mover === 'b' && m.path[m.path.length - 1] >> 3 === 7));
  np = kingBefore && !m.caps.length ? np + 1 : 0; B = ap(B, m); lm = [m.path[0], m.path[m.path.length - 1]]; turn = opp(turn); sel = -1; tg = []; plies += 1;
  if (m.caps.length) { addScore(mover, 150 * m.caps.length); PS[mover].caps += m.caps.length; PS[opp(mover)].lost += m.caps.length; }
  if (newKing) { addScore(mover, 120); PS[mover].kings += 1; crowns[mover] += 1; }
  Board.sfx(m.caps.length ? 'capture' : 'move');
  if (humanSeatFor(mover)) {
    GameUI.unlock('first-move');
    if (m.caps.length) GameUI.unlock('first-capture');
    if (m.caps.length >= 3) GameUI.unlock('triple-jump'); else if (m.caps.length >= 2) GameUI.unlock('double-jump');
    if (newKing) GameUI.unlock('first-king');
  }
  render();
  checkEnd(mover);
  if (!over) cpu();
}
function checkEnd(mover) {
  const cfg = CFG[mode], next = turn;
  if (cfg.kingTarget && crowns[mover] >= cfg.kingTarget) { conclude(mover, 'kings'); return; }
  if (cfg.misere && !B.some((p) => p && p.toLowerCase() === next)) { conclude(next, 'lost all'); return; }
  const nextMoves = moves(B, next);
  if (!nextMoves.length) {
    if (cfg.misere) conclude(mover, 'stuck');
    else conclude(mover, 'blocked');
    return;
  }
  if (np >= 80) conclude(null, 'draw');
}
function conclude(winner, reason) {
  if (over) return;
  over = !winner ? 'Draw \u2014 no progress in 40 moves' : `${winner === 'r' ? 'Red' : 'Black'} wins!`;
  overSide = winner; busy = false; gen++;
  if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
  const cfg = CFG[mode], h = humanSide();
  const humanWon = !!winner && (seat === 'two' ? winner === 'r' : winner === seat);
  const base = PS[h].score + (humanWon ? cfg.bonus : 0);
  const finalScore = Math.round(base * cfg.mult);
  const records = {}; records['best' + MODE_KEY[mode] + 'Score'] = finalScore;
  const counters = { captures: PS[h].caps, kingsCrowned: PS[h].kings };
  if (humanWon) { counters.wins = 1; counters[mode + 'Wins'] = 1; }
  const achievements = [];
  if (humanWon) achievements.push(mode + '-clear');
  if (humanWon && PS[h].lost === 0) achievements.push('flawless');
  const prevBest = Number(GameUI.stats().bestScore) || 0;
  const label = !winner ? 'Draw' : (winner === 'r' ? 'Red' : 'Black') + ' won';
  GameUI.record({
    score: finalScore,
    result: label + ' ' + MODE_NAMES[mode] + (reason === 'on time' ? ' on time' : ''),
    records, counters,
    mins: humanWon ? { fewestMoves: plies } : {},
    achievements,
  });
  if (finalScore > prevBest) GameUI.unlock('personal-best');
  render();
  const title = seat === 'two' ? (winner ? (winner === 'r' ? 'Red' : 'Black') + ' wins!' : 'Draw') : humanWon ? 'You won!' : winner ? 'Computer wins' : 'Draw';
  const detail = finalScore + ' pts \u00b7 ' + MODE_NAMES[mode] + (reason === 'on time' ? ' \u00b7 won on time' : '');
  Board.sfx(seat === 'two' || humanWon ? 'win' : winner ? 'lose' : 'move');
  Board.modal(title, detail, [['Play again', newGame], ['Close']]);
}
function cpu() {
  if (over || humanTurn()) return;
  const g = gen, s = turn; busy = true; render();
  const go = () => {
    if (g !== gen || over) return;
    if (menuPaused || Board.paused()) { Board.after(250, go); return; }
    Board.think(() => {
      const ms = moves(B, s), L = +$('#lvl').value, d = mode === 'grandmaster' ? 6 : [2, 4, 6][L], noise = mode === 'grandmaster' ? 0 : [40, 0, 0][L]; let bm = ms[0], bs = -1e9;
      for (const m of ms) { const v = -nm(ap(B, m), opp(s), d - 1, -1e9, 1e9) + Math.random() * noise; if (v > bs) { bs = v; bm = m; } }
      return bm;
    }, 1000).then(async (bm) => {
      if (g !== gen || !bm) return;
      const el = (i) => sqs[flip ? 63 - i : i];
      sel = bm.path[0]; render(); await Board.sleep(Board.pace(380));
      if (g !== gen) return;
      await Board.glide(el(bm.path[0]), bm.path.slice(1).map(el), 460, '.pc', (h) => {
        if (bm.caps[h]) { const c = el(bm.caps[h]).querySelector('.pc'); if (c) c.style.visibility = 'hidden'; Board.sfx('capture'); }
      });
      if (g !== gen) return;
      busy = false; play(bm);
    });
  };
  go();
}
bd.addEventListener('click', (e) => {
  const d = e.target.closest('.q'); if (!d || over || busy || !humanTurn()) return;
  const i = flip ? 63 - +d.dataset.k : +d.dataset.k;
  if (sel >= 0) { const m = tg.find((x) => x.path[x.path.length - 1] === i); if (m) return play(m); }
  const ms = moves(B, turn).filter((m) => m.path[0] === i);
  if (B[i] && B[i].toLowerCase() === turn && ms.length) { sel = i; tg = ms; Board.sfx('click'); } else { sel = -1; tg = []; Board.sfx('error'); }
  render();
});
function undo() {
  if (busy || !hist.length) return;
  const pop = () => { const h = hist.pop(); B = h.B; turn = h.turn; lm = h.lm; np = h.np; PS = h.PS; crowns = h.crowns; plies = h.plies; };
  pop(); if (seat !== 'two' && !humanTurn() && hist.length) pop();
  over = null; overSide = null; sel = -1; tg = []; render(); cpu();
}
$('#new').onclick = newGame; $('#undo').onclick = undo; $('#flip').onclick = () => { flip = !flip; render(); }; $('#seat').onchange = newGame;
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase(); if (k === 'n') newGame(); else if (k === 'u') undo(); else if (k === 'f') { flip = !flip; render(); }
});

/* ---------------- shared menu contract ---------------- */
const GameUI = Board.ui({
  id: 'checkers', title: 'Checkers', subtitle: 'Five ways to rule the board.', accent: '#f59e0b',
  modes: MODES, achievements: ACHIEVEMENTS,
  tutorial: { type: 'interactive', steps: [
    { text: 'Select one of your pieces, then a green square. Captures are mandatory.' },
    { text: 'Multi-jumps continue automatically in one move \u2014 hop every enemy you can.' },
    { text: 'Reach the far row to crown a king that moves and captures backwards.' },
    { text: 'Win by capturing or blocking every enemy piece; Giveaway flips that objective.' },
  ] },
  hooks: {
    applyMode: (next) => { mode = MODES.some((m) => m.id === next) ? next : 'classic'; if (B) newGame(); },
    applyCosmetic,
    onStart: () => { menuPaused = false; clockLast = Date.now(); },
  },
});
window.ApexGameMenuActions = {
  play: function () { menuPaused = false; clockLast = Date.now(); },
  pause: function (value) { menuPaused = !!value; clockLast = Date.now(); },
  resume: function () { menuPaused = false; clockLast = Date.now(); },
  restart: function () { menuPaused = false; newGame(); }
};

paintPalette(); newGame();

if (/(\?|&)test=1(?:&|$)/.test(location.search)) {
  const snap = () => ({
    mode, seat, turn, over, overSide, plies, np, sel, flip, busy, menuPaused,
    board: B.slice(), scores: { r: PS.r.score, b: PS.b.score }, caps: { r: PS.r.caps, b: PS.b.caps },
    kings: { r: PS.r.kings, b: PS.b.kings }, lost: { r: PS.r.lost, b: PS.b.lost }, crowns: Object.assign({}, crowns),
    clocks: Object.assign({}, clocks), legal: over ? [] : moves(B, turn).map((m) => ({ from: m.path[0], to: m.path[m.path.length - 1], caps: m.caps.slice() })),
  });
  window.CheckersTest = {
    state: snap,
    modes: () => MODES.map((m) => m.id),
    setMode: (id) => GameUI.setMode(id),
    getMode: () => GameUI.getMode(),
    restart: () => { newGame(); return true; },
    setSeat: (value) => { const s = $('#seat'); if (!Array.from(s.options).some((o) => o.value === value)) return false; s.value = value; newGame(); return true; },
    setLevel: (n) => { const s = $('#lvl'); s.value = String(Math.max(0, Math.min(2, Number(n) || 0))); return +s.value; },
    setDifficulty: (d) => Board.setDifficulty(d),
    level: () => Board.level(),
    setBoard: (cells) => { B = Array.isArray(cells) && cells.length === 64 ? cells.map((p) => p || 0) : mk(); over = null; overSide = null; sel = -1; tg = []; lm = null; render(); return B.slice(); },
    setTurn: (s) => { turn = s === 'b' ? 'b' : 'r'; sel = -1; tg = []; render(); return turn; },
    move: (from, to) => { const m = moves(B, turn).find((x) => x.path[0] === Number(from) && x.path[x.path.length - 1] === Number(to)); if (!m) return false; play(m); return snap(); },
    finish: (s) => { conclude(s === 'draw' ? null : s, 'test'); return snap(); },
    setScore: (s, n) => { PS[s].score = Math.max(0, Number(n) || 0); render(); return PS[s].score; },
    setClock: (s, ms) => { clocks[s] = Math.max(0, Number(ms) || 0); render(); return clocks[s]; },
    tick: (ms) => { tickClock(Number(ms) || 0); return snap(); },
    menuPaused: (value) => { menuPaused = !!value; clockLast = Date.now(); return menuPaused; },
    start: () => { menuPaused = false; clockLast = Date.now(); },
    colors: () => ({ pieces: Object.assign({}, PALETTE.pieces), board: Object.assign({}, PALETTE.board), accent: PALETTE.accent, theme: document.body.style.background || 'auto' }),
    cosmetic: (slot, id) => { applyCosmetic(slot, id); return window.CheckersTest.colors(); },
    cosmeticList: () => (window.Meta && Meta.getCosmetics ? Meta.getCosmetics('checkers') : []).map((item) => ({ id: item.id, slot: item.slot })),
    achievements: () => (Save.load('checkers').achievements || []).slice(),
    stats: () => Save.load('checkers').stats || {},
    modalOpen: () => { const d = document.getElementById('bk-dlg'); return !!(d && d.open); },
    closeModal: () => { const d = document.getElementById('bk-dlg'); if (d && d.open) d.close(); },
  };
}
</script>
<script src="../../kits/menu-bootstrap.js"></script>
