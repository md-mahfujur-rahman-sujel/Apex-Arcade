<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match</title>
<style>
  .mm { display: grid; grid-template-columns: auto minmax(240px, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .mm { grid-template-columns: 1fr; } }
  #bd { width: var(--s); display: grid; gap: 10px; user-select: none; touch-action: manipulation; }
  .mc { aspect-ratio: 1; perspective: 700px; cursor: pointer; border-radius: 14px; }
  .mc .in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .35s; }
  .mc.up .in { transform: rotateY(180deg); }
  .mc .f, .mc .b { position: absolute; inset: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--line); }
  .mc .f { background: linear-gradient(135deg, #1e2a52, #2a1646); color: rgba(255,255,255,.35); font-weight: 800; box-shadow: inset 0 0 0 4px rgba(255,255,255,.04); }
  .mc:hover .f { border-color: rgba(255,255,255,.35); }
  .mc .b { background: var(--panel); transform: rotateY(180deg); }
  .mc.ok .b { background: rgba(16,185,129,.2); border-color: var(--emerald); }
  .mc.ok .in { animation: hop .4s ease-out; }
  @keyframes hop { 50% { transform: rotateY(180deg) scale(1.08); } }
  .mc.foc { outline: 3px solid var(--cyan); outline-offset: 2px; }
  .side { display: grid; gap: 12px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stats div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--muted); }
  .stats b { display: block; font-size: 24px; color: var(--text); }
  .stats .on { border-color: var(--cyan); }
  .capt { color: var(--muted); line-height: 1.7; font-size: 13px; }
</style>
<script src="../../kits/music-kit.js"></script><script src="../../kits/menu-kit.js"></script>
</head>
<body>

<script src="../../kits/perf-kit.js"></script>
<script src="../../kits/save-kit.js"></script>
<script src="../../kits/meta-config.js"></script>
<script src="../../kits/meta-kit.js"></script>
<script src="../../kits/board-kit.js"></script>
<script src="../../kits/score-bridge.js"></script>
<script src="../../kits/ui-kit.js"></script>
<script>
const ui = Board.shell({
  id: 'memory-match', title: 'Memory Match', subtitle: 'Flip cards, find the pairs and beat your best time',
  rules: 'All the cards start face down. Flip two cards per turn: if the pictures match, the pair stays face up; if not, they flip back, so remember where they were. Find every pair to finish. In solo mode the clock starts on your first flip and your best time for each size is saved. In two-player mode a match scores a point and earns another turn; a miss passes the turn. Most pairs wins.',
  controls: [['Click / tap', 'Flip a card'], ['← ↑ → ↓', 'Move the highlight'], ['Space / Enter', 'Flip the highlighted card'], ['N', 'New game'], ['H / M', 'Toggle help / mute']],
});
ui.main.innerHTML = `
<div class="mm">
  <div id="bd"></div>
  <div class="side">
    <div class="bk-status" id="st"></div>
    <div class="stats" id="stats"></div>
    <div class="bk-row">
      <label>Mode <select class="bk-select" id="mode"><option value="solo">Solo — beat the clock</option><option value="two">Two players</option></select></label>
      <label>Size <select class="bk-select" id="size"><option value="12">Easy · 12 cards</option><option value="16" selected>Medium · 16 cards</option><option value="24">Hard · 24 cards</option><option value="36">Expert · 36 cards</option></select></label>
    </div>
    <div class="bk-row"><button class="bk-btn bk-primary" id="new">New game</button></div>
    <div class="capt" id="cp"></div>
  </div>
</div>`;
const $ = (s) => ui.main.querySelector(s);
const SIZES = { 12: { cols: 4, pairs: 6 }, 16: { cols: 4, pairs: 8 }, 24: { cols: 6, pairs: 12 }, 36: { cols: 6, pairs: 18 } };
const EM = ['🦊', '🐙', '🌵', '🍄', '🚀', '🎈', '🦋', '🍉', '⚡', '🎲', '🐳', '🌙', '🍕', '🎸', '🔔', '🍀', '🦉', '🧩'];
const fmt = (ms) => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const bd = $('#bd');
let deck, S, up, matched, lock, moves, found, t0, elapsed, timer, player, scores, mode, foc, done, msg, gen = 0, sizeKey;

function bestOf() { const v = Board.ls.get('apex:mm:' + sizeKey); if (!v) return null; const [t, m] = v.split('|').map(Number); return isNaN(t) ? null : { t, m }; }
function newGame() {
  Board.cancel(timer); gen++;
  mode = $('#mode').value; sizeKey = $('#size').value; S = SIZES[sizeKey];
  const faces = Board.shuffle(EM.slice()).slice(0, S.pairs);
  deck = Board.shuffle([...faces, ...faces]);
  up = []; matched = new Set(); lock = false; moves = 0; found = 0; t0 = 0; elapsed = 0; player = 0; scores = [0, 0]; foc = 0; done = false; msg = '';
  bd.style.setProperty('--s', `max(280px, min(100vw - 40px, ${S.cols === 4 ? 480 : 640}px))`);
  bd.style.gridTemplateColumns = `repeat(${S.cols}, 1fr)`;
  bd.style.fontSize = `calc(var(--s) / ${S.cols * 2.4})`;
  bd.innerHTML = deck.map((e, i) => `<div class="mc" data-i="${i}"><div class="in"><div class="f">?</div><div class="b">${e}</div></div></div>`).join('');
  paint();
}
function paint() {
  [...bd.children].forEach((d, i) => {
    d.classList.toggle('up', up.includes(i) || matched.has(i));
    d.classList.toggle('ok', matched.has(i));
    d.classList.toggle('foc', i === foc && !done);
  });
  paintStats();
}
function paintStats() {
  const best = bestOf();
  if (mode === 'solo') {
    $('#stats').innerHTML = `<div>Time<b>${fmt(elapsed)}</b></div><div>Moves<b>${moves}</b></div><div>Pairs<b>${found} / ${S.pairs}</b></div><div>Best<b>${best ? fmt(best.t) : '—'}</b></div>`;
    $('#st').innerHTML = done ? msg : t0 ? 'Find every pair' : 'Flip a card to start the clock';
  } else {
    $('#stats').innerHTML = `<div class="${player === 0 && !done ? 'on' : ''}">Player 1<b>${scores[0]}</b></div><div class="${player === 1 && !done ? 'on' : ''}">Player 2<b>${scores[1]}</b></div><div>Pairs<b>${found} / ${S.pairs}</b></div><div>Moves<b>${moves}</b></div>`;
    $('#st').innerHTML = done ? msg : `Player ${player + 1}'s turn`;
  }
  $('#cp').innerHTML = best && mode === 'solo' ? `Your best for ${S.pairs * 2} cards: <b>${fmt(best.t)}</b> in <b>${best.m}</b> moves.` : '';
}
function flip(i) {
  if (lock || done || up.includes(i) || matched.has(i)) return;
  if (mode === 'solo' && !t0) { t0 = Board.now(); timer = Board.every(250, () => { elapsed = Board.now() - t0; paintStats(); }); }
  up.push(i); Board.sfx('click'); paint();
  if (up.length === 2) {
    moves++; const [a, b] = up, g = gen; lock = true;
    if (deck[a] === deck[b]) {
      Board.after(420, () => {
        if (g !== gen) return;
        matched.add(a); matched.add(b); up = []; found++; if (mode === 'two') scores[player]++;
        lock = false; Board.sfx('check'); paint(); if (found === S.pairs) finish();
      });
    } else {
      Board.after(950, () => { if (g !== gen) return; up = []; lock = false; if (mode === 'two') player = 1 - player; paint(); });
    }
  }
  paintStats();
}
function finish() {
  Board.cancel(timer); done = true; let title, body;
  if (mode === 'solo') {
    elapsed = Board.now() - t0; const best = bestOf(); const rec = !best || elapsed < best.t;
    if (rec) Board.ls.set('apex:mm:' + sizeKey, elapsed + '|' + moves);
    title = rec ? 'New best time!' : 'All pairs found!'; body = `Time ${fmt(elapsed)} in ${moves} moves.` + (rec ? '' : ` Your best is ${fmt(best.t)}.`);
    msg = title + ' ' + fmt(elapsed);
  } else {
    const [a, b] = scores; title = a === b ? 'Draw' : (a > b ? 'Player 1' : 'Player 2') + ' wins!'; body = `Player 1: ${a} pairs · Player 2: ${b} pairs`; msg = title + ' ' + a + '–' + b;
  }
  Board.sfx('win'); paint();
  Board.after(600, () => Board.modal(title, body, [['New game', newGame], ['Close']]));
}
bd.addEventListener('click', (e) => { const d = e.target.closest('.mc'); if (d) { foc = +d.dataset.i; flip(foc); } });
$('#new').onclick = newGame; $('#mode').onchange = newGame; $('#size').onchange = newGame;
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, n = deck.length;
  if (k === 'n' || k === 'N') newGame();
  else if (k === 'ArrowLeft') { foc = (foc + n - 1) % n; paint(); e.preventDefault(); }
  else if (k === 'ArrowRight') { foc = (foc + 1) % n; paint(); e.preventDefault(); }
  else if (k === 'ArrowUp') { foc = foc - S.cols >= 0 ? foc - S.cols : foc + n - S.cols; paint(); e.preventDefault(); }
  else if (k === 'ArrowDown') { foc = foc + S.cols < n ? foc + S.cols : foc % S.cols; paint(); e.preventDefault(); }
  else if (k === ' ' || k === 'Enter') { flip(foc); e.preventDefault(); }
});
newGame();
</script>
<script src="../../kits/menu-bootstrap.js"></script>
</body>
</html>
