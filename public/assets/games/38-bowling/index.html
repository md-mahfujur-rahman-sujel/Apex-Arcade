<body>

<script src="../../kits/perf-kit.js"></script>
<script src="../../kits/save-kit.js"></script>
<script src="../../kits/meta-config.js"></script>
<script src="../../kits/meta-kit.js"></script>
<script src="../../kits/arcade-core.js"></script>
<script src="../../kits/score-bridge.js"></script>
<script src="../../kits/ui-kit.js"></script>

<script>
/* Bowling — neon-trimmed night alley, lacquered wood lane with moving sheen and light pool behind the pins,
   glossy rotating ball with smoke trail, shaded pins that spin and tumble, animated aim chevrons, glowing meters,
   neon scoreboard and a strike/spare flash with confetti. Physics and scoring keep their original shape. */
(function () {
  const A = Arcade, W = 800, H = 480, LX0 = 490, LX1 = 670, CX = 580, BR = 11, PR = 8, BY = 425, GAME_ID = 'bowling';
  const MODE = {
    classic: { mult: 1, clock: 0, hook: 1, guide: true, series: 1 },
    blitz: { mult: 1.2, clock: 720, hook: 1, guide: true, series: 1 },
    spares: { mult: 1.15, clock: 0, hook: 1, guide: true, series: 1 },
    series: { mult: 1.25, clock: 0, hook: 1, guide: true, series: 3 },
    master: { mult: 1.6, clock: 0, hook: 1.9, guide: false, series: 1 },
  };
  const ACHIEVEMENTS = [
    { id: 'first-strike', name: 'First Strike', desc: 'Knock down a full rack with one ball.', rarity: 'common' },
    { id: 'double', name: 'Double', desc: 'Throw two strikes in a row.', rarity: 'common' },
    { id: 'turkey', name: 'Turkey', desc: 'Throw three strikes in a row.', rarity: 'rare' },
    { id: 'spare-artist', name: 'Spare Artist', desc: 'Convert a spare in a standard game.', rarity: 'common' },
    { id: 'clean-sheet', name: 'Clean Sheet', desc: 'Finish a game without an open frame.', rarity: 'epic' },
    { id: 'league-regular', name: 'League Regular', desc: 'Score 150 in one session.', rarity: 'common' },
    { id: 'century-club', name: 'Century Club', desc: 'Score 200 in one session.', rarity: 'rare' },
    { id: 'perfect-game', name: 'Perfect Game', desc: 'Throw twelve strikes for 300.', rarity: 'legendary' },
    { id: 'speed-demon', name: 'Speed Demon', desc: 'Finish a Speed Lanes session.', rarity: 'rare' },
    { id: 'spare-master', name: 'Spare Master', desc: 'Clear eight leaves in Spare Practice.', rarity: 'epic' },
    { id: 'series-champ', name: 'Series Champ', desc: 'Finish a Triple Header.', rarity: 'epic' },
    { id: 'pro-oil', name: 'Pro Oil', desc: 'Finish a Pro Oil session.', rarity: 'legendary' },
  ];

  /* ---------- cosmetics ---------- */
  const BALLS = {
    'ball-cyan': { hi: '#a5f3fc', main: '#06b6d4', rim: '#0b3d52', glow: '34,211,238' },
    'ball-ember': { hi: '#fed7aa', main: '#f97316', rim: '#431407', glow: '251,146,60' },
    'ball-jade': { hi: '#bbf7d0', main: '#22c55e', rim: '#052e16', glow: '74,222,128' },
    'ball-mono': { hi: '#f8fafc', main: '#94a3b8', rim: '#0f172a', glow: '148,163,184' },
    'ball-ruby': { hi: '#fecdd3', main: '#e11d48', rim: '#4c0519', glow: '251,113,133' },
  };
  const LANES = {
    'lane-classic': { wood: ['#b9843f', '#e4b878', '#b9843f'], grain: 'rgba(90,55,20,.32)', speck: 'rgba(90,55,20,.14)', sheen: 0.14 },
    'lane-maple': { wood: ['#cfa163', '#f2d2a0', '#cfa163'], grain: 'rgba(110,70,25,.28)', speck: 'rgba(110,70,25,.13)', sheen: 0.16 },
    'lane-ash': { wood: ['#8a8378', '#c9c1b3', '#8a8378'], grain: 'rgba(60,55,48,.3)', speck: 'rgba(60,55,48,.13)', sheen: 0.12 },
    'lane-midnight': { wood: ['#2e4a63', '#4f7a99', '#2e4a63'], grain: 'rgba(10,25,40,.42)', speck: 'rgba(10,25,40,.2)', sheen: 0.2 },
  };
  const TRIMS = {
    'trim-cyan': ['244,114,182', '34,211,238'],
    'trim-amber': ['251,191,36', '251,113,133'],
    'trim-rose': ['244,114,182', '251,113,133'],
    'trim-lime': ['163,230,53', '34,211,238'],
  };
  const ALLEYS = {
    'alley-night': { bg: ['#060811', '#0d1324', '#070914'], wall: '#0a0d17', lamp: 'rgba(255,230,170,.35)' },
    'alley-neon': { bg: ['#0b0614', '#171033', '#08040f'], wall: '#120a24', lamp: 'rgba(232,160,255,.32)' },
    'alley-sunset': { bg: ['#120a08', '#241226', '#0b0508'], wall: '#1a0d12', lamp: 'rgba(255,180,120,.4)' },
  };
  const look = { ball: BALLS['ball-cyan'], lane: 'lane-classic', trim: 'trim-cyan', theme: 'alley-night' };
  const cosmeticKey = (id) => String(id || '').split(':').pop();
  function applyCosmetic(slot, id) {
    const key = cosmeticKey(id);
    if (slot === 'skin' && BALLS[key]) look.ball = BALLS[key];
    else if (slot === 'palette' && LANES[key]) look.lane = key;
    else if (slot === 'effect' && TRIMS[key]) look.trim = key;
    else if (slot === 'theme' && ALLEYS[key]) look.theme = key;
  }

  /* ---------- records ---------- */
  function saved() { return (window.Save && Save.load(GAME_ID)) || {}; }
  function stats() { const s = saved(); return s.stats || {}; }
  function award(id, label) {
    const s = saved(), earned = Array.isArray(s.achievements) ? s.achievements : [];
    if (earned.includes(id) || !window.Save) return;
    Save.update(GAME_ID, { achievements: [id] });
    if (A.sfx) A.sfx('blip');
    if (window.UI && UI.toast) UI.toast(label || id.replace(/-/g, ' '), { color: '#34d399' });
  }

  let G, pins, ball, phase, px, ang, pow, rolls, frame, rif, timer, msg, msgT, steer, lockT, ptrX = null, inited = false, rollT;
  let rollTrail = [], flashB = 0, flashCol = '255,255,255';
  let activeMode = 'classic', lastInitMode = '', guideOn = true, clockLeft = 0;
  let gameNo = 0, seriesBase = 0, seriesScores = [], frameMarks = [];
  let runStrikes = 0, runSpares = 0, runGutters = 0, runPins = 0, gameOpen = 0, gameFrames = 0, strikeChain = 0, maxChain = 0, runEnded = false;
  let spareFrames = [], spareTotal = 0;
  const mode = () => MODE[activeMode] || MODE.classic;
  const guideVisible = () => mode().guide && guideOn;
  const say = (t, f) => { msg = t; msgT = f || 150; };
  const standing = () => pins.filter((p) => !p.down).length;

  const RACK = [];
  for (let r = 0; r < 4; r++) for (let i = 0; i <= r; i++) RACK.push({ x: CX + (i - r / 2) * 28, y: 130 - r * 24 });
  const LEAVES = [
    [1, 2, 3, 5, 6, 8, 9], [1, 3, 4, 6, 7, 9, 10], [2, 3, 5, 6, 8, 9, 10], [1, 2, 4, 5, 7, 8, 10],
    [2, 4, 6, 8, 9, 10, 3], [1, 2, 3, 4, 7, 8, 10], [1, 3, 5, 7, 8, 9, 10], [2, 3, 4, 5, 6, 8, 9],
    [1, 2, 5, 6, 8, 9, 10], [1, 3, 4, 6, 8, 9, 10],
  ];
  const mkPin = (n) => { const p = RACK[n - 1]; return { n, x: p.x, y: p.y, hx: p.x, hy: p.y, vx: 0, vy: 0, down: false, gone: false, fade: 1, rot: 0 }; };
  function rack() { pins = RACK.map((p, i) => mkPin(i + 1)); }
  function rackLeave() { pins = LEAVES[frame % LEAVES.length].map(mkPin); }

  function init(g) {
    G = g; gameNo = 0; seriesBase = 0; seriesScores = []; frameMarks = [];
    runStrikes = 0; runSpares = 0; runGutters = 0; runPins = 0; gameOpen = 0; gameFrames = 0; strikeChain = 0; maxChain = 0; runEnded = false;
    spareFrames = []; spareTotal = 0;
    rolls = []; frame = 0; rif = 0; ball = null; phase = 'pos'; px = CX; ang = 0; pow = 0; timer = 0; msg = ''; msgT = 0; steer = 0; lockT = 0; rollT = 0; rollTrail = []; flashB = 0;
    clockLeft = mode().clock || 0;
    if (activeMode === 'spares') rackLeave(); else rack();
    lastInitMode = activeMode;
    if (!inited) { inited = true; bind(); }
  }
  const pt = (e) => { const r = G.canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  function bind() {
    G.canvas.addEventListener('pointermove', (e) => { ptrX = pt(e).x; });
    G.canvas.addEventListener('pointerdown', (e) => { if (G.state !== 'playing') return; ptrX = pt(e).x; if (phase === 'pos') px = A.clamp(ptrX, LX0 + 14, LX1 - 14); action(); });
  }
  function action() {
    if (lockT > 0) return;
    if (phase === 'pos') { phase = 'aim'; timer = 0; lockT = 8; A.sfx('select'); }
    else if (phase === 'aim') { phase = 'power'; timer = 0; lockT = 8; A.sfx('select'); }
    else if (phase === 'power') { throwBall(); }
  }
  function forceThrow() {
    if (phase === 'pos') { ang = 0; pow = 0.55; }
    else if (phase === 'aim') { pow = 0.55; }
    else if (pow < 0.1) pow = 0.55;
    say('Time — thrown!', 50);
    throwBall();
  }
  function throwBall() {
    const sp = 5 + pow * 6.5; ball = { x: px, y: BY, vx: Math.sin(ang) * sp, vy: -Math.cos(ang) * sp, gutter: false, rot: 0 };
    phase = 'roll'; rollT = 0; steer = 0; rollTrail = []; A.sfx('shoot'); lockT = 10; G.popup(px, BY - 30, Math.round(pow * 100) + '%', '#fff', 14); pins.forEach((p) => (p.before = !p.down));
    G.burst(px, BY, 8, { color: ['#e0b274', '#fff'], speed: 2.4, life: 16, angle: -Math.PI / 2, spread: 0.8 });
  }
  function collide(a, b, ma, mb, mark) {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r; if (d >= min || d < 0.001) return false;
    const nx = dx / d, ny = dy / d, ov = min - d, tm = ma + mb;
    a.x -= nx * ov * (mb / tm); a.y -= ny * ov * (mb / tm); b.x += nx * ov * (ma / tm); b.y += ny * ov * (ma / tm);
    const rv = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (rv > 0) { const j = (1.7 * rv) / (1 / ma + 1 / mb); a.vx -= (j / ma) * nx; a.vy -= (j / ma) * ny; b.vx += (j / mb) * nx; b.vy += (j / mb) * ny; if (rv > 0.4) { mark(rv); } }
    return true;
  }
  function physics() {
    if (ball && !ball.gone) {
      if (!ball.gutter && (ball.x < LX0 - 2 || ball.x > LX1 + 2)) { ball.gutter = true; ball.x = ball.x < CX ? LX0 - 14 : LX1 + 14; ball.vx = 0; A.sfx('thud'); runGutters++; msg = 'Gutter ball'; msgT = 70; }
      if (!ball.gutter) { const s = A.axisX(); steer = A.clamp(steer + s * 0.012 * mode().hook, -0.45, 0.45); ball.vx += steer * 0.012 * (ball.y < 330 ? 1 : 0.4) * mode().hook; ball.vx = A.clamp(ball.vx, -4, 4); }
      ball.x += ball.vx; ball.y += ball.vy; ball.r = BR; ball.rot = (ball.rot || 0) + Math.hypot(ball.vx, ball.vy) * 0.09;
      if (ball.y < 24) ball.gone = true;
    }
    for (const p of pins) { p.r = PR; if (p.gone) continue; const psp = Math.hypot(p.vx, p.vy); if (psp > 5) { p.vx *= 5 / psp; p.vy *= 5 / psp; } p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; if (p.x < LX0 + PR) { p.x = LX0 + PR; p.vx = Math.abs(p.vx) * 0.4; } if (p.x > LX1 - PR) { p.x = LX1 - PR; p.vx = -Math.abs(p.vx) * 0.4; } if (p.y < 52) { p.y = 52; p.vy = Math.abs(p.vy) * 0.4; } p.rot += Math.hypot(p.vx, p.vy) * 0.22; if (p.y < 40 || p.y > 300) { p.gone = true; p.down = true; } if (Math.hypot(p.x - p.hx, p.y - p.hy) > 10 || p.x < LX0 - 2 || p.x > LX1 + 2) p.down = true; }
    if (ball && !ball.gone && !ball.gutter) for (const p of pins) if (!p.gone && collide(ball, p, 6, 1, () => { })) { p.down = true; A.sfx('hit'); G.burst(p.x, p.y, 7, { color: ['#fff', '#fde68a'], speed: 2.6, glow: true, life: 18 }); G.shake(1.5); }
    for (let i = 0; i < pins.length; i++) for (let j = i + 1; j < pins.length; j++) { const a = pins[i], b = pins[j]; if (a.gone || b.gone) continue; if (Math.hypot(a.vx, a.vy) < 0.15 && Math.hypot(b.vx, b.vy) < 0.15) continue; collide(a, b, 1, 1, () => { a.down = true; b.down = true; if (G.t % 3 === 0) A.sfx('tick'); }); }
  }
  function moving() { return (ball && !ball.gone) || pins.some((p) => !p.gone && Math.hypot(p.vx, p.vy) > 0.12); }
  function marks(rs) {
    const out = []; let stand = 10;
    rs.forEach((k) => { if (k === stand) { out.push(stand === 10 ? 'X' : '/'); stand = 10; } else { out.push(k === 0 ? '-' : String(k)); stand -= k; } });
    return out;
  }
  function frames() {
    const res = []; let i = 0;
    for (let f = 0; f < 10 && i < rolls.length; f++) {
      if (f < 9) {
        const a = rolls[i];
        if (a === 10) { res.push({ m: ['X'], pts: i + 2 < rolls.length ? 10 + rolls[i + 1] + rolls[i + 2] : null }); i += 1; }
        else if (i + 1 >= rolls.length) { res.push({ m: marks([a]), pts: null }); break; }
        else { const b = rolls[i + 1]; res.push({ m: marks([a, b]), pts: a + b === 10 ? (i + 2 < rolls.length ? 10 + rolls[i + 2] : null) : a + b }); i += 2; }
      } else {
        const r = rolls.slice(i), done = r.length === 3 || (r.length === 2 && r[0] !== 10 && r[0] + r[1] < 10);
        res.push({ m: marks(r), pts: done ? r.reduce((s, v) => s + v, 0) : null });
      }
    }
    return res;
  }
  function total() { let t = 0; for (const f of frames()) { if (f.pts == null) break; t += f.pts; } return t; }
  function rawScore() { return activeMode === 'spares' ? spareTotal : seriesBase + total(); }
  function pushScore() {
    G.score = Math.round(rawScore() * mode().mult);
    if (G.score > G.hi) {
      G.hi = G.score;
      if (window.Save && Save.update) Save.update(GAME_ID, { stats: { bestScore: G.hi } });
    }
  }

  function afterRoll() {
    const before = pins.filter((p) => p.before).length;
    const k = Math.max(0, before - standing());
    runPins += k;
    let reset = false, fin = false, struck = false, spared = false;
    let text = k === 0 ? 'Miss' : k + ' pin' + (k > 1 ? 's' : '');

    if (activeMode === 'spares') {
      const cleared = standing() === 0;
      spareFrames.push({ k, of: before, cleared });
      spareTotal += k + (cleared ? 30 : 0);
      gameFrames++;
      if (cleared) { runSpares++; text = 'CLEAN!'; award('spare-artist', 'Spare Artist'); }
      else { gameOpen++; text = k + '/' + before; }
      frame++; reset = frame < 10; fin = frame >= 10;
    } else {
      rolls.push(k);
      if (frame < 9) {
        if (rif === 0) {
          if (k === 10) { text = 'STRIKE!'; struck = true; reset = true; frame++; gameFrames++; }
          else rif = 1;
        } else {
          if (standing() === 0) { text = 'SPARE!'; spared = true; } else gameOpen++;
          reset = true; frame++; rif = 0; gameFrames++;
        }
      } else {
        const r = rolls.slice(rolls.length - (rif + 1));
        if (rif === 0) {
          rif = 1;
          if (k === 10) { text = 'STRIKE!'; struck = true; reset = true; }
        } else if (rif === 1) {
          if (r[0] === 10) { rif = 2; if (k === 10) { text = 'STRIKE!'; struck = true; reset = true; } }
          else if (r[0] + k === 10) { text = 'SPARE!'; spared = true; reset = true; rif = 2; }
          else { fin = true; gameOpen++; }
        } else { fin = true; if (k === 10) { text = 'STRIKE!'; struck = true; } else gameOpen++; }
        if (fin) gameFrames++;
      }
    }
    if (struck) {
      runStrikes++; strikeChain++; if (strikeChain > maxChain) maxChain = strikeChain;
      award('first-strike', 'First Strike');
      if (strikeChain >= 2) award('double', 'Double');
      if (strikeChain >= 3) award('turkey', 'Turkey');
    } else {
      strikeChain = 0;
      if (spared) runSpares++;
    }
    if (/STRIKE|SPARE|CLEAN/.test(text)) {
      A.sfx('clear'); G.burst(CX, 150, 36, { color: ['#06b6d4', '#facc15', '#fff'], speed: 5, glow: true });
      G.burst(CX, 120, 40, { color: ['#22d3ee', '#fbbf24', '#f472b6', '#a3e635', '#fff'], speed: 6, shape: 's', size: 4, life: 60, grav: 0.1 });
      G.ring(CX, 120, /STRIKE/.test(text) ? '#fbbf24' : '#22d3ee', 120, 30);
      flashB = /STRIKE/.test(text) ? 1 : 0.6; flashCol = /STRIKE/.test(text) ? '251,191,36' : '34,211,238';
    }
    msg = text; msgT = 90; phase = 'between'; timer = 0; G.shake(/STRIKE|CLEAN/.test(text) ? 5 : 0);
    window.__bowlNext = { reset, fin };
    pushScore();
  }
  function archiveGame() {
    const t = total();
    seriesScores.push(t); seriesBase += t; gameNo++;
    rolls = []; frame = 0; rif = 0; frameMarks = []; gameOpen = 0; gameFrames = 0; strikeChain = 0;
    rack(); ball = null; phase = 'pos'; ang = 0; pow = 0; px = A.clamp(px, LX0 + 14, LX1 - 14); clockLeft = mode().clock || 0;
    say('Game ' + gameNo + ' down — ' + seriesBase + ' pins', 140);
    pushScore();
  }
  function nextTurn() {
    const n = window.__bowlNext || {}; ball = null;
    if (n.fin) {
      if (mode().series > 1 && seriesScores.length < mode().series - 1) { archiveGame(); return; }
      finishGame(); return;
    }
    if (activeMode === 'spares') rackLeave();
    else if (n.reset) rack();
    else pins = pins.filter((p) => !p.gone).map((p) => p), pins.forEach((p) => { p.vx = p.vy = 0; if (p.down) p.gone = true; else { p.hx = p.x; p.hy = p.y; } });
    phase = 'pos'; ang = 0; pow = 0; px = A.clamp(px, LX0 + 14, LX1 - 14); clockLeft = mode().clock || 0;
  }
  function recordGame() {
    const st = stats();
    const patch = {
      games: (st.games || 0) + (activeMode === 'series' ? 3 : 1),
      strikes: (st.strikes || 0) + runStrikes,
      spares: (st.spares || 0) + runSpares,
      gutters: (st.gutters || 0) + runGutters,
      pins: (st.pins || 0) + runPins,
      bestGame: Math.max(st.bestGame || 0, G.score),
      perfectGames: (st.perfectGames || 0) + (activeMode === 'classic' && total() === 300 ? 1 : 0),
    };
    patch[activeMode + 'Runs'] = (st[activeMode + 'Runs'] || 0) + 1;
    Save.update(GAME_ID, { stats: patch });
  }
  function finishGame() {
    if (runEnded) return;
    runEnded = true;
    const t = total(), final = Math.round(rawScore() * mode().mult);
    if (activeMode === 'classic' && t === 300) award('perfect-game', 'Perfect Game');
    if (final >= 150) award('league-regular', 'League Regular');
    if (final >= 200) award('century-club', 'Century Club');
    if (activeMode === 'blitz') award('speed-demon', 'Speed Demon');
    if (activeMode === 'series') award('series-champ', 'Series Champ');
    if (activeMode === 'master') award('pro-oil', 'Pro Oil');
    if (activeMode === 'spares' && spareFrames.filter((f) => f.cleared).length >= 8) award('spare-master', 'Spare Master');
    if (activeMode !== 'spares' && gameFrames >= 10 && gameOpen === 0 && runGutters === 0) award('clean-sheet', 'Clean Sheet');
    recordGame();
    G.win('Game complete', 'Final score ' + final + (final >= 300 ? ' — perfect!' : final >= 200 ? ' — fantastic!' : final >= 150 ? ' — nice game' : ''));
  }

  function update(g) {
    if (g.state !== 'playing' || g.t < 6) return; if (lockT > 0) lockT--; if (msgT > 0) msgT--; timer++;
    Fx.update(1); flashB = Math.max(0, flashB - 0.03);
    if (ball && !ball.gone && phase === 'roll') { rollTrail.push({ x: ball.x, y: ball.y }); if (rollTrail.length > 16) rollTrail.shift(); } else if (rollTrail.length) rollTrail.shift();
    if ((phase === 'pos' || phase === 'aim' || phase === 'power') && mode().clock) {
      clockLeft--;
      if (clockLeft <= 0) { forceThrow(); return; }
    }
    if (phase === 'pos') { const s = A.axisX(); px = A.clamp(px + s * 3.2, LX0 + 14, LX1 - 14); if (A.hit('Space', 'Enter')) action(); }
    else if (phase === 'aim') { ang = Math.sin(timer * 0.055) * 0.32; if (A.hit('Space', 'Enter')) action(); }
    else if (phase === 'power') { pow = (1 - Math.cos(timer * 0.075)) / 2; if (A.hit('Space', 'Enter')) action(); }
    else if (phase === 'roll') { rollT++; physics(); if ((!moving() && rollT > 20) || rollT > 420) { pins.forEach((p) => { if (Math.hypot(p.x - p.hx, p.y - p.hy) > 4) p.down = true; }); afterRoll(); } }
    else if (phase === 'between') { physics(); if (timer > 90) nextTurn(); }
  }

  /* ---------- baked art ---------- */
  function alleySprite() {
    const room = ALLEYS[look.theme] || ALLEYS['alley-night'];
    const lane = LANES[look.lane] || LANES['lane-classic'];
    const trim = TRIMS[look.trim] || TRIMS['trim-cyan'];
    return Fx.bake('bw-alley-' + look.theme + '-' + look.lane + '-' + look.trim, W, H, (c) => {
      c.fillStyle = A.vgrad(c, 0, H, room.bg); c.fillRect(0, 0, W, H);
      // neon trim down both sides of the lane
      for (const [x, col] of [[LX0 - 34, trim[0]], [LX1 + 34, trim[1]]]) {
        const g = c.createLinearGradient(x - 18, 0, x + 18, 0); g.addColorStop(0, 'rgba(' + col + ',0)'); g.addColorStop(0.5, 'rgba(' + col + ',.5)'); g.addColorStop(1, 'rgba(' + col + ',0)');
        c.fillStyle = g; c.fillRect(x - 18, 50, 36, H - 50);
        c.fillStyle = 'rgb(' + col + ')'; c.fillRect(x - 1, 50, 2, H - 50);
      }
      // back wall with soft pin-deck light
