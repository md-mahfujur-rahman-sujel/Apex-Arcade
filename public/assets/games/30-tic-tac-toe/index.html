  if (window.Save && Save.update) Save.update(GAME_ID, { stats: { plays: (saved.stats.plays || 0) + 1, bestScore: Math.max(saved.stats.bestScore || 0, wins), ticTacToe: { x: score.x, o: score.o, draws, wins, losses, streak, bestStreak, rounds, lastResult: w ? w.p === humanSide ? 'win' : 'loss' : 'draw', lastMode: gameFormat } } });
  if (window.Apex && Apex.report) Apex.report({ gameId: GAME_ID, type: 'score', score: wins });

    if (!threatenedThisGame) announceAchievement('clean-sweep', 'Clean Sweep');

function cpu() {
  if (paused || over || human()) return; busy = true; render();

  Board.think(() => cpuMove(state, turn, activeLevel()), 850).then(async (m) => {
    if (g !== gen) return;
    if (paused) { busy = false; render(); return; }
    if (m < 0 || !cells[m]) { busy = false; render(); return; }
    cells[m].classList.add('pick'); await Board.sleep(Board.pace(450));   /* highlight the square it chose before marking it */

}
function showHint() {

  const state = { board: B.slice(), boardWins: boardWins.slice(), forcedBoard, format: gameFormat, size, need: target };

function winnerFromState() {
  if (!over) return null;
  const p = over[0].toLowerCase();
  return p === 'x' || p === 'o' ? { p, line: wl || [] } : null;
}
function undo() {
  if (busy || !hist.length) return; hintIndex = null;
  if (over) { const winnerState = winnerFromState(); if (winnerState) score[winnerState.p]--; else score.d--; }
  Board.sfx('undo'); hist.pop(); if (mode !== 'two' && hist.length && turn === mode) hist.pop();

function resumeMatch() { const dialog = document.getElementById('bk-dlg'); if (dialog?.open) dialog.close(); paused = false; Board.setPaused(false); $('#pause').textContent = 'Pause'; render(); if (!over && !human()) cpu(); }
function togglePause() {

  paused = true; Board.setPaused(true); $('#pause').textContent = 'Resume';
  if (!window.__apexTheaterEmbedded) Board.modal('Paused', 'Your match is safe. Resume when you are ready.', [['Resume', resumeMatch], ['New game', newGame]]);
  const dialog = document.getElementById('bk-dlg');

function go(i) { if (paused || over || busy || !human()) return; if (B[i] || gameFormat === 'ultimate' && forcedBoard != null && Math.floor(Math.floor(i / 9) / 3) * 3 + Math.floor((i % 9) / 3) !== forcedBoard) { Board.sfx('error'); return; } play(i); }

$('#stats').onclick = () => { const s = readSave().stats.ticTacToe || {}; Board.modal('Match statistics', `Matches: ${s.rounds || 0}<br>Wins: ${s.wins || 0} · Losses: ${s.losses || 0} · Draws: ${s.draws || 0}<br>Current streak: ${s.streak || 0} · Best streak: ${s.bestStreak || 0}<br>Achievements: ${(readSave().achievements || []).length}`, [['Close']]); };

document.addEventListener('keydown', (e) => {
  if (window.ApexMenuActive || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;

function ticTacToeMenuScene(c, frame) {
  const w = frame.width, h = frame.height, t = frame.time;
  const bg = c.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, '#111923'); bg.addColorStop(0.55, '#172630'); bg.addColorStop(1, '#0d1721');
  c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const glow = c.createRadialGradient(w * 0.76, h * 0.48, 0, w * 0.76, h * 0.48, Math.max(w, h) * 0.55);
  glow.addColorStop(0, 'rgba(103,232,249,.13)'); glow.addColorStop(1, 'rgba(17,25,35,0)'); c.fillStyle = glow; c.fillRect(0, 0, w, h);
  const paperW = Math.min(w * 0.42, h * 0.54), paperH = paperW, px = w * 0.72 - paperW / 2, py = h * 0.48 - paperH / 2;
  c.save(); c.translate(px + paperW / 2, py + paperH / 2); c.rotate(-0.035); c.translate(-paperW / 2, -paperH / 2);
  c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 25; c.shadowOffsetY = 12;
  c.fillStyle = '#e8dfc9'; c.fillRect(0, 0, paperW, paperH); c.shadowColor = 'transparent';
  c.strokeStyle = 'rgba(29,52,62,.19)'; c.lineWidth = 1;
  for (let y = 18; y < paperH; y += 22) { c.beginPath(); c.moveTo(0, y); c.lineTo(paperW, y); c.stroke(); }
  c.strokeStyle = 'rgba(29,52,62,.62)'; c.lineWidth = Math.max(2, paperW * 0.012);
  const pad = paperW * 0.15, cell = paperW * 0.23;
  for (let i = 1; i <= 2; i++) { const p = pad + cell * i; c.beginPath(); c.moveTo(p, pad); c.lineTo(p, paperW - pad); c.moveTo(pad, p); c.lineTo(paperW - pad, p); c.stroke(); }
  c.strokeStyle = '#13b8cf'; c.lineWidth = Math.max(3, paperW * 0.023); c.lineCap = 'round';
  c.beginPath(); c.moveTo(pad + 10, pad + 10); c.lineTo(pad + cell - 10, pad + cell - 10); c.moveTo(pad + cell - 10, pad + 10); c.lineTo(pad + 10, pad + cell - 10); c.stroke();
  c.strokeStyle = '#d99218'; c.beginPath(); c.arc(pad + cell * 1.5, pad + cell * 1.5, cell * 0.32 + Math.sin(t * 0.001) * 1.2, 0, Math.PI * 2); c.stroke();
  c.restore();
  // A small pencil rests outside the score sheet, away from menu labels.
  c.save(); c.translate(w * 0.93, h * 0.78); c.rotate(-0.58); c.fillStyle = '#e0b86d'; c.fillRect(-4, -h * 0.12, 8, h * 0.24); c.fillStyle = '#263844'; c.fillRect(-4, -h * 0.12, 8, 8); c.fillStyle = '#f3dfb5'; c.beginPath(); c.moveTo(-4, h * 0.12); c.lineTo(4, h * 0.12); c.lineTo(0, h * 0.145); c.closePath(); c.fill(); c.restore();
}

function menuSelect(id, value) {
  const control = document.getElementById(id);
  if (!control || control.value === value) return;
  control.value = value;
  control.dispatchEvent(new Event('change', { bubbles: true }));
}
function menuChoice(doc, label, controlId, value) {
  const button = doc.createElement('button'), control = document.getElementById(controlId);
  button.type = 'button'; button.className = 'apex-menu-control-button'; button.textContent = label;
  button.dataset.menuControl = controlId; button.dataset.menuValue = value;
  button.setAttribute('aria-pressed', String(!!control && control.value === value));
  button.addEventListener('click', function () {
    menuSelect(controlId, value);
    Array.from(button.parentNode.querySelectorAll('[data-menu-control="' + controlId + '"]')).forEach(function (choice) { choice.setAttribute('aria-pressed', String(choice === button)); });
  });
  return button;
}
