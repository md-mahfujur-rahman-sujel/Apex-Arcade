<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Table Tennis — Apex Arcade</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #070914; overflow-x: hidden; touch-action: manipulation; }
  .tt { display: grid; gap: 12px; width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 4px; }
  .stage { position: relative; line-height: 0; width: 100%; }
  #cv { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 16px; box-shadow: 0 24px 60px -24px #000, 0 0 0 1px rgba(255,255,255,.08); touch-action: none; cursor: none; background: #07102e; user-select: none; -webkit-user-select: none; }
  .hud { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: var(--muted); }
  .hud label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .hud input[type=checkbox] { accent-color: var(--cyan); width: 16px; height: 16px; }
  @media (max-width: 640px) {
    .hud { font-size: 12px; gap: 6px; }
    .bk-btn { padding: 6px 10px; font-size: 13px; min-height: 40px; }
    #cv { border-radius: 10px; }
  }
</style>
<script src="../../kits/music-kit.js"></script><script src="../../kits/menu-kit.js"></script>
</head>
<body>

<script src="../../kits/perf-kit.js"></script>
<script src="../../kits/save-kit.js"></script>
<script src="../../kits/meta-config.js"></script>
<script src="../../kits/meta-kit.js"></script>
<script src="../../kits/board-kit.js"></script>
<script src="../../kits/score-bridge.js"></script>
<script src="../../kits/ui-kit.js"></script>
<script>
const ui = Board.shell({
  id: 'table-tennis',
  title: 'Table Tennis',
  subtitle: 'First to 11 points, win by two — full arena tournament edition',
  rules: 'Real table-tennis rules seen from behind your end of the table. A serve must bounce on your side first, then on your opponent\u2019s side. After that every return must clear the net and bounce once on the other side. Let the ball bounce twice on your side, hit the net, or knock it off the table and you lose the point. The whole arena is yours to play in: move your paddle anywhere around you with mouse/touch, push it forward over the table to take the ball early, or pull it back to buy time on fast shots. Sweep the bat quickly for extra speed, or click / press Space just before contact for a power smash. The aim guide shows landing targets and interception circles.',
  controls: [
    ['Mouse / touch', 'Move paddle anywhere — follows your pointer smoothly'],
    ['Wheel · Q / E · slider', 'Reach: push the bat forward or pull it back'],
    ['Click / Space', 'Serve · swing for a power smash (short cooldown)'],
    ['W A S D / arrows', 'Move the bat (hold Shift for fine control)'],
    ['Enter', 'Player two: serve and swing (arrow keys move)'],
    ['G', 'Toggle the aim guide'],
    ['P', 'Pause'],
    ['N', 'New match'],
    ['H / M', 'Toggle help / mute']
  ],
});
ui.main.innerHTML = `<div class="tt">
  <div class="hud">
    <label>Opponent <select class="bk-select" id="mode"><option value="0">Computer · Easy</option><option value="1" selected>Computer · Medium</option><option value="2">Computer · Hard</option><option value="3">Two players</option></select></label>
    <label><input type="checkbox" id="guide" checked> Aim guide</label>
    <button class="bk-btn bk-primary" id="new">New match</button>
    <button class="bk-btn" id="pause">Pause</button>
  </div>
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="bk-status" id="st"></div>
</div>`;
const $ = (s) => ui.main.querySelector(s);
const cv = $('#cv'), cx = cv.getContext('2d');

/* ---------- world geometry (metres): x across, y up, z along table (0 player, L opponent) ---------- */
const W = 1280, H = 720;
// Safe DPR to prevent massive memory usage on 4K/Retina displays
const DPR = Math.min(1.25, Math.max(1, window.devicePixelRatio || 1));
cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
const L = 2.74, HW = .7625, NZ = L / 2, NH = .22, BR = .02, G = 7, REACH = .24, SV = 3.0, SVY = -1.2, FLOORY = -.42, FLOOR = -.76;
const ZMIN = -1.0, ZMAX = .55, ZDEF = 0, SERVEZ = -.1, XMAX = 1.7, YMIN = -.3, YMAX = 1.3, BZ_BACK = 5.6;
const CY = 1.9, CZ = -3.2, TH = .36, F = 1000, SCX = W / 2, SCY = 455, SN = Math.sin(TH), CS = Math.cos(TH);

const LV = [
  { spd: 1.8, react: .30, noise: .14, pw: .32 },
  { spd: 2.9, react: .18, noise: .06, pw: .55 },
  { spd: 4.4, react: .06, noise: .02, pw: .80 }
];

const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
let camX = 0;

// Reusable projection helper (avoids array allocations in hot path)
const _projOut = [0, 0, 0];
const pj = (x, y, z) => {
  const dy = y - CY, dz = z - CZ;
  const zc = Math.max(0.1, -dy * SN + dz * CS);
  const yc = dy * CS + dz * SN;
  const s = F / zc;
  _projOut[0] = SCX + (x - camX) * s;
  _projOut[1] = SCY - yc * s;
  _projOut[2] = s;
  return _projOut;
};

const _invOut = [0, 0];
const inv = (sx, sy, z) => {
  const dz = z - CZ, q = SCY - sy;
  const denom = F * CS + q * SN;
  if (Math.abs(denom) < 1e-4) { _invOut[0] = 0; _invOut[1] = 0; return _invOut; }
  const dy = dz * (q * CS - F * SN) / denom;
  const zc = Math.max(0.1, -dy * SN + dz * CS);
  _invOut[0] = camX + (sx - SCX) * zc / F;
  _invOut[1] = CY + dy;
  return _invOut;
};

// P2 helper returns direct coordinates without slicing
const P2x = (x, y, z) => pj(x, y, z)[0];
const P2y = (x, y, z) => pj(x, y, z)[1];

/* =========================================================================
   OBJECT POOLS: ZERO HEAP ALLOCATIONS DURING GAMEPLAY
   ========================================================================= */

// 1. Particle FX Pool (64 slots pre-allocated)
const FX_POOL_SIZE = 64;
const fxPool = Array.from({ length: FX_POOL_SIZE }, () => ({
  active: false,
  k: '',
  x: 0, y: 0, z: 0,
  t: 0, life: 0,
  p: 0,
  text: '', col: '', size: 0,
  sx: 0, sy: 0, vx: 0, vy: 0, rot: 0, vr: 0
}));

function spawnFX(initFn) {
  for (let i = 0; i < FX_POOL_SIZE; i++) {
    const f = fxPool[i];
    if (!f.active) {
      f.active = true;
      f.t = 0;
      initFn(f);
      return f;
    }
  }
  // If pool full, recycle oldest slot
  let oldest = fxPool[0];
  for (let i = 1; i < FX_POOL_SIZE; i++) {
    if (fxPool[i].t > oldest.t) oldest = fxPool[i];
  }
  oldest.active = true;
  oldest.t = 0;
  initFn(oldest);
  return oldest;
}

// 2. Trail Ring Buffer (16 fixed slots)
const TRAIL_MAX = 16;
const trailBuffer = Array.from({ length: TRAIL_MAX }, () => [0, 0, 0]);
let trailHead = 0, trailCount = 0;

function pushTrail(x, y, z) {
  const idx = (trailHead + trailCount) % TRAIL_MAX;
  const slot = trailBuffer[idx];
  slot[0] = x; slot[1] = y; slot[2] = z;
  if (trailCount < TRAIL_MAX) {
    trailCount++;
  } else {
    trailHead = (trailHead + 1) % TRAIL_MAX;
  }
}

function clearTrail() {
  trailHead = 0; trailCount = 0;
}

// 3. Bat Motion Velocity History (pre-allocated 6 slots per paddle)
const mkBat = (z) => ({
  x: 0, y: .25, z,
  vx: 0, vy: 0, vz: 0,
  sw: 0, swing: 0, cd: 0,
  h: Array.from({ length: 6 }, () => [0, 0, 0, 0]),
  hHead: 0,
  hCount: 0
});

function recordBatHistory(B, sx, sy, rot, R) {
  const idx = (B.hHead + B.hCount) % 6;
  const slot = B.h[idx];
  slot[0] = sx; slot[1] = sy; slot[2] = rot; slot[3] = R;
  if (B.hCount < 6) {
    B.hCount++;
  } else {
    B.hHead = (B.hHead + 1) % 6;
  }
}

// 4. Trajectory Prediction Scratchpad
const simBall = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 };

/* ---------- Sound (clean singleton synth, zero node leaks) ---------- */
let ac = null, nbuf = null;
function AC() {
  if (Board.muted()) return null;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { return null; }
  return ac;
}
function tone(f, d, type, v, slide, delay) {
  const a = AC(); if (!a) return;
  try {
    const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v || .08, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
function noise(d, v, f, type, delay) {
  const a = AC(); if (!a) return;
  try {
    if (!nbuf) {
      nbuf = a.createBuffer(1, Math.min(22050, a.sampleRate / 2), a.sampleRate);
      const q = nbuf.getChannelData(0);
      for (let i = 0; i < q.length; i++) q[i] = Math.random() * 2 - 1;
    }
    const t = a.currentTime + (delay || 0), s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
    s.buffer = nbuf; s.loop = true;
    fl.type = type || 'lowpass';
    fl.frequency.value = f || 1000;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(a.destination);
    s.start(t); s.stop(t + d + .02);
  } catch (e) {}
}
const snd = {
  hit(p) { noise(.04, .08 + p * .08, 2400 + p * 1200, 'highpass'); tone(1150 + p * 500, .04, 'triangle', .06 + p * .04, -500); },
  bounce(v) { tone(640, .04, 'sine', .03 + Math.min(.05, v * .015), -280); },
  net() { noise(.10, .08, 600, 'lowpass'); tone(180, .10, 'sine', .05, -60); },
  swing() { noise(.10, .04, 1800, 'bandpass'); },
  serve() { tone(420, .06, 'sine', .04, 260); },
  cheer() { noise(.7, .05, 900, 'bandpass'); },
  groan() { noise(.5, .04, 500, 'bandpass'); },
};

/* ---------- state ---------- */
let sc, srv, state, mode, ball, bats, hitter, need, idx, aiPred, aiDelay, timer, why, over, keys = {}, lastU = 9, shake = 0, paused = false, rally = 0, bestRally = 0, spd = 0, depthPref = ZDEF, ptr = null, ptrOn = false, guide = true, gd = { bounce: null, hit: null }, gdT = 0, hint = 9, banner = '', sliding = false, bounceV = 0, flash = 0;
const tgt = { x: 0, y: .25 };

// Parse URL difficulty param
try {
  const q = new URLSearchParams(window.location.search).get('diff');
  if (q === 'easy') $('#mode').value = '0';
  else if (q === 'hard') $('#mode').value = '2';
  else if (q === 'normal') $('#mode').value = '1';
} catch (e) {}

function newMatch() {
  mode = +$('#mode').value; sc = [0, 0]; srv = 0; over = false; paused = false; rally = 0; bestRally = 0; spd = 0; depthPref = ZDEF; ptrOn = false; hint = 9;
  for (let i = 0; i < FX_POOL_SIZE; i++) fxPool[i].active = false;
  clearTrail();
  bats = [mkBat(ZDEF), mkBat(L + .1)]; tgt.x = 0; tgt.y = .25; syncPause(); toServe();
}
function toServe() {
  state = 'serve'; timer = 0; hitter = null; need = []; idx = 0; aiPred = null; clearTrail(); why = '';
  gd.bounce = null; gd.hit = null;
  rally = 0; ball = { x: 0, y: .3, z: 0, vx: 0, vy: 0, vz: 0 };
  holdBall(); msg();
}
function holdBall() {
  const B = bats[srv];
  ball.x = clamp(B.x + (srv ? -.05 : .05), -HW + .06, HW - .06);
  ball.y = Math.max(B.y + .19, .16);
  ball.z = srv ? L - .05 : .05;
}
const names = () => (mode === 3 ? ['Player one', 'Player two'] : ['You', 'Computer']);
function msg() {
  const n = names(); let t;
  if (over) t = (sc[0] > sc[1] ? n[0] + ' win' + (mode === 3 ? 's' : '') + '!' : n[1] + ' wins!') + ' ' + sc[0] + '–' + sc[1];
  else if (state === 'serve') t = (srv === 0 || mode === 3) ? n[srv] + (mode === 3 ? ' serves — ' + (srv ? 'press Enter' : 'press Space or click') : ' serve — press Space or click') : 'Computer is serving…';
  else if (state === 'point') t = why; else t = 'Rally!';
  banner = t; $('#st').textContent = t;
}

/* ---------- physics: zero-alloc bitmask stepping ---------- */
// Bitmask: 1 = net, 2 = b0, 4 = b1, 8 = floor
function stepBallFast(b, dt) {
  let mask = 0;
  const pz = b.z;
  b.vy -= G * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  if ((pz < NZ) !== (b.z < NZ) && b.y < NH + BR && b.y > -.05 && Math.abs(b.x) < HW + .14) mask |= 1;
  const on = Math.abs(b.x) <= HW && b.z >= 0 && b.z <= L;
  if (b.vy < 0 && b.y <= BR && on) {
    bounceV = -b.vy; b.y = BR; b.vy = -b.vy * .88; b.vx *= .99; b.vz *= .99;
    mask |= (b.z < NZ ? 2 : 4);
  }
  if (b.y < FLOORY && !on) mask |= 8;
  return mask;
}

const _predOut = { x: 0, y: 0 };
function predict(side) {
  simBall.x = ball.x; simBall.y = ball.y; simBall.z = ball.z;
  simBall.vx = ball.vx; simBall.vy = ball.vy; simBall.vz = ball.vz;
  for (let i = 0; i < 280; i++) {
    const mask = stepBallFast(simBall, 1 / 100);
    if ((mask & 1) || (mask & 8)) return null;
    if (side ? simBall.z >= L : simBall.z <= 0) {
      _predOut.x = simBall.x;
      _predOut.y = Math.max(simBall.y, .06);
      return _predOut;
    }
  }
  return null;
}

function computeGuide() {
  gd.bounce = null; gd.hit = null;
  if (!guide || state !== 'rally' || hitter !== 1 || over) return;
  const bat = bats[0];
  simBall.x = ball.x; simBall.y = ball.y; simBall.z = ball.z;
  simBall.vx = ball.vx; simBall.vy = ball.vy; simBall.vz = ball.vz;
  let bounce = null, hit = null;
  for (let i = 0; i < 320; i++) {
    const mask = stepBallFast(simBall, 1 / 100);
    if ((mask & 1) || (mask & 8) || (mask & 4)) break;
    if (!bounce && (mask & 2)) bounce = { x: simBall.x, z: simBall.z };
    if (simBall.z <= bat.z && simBall.vz < 0) { hit = { x: simBall.x, y: simBall.y }; break; }
  }
  gd.bounce = bounce;
  gd.hit = hit;
}

function strike(side, bat, aim) {
  const b = ball, rel = clamp((b.x - bat.x) / REACH, -1, 1), dist = clamp(Math.hypot(b.x - bat.x, b.y - bat.y) / REACH, 0, 1), sp = Math.hypot(bat.vx, bat.vy, (bat.vz || 0) * .8);
  const boost = bat.swing > 0 ? .35 : 0, pw = aim.p != null ? aim.p : clamp(.32 + sp / 2.5 + boost, .3, 1), err = dist * dist * pw * .2 + (aim.noise || 0);
  let tx = aim.tx != null ? aim.tx : clamp(b.x * .35 + rel * .9 + bat.vx * .14, -.7, .7);
  tx += (Math.random() - .5) * 2 * err;
  const depth = lerp(.75, .3, pw) + (Math.random() - .5) * err * 1.2, tz = side ? depth : L - depth;
  let T = lerp(.8, .44, pw);
  for (let i = 0; i < 10; i++) {
    const vz = (tz - b.z) / T, vy = (BR - b.y + G * T * T / 2) / T, tn = (NZ - b.z) / vz;
    if (tn > 0 && tn < T) { if (b.y + vy * tn - G * tn * tn / 2 >= NH + BR + .04) break; } else break;
    T += .04;
  }
  b.vz = (tz - b.z) / T; b.vx = (tx - b.x) / T; b.vy = (BR - b.y + G * T * T / 2) / T;
  hitter = side; need = [1 - side]; idx = 0; lastU = 9; bat.sw = .18; rally++;
  if (rally > bestRally) bestRally = rally;
  spd = Math.hypot(b.vx, b.vy, b.vz) * 3.6;
  snd.hit(pw); shake = Math.min(1, pw * .8 + (bat.swing > 0 ? .25 : 0));

  spawnFX((f) => {
    f.k = 'hit'; f.x = b.x; f.y = b.y; f.z = b.z; f.life = .25; f.p = pw;
  });

  if (pw > .85 && (side === 0 || mode === 3)) {
    spawnFX((f) => {
      f.k = 'txt'; f.text = 'SMASH!'; f.x = b.x; f.y = b.y + .12; f.z = b.z; f.life = .8; f.col = '#fde047'; f.size = 28;
    });
  }
  aiPred = null;
  if (side === 0 && mode < 3) {
    const p = predict(1), lv = LV[mode];
    if (p) {
      aiPred = { x: p.x + (Math.random() - .5) * 2 * lv.noise, y: p.y + (Math.random() - .5) * lv.noise };
      aiDelay = lv.react;
    }
  }
}

function tryHit() {
  if (state !== 'rally') return;
  const r = 1 - hitter, bat = bats[r], zp = r ? L : bat.z, u = r ? zp - ball.z : ball.z - zp, vu = r ? -ball.vz : ball.vz;
  const crossed = (lastU > 0 && u <= 0) || (Math.abs(u) < 0.16 && vu < 0);
  lastU = u;
  if (idx < need.length || !crossed || vu >= 0) return;
  const hitReach = REACH * (bat.swing > 0 ? 1.4 : 1.15);
  if (Math.hypot(ball.x - bat.x, ball.y - bat.y) > hitReach) return;
  lastU = 9;
  const lv = LV[mode] || LV[1];
  strike(r, bat, r === 1 && mode < 3 ? { p: lv.pw, tx: clamp(-bats[0].x * .7 + (Math.random() - .5) * .5, -.6, .6), noise: lv.noise * .6 } : {});
}

function onEventMask(mask) {
  if (state !== 'rally') return;
  if (mask & 1) {
    snd.net(); shake = .5;
    spawnFX((f) => {
      f.k = 'txt'; f.text = 'NET'; f.x = ball.x; f.y = .3; f.z = NZ; f.life = .6; f.col = '#fca5a5'; f.size = 22;
    });
    return point(1 - hitter, 'Net!');
  }
  if (mask & 8) {
    return point(idx >= need.length ? hitter : 1 - hitter, idx >= need.length ? 'Missed!' : 'Out!');
  }
  const isB0 = (mask & 2) !== 0, isB1 = (mask & 4) !== 0;
  if (isB0 || isB1) {
    const side = isB0 ? 0 : 1;
    snd.bounce(bounceV);
    spawnFX((f) => {
      f.k = 'ring'; f.x = ball.x; f.z = ball.z; f.life = .35;
    });
    if (idx < need.length) {
      if (side === need[idx]) idx++; else point(1 - hitter, 'Bounced on the wrong side');
    } else {
      point(side === 1 - hitter ? hitter : 1 - hitter, side === 1 - hitter ? 'Double bounce!' : 'Wrong side');
    }
  }
}

function confetti() {
  const cols = ['#fde047', '#38bdf8', '#fb7185', '#4ade80', '#fff'];
  for (let i = 0; i < 30; i++) {
    spawnFX((f) => {
      f.k = 'conf';
      f.sx = 340 + Math.random() * 600;
      f.sy = -10 - Math.random() * 50;
      f.vx = (Math.random() - .5) * 140;
      f.vy = 110 + Math.random() * 180;
      f.rot = Math.random() * 6;
      f.vr = (Math.random() - .5) * 8;
      f.col = cols[i % 5];
      f.life = 1.8;
    });
  }
}

function point(w, reason) {
  if (state !== 'rally') return;
  const n = names(); sc[w]++; state = 'point'; timer = 1.3; flash = 1;
  why = (w === 0 ? n[0] : n[1]) + ' ' + (mode === 3 ? 'scores' : w === 0 ? 'score' : 'scores') + ' — ' + reason + (rally > 3 ? ' · rally of ' + rally : '');
  if (w === 0 || mode === 3) { Board.sfx('win'); snd.cheer(); confetti(); } else { Board.sfx('error'); snd.groan(); }
  const hi = Math.max(...sc);
  if (hi >= 11 && Math.abs(sc[0] - sc[1]) >= 2) {
    over = true; state = 'over'; msg(); Board.sfx(sc[0] > sc[1] || mode === 3 ? 'win' : 'lose');
    Board.after(700, () => Board.modal(sc[0] > sc[1] ? (mode === 3 ? 'Player one wins' : 'You win!') : (mode === 3 ? 'Player two wins' : 'Computer wins'), sc[0] + ' – ' + sc[1] + ' · longest rally ' + bestRally, [['New match', newMatch], ['Close']]));
    return;
  }
  const t = sc[0] + sc[1]; srv = (sc[0] >= 10 && sc[1] >= 10) ? t % 2 : (t >> 1) % 2; msg();
}

function serve() {
  const B = bats[srv], dir = srv ? -1 : 1;
  ball.x = clamp(B.x, -HW + .05, HW - .05); ball.y = .3; ball.z = srv ? L - .05 : .05;
  ball.vx = -ball.x * .5 + (srv && mode < 3 ? (Math.random() - .5) * .5 : 0) + (srv === 0 ? clamp(B.vx * .12, -.5, .5) : 0);
  ball.vy = SVY; ball.vz = dir * SV;
  hitter = srv; need = [srv, 1 - srv]; idx = 0; lastU = 9; state = 'rally'; B.sw = .18; rally = 0; snd.serve();
  aiPred = null;
  if (srv === 0 && mode < 3) {
    const p = predict(1), lv = LV[mode];
    if (p) { aiPred = { x: p.x + (Math.random() - .5) * 2 * lv.noise, y: p.y + (Math.random() - .5) * lv.noise }; aiDelay = lv.react; }
  }
  msg();
}

function swing(i) {
  const B = bats[i]; if (B.cd > 0 || over) return;
  B.swing = .24; B.cd = .45; B.sw = .2; snd.swing();
}

function act(who) {
  if (over || paused) return;
  if (state === 'serve') { if (mode === 3 ? srv === who : (srv === 0 && who === 0)) serve(); }
  else if (state === 'rally' || state === 'point') { if (who === 0 || mode === 3) swing(who); }
}

/* ---------- targets & update ---------- */
function clampTarget(t, z, serving) {
  t.x = clamp(t.x, -XMAX, XMAX); t.y = clamp(t.y, YMIN, YMAX);
  if (serving) { t.x = clamp(t.x, -HW, HW); t.y = clamp(t.y, 0, .6); }
  let p = pj(t.x, t.y, z);
  if (p[1] > H - 46) { t.y = inv(p[0], H - 46, z)[1]; p = pj(t.x, t.y, z); }
  if (p[1] < 40) { t.y = inv(p[0], 40, z)[1]; p = pj(t.x, t.y, z); }
  if (p[0] < 44) t.x = inv(44, p[1], z)[0]; else if (p[0] > W - 96) t.x = inv(W - 96, p[1], z)[0];
}

function update(dt) {
  hint = Math.max(0, hint - dt); flash = Math.max(0, flash - dt * 2.5);
  const kb = (k) => keys[k], B0 = bats[0], B1 = bats[1], o0 = [B0.x, B0.y, B0.z], o1 = [B1.x, B1.y, B1.z], serving = state === 'serve' && srv === 0;
  const spd1 = kb('shift') ? 1.4 : 3.8;
  const kx = ((kb('d') || (mode < 3 && kb('arrowright'))) ? 1 : 0) - ((kb('a') || (mode < 3 && kb('arrowleft'))) ? 1 : 0);
  const ky = ((kb('w') || (mode < 3 && kb('arrowup'))) ? 1 : 0) - ((kb('s') || (mode < 3 && kb('arrowdown'))) ? 1 : 0);
  if (kx || ky) { ptrOn = false; tgt.x += kx * spd1 * dt; tgt.y += ky * spd1 * dt; }
  const dk = ((kb('e') || kb('pageup')) ? 1 : 0) - ((kb('q') || kb('pagedown')) ? 1 : 0);
  depthPref = clamp(depthPref + dk * 1.4 * dt, ZMIN, ZMAX);
  B0.z += ((serving ? SERVEZ : depthPref) - B0.z) * Math.min(1, dt * 10);
  if (ptrOn && ptr) { const w = inv(ptr.x, ptr.y, B0.z); tgt.x = w[0]; tgt.y = w[1]; }
  clampTarget(tgt, B0.z, serving);
  B0.x += (tgt.x - B0.x) * Math.min(1, dt * 36);
  B0.y += (tgt.y - B0.y) * Math.min(1, dt * 36);

  if (mode === 3) {
    const sp2 = 3.6;
    if (kb('arrowleft')) B1.x -= sp2 * dt; if (kb('arrowright')) B1.x += sp2 * dt;
    if (kb('arrowup')) B1.y += sp2 * dt; if (kb('arrowdown')) B1.y -= sp2 * dt;
    B1.x = clamp(B1.x, -XMAX, XMAX); B1.y = clamp(B1.y, YMIN, 1.1);
  } else {
    const lv = LV[mode]; let tx = 0, ty = .28;
    if (aiPred && state === 'rally' && hitter === 0) {
      aiDelay -= dt; if (aiDelay <= 0) { tx = aiPred.x; ty = aiPred.y; }
    } else if (state === 'serve' && srv === 1) { tx = 0; ty = .28; }
    const m = lv.spd * dt;
    B1.x += clamp(tx - B1.x, -m, m);
    B1.y += clamp(ty - B1.y, -m * .8, m * .8);
  }
  for (const [B, o] of [[B0, o0], [B1, o1]]) {
    const d = Math.max(dt, 1e-3);
    B.vx = lerp(B.vx, (B.x - o[0]) / d, .5);
    B.vy = lerp(B.vy, (B.y - o[1]) / d, .5);
    B.vz = lerp(B.vz, (B.z - o[2]) / d, .5);
    B.sw = Math.max(0, B.sw - dt);
    B.swing = Math.max(0, B.swing - dt);
    B.cd = Math.max(0, B.cd - dt);
  }
  camX += (clamp(B0.x * .12, -.22, .22) - camX) * Math.min(1, dt * 3);
  shake = Math.max(0, shake - dt * 4);

  // FX decay (using object pool)
  for (let i = 0; i < FX_POOL_SIZE; i++) {
    const f = fxPool[i];
    if (f.active) {
      f.t += dt;
      if (f.k === 'conf') {
        f.sx += f.vx * dt; f.sy += f.vy * dt; f.vx *= .995; f.rot += f.vr * dt;
      }
      if (f.t > f.life) f.active = false;
    }
  }

  if (state === 'serve') {
    holdBall();
    if (srv === 1 && mode < 3) { timer += dt; if (timer > 1) serve(); }
    return;
  }
  if (state === 'point') {
    timer -= dt;
    if (timer <= 0 && !over) toServe();
  }
  if (state !== 'rally' && state !== 'point') return;

  // Fixed physics substepping
  const n = Math.ceil(dt * 180), h = dt / n;
  for (let i = 0; i < n; i++) {
    const mask = stepBallFast(ball, h);
    if (mask) onEventMask(mask);
    if (state === 'rally') tryHit();
    if (i % 3 === 0) {
      pushTrail(ball.x, ball.y, ball.z);
    }
  }
  if (state === 'point' && ball.y < -2) ball.vy = 0;
  if (--gdT <= 0) { gdT = 3; computeGuide(); }
}

/* ---------- pre-rendered lightweight arena background ---------- */
let bg = null;
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function mkBg() {
  const BW = W + 240;
  bg = document.createElement('canvas');
  bg.width = BW; bg.height = H;
  const x = bg.getContext('2d');
  x.translate(120, 0);

  let seed = 11;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  let g = x.createLinearGradient(0, 0, 0, 340);
  g.addColorStop(0, '#02061a'); g.addColorStop(.45, '#091848'); g.addColorStop(1, '#0c2560');
  x.fillStyle = g; x.fillRect(-120, 0, BW, H);

  // Soft crowd (no GPU blur filter to prevent memory explosion)
  const cols = ['#1e3a8a', '#9f1239', '#0f766e', '#e2e8f0', '#d97706', '#6d28d9', '#334155', '#be185d', '#0369a1', '#475569'];
  const skin = ['#f1c9a5', '#d9a47a', '#b98055', '#8d5a3a', '#f6d7bd'];
  for (let row = 0; row < 9; row++) {

      x.beginPath(); x.ellipse(jx, jy + r * 1.5, r * 1.2, r * 1.3, 0, 0, 7); x.fill();
      x.fillStyle = skin[(rnd() * skin.length) | 0];
      x.beginPath(); x.arc(jx, jy, r, 0, 7); x.fill();
    }
    x.fillStyle = 'rgba(2,6,23,.5)'; x.fillRect(-120, y + r * 2.4, BW, 3);
  }
  g = x.createLinearGradient(0, 140, 0, 320);
  g.addColorStop(0, 'rgba(3,8,30,.82)'); g.addColorStop(1, 'rgba(3,8,30,.15)');
  x.fillStyle = g; x.fillRect(-120, 140, BW, 190);

  // LED ribbon
  x.fillStyle = '#04123e'; x.fillRect(-120, 104, BW, 34);
  x.fillStyle = 'rgba(56,189,248,.8)'; x.fillRect(-120, 104, BW, 2); x.fillRect(-120, 136, BW, 2);
  x.font = '800 18px "Segoe UI",system-ui,sans-serif'; x.textBaseline = 'middle'; x.textAlign = 'left';
  for (let k = -1; k < 8; k++) {

    x.fillStyle = '#fbbf24'; x.fillText('◆', k * 230 + 140, 122);
    x.fillStyle = '#e2e8f0'; x.fillText('TABLE TENNIS', k * 230 + 160, 122);
    x.fillStyle = '#fb7185'; x.fillText('•', k * 230 + 100, 122);
  }
  // Ceiling lights
  x.globalCompositeOperation = 'lighter';
  for (let k = -1; k < 12; k++) {
    const lx = k * 120 + 40, lg = x.createRadialGradient(lx, 24, 1, lx, 24, 46);
    lg.addColorStop(0, 'rgba(190,225,255,.9)'); lg.addColorStop(.25, 'rgba(120,180,255,.3)'); lg.addColorStop(1, 'rgba(120,180,255,0)');
    x.fillStyle = lg; x.beginPath(); x.arc(lx, 24, 46, 0, 7); x.fill();
  }
  for (const [bx, dx] of [[300, 90], [520, 30], [760, -30], [980, -90]]) {
    const lg = x.createLinearGradient(bx, 20, bx + dx, 330);
    lg.addColorStop(0, 'rgba(140,200,255,.24)'); lg.addColorStop(1, 'rgba(140,200,255,0)');
    x.fillStyle = lg; x.beginPath(); x.moveTo(bx - 14, 20); x.lineTo(bx + 14, 20); x.lineTo(bx + dx + 130, 330); x.lineTo(bx + dx - 130, 330); x.fill();
  }
  x.globalCompositeOperation = 'source-over';
}

/* ---------- rendering helpers ---------- */
function polyFast(pts, fill, stroke, lw) {
  cx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (i === 0) cx.moveTo(p[0], p[1]); else cx.lineTo(p[0], p[1]);
  }
  cx.closePath();
  if (fill) { cx.fillStyle = fill; cx.fill(); }
  if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = lw; cx.stroke(); }
}

function line(x0, y0, x1, y1, col, w) {
  cx.strokeStyle = col; cx.lineWidth = w; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(x0, y0); cx.lineTo(x1, y1); cx.stroke();
}

function drawGuide() {
  if (!guide || state !== 'rally' || hitter !== 1 || over) return;
  const t = Board.now() / 1000;
  if (gd.bounce) {
    cx.beginPath();
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2, rr2 = .06 + .012 * Math.sin(t * 6);
      const px = P2x(gd.bounce.x + Math.cos(a) * rr2, 0, gd.bounce.z + Math.sin(a) * rr2);
      const py = P2y(gd.bounce.x + Math.cos(a) * rr2, 0, gd.bounce.z + Math.sin(a) * rr2);
      if (i === 0) cx.moveTo(px, py); else cx.lineTo(px, py);

    const B = bats[0], p = pj(gd.hit.x, gd.hit.y, B.z), near = Math.hypot(gd.hit.x - B.x, gd.hit.y - B.y) < REACH;

    cx.beginPath(); cx.moveTo(p[0] - 8, p[1]); cx.lineTo(p[0] + 8, p[1]); cx.moveTo(p[0], p[1] - 8); cx.lineTo(p[0], p[1] + 8); cx.stroke();
    cx.restore();
  }
}

function drawBallShadow() {
  const b = ball, on = Math.abs(b.x) <= HW && b.z >= 0 && b.z <= L, gy = on ? 0 : FLOOR;
  if (b.y < gy - .02) return;
  const hx = P2x(b.x, gy, b.z), hy = P2y(b.x, gy, b.z), hs = pj(b.x, gy, b.z)[2], k = 1 + (b.y - gy) * 2.2;
  cx.fillStyle = `rgba(0,10,40,${.4 / k})`;
  cx.beginPath(); cx.ellipse(hx, hy, .055 * hs * k * .8, .02 * hs * k * .8, 0, 0, 7); cx.fill();
  if (guide && state === 'rally') {
    const p = pj(b.x, b.y, b.z);
    line(p[0], p[1], hx, hy, 'rgba(255,255,255,.18)', 1.2);
  }
}

function drawBall(b, hold) {
  const [sx, sy, s] = pj(b.x, b.y, b.z), r = Math.max(4, .05 * s);
  if (!hold && trailCount > 0) {
    for (let k = 0; k < trailCount; k++) {
      const idx = (trailHead + k) % TRAIL_MAX;
      const t = trailBuffer[idx];
      const p = pj(t[0], t[1], t[2]);
      cx.fillStyle = `rgba(255,255,255,${(k / trailCount) * .22})`;
      cx.beginPath(); cx.arc(p[0], p[1], .04 * p[2] * (k / trailCount), 0, 7); cx.fill();
    }
  }
  const gl = cx.createRadialGradient(sx, sy, r * .5, sx, sy, r * 2.2);
  gl.addColorStop(0, 'rgba(255,255,255,.3)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  cx.fillStyle = gl; cx.beginPath(); cx.arc(sx, sy, r * 2.2, 0, 7); cx.fill();

  const g = cx.createRadialGradient(sx - r * .35, sy - r * .4, r * .1, sx, sy, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#d9dee8');
  cx.fillStyle = g; cx.beginPath(); cx.arc(sx, sy, r, 0, 7); cx.fill();
  cx.strokeStyle = 'rgba(10,20,50,.45)'; cx.lineWidth = Math.max(1, r * .12); cx.stroke();
}

function drawBat(B, mine) {
  const [sx, sy, s] = pj(B.x, B.y, B.z);
  const R = .15 * s;
  const rot = -.5 - clamp(B.vx, -3, 3) * .1 + (B.sw > 0 ? B.sw * 2.2 * (mine ? -1 : 1) : 0) - clamp(B.vz, -2, 2) * .05;
  const kick = 1 + (B.sw > 0 ? B.sw * .6 : 0);
  const hx = sx - Math.sin(rot) * R * 1.75, hy = sy + Math.cos(rot) * R * 1.75;
  recordBatHistory(B, sx, sy, rot, R);

  if (mine) {
    const dx = -Math.sin(rot), dy = Math.cos(rot), len = 600, w0 = R * .36, w1 = R * .8, nx = -dy, ny = dx;
    const ax = hx + dx * R * .1, ay = hy + dy * R * .1;
    polyFast([[ax + nx * w0, ay + ny * w0], [ax - nx * w0, ay - ny * w0], [ax + dx * len - nx * w1, ay + dy * len - ny * w1], [ax + dx * len + nx * w1, ay + dy * len + ny * w1]], '#1e293b');
    cx.fillStyle = '#334155'; cx.beginPath(); cx.ellipse(ax + dx * R * .75, ay + dy * R * .75, w0 * 1.05, R * .13, rot, 0, 7); cx.fill();
    cx.fillStyle = '#e9b896'; cx.beginPath(); cx.ellipse(hx + dx * R * .02, hy + dy * R * .02, R * .3, R * .26, rot, 0, 7); cx.fill();
  }

  cx.save(); cx.translate(sx, sy); cx.rotate(rot); cx.scale(kick, kick);
  cx.fillStyle = 'rgba(0,8,40,.22)'; cx.beginPath(); cx.ellipse(R * .12, R * .14, R, R, 0, 0, 7); cx.fill();

  // Wooden handle
  const hg = cx.createLinearGradient(-R * .2, 0, R * .2, 0);
  hg.addColorStop(0, '#f6c35a'); hg.addColorStop(1, '#c98a22');
  cx.fillStyle = hg;
  cx.beginPath();
  cx.moveTo(-R * .17, R * .7); cx.lineTo(R * .17, R * .7);
  cx.lineTo(R * .15, R * 1.75); cx.lineTo(-R * .15, R * 1.75);
  cx.closePath(); cx.fill();

  // Wood rim
  cx.fillStyle = '#d9a455'; cx.beginPath(); cx.arc(0, 0, R, 0, 7); cx.fill();

  // Rubber face
  const rb = mine ? ['#4a4f70', '#0a0b12'] : ['#fb7185', '#9f1239'];
  const rg = cx.createRadialGradient(-R * .3, -R * .35, R * .1, 0, 0, R);
  rg.addColorStop(0, rb[0]); rg.addColorStop(1, rb[1]);
  cx.fillStyle = rg; cx.beginPath(); cx.arc(0, 0, R * .93, 0, 7); cx.fill();

  // Specular sheen
  cx.fillStyle = 'rgba(255,255,255,.16)';
  cx.beginPath(); cx.ellipse(-R * .3, -R * .35, R * .4, R * .22, -.6, 0, 7); cx.fill();
  cx.fillStyle = mine ? 'rgba(244,63,94,.85)' : 'rgba(255,255,255,.55)';
  cx.beginPath(); cx.arc(0, R * .22, R * .13, 0, 7); cx.fill();
  cx.strokeStyle = 'rgba(0,0,0,.4)'; cx.lineWidth = Math.max(1.5, R * .04);
  cx.beginPath(); cx.arc(0, 0, R * .93, 0, 7); cx.stroke();

  if (mine && B.cd > 0) {
    cx.strokeStyle = 'rgba(253,224,71,.85)'; cx.lineWidth = Math.max(2, R * .08);
    cx.beginPath(); cx.arc(0, 0, R * 1.08, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - B.cd / .45)); cx.stroke();
  }
  cx.restore();
}

function drawFX() {
  for (let i = 0; i < FX_POOL_SIZE; i++) {
    const f = fxPool[i];
    if (!f.active) continue;
    const k = f.t / f.life;
    if (f.k === 'hit') {
      const p = pj(f.x, f.y, f.z);
      cx.save(); cx.translate(p[0], p[1]); cx.globalAlpha = 1 - k; cx.strokeStyle = '#fff'; cx.lineWidth = 2.5;
      const n = 8, r0 = 8 + k * 24 * (.7 + f.p), r1 = r0 + 10 + f.p * 12;
      for (let j = 0; j < n; j++) {
        const a = j / n * Math.PI * 2 + .3;
        cx.beginPath(); cx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); cx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); cx.stroke();
      }
      cx.restore();
    } else if (f.k === 'ring') {
      cx.save(); cx.globalAlpha = (1 - k) * .8;
      cx.beginPath();
      const rad = .03 + k * .12;
      for (let j = 0; j < 16; j++) {
        const a = j / 16 * Math.PI * 2;
        const px = P2x(f.x + Math.cos(a) * rad, 0, f.z + Math.sin(a) * rad);
        const py = P2y(f.x + Math.cos(a) * rad, 0, f.z + Math.sin(a) * rad);
        if (j === 0) cx.moveTo(px, py); else cx.lineTo(px, py);
      }
      cx.closePath(); cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.stroke();
      cx.restore();
    } else if (f.k === 'txt') {
      const p = pj(f.x, f.y, f.z);
      cx.save(); cx.globalAlpha = Math.min(1, (1 - k) * 2);
      cx.font = `800 ${f.size}px "Segoe UI",system-ui,sans-serif`;
      cx.textAlign = 'center'; cx.lineWidth = 4; cx.strokeStyle = 'rgba(0,10,40,.8)';
      cx.strokeText(f.text, p[0], p[1] - k * 35);
      cx.fillStyle = f.col; cx.fillText(f.text, p[0], p[1] - k * 35);
      cx.restore();
    } else if (f.k === 'conf') {
      cx.save(); cx.globalAlpha = Math.min(1, (1 - k) * 2);
      cx.translate(f.sx, f.sy); cx.rotate(f.rot);
      cx.fillStyle = f.col; cx.fillRect(-5, -3, 10, 6);
      cx.restore();
    }
  }
}

function drawHud() {
  const n = names();
  cx.save(); rr(cx, 20, 18, 300, 74, 16);
  cx.fillStyle = 'rgba(4,12,50,.72)'; cx.fill();
  cx.strokeStyle = 'rgba(255,255,255,.12)'; cx.lineWidth = 1.5; cx.stroke();
  cx.textBaseline = 'middle';
  [[0, 40, n[0]], [1, 180, n[1]]].forEach(([i, x, nm]) => {
    cx.fillStyle = i ? '#fb7185' : '#cbd5e1';
    cx.font = '700 14px "Segoe UI",system-ui,sans-serif'; cx.textAlign = 'left';
    cx.fillText(nm.toUpperCase(), x, 40);
    const tw = cx.measureText(nm.toUpperCase()).width;
    cx.fillStyle = '#fff'; cx.font = '800 36px "Segoe UI",system-ui,sans-serif';
    cx.fillText(sc[i], x, 70);
    if (srv === i && state !== 'over') {
      cx.fillStyle = '#fde047'; cx.beginPath(); cx.arc(x + tw + 12, 40, 5, 0, 7); cx.fill();
    }
  });
  cx.restore();

  // Rally count
  if (state === 'rally' && rally > 0) {
    cx.save(); rr(cx, W / 2 - 80, 18, 160, 40, 20);
    cx.fillStyle = 'rgba(4,12,50,.68)'; cx.fill();
    cx.fillStyle = '#fde047'; cx.font = '800 18px "Segoe UI",system-ui,sans-serif';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('RALLY ' + rally, W / 2, 38);
    cx.restore();
  }
  if (spd > 0 && (state === 'rally' || state === 'point')) {
    cx.save();
    cx.font = '700 15px "Segoe UI",system-ui,sans-serif'; cx.fillStyle = 'rgba(226,240,255,.85)';
    cx.textAlign = 'right'; cx.fillText(Math.round(spd) + ' km/h', W - 28, 36);
    cx.fillStyle = 'rgba(226,240,255,.5)'; cx.font = '600 12px "Segoe UI",system-ui,sans-serif';
    cx.fillText('BEST RALLY ' + bestRally, W - 28, 56);
    cx.restore();
  }

  // Reach slider
  const x = W - 52, y0 = 190, y1 = 530, ty = y0 + (ZMAX - depthPref) / (ZMAX - ZMIN) * (y1 - y0);
  cx.save(); cx.fillStyle = 'rgba(4,12,50,.55)'; rr(cx, x - 24, y0 - 40, 48, y1 - y0 + 76, 24); cx.fill();
  cx.fillStyle = 'rgba(255,255,255,.18)'; rr(cx, x - 4, y0, 8, y1 - y0, 4); cx.fill();
  const bar = cx.createLinearGradient(0, ty, 0, y1); bar.addColorStop(0, '#38bdf8'); bar.addColorStop(1, '#6366f1');
  cx.fillStyle = bar; rr(cx, x - 4, ty, 8, y1 - ty, 4); cx.fill();
  cx.fillStyle = '#e2f1ff'; cx.beginPath(); cx.arc(x, ty, 11, 0, 7); cx.fill();
  cx.strokeStyle = '#38bdf8'; cx.lineWidth = 3; cx.stroke();
  cx.fillStyle = 'rgba(226,240,255,.8)'; cx.font = '700 10px "Segoe UI",system-ui,sans-serif'; cx.textAlign = 'center';
  cx.fillText('REACH', x, y0 - 24); cx.fillText('FWD', x, y0 - 10); cx.fillText('BACK', x, y1 + 20); cx.restore();

  // Banner
  if (state === 'point' || state === 'over' || state === 'serve') {
    cx.save(); cx.font = '700 24px "Segoe UI",system-ui,sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    const w = cx.measureText(banner).width + 52;
    rr(cx, W / 2 - w / 2, H - 76, w, 50, 25);
    cx.fillStyle = 'rgba(4,12,50,.8)'; cx.fill();
    cx.strokeStyle = 'rgba(255,255,255,.14)'; cx.lineWidth = 1.5; cx.stroke();
    cx.fillStyle = '#fff'; cx.fillText(banner, W / 2, H - 50); cx.restore();
  }

  if (hint > 0 && state === 'serve') {
    cx.save(); cx.globalAlpha = Math.min(1, hint);
    cx.font = '600 15px "Segoe UI",system-ui,sans-serif'; cx.textAlign = 'center';
    cx.fillStyle = 'rgba(226,240,255,.92)';
    const t = 'Move pointer to guide paddle  ·  wheel / slider = reach  ·  click / tap to serve, click again to smash  ·  G aim guide';
    const w = cx.measureText(t).width + 36;
    rr(cx, W / 2 - w / 2, H - 138, w, 38, 19);
    cx.fillStyle = 'rgba(4,12,50,.72)'; cx.fill();
    cx.fillStyle = 'rgba(226,240,255,.95)'; cx.textBaseline = 'middle';
    cx.fillText(t, W / 2, H - 119); cx.restore();
  }

  if (paused && !window.__apexTheaterEmbedded) {
    cx.save(); cx.fillStyle = 'rgba(2,6,24,.65)'; cx.fillRect(0, 0, W, H);
    cx.fillStyle = '#fff'; cx.font = '800 54px "Segoe UI",system-ui,sans-serif';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('Paused', W / 2, H / 2 - 10);
    cx.font = '600 18px "Segoe UI",system-ui,sans-serif'; cx.fillStyle = 'rgba(226,240,255,.8)';
    cx.fillText('Press P or click Resume', W / 2, H / 2 + 36);
    cx.restore();
  }
}

function draw() {
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!bg) mkBg();
  cx.save();
  if (shake > 0) cx.translate((Math.random() - .5) * shake * 6, (Math.random() - .5) * shake * 6);
  cx.drawImage(bg, -120 - camX * 45, 0, W + 240, H);
  drawFloor(); drawBarrier(); drawOpponent(); drawTable(); drawBallShadow(); drawGuide();

  const hold = state === 'serve';
  const b1z = bats[1].z, b0z = bats[0].z, bz = ball.z;
  // Sort items manually to avoid allocating objects in render loop
  if (b1z > NZ) { drawBat(bats[1], false); drawNet(); } else { drawNet(); drawBat(bats[1], false); }
  if (bz > b0z) { drawBall(ball, hold); drawBat(bats[0], true); } else { drawBat(bats[0], true); drawBall(ball, hold); }

  drawFX();
  cx.restore();

  if (flash > 0) {
    cx.fillStyle = `rgba(255,255,255,${flash * .08})`;
    cx.fillRect(0, 0, W, H);
  }
  const vg = cx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,12,.45)');
  cx.fillStyle = vg; cx.fillRect(0, 0, W, H);
  drawHud();
}

/* ---------- input & responsive touch handling ---------- */
const _pointerPt = { x: 0, y: 0 };
const toCv = (e) => {
  const r = cv.getBoundingClientRect();
  _pointerPt.x = (e.clientX - r.left) * W / (r.width || 1);
  _pointerPt.y = (e.clientY - r.top) * H / (r.height || 1);
  return _pointerPt;
};
const inSlider = (p) => p.x > W - 88 && p.y > 140 && p.y < 570;
function setDepthFromY(y) { depthPref = clamp(ZMAX - (y - 190) / 340 * (ZMAX - ZMIN), ZMIN, ZMAX); }

cv.addEventListener('pointermove', (e) => {
  const p = toCv(e);
  if (sliding) { setDepthFromY(p.y); return; }
  const adjustedY = e.pointerType === 'touch' ? p.y - 70 : p.y;
  ptr = { x: p.x, y: adjustedY };
  ptrOn = true;
  cv.style.cursor = inSlider(p) ? 'ns-resize' : 'none';
}, { passive: true });

cv.addEventListener('pointerdown', (e) => {
  const p = toCv(e);
  try { cv.setPointerCapture(e.pointerId); } catch (x) {}
  if (paused) { if (!window.__apexTheaterEmbedded) togglePause(); return; }
  if (inSlider(p)) { sliding = true; setDepthFromY(p.y); return; }
  const adjustedY = e.pointerType === 'touch' ? p.y - 70 : p.y;
  ptr = { x: p.x, y: adjustedY };
  ptrOn = true;
  act(0);
});

window.addEventListener('pointerup', () => { sliding = false; });
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  depthPref = clamp(depthPref - e.deltaY * (e.deltaMode === 1 ? .03 : .0014), ZMIN, ZMAX);
}, { passive: false });
cv.addEventListener('contextmenu', (e) => e.preventDefault());

function syncPause() { $('#pause').textContent = paused ? 'Resume' : 'Pause'; }
function togglePause() { if (over) return; paused = !paused; syncPause(); }
window.ApexGameMenuActions = {
  play: function () { paused = false; syncPause(); },
  pause: function (value) { if (!over) paused = !!value; syncPause(); },
  resume: function () { if (!over) paused = false; syncPause(); },
  restart: function () { newMatch(); }
};

$('#new').onclick = (e) => { e.target.blur(); newMatch(); };
$('#mode').onchange = (e) => { e.target.blur(); newMatch(); };
$('#pause').onclick = (e) => { e.target.blur(); togglePause(); };
$('#guide').onchange = (e) => { guide = e.target.checked; gd.bounce = null; gd.hit = null; e.target.blur(); };

// Listen for theater modal difficulty and virtual touch control messages
window.addEventListener('message', (e) => {
  if ((e.source !== window.parent && e.source !== window) || e.origin !== window.location.origin || !e.data) return;
  if (e.data.type === 'SET_DIFFICULTY') {
    const d = e.data.difficulty;
    const modeIdx = d === 'easy' ? '0' : d === 'hard' ? '2' : '1';
    const keepPaused = paused || window.ApexMenuActive;
    $('#mode').value = modeIdx;
    mode = +modeIdx;
    newMatch();
    if (keepPaused) { paused = true; syncPause(); }
  } else if (e.data.type === 'KEY_EVENT') {
    const k = (e.data.key || '').toLowerCase();
    if (k) {
      if (e.data.action === 'down') {
        keys[k] = true;
        if (k === ' ' || k === 'space') act(0);
        else if (k === 'enter') act(mode === 3 ? 1 : 0);
        else if (k === 'p') togglePause();
      } else {
        keys[k] = false;
      }
    }
  } else if (e.data.type === 'REACH_DELTA') {
    depthPref = clamp(depthPref + (e.data.delta || 0), ZMIN, ZMAX);
  }
});

document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'pageup', 'pagedown'].includes(k)) e.preventDefault();
  keys[k] = true;
  if (e.repeat) return;
  if (k === ' ') act(0);
  else if (k === 'enter') act(mode === 3 ? 1 : 0);
  else if (k === 'n') newMatch();
  else if (k === 'p' || k === 'escape') togglePause();
  else if (k === 'g') { guide = !guide; $('#guide').checked = guide; gd.bounce = null; gd.hit = null; }
});
document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { keys = {}; });
document.addEventListener('visibilitychange', () => { if (document.hidden && !paused && !over && !window.__apexTheaterEmbedded) togglePause(); });

newMatch();
paused = true;
syncPause();

/* ---------- deterministic fixed-timestep game loop ---------- */
let lastTime = performance.now();
const FIXED_STEP = 1 / 120; // 120Hz physics sub-step
let accumulator = 0;

function loop(currentTime) {
  requestAnimationFrame(loop);
  if (document.hidden) { lastTime = currentTime; return; }
  const elapsed = Math.min(0.06, (currentTime - lastTime) / 1000);
  lastTime = currentTime;

  if (!paused && !document.getElementById('bk-dlg')?.open) {
    accumulator += elapsed;
    // Step in deterministic slices
    while (accumulator >= FIXED_STEP) {
      update(FIXED_STEP);
      accumulator -= FIXED_STEP;
    }
  }
  draw();
}
requestAnimationFrame(loop);
</script>
