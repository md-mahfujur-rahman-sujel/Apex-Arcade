<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludo</title>
<style>
  .lu { display: grid; grid-template-columns: minmax(280px, 620px) minmax(240px, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .lu { grid-template-columns: 1fr; } }
  #cv { width: 100%; max-width: 620px; height: auto; border-radius: 14px; box-shadow: 0 20px 50px -20px #000, 0 0 0 6px #2a2f45; cursor: pointer; touch-action: manipulation; }
  .side { display: grid; gap: 12px; }
  .die { font-size: 88px; line-height: 1; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 0 16px; user-select: none; }
  .die.roll { animation: sh .12s linear infinite; }
  @keyframes sh { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  .big { font-size: 18px !important; padding: 12px 18px !important; }
  .pl { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .pl.on { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
  .pl i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; flex: none; }
  .pl span { margin-left: auto; color: var(--muted); font: 600 12px ui-monospace, Consolas, monospace; white-space: nowrap; }
</style>
<script src="../../kits/music-kit.js"></script><script src="../../kits/menu-kit.js"></script>
</head>
<body>

<script src="../../kits/perf-kit.js"></script>
<script src="../../kits/save-kit.js"></script>
<script src="../../kits/meta-config.js"></script>
<script src="../../kits/meta-kit.js"></script>
<script src="../../kits/board-kit.js"></script>
<script src="../../kits/score-bridge.js"></script>
<script src="../../kits/ui-kit.js"></script>
<script>
const ui = Board.shell({
  id: 'ludo', cpu: true, title: 'Ludo', subtitle: 'Roll a 6 to leave the yard, then race your tokens home',
  rules: 'Roll a 6 to bring a token onto your start square. Move tokens clockwise round the track, then up your coloured lane; you need the exact number to reach the centre. Landing on a rival (outside a start square or a \u2605) sends it back to its yard. A 6, a capture or a token reaching home gives another roll. Classic brings all four tokens home; Sprint races two tokens each; Hunter disables \u2605 safety and pays more for captures; Steady Pace removes the extra roll for sixes; Duel is a 1v1 against the hard computer. First to the mode\u2019s home target wins.',
  controls: [['Space / R', 'Roll the die'], ['1\u20134 / click', 'Move that token'], ['N', 'New game'], ['H / M', 'Toggle help / mute']],
});
ui.main.innerHTML = `
<div class="lu">
  <canvas id="cv" width="600" height="600"></canvas>
  <div class="side">
    <div class="bk-status" id="status"></div>
    <div class="die" id="die">\u2680</div>
    <button class="bk-btn bk-primary big" id="roll">Roll the die</button>
    <div class="bk-row"><label>Opponents <select class="bk-select" id="mode"><option value="1">1 computer</option><option value="2">2 computers</option><option value="3">3 computers</option><option value="0">Local (4 humans)</option></select></label>
      <button class="bk-btn" id="new">New game</button></div>
    <div id="plist" style="display:grid;gap:8px"></div>
  </div>
</div>`;
const $ = (s) => ui.main.querySelector(s), cv = $('#cv'), c = cv.getContext('2d'), U = 40;
const NM = ['Red', 'Green', 'Yellow', 'Blue'];
const FACES = ['\u2680', '\u2681', '\u2682', '\u2683', '\u2684', '\u2685'];
const rot = (x, y, k) => { for (let i = 0; i < k; i++) [x, y] = [14 - y, x]; return [x, y]; };
const rotc = (x, y, k) => { for (let i = 0; i < k; i++) [x, y] = [15 - y, x]; return [x, y]; };
const Q = [[1, 6], [2, 6], [3, 6], [4, 6], [5, 6], [6, 5], [6, 4], [6, 3], [6, 2], [6, 1], [6, 0], [7, 0], [8, 0]];
const TRK = [0, 1, 2, 3].flatMap((k) => Q.map(([x, y]) => rot(x, y, k)));
const SAFE = new Set([0, 8, 13, 21, 26, 34, 39, 47]), BASE = [[2, 2], [4, 2], [2, 4], [4, 4]];
const MODE_NAMES = { classic: 'Classic', sprint: 'Sprint', hunter: 'Hunter', steady: 'Steady Pace', duel: 'Duel' };
const MODE_KEY = { classic: 'Classic', sprint: 'Sprint', hunter: 'Hunter', steady: 'Steady', duel: 'Duel' };
const HOME_TARGET = { classic: 4, sprint: 2, hunter: 3, steady: 4, duel: 4 };
const WIN_BONUS = { classic: 1000, sprint: 600, hunter: 900, steady: 1100, duel: 1400 };
const MODES = [
  { id: 'classic', name: 'Classic', blurb: 'Four tokens each, standard rules.' },
  { id: 'sprint', name: 'Sprint', blurb: 'Two tokens each. First pair home wins.' },
  { id: 'hunter', name: 'Hunter', blurb: '\u2605 squares no longer block captures and captures pay 150. First three home.' },
  { id: 'steady', name: 'Steady Pace', blurb: 'Sixes do not grant another roll. Every point is worth 1.2\u00d7.' },
  { id: 'duel', name: 'Duel', blurb: 'A 1v1 against the hard computer, 1.5\u00d7 score.', requires: { stat: 'classicWins', gte: 1 }, lockedHint: 'Win a Classic game to unlock' },
];
const ACHIEVEMENTS = [
  { id: 'first-roll', name: 'Opening Roll', desc: 'Roll the die.', rarity: 'common' },
  { id: 'first-capture', name: 'Bump', desc: 'Send a rival token back to its yard.', rarity: 'common' },
  { id: 'first-home', name: 'Home Safe', desc: 'Bring a token all the way home.', rarity: 'common' },
  { id: 'classic-clear', name: 'Ludo Champion', desc: 'Win a Classic game.', rarity: 'common' },
  { id: 'sprint-clear', name: 'Quick Pair', desc: 'Win a Sprint game.', rarity: 'common' },
  { id: 'hunter-clear', name: 'No Mercy', desc: 'Win a Hunter game.', rarity: 'rare' },
  { id: 'steady-clear', name: 'Slow And Sure', desc: 'Win a Steady Pace game.', rarity: 'rare' },
  { id: 'duel-clear', name: 'Head To Head', desc: 'Win a Duel against the hard computer.', rarity: 'legendary' },
  { id: 'sextet', name: 'Triple Six', desc: 'Roll three sixes in a row.', rarity: 'rare' },
  { id: 'flawless', name: 'Flawless Finish', desc: 'Win without losing a token.', rarity: 'epic' },
  { id: 'sharpshooter', name: 'Sharpshooter', desc: 'Capture three tokens in one game.', rarity: 'epic' },
  { id: 'personal-best', name: 'Personal Best', desc: 'Set a new best score.', rarity: 'rare' },
];

/* ---------------- cosmetics ---------------- */
const TOKEN_SETS = {
  'ludo:tokens-classic': ['#ef4444', '#22c55e', '#eab308', '#3b82f6'],
  'ludo:tokens-pastel': ['#fda4af', '#86efac', '#fde68a', '#93c5fd'],
  'ludo:tokens-neon': ['#f43f5e', '#a3e635', '#facc15', '#22d3ee'],
  'ludo:tokens-jewel': ['#e11d48', '#10b981', '#f59e0b', '#6366f1'],
  'ludo:tokens-mono': ['#f8fafc', '#cbd5e1', '#94a3b8', '#475569'],
};
const BOARD_SETS = {
  'ludo:board-midnight': { bg: '#151a2e', frame: '#2a2f45', yard: 'rgba(255,255,255,.88)', track: '#e8ebf6', star: '#8b93b3' },
  'ludo:board-ivory': { bg: '#26211a', frame: '#6b5a42', yard: 'rgba(255,250,240,.92)', track: '#f3ead9', star: '#9a8465' },
  'ludo:board-cedar': { bg: '#1b120d', frame: '#5c3a24', yard: 'rgba(255,240,225,.92)', track: '#f0dcc6', star: '#a97a55' },
  'ludo:board-graphite': { bg: '#111318', frame: '#3a3f4b', yard: 'rgba(240,244,250,.92)', track: '#d7dde8', star: '#6b7280' },
};
const GLOWS = { 'ludo:glow-gold': '#fbbf24', 'ludo:glow-cyan': '#22d3ee', 'ludo:glow-rose': '#fb7185', 'ludo:glow-white': '#ffffff' };
const THEMES = {
  'ludo:theme-night': '',
  'ludo:theme-casino': 'radial-gradient(1100px 520px at 12% -8%, #4c1d1d, transparent 60%), radial-gradient(900px 520px at 100% 0, #14532d, transparent 55%), #090a10',
  'ludo:theme-garden': 'radial-gradient(1000px 500px at 10% -10%, #14532d, transparent 60%), radial-gradient(800px 500px at 100% 0, #1e3a5f, transparent 55%), #070d09',
};
const PALETTE = {
  tokens: TOKEN_SETS['ludo:tokens-classic'].slice(),
  board: Object.assign({}, BOARD_SETS['ludo:board-midnight']),
  glow: GLOWS['ludo:glow-gold'],
};
function applyCosmetic(slot, id) {
  if (slot === 'skin') PALETTE.tokens = (TOKEN_SETS[id] || TOKEN_SETS['ludo:tokens-classic']).slice();
  else if (slot === 'palette') PALETTE.board = Object.assign({}, BOARD_SETS[id] || BOARD_SETS['ludo:board-midnight']);
  else if (slot === 'effect') PALETTE.glow = GLOWS[id] || GLOWS['ludo:glow-gold'];
  else if (slot === 'theme') document.body.style.background = THEMES[id] || '';
  if (slot === 'palette') cv.style.boxShadow = '0 20px 50px -20px #000, 0 0 0 6px ' + PALETTE.board.frame;
  if (players) { upd(); draw(); }
}

/* ---------------- state ---------------- */
let players = null, cur = 0, die = 0, phase = 'roll', busy = false, over = false, winner = null, mode = 'classic', menuPaused = true, opp = '1';
let moves = [], cpuSel = -1, genId = 0;
const scoreMult = () => mode === 'steady' ? 1.2 : mode === 'duel' ? 1.5 : 1;
const addScore = (p, n) => { p.score += Math.round(n * scoreMult()); };
const safeCell = (k) => mode === 'hunter' ? k % 13 === 0 : SAFE.has(k);
const trk = (s, v) => (13 * s + v - 1) % 52;
function xy(p, i) {
  const s = p.s, v = p.t[i]; let x, y;
  if (v === 0) [x, y] = rotc(BASE[i % 4][0], BASE[i % 4][1], s);
  else if (v <= 51) { [x, y] = TRK[trk(s, v)]; x += .5; y += .5; }
  else if (v <= 56) { [x, y] = rot(v - 51, 7, s); x += .5; y += .5; }
  else [x, y] = rotc(6.45, 6.8 + .4 * i, s);
  return [x, y];
}
function draw() {
  if (!players) return;
  const pal = PALETTE.board;
  c.fillStyle = pal.bg; c.fillRect(0, 0, 600, 600);
  for (let k = 0; k < 4; k++) {
    c.save(); c.translate(300, 300); c.rotate(k * Math.PI / 2); c.translate(-300, -300);
    const col = PALETTE.tokens[k]; c.fillStyle = col; c.fillRect(0, 0, 6 * U, 6 * U);
    c.fillStyle = pal.yard; c.fillRect(U, U, 4 * U, 4 * U);
    BASE.forEach(([x, y]) => { c.fillStyle = col; c.globalAlpha = .35; c.beginPath(); c.arc(x * U, y * U, 17, 0, 7); c.fill(); c.globalAlpha = 1; });
    c.fillStyle = col; for (let j = 1; j <= 5; j++) c.fillRect(j * U + 1, 7 * U + 1, U - 2, U - 2);
    c.beginPath(); c.moveTo(6 * U, 6 * U); c.lineTo(6 * U, 9 * U); c.lineTo(7.5 * U, 7.5 * U); c.fill(); c.restore();
  }
  TRK.forEach(([x, y], i) => {
    c.fillStyle = i % 13 === 0 ? PALETTE.tokens[i / 13] : pal.track; c.fillRect(x * U + 1, y * U + 1, U - 2, U - 2);
    if (SAFE.has(i)) { c.fillStyle = i % 13 === 0 ? 'rgba(255,255,255,.85)' : pal.star; c.font = '20px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('\u2605', x * U + U / 2, y * U + U / 2 + 1); }
  });
  const items = [], seen = {}, t = Board.now() / 300, me = players[cur];
  players.forEach((p) => p.t.forEach((v, i) => { const [x, y] = xy(p, i); items.push({ p, i, v, x: x * U, y: y * U }); }));
  items.forEach((o) => { if (!o.v || o.v === 57) return; const k = Math.round(o.x) + ',' + Math.round(o.y), n = (seen[k] = (seen[k] || 0) + 1); o.x += (n - 1) * 6; o.y -= (n - 1) * 6; });
  items.forEach((o) => {
    const mv = phase === 'pick' && o.p === me && (me.cpu ? o.i === cpuSel : moves.includes(o.i)), r = o.v === 57 ? 8 : 13;
    c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(o.x + 2, o.y + r * .7, r, r * .45, 0, 0, 7); c.fill();
    c.fillStyle = PALETTE.tokens[o.p.s]; c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.beginPath(); c.arc(o.x, o.y, r, 0, 7); c.fill(); c.stroke();
    if (o.v !== 57) { c.fillStyle = '#111827'; c.font = '700 12px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(o.i + 1, o.x, o.y + 1); }
    if (mv) { c.strokeStyle = PALETTE.glow; c.lineWidth = 3; c.beginPath(); c.arc(o.x, o.y, r + 4 + Math.sin(t * 3) * 2.5, 0, 7); c.stroke(); }
  });
}
(function loop() { if (players && !Board.paused()) draw(); requestAnimationFrame(loop); })();

/* ---------------- rules ---------------- */
function targetOf(p, i, d) {
  const v = p.t[i];
  if (v === 0) return d === 6 ? 1 : null;
  const n = v + d;
  return n <= 57 ? n : null;
}
function legalMoves(p, d) { return p.t.map((v, i) => targetOf(p, i, d) != null ? i : -1).filter((i) => i >= 0); }
function resolveArrival(p, i, from) {
  const to = p.t[i];
  let extra = die === 6 && mode !== 'steady', capture = false, home = false, msg = '';
  if (from === 0) addScore(p, 20);
  if (to <= 51) {
    const k = trk(p.s, to);
    if (!safeCell(k)) players.forEach((q) => {
      if (q === p) return;
      q.t.forEach((w, j) => {
        if (w >= 1 && w <= 51 && trk(q.s, w) === k) {
          q.t[j] = 0; q.tokensLost += 1; p.captures += 1;
          capture = true; extra = true;
          addScore(p, mode === 'hunter' ? 150 : 120);
          msg = p.name + ' captured ' + q.name + '!';
          Board.sfx('capture');
        }
      });
    });
  }
  if (to === 57) { p.home += 1; home = true; extra = true; addScore(p, 250); msg = p.name + ' got a token home!'; Board.sfx('ladder'); }
  if (capture && p.human) GameUI.unlock('first-capture');
  if (home && p.human) GameUI.unlock('first-home');
  const win = p.home >= HOME_TARGET[mode];
  if (win) msg = p.name + ' brings the last token home!';
  return { extra, capture, home, win, msg };
}
function newGame() {
  genId++;
  const d = document.getElementById('bk-dlg'); if (d && d.open) d.close();
  mode = GameUI.getMode();
  const duel = mode === 'duel';
  const n = duel ? 1 : +opp;
  $('#mode').disabled = duel; $('#mode').value = String(n);
  const seats = n === 0 ? [0, 1, 2, 3] : n === 1 ? [0, 2] : [0, 1, 2, 3].slice(0, n + 1);
  const tk = mode === 'sprint' ? 2 : 4;
  players = seats.map((s, i) => ({
    s, t: Array(tk).fill(0), cpu: n > 0 && i > 0, human: n === 0 || i === 0,
    name: n > 0 ? (i ? 'Computer ' + i : 'You') : NM[s],
    home: 0, score: 0, captures: 0, tokensLost: 0, rolls: 0, sixStreak: 0,
  }));
  cur = 0; die = 0; phase = 'roll'; busy = false; over = false; winner = null; moves = []; cpuSel = -1;
  setFace(0); upd(); draw(); auto();
}
function setFace(n) {
  const el = $('#die');
  el.textContent = n ? FACES[n - 1] : FACES[0];
  el.classList.toggle('roll', false);
}
function upd(m) {
  if (!players) return;
  const p = players[cur], vs = players.some((q) => q.cpu);
  $('#status').textContent = m || (over ? (winner ? winner.name + ' won!' : '') : p.cpu ? p.name + ' is rolling\u2026' : (vs ? 'Your turn' : p.name + '\u2019s turn') + ' \u2014 roll the die');
  $('#roll').disabled = busy || over || phase !== 'roll' || p.cpu || menuPaused;
  $('#plist').innerHTML = players.map((q, i) => `<div class="pl ${i === cur && !over ? 'on' : ''}"><i style="background:${PALETTE.tokens[q.s]}"></i>${q.name}<span>${q.home}/${HOME_TARGET[mode]} home \u00b7 ${q.score} pts</span></div>`).join('');
}
function auto() {
  if (over || menuPaused || !players) return;
  const p = players[cur];
  if (!p.cpu || phase !== 'roll') return;
  const g = genId;
  Board.after(Board.pace(1250), () => { if (g === genId && !over && !menuPaused && players[cur].cpu && phase === 'roll') roll(); });
}
function cpuPick(p) {
  const skill = mode === 'duel' ? 3 : Board.level();
  if (skill === 1) return moves[Board.rand(moves.length)];
  const sc = (i) => {
    const v = p.t[i], n = v ? v + die : 1; let s = v;
    if (n === 57) s += skill === 3 ? 180 : 100;
    if (n <= 51) { const k = trk(p.s, n); if (safeCell(k)) s += skill === 3 ? 30 : 15; else if (players.some((q) => q !== p && q.t.some((w) => w >= 1 && w <= 51 && trk(q.s, w) === k))) s += skill === 3 ? 150 : 80; }
    if (v === 0) s += skill === 3 ? 55 : 40;
    return s + Math.random();
  };
  return moves.slice().sort((a, b) => sc(b) - sc(a))[0];
}
function conclude(p) {
  if (over) return;
  over = true; phase = 'done'; busy = false; winner = p;
  addScore(p, WIN_BONUS[mode] || 1000);
  const cpu = players.some((q) => q.cpu);
  const humanWon = !!p.human;
  const humanScore = (cpu ? players[0] : players.filter((q) => q.human).reduce((best, q) => q.score > best.score ? q : best, players[0])).score;
  const achievements = [];
  if (humanWon) {
    achievements.push(mode + '-clear');
    if (p.tokensLost === 0) achievements.push('flawless');
    if (p.captures >= 3) achievements.push('sharpshooter');
  }
  const records = {};
  records['best' + MODE_KEY[mode] + 'Score'] = humanScore;
  const counters = { captures: players.reduce((s, q) => s + q.captures, 0), tokensHome: players.reduce((s, q) => s + q.home, 0) };
  if (humanWon) { counters.wins = 1; counters[mode + 'Wins'] = 1; }
  const mins = humanWon ? { fewestRolls: p.rolls } : {};
  const prevBest = Number(GameUI.stats().bestScore) || 0;
  GameUI.record({ score: humanScore, result: p.name + ' won ' + MODE_NAMES[mode], records, counters, mins, achievements });
  if (humanScore > prevBest) GameUI.unlock('personal-best');
  Board.sfx(humanWon ? 'win' : 'lose');
  upd(); draw();
  Board.modal(humanWon ? (cpu ? 'You win!' : p.name + ' wins!') : (cpu ? 'Computer wins' : p.name + ' wins!'),
    p.name + ' brought ' + HOME_TARGET[mode] + ' tokens home in ' + MODE_NAMES[mode] + ' \u00b7 ' + humanScore + ' pts.',
    [['Play again', newGame], ['Close']]);
}
function next(extra, msg) {
  if (!extra) cur = (cur + 1) % players.length;
  phase = 'roll'; busy = false; moves = []; cpuSel = -1;
  upd(msg || (extra ? players[cur].name + ' rolls again' : undefined));
  auto();
}

/* ---------------- turn flow ---------------- */
function beginRoll(p, n) {
  p.rolls += 1;
  p.sixStreak = n === 6 ? p.sixStreak + 1 : 0;
  if (p.human) { GameUI.unlock('first-roll'); if (p.sixStreak >= 3) GameUI.unlock('sextet'); }
}
async function roll() {
  if (busy || over || phase !== 'roll' || menuPaused) return;
  const p = players[cur], g = genId;
  busy = true; upd(p.name + ' rolls\u2026');
  const el = $('#die'); el.classList.add('roll'); Board.sfx('dice');
  const T = (ms) => Board.sleep(p.cpu ? Board.pace(ms * 1.6) : ms);
  for (let i = 0; i < 9; i++) { el.textContent = FACES[Board.rand(6)]; await T(70); if (g !== genId) return; }
  die = 1 + Board.rand(6); setFace(die); beginRoll(p, die);
  await T(350); if (g !== genId) return;
  moves = legalMoves(p, die);
  if (!moves.length) { upd(p.name + ' rolled ' + die + ' \u2014 no move'); Board.sfx('error'); await T(950); if (g !== genId) return; return next(false, p.name + ' rolled ' + die + ' \u2014 no move'); }
  phase = 'pick';
  if (p.cpu) {
    const chosen = cpuPick(p);
    cpuSel = chosen; upd(p.name + ' rolled ' + die); await T(700); if (g !== genId) return;
    cpuSel = -1; return move(chosen, true);
  }
  if (moves.length === 1) { upd('You rolled ' + die); await T(420); if (g !== genId) return; return move(moves[0]); }
  busy = false;
  upd(p.name + ' rolled ' + die + ' \u2014 pick a token (1\u20134 or click)');
}
async function move(i, chosen) {
  if (!players || over) return;
  if (!chosen && !moves.includes(i)) return;
  const p = players[cur], g = genId;
  busy = true; phase = 'anim'; upd();
  const T = (ms) => Board.sleep(p.cpu ? Board.pace(ms * 1.6) : ms);
  const from = p.t[i], to = targetOf(p, i, die);
  if (to == null) { busy = false; phase = 'roll'; return; }
  if (from === 0) { p.t[i] = 1; Board.sfx('move'); draw(); await T(250); }
  else for (let s = from + 1; s <= to; s++) { p.t[i] = s; Board.sfx('step'); draw(); await T(170); if (g !== genId) return; }
  const res = resolveArrival(p, i, from);
  if (res.win) { conclude(p); return; }
  next(res.extra, res.msg);
}
function pick(i) { if (phase === 'pick' && !busy && !players[cur].cpu && moves.includes(i)) move(i); }

cv.addEventListener('click', (e) => {
  if (!players) return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * 600 / r.width, y = (e.clientY - r.top) * 600 / r.height, p = players[cur];
  let best = -1, bd = 22;
  p.t.forEach((v, i) => { const [a, b] = xy(p, i), d = Math.hypot(a * U - x, b * U - y); if (d < bd) { bd = d; best = i; } });
  if (best >= 0) pick(best);
});
$('#roll').onclick = roll; $('#new').onclick = newGame;
$('#mode').onchange = () => { opp = $('#mode').value; newGame(); };
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || menuPaused) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter' || k === 'r') { e.preventDefault(); if (players && !players[cur].cpu) roll(); }
  else if (k >= '1' && k <= '4') pick(+k - 1);
  else if (k === 'n') newGame();
});

/* ---------------- shared menu contract ---------------- */
const GameUI = Board.ui({
  id: 'ludo', title: 'Ludo', subtitle: 'Five races around the board.', accent: '#22d3ee',
  modes: MODES, achievements: ACHIEVEMENTS,
  tutorial: { type: 'interactive', steps: [
    { text: 'Roll a 6 to move a token out of the yard.' },
    { text: 'A 6, a capture, or a token reaching home earns another roll.' },
    { text: 'Land on a rival outside a safe square to send it back.' },
    { text: 'Reach the home target for your mode: two tokens in Sprint, three in Hunter, four elsewhere.' },
  ] },
  hooks: {
    applyMode: (nextMode) => {
      mode = MODES.some((m) => m.id === nextMode) ? nextMode : 'classic';
      if (players) newGame();
    },
    applyCosmetic,
    onStart: () => { menuPaused = false; upd(); auto(); },
  },
});
window.ApexGameMenuActions = {
  play: function () { menuPaused = false; upd(); auto(); },
  pause: function (value) { menuPaused = !!value; upd(); if (!menuPaused) auto(); },
  resume: function () { menuPaused = false; upd(); auto(); },
  restart: function () { menuPaused = false; newGame(); }
};

newGame();

if (/(\?|&)test=1(?:&|$)/.test(location.search)) {
  window.LudoTest = {
    state: () => ({
      mode, cur, die, phase, busy, over, menuPaused, winners: winner ? winner.name : null,
      target: HOME_TARGET[mode],
      players: players.map((p) => ({ seat: p.s, t: p.t.slice(), home: p.home, score: p.score, captures: p.captures, lost: p.tokensLost, rolls: p.rolls, cpu: p.cpu, human: p.human, name: p.name })),
      best: Number(GameUI.stats().bestScore) || 0,
      difficulty: Board.difficulty(),
    }),
    modes: () => MODES.map((m) => m.id),
    setMode: (id) => GameUI.setMode(id),
    getMode: () => GameUI.getMode(),
    restart: () => { newGame(); return true; },
    setOpponents: (value) => {
      const sel = $('#mode');
      if (!Array.from(sel.options).some((o) => o.value === String(value))) return false;
      opp = String(value); sel.value = opp; newGame(); return true;
    },
    setPositions: (i, arr) => {
      const p = players[i]; if (!p) return false;
      p.t = p.t.map((_, k) => Math.max(0, Math.min(57, Number((arr || [])[k]) || 0)));
      p.home = p.t.filter((v) => v === 57).length;
      draw(); upd(); return p.t.slice();
    },
    setCounters: (i, data) => {
      const p = players[i]; if (!p) return false;
      if (data && data.captures != null) p.captures = Number(data.captures) || 0;
      if (data && data.lost != null) p.tokensLost = Number(data.lost) || 0;
      return true;
    },
    setTurn: (i) => { if (!players[i]) return false; cur = i; phase = 'roll'; busy = false; moves = []; upd(); return true; },
    legal: (d) => legalMoves(players[cur], Number(d) || 0),
    trk: (seat, step) => trk(seat, step),
    safeIndex: (k) => safeCell(Number(k)),
    turn: (d, choice) => {
      if (over || phase !== 'roll' || !players) return null;
      const p = players[cur]; die = Number(d) || 1; beginRoll(p, die); setFace(die);
      const list = legalMoves(p, die);
      if (!list.length) { const out = { roll: die, noMove: true, moves: 0, cur, score: p.score }; next(false, p.name + ' rolled ' + die + ' \u2014 no move'); return out; }
      const i = choice != null && list.includes(Number(choice)) ? Number(choice) : list[0];
      const from = p.t[i], to = targetOf(p, i, die);
      p.t[i] = to;
      const r = resolveArrival(p, i, from);
      const out = { roll: die, pick: i, from, to, capture: r.capture, home: r.home, extra: r.extra, win: r.win, score: p.score, cur, msg: r.msg };
      if (r.win) conclude(p); else next(r.extra, r.msg);
      out.score = p.score; out.cur = cur; out.over = over;
      return out;
    },
    finish: (i) => { const p = players[i]; if (!p) return false; p.t = p.t.map(() => 57); p.home = HOME_TARGET[mode]; conclude(p); return true; },
    award: (n) => { addScore(players[0], Number(n) || 0); upd(); return players[0].score; },
    menuPaused: (value) => { menuPaused = !!value; upd(); return menuPaused; },
    start: () => { menuPaused = false; upd(); auto(); },
    setDifficulty: (d) => Board.setDifficulty(d),
    level: () => Board.level(),
    colors: () => ({ tokens: PALETTE.tokens.slice(), board: Object.assign({}, PALETTE.board), glow: PALETTE.glow, theme: document.body.style.background || 'auto' }),
    cosmetic: (slot, id) => { applyCosmetic(slot, id); return window.LudoTest.colors(); },
    cosmeticList: () => (window.Meta && Meta.getCosmetics ? Meta.getCosmetics('ludo') : []).map((item) => ({ id: item.id, slot: item.slot })),
    achievements: () => (Save.load('ludo').achievements || []).slice(),
    stats: () => Save.load('ludo').stats || {},
    modalOpen: () => { const d = document.getElementById('bk-dlg'); return !!(d && d.open); },
    closeModal: () => { const d = document.getElementById('bk-dlg'); if (d && d.open) d.close(); },
  };
}
</script>
<script src="../../kits/menu-bootstrap.js"></script>
