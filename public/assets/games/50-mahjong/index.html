/* ---------- board geometry ---------- */
function layerSpan(v, z) { return [v + z * 0.5, v + z * 0.5 + 1]; }
function axisOverlap(a, az, b, bz) {
  const A = layerSpan(a, az), B = layerSpan(b, bz);
  return A[0] < B[1] && B[0] < A[1];
}
function isFree(t, board = tiles) {
  if (t.removed) return false;
  for (let i = 0; i < board.length; i++) {
    const o = board[i];
    if (!o.removed && o.z > t.z && axisOverlap(t.x, t.z, o.x, o.z) && axisOverlap(t.y, t.z, o.y, o.z)) return false;
  }
  let left = false, right = false;
  for (let i = 0; i < board.length; i++) {
    const o = board[i];
    if (o.removed || o.z !== t.z || o.y !== t.y) continue;
    if (o.x === t.x - 1) left = true;
    else if (o.x === t.x + 1) right = true;
  }
  return !left || !right;
}
function availablePairs() {
  const freeTiles = tiles.filter((t) => !t.removed && isFree(t));
  const out = [];
  for (let i = 0; i < freeTiles.length; i++) {
    for (let j = i + 1; j < freeTiles.length; j++) {
      if (freeTiles[i].face === freeTiles[j].face) out.push([freeTiles[i], freeTiles[j]]);
    }
  }
  return out;
}

/* ---------- tile faces ---------- */
const CJK = '"Songti SC","Noto Serif CJK SC","Noto Serif SC","SimSun","MS Mincho",serif';

  },

    2: [[.5, .27], [.5, .73]],
    3: [[.5, .22], [.27, .7], [.73, .7]],
    4: [[.28, .28], [.72, .28], [.28, .72], [.72, .72]],
    5: [[.26, .22], [.74, .22], [.5, .5], [.26, .78], [.74, .78]],
    6: [[.26, .22], [.5, .22], [.74, .22], [.26, .74], [.5, .74], [.74, .74]],
    7: [[.22, .18], [.5, .18], [.78, .18], [.28, .48], [.72, .48], [.28, .8], [.72, .8]],
    8: [[.3, .16], [.7, .16], [.3, .38], [.7, .38], [.3, .62], [.7, .62], [.3, .84], [.7, .84]],
    9: [[.22, .22], [.5, .22], [.78, .22], [.22, .5], [.5, .5], [.78, .5], [.22, .78], [.5, .78], [.78, .78]],
  },
};
function pipXY(p) { return [7 + p[0] * 26, 11 + p[1] * 32]; }
function bambooStick(x, y, h, red) {
  const w = Math.max(2.4, h * 0.36), band = Math.max(1.2, h * 0.16);
  return `<g><rect x="${(x - w / 2).toFixed(2)}" y="${(y - h / 2).toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}" rx="${(w * 0.34).toFixed(2)}" fill="#2f7d52"/>` +
    `<rect x="${(x - w * 0.68).toFixed(2)}" y="${(y - band / 2).toFixed(2)}" width="${(w * 1.36).toFixed(2)}" height="${band.toFixed(2)}" rx="0.7" fill="${red ? '#b03a3a' : '#1d5b3c'}"/></g>`;
}
function circlePip(x, y, r, color) {
  return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${r.toFixed(2)}" fill="none" stroke="${color}" stroke-width="${Math.max(1.1, r * 0.4).toFixed(2)}"/>` +
    `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${(r * 0.34).toFixed(2)}" fill="${color}"/>`;
}
function suitPips(kind, n) {
  const pts = PIPS[kind][n];
  let out = '';
  if (kind === 'bamboo') {
    const h = n <= 1 ? 20 : n <= 2 ? 15 : n <= 4 ? 11 : n <= 6 ? 9.6 : 8.2;
    pts.forEach((p, k) => { const [x, y] = pipXY(p); out += bambooStick(x, y, h, (k + n) % 5 === 0); });
    if (n === 1) out += '<path d="M24 17 q6 -4 8 1 q-5 3 -8 -1 M24 17 q-6 -4 -8 1 q5 3 8 -1" fill="#2f7d52"/>';

    const r = n <= 1 ? 7.4 : n <= 2 ? 5.4 : n <= 6 ? 3.9 : 3.3;
    const colors = ['#2f5fa8', '#b03a3a', '#1f6b46'];
    pts.forEach((p, k) => { const [x, y] = pipXY(p); out += circlePip(x, y, r, colors[k % colors.length]); });
  }
  return out;
}
function textFace(char, size, color, y) {

}
function faceMarkup(i) {

  else if (i < 27) body = suitPips('circle', i - 17);
  else if (i < 31) body = textFace(['東', '南', '西', '北'][i - 27], 27, 'currentColor');
  else if (i < 34) {
    if (i === 31) body = textFace('中', 27, '#b03a3a');
    else if (i === 32) body = textFace('發', 26, '#1f6b46');
    else body = '<rect x="10" y="12" width="20" height="28" rx="2.5" fill="#eaf2ff" stroke="#2f5fa8" stroke-width="2"/>' +
      '<rect x="14" y="16" width="12" height="20" rx="1.5" fill="none" stroke="#2f5fa8" stroke-width="1.2"/>';
  } else if (i === 34) {
    body = '<g fill="#c25b7c">' + [0, 1, 2, 3, 4].map((k) => {
      const a = -Math.PI / 2 + k * Math.PI * 0.4;
      return `<ellipse cx="${(20 + Math.cos(a) * 6).toFixed(2)}" cy="${(13 + Math.sin(a) * 6).toFixed(2)}" rx="3.4" ry="4.6" transform="rotate(${(a * 180 / Math.PI + 90).toFixed(1)} ${(20 + Math.cos(a) * 6).toFixed(2)} ${(13 + Math.sin(a) * 6).toFixed(2)})"/>`;
    }).join('') + '</g><circle cx="20" cy="13" r="2.2" fill="#f3c96b"/>' + textFace('梅', 17, '#a8455f', 39);
  } else {
    body = '<g fill="none" stroke="#2f7d52" stroke-width="2.2" stroke-linecap="round">' +
      '<path d="M20 29 q-9 -4 -11 -14 q9 3 11 14"/><path d="M20 29 q9 -4 11 -14 q-9 3 -11 14"/>' +
      '<path d="M20 29 q-2 -10 0 -17"/></g>' + textFace('蘭', 17, '#1f6b46', 43);
  }
  return `<svg class="face" viewBox="0 0 40 52" aria-hidden="true" focusable="false" style="color:var(--mj-ink)">${body}</svg>`;
}

/* ---------- rendering ---------- */
function render() {
  if (bulk) return;
  const remaining = tiles.filter((t) => !t.removed);
  let maxX = 1, maxY = 1;
  remaining.forEach((t) => {
    maxX = Math.max(maxX, t.x + t.z * 0.5 + 1);
    maxY = Math.max(maxY, t.y + t.z * 0.5 + 1);
  });
  const avail = Math.max(300, stage.clientWidth - 22);
  const base = Math.max(30, Math.min(58, Math.floor(avail / 10)));
  const tw = Math.max(24, Math.min(base, Math.floor((avail - 12) / maxX) - 2));
  const th = Math.round(tw * 1.3);
  const cellX = tw + 2;
  const stepY = th + 2;
  const lift = Math.round(th * 0.14);
  root.style.width = Math.round(maxX * cellX + 16) + 'px';
  root.style.height = Math.round(maxY * stepY + 16 + 2 * lift) + 'px';
  root.style.setProperty('--tw', tw + 'px');
  root.style.setProperty('--th', th + 'px');
  root.innerHTML = '';
  tiles.forEach((t) => {
    if (t.removed) return;
    const free = isFree(t);
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.id = t.id;
    b.className = 'mj-tile ' + (free ? 'free' : 'blocked') + (selected === t.id ? ' selected' : '') + (hinted.indexOf(t.id) >= 0 ? ' hint' : '');
    b.style.left = Math.round(t.x * cellX + t.z * 0.5 * cellX + 8) + 'px';
    b.style.top = Math.round(t.y * stepY + t.z * 0.5 * stepY + 8 - t.z * lift) + 'px';
    b.style.zIndex = 10 + t.z * 1000 + t.y * 20 + t.x;
    b.disabled = !free || over;
    b.setAttribute('aria-label', FACES[t.face].name + (free ? '' : ' (blocked)'));
    b.innerHTML = faceMarkup(t.face);
    b.addEventListener('click', () => choose(t.id));
    root.appendChild(b);
  });
}

function setStatus(html) { statusEl.innerHTML = html; }

function paint() {
  const c = cfg();
  $('#mj-pairs').textContent = pairs + ' / ' + boardPairs;
  $('#mj-time').textContent = fmt(elapsed) + (c.limit ? ' / ' + fmt(c.limit) : '');
  $('#mj-score').textContent = score.toLocaleString();
  $('#mj-moves').textContent = moves;
  $('#mj-mode').textContent = c.name + ' · ' + boardPairs + ' pairs';
  const hb = $('#mj-hint'), ub = $('#mj-undo'), sb = $('#mj-shuffle');
  hb.textContent = 'Hint · ' + hintLeft;
  ub.textContent = 'Undo · ' + undoLeft;
  sb.textContent = 'Shuffle · ' + shuffleLeft;
  hb.disabled = over || hintLeft <= 0;
  ub.disabled = over || undoLeft <= 0 || !history.length;
  sb.disabled = over || shuffleLeft <= 0;
}

/* ---------- deals and turns ---------- */
function layoutPositions() {
  const layout = LAYOUTS[cfg().layout] || LAYOUTS.full;
  const pos = [];
  layout.forEach((layer) => {
    for (let y = 0; y < layer.h; y++) {
      for (let x = 0; x < layer.w; x++) {
        if (layer.skip && layer.skip.some((p) => p[0] === x && p[1] === y)) continue;
        pos.push({ x: x + layer.x0, y: y + layer.y0, z: layer.z });
      }
    }
  });
  return pos;
}

function removalPlan(pos, randomize) {
  const board = pos.map((p) => ({ ...p, removed: false }));
  const plan = [];
  for (let i = 0; i < board.length; i += 2) {
    const free = board.filter((t) => isFree(t, board));
    if (free.length < 2) return null;
    if (randomize) Board.shuffle(free);
    else free.sort((a, b) => b.z - a.z || a.y - b.y || a.x - b.x);
    const a = free[0], b = free[1];
    a.removed = true; b.removed = true;
    plan.push([a, b]);
  }
  return plan;
}

function arrangePairs(rem) {
  const pos = layoutPositions();
  let plan = null;
  for (let attempt = 0; attempt < 12 && !plan; attempt++) plan = removalPlan(pos, true);
  // Every layout row is even, so peeling its exposed ends top-down always succeeds.
  if (!plan) plan = removalPlan(pos, false);
  const slots = plan.slice(-rem.length / 2);
  const counts = new Map();
  rem.forEach((t) => counts.set(t.face, (counts.get(t.face) || 0) + 1));
  const faces = [];
  counts.forEach((count, face) => { for (let i = 0; i < count; i += 2) faces.push(face); });
  Board.shuffle(faces);
  solution = slots.map((pair, i) => pair.map((p, j) => {
    const t = rem[i * 2 + j];
    t.x = p.x; t.y = p.y; t.z = p.z; t.face = faces[i];
    return t.id;
  }));
}

function dealBoard() {
  const pos = layoutPositions();
  const copies = pos.length / FACES.length;
  tiles = pos.map((p, i) => ({ ...p, id: i, face: Math.floor(i / copies), removed: false }));
  arrangePairs(tiles);
  boardPairs = tiles.length / 2;
}

function onTick() {
  if (over || menuPaused || Board.paused()) return;
  elapsed++;
  paint();
  const c = cfg();
  if (c.limit && elapsed >= c.limit) finish(false);
}

function newBoard() {
  Board.cancel(tickId);
  Board.cancel(hintTimer);
  tickId = null; hintTimer = 0;
  dealBoard();
  const c = cfg();
  hintLeft = c.hints; undoLeft = c.undos; shuffleLeft = c.shuffles;
  hintsUsed = 0; undosUsed = 0; shufflesUsed = 0;
  pairs = 0; moves = 0; score = 0; elapsed = 0;
  over = false; overReason = ''; recorded = false;
  selected = null; hinted = []; history = []; bulk = false;
  tickId = Board.every(1000, onTick);
  render(); paint();
  setStatus('Choose any glowing tile to begin.');
}

function choose(id) {
  if (over || menuPaused || Board.paused()) return;
  const t = tiles[id];
  if (!t || t.removed || !isFree(t)) return;
  if (selected === id) { selected = null; render(); return; }
  if (selected == null) {
    selected = id;
    if (!bulk) Board.sfx('click');
    render();
    setStatus('Tile selected — find its matching twin.');
    return;
  }
  const a = tiles[selected];
  if (a && a.face === t.face) {
    history.push({ a: a.id, b: t.id, moves: moves, score: score, pairs: pairs });
    a.removed = true; t.removed = true;
    selected = null; hinted = [];
    moves++; pairs++; score += 100;
    if (!bulk) Board.sfx('capture');
    render(); paint();
    if (tiles.every((x) => x.removed)) { finish(true); return; }
    setStatus('Beautiful match. <b>+100</b>');
    if (!availablePairs().length) recoverBoard();
  } else {
    selected = id;
    if (!bulk) Board.sfx('error');
    render();
    setStatus('Not a match — find the same symbol.');
  }
}

function recoverBoard() {
  const actions = [];
  if (undoLeft > 0 && history.length) actions.push(['Undo last match', undo]);
  if (shuffleLeft > 0) actions.push(['Shuffle tiles', shuffleBoard]);
  if (!actions.length) { finish(false, 'blocked'); return; }
  const message = 'No matching tiles are free. ' + (actions.length === 2 ? 'Undo the last match or shuffle the remaining tiles.' : undoLeft > 0 && history.length ? 'Undo the last match to try another path.' : 'Shuffle the remaining tiles to reopen the board.');
  setStatus(message);
  Board.modal('No matches available', message, [...actions, ['New board', newBoard]]);
}

function hint() {
  if (over || menuPaused || Board.paused()) return;
  const list = availablePairs();
  if (!list.length) { recoverBoard(); return; }
  if (hintLeft <= 0) { setStatus('No hints left on this board.'); return; }
  const pick = list[Board.rand(list.length)];
  hintLeft--; hintsUsed++;
  hinted = [pick[0].id, pick[1].id];
  Board.sfx('hint');
  render(); paint();
  setStatus('Two matching tiles are glowing.');
  Board.cancel(hintTimer);
  hintTimer = Board.after(1800, () => { hinted = []; render(); });
}

function undo() {
  if (over || menuPaused || Board.paused()) return;
  if (!history.length) { setStatus('Nothing to undo yet.'); return; }
  if (undoLeft <= 0) { setStatus('No undos left on this board.'); return; }
  const h = history.pop();
  tiles[h.a].removed = false; tiles[h.b].removed = false;
  moves = h.moves; score = h.score; pairs = h.pairs;
  undoLeft--; undosUsed++;
  selected = null; hinted = [];
  Board.sfx('undo');
  render(); paint();
  setStatus('Last match restored.');
}

function shuffleBoard() {
  if (over || menuPaused || Board.paused()) return;
  if (shuffleLeft <= 0) { setStatus('No shuffles left on this board.'); return; }
  const rem = tiles.filter((t) => !t.removed);
  if (rem.length < 2) return;
  arrangePairs(rem);
  shuffleLeft--; shufflesUsed++;
  history = []; selected = null; hinted = [];
  Board.sfx('dice');
  render(); paint();
  setStatus('Remaining tiles rearranged into a solvable layout.');
}

function finish(won, reason = 'time') {
  if (over) return;
  over = true;
  overReason = won ? 'cleared' : reason;
  Board.cancel(tickId); tickId = null;
  Board.cancel(hintTimer); hintTimer = 0;
  selected = null; hinted = [];
  const seconds = Math.max(0, Math.floor(elapsed));
  if (won) {
    score = score + 500 + Math.max(0, 900 - seconds * 3) - hintsUsed * 20 - undosUsed * 25 - shufflesUsed * 40;
  }
  score = Math.max(0, score);
  if (won) Board.sfx('win'); else Board.sfx('lose');

  const st = gameUI.stats();
  const cap = gm.charAt(0).toUpperCase() + gm.slice(1);
  const wins = (Number(st.wins) || 0) + (won ? 1 : 0);
  const careerPairs = (Number(st.pairs) || 0) + pairs;
  const modeWins = {};
  MODES.forEach((m) => { modeWins[m.id] = Number(st[m.id + 'Wins']) || 0; });
  if (won) modeWins[gm]++;
  const everyMode = MODES.every((m) => modeWins[m.id] > 0);

  const ach = [];
  if (won) {
    ach.push('first-clear');
    if (hintsUsed + undosUsed + shufflesUsed === 0) ach.push('no-help');
    if (shufflesUsed === 0) ach.push('shuffle-free');
    if (seconds < 90) ach.push('quick-clear');
    if (wins >= 5) ach.push('five-clears');
    if (wins >= 10) ach.push('ten-clears');
    if (gm !== 'classic') ach.push(gm + '-clear');
    if (everyMode) ach.push('all-modes');
  }
  if (careerPairs >= 100) ach.push('pairs-100');

  gameUI.record({
    score: score,
    seconds: seconds,
    result: won ? 'Cleared' : reason === 'blocked' ? 'No matches left' : 'Out of time',
    records: { ['bestScore' + cap]: score, bestPairs: pairs },
    mins: { ['bestTime' + cap]: won ? seconds : 0, ['bestMoves' + cap]: won ? moves : 0 },
    counters: {
      matches: 1,
      wins: won ? 1 : 0,
      losses: won ? 0 : 1,
      pairs: pairs,
      hints: hintsUsed,
      undos: undosUsed,
      shuffles: shufflesUsed,
      [gm + 'Wins']: won ? 1 : 0,
    },
    achievements: ach,
  });
  recorded = true;

  render(); paint();
  const title = won ? 'Board cleared' : reason === 'blocked' ? 'No matches left' : 'Out of time';
  const body = pairs + ' of ' + boardPairs + ' pairs · ' + fmt(seconds) + ' · ' + moves + ' moves<br><strong>' + score.toLocaleString() + ' points</strong>';
  setStatus(won ? 'Board cleared — beautiful work.' : reason === 'blocked' ? 'No matches or assists remain. Start a new board to try again.' : 'Time up. The clock beat the table.');
  Board.modal(title, body, [['New board', newBoard], ['Close']]);
}

/* ---------- window and controls ---------- */
$('#mj-hint').onclick = (e) => { e.currentTarget.blur(); hint(); };
$('#mj-undo').onclick = (e) => { e.currentTarget.blur(); undo(); };
$('#mj-shuffle').onclick = (e) => { e.currentTarget.blur(); shuffleBoard(); };
$('#mj-new').onclick = (e) => { e.currentTarget.blur(); newBoard(); };

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || document.getElementById('bk-dlg')?.open) return;
  const k = e.key.toLowerCase();
  if (k === 'h') { e.preventDefault(); hint(); }
  else if (k === 'u') { e.preventDefault(); undo(); }
  else if (k === 's') { e.preventDefault(); shuffleBoard(); }
  else if (k === 'n') { e.preventDefault(); newBoard(); }
});

window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => render(), 120);
});

/* ---------- deterministic test hooks ---------- */
function state() {
  return {
    mode: gm,
    tiles: tiles.length,
    left: tiles.filter((t) => !t.removed).length,
    boardPairs: boardPairs,
    pairs: pairs,
    moves: moves,
    score: score,
    seconds: Math.floor(elapsed),
    over: over,
    won: over && overReason === 'cleared',
    overReason: overReason,
    paused: menuPaused || Board.paused(),
    hints: hintLeft,
    undos: undoLeft,
    shuffles: shuffleLeft,
    hintsUsed: hintsUsed,
    undosUsed: undosUsed,
    shufflesUsed: shufflesUsed,
    recorded: recorded,
    modal: modalOpen(),
  };
}
function modalOpen() {
  const d = document.getElementById('bk-dlg');
  return !!(d && d.open);
}
if (/(\?|&)test=1(?:&|$)/.test(location.search)) {
  window.MahjongTest = {
    state: state,
    solution: () => solution.map((pair) => pair.slice()),
    modes: () => MODES.map((m) => m.id),
    setMode: (id) => gameUI.setMode(id),
    getMode: () => gm,
    restart: () => { newBoard(); return state(); },
    start: () => { resumePlay(); Board.setPaused(false); return state(); },
    pause: (value) => { menuPaused = !!value; return menuPaused; },
    setElapsed: (sec) => { elapsed = Math.max(0, Number(sec) || 0); paint(); return state(); },
    expire: () => { if (!over) { const c = cfg(); if (c.limit) elapsed = c.limit; finish(false); } return state(); },
    hint: () => { hint(); return state(); },
    undo: () => { undo(); return state(); },
    shuffle: () => { shuffleBoard(); return state(); },
    sweep: () => {
      if (over || menuPaused || Board.paused()) return state();
      bulk = true;
      selected = null; hinted = [];
      try {
        for (const [a, b] of solution) {
          if (tiles[a].removed && tiles[b].removed) continue;
          if (over || !isFree(tiles[a]) || !isFree(tiles[b]) || tiles[a].face !== tiles[b].face) break;
          choose(a);
          if (!over) choose(b);
        }
      } finally { bulk = false; }
      render(); paint();
      return state();
    },
    close: () => { const d = document.getElementById('bk-dlg'); if (d && d.open) d.close(); return true; },
    modalOpen: modalOpen,
    cosmetic: (slot, id) => { applyCosmetic(slot, id); return { slot: slot, id: cosmeticKey(id) }; },
    cosmeticList: () => (window.Meta && Meta.getCosmetics ? Meta.getCosmetics(GAME_ID) : []),
    colors: () => ({
      skin: look.skin, face1: TILE_SKINS[look.skin][0], face2: TILE_SKINS[look.skin][1], edge: TILE_SKINS[look.skin][2], ink: TILE_SKINS[look.skin][3],
      palette: look.palette, felt1: FELTS[look.palette][0], felt2: FELTS[look.palette][1],
      effect: look.effect, glow: GLOWS[look.effect],
      theme: look.theme, accent: INKS[look.theme],
    }),
    stats: () => gameUI.stats(),
    achievements: () => (Save.load(GAME_ID).achievements || []),
  };
}

newBoard();
initialized = true;
</script>
<script src="../../kits/menu-bootstrap.js"></script>
