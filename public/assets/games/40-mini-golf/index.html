<script>

  let h, segs, ball, last, strokes, state, drag = null, ptr = { x: 0, y: 0 }, aimA, kp = 0, wasChg = false, sinkT = 0, between = 0, msg = '', msgT = 0, totalS = 0, totalPar = 0, hitCd = 0, inited = false;

  function slideY(s) { return s.y + Math.sin(G.t * s.spd + s.ph) * s.amp; }

  }
  function finishHole(pickup) {
    const par = hole().par, s = pickup ? mode().pickupAt : strokes, d = s - par; let name, pts;
    if (!pickup && s === 1) { name = 'HOLE IN ONE!'; pts = 80; } else { name = pickup ? 'Pick up (' + mode().pickupAt + ' strokes)' : d <= -2 ? 'Eagle!' : d === -1 ? 'Birdie!' : d === 0 ? 'Par' : d === 1 ? 'Bogey' : 'Double bogey+'; pts = pickup ? 0 : Math.max(0, (par + 3 - s) * 10); }

      else if (d === -1) roundBirdies++;

    if (!pickup) { A.sfx(d <= 0 ? 'win' : 'coin'); G.burst(hole().hole[0], hole().hole[1], 26, { color: ['#fbbf24', '#fff', '#22c55e'], speed: 4, glow: true }); }
    award('first-hole', 'Tee Time');
    if (!pickup && s === 1) award('ace', 'Hole In One');
    if (roundAces >= 2) award('ace-pair', 'Double Ace');
    if (!pickup && d <= -2 && s > 1) award('eagle', 'Eagle Eye');
    if (!pickup && d === -1 && s > 1) award('birdie', 'Under Par');
    if (underParStreak >= 3) award('steady', 'Steady Hand');
  }
  function recordRound() {
    const st0 = stats(), patch = {
      rounds: (st0.rounds || 0) + 1,
      holes: (st0.holes || 0) + holesPlayed,
      strokes: (st0.strokes || 0) + totalS,
      aces: (st0.aces || 0) + roundAces,
      birdies: (st0.birdies || 0) + roundBirdies,
      eagles: (st0.eagles || 0) + roundEagles,
      pars: (st0.pars || 0) + roundPars,
      pickups: (st0.pickups || 0) + roundPickups,
      bestRound: Math.max(st0.bestRound || 0, G.score),
    };

    if (holes().length === 9) {

  function finishRound(timedOut) {

      if (roundPickups === 0) award('clean-card', 'Clean Card');

    if (!timedOut) {
      if (activeMode === 'sprint') award('sprint-clear', 'Quick Round');
      if (activeMode === 'windy') award('windy-clear', 'Wind Player');
      if (activeMode === 'tight') award('tight-clear', 'Threading It');
      if (activeMode === 'master') award('master-clear', 'Club Champion');

    const sub = timedOut ? 'The clock ran out after ' + holesPlayed + ' hole' + (holesPlayed === 1 ? '' : 's') : totalS + ' strokes (' + (toPar === 0 ? 'level par' : (toPar > 0 ? '+' : '') + toPar + ' vs par') + ')';

    }
  }

    for (const b of H0.bumpers || []) { c.fillStyle = '#ef4444'; c.beginPath(); c.arc(b[0], b[1], b[2], 0, A.TAU); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke(); c.fillStyle = '#fff'; c.beginPath(); c.arc(b[0], b[1], b[2] * 0.35, 0, A.TAU); c.fill(); }
    c.strokeStyle = '#b45309'; c.lineWidth = (WALL + 1) * 2; for (const s of H0.slides || []) { const y = slideY(s); c.beginPath(); c.moveTo(s.x, y - s.len / 2); c.lineTo(s.x, y + s.len / 2); c.stroke(); }
    if (H0.mill) { const m = H0.mill, a = g.t * m.spd; c.strokeStyle = '#fbbf24'; c.lineWidth = WALL * 2; for (let q = 0; q < 2; q++) { const aa = a + q * Math.PI / 2, ux = Math.cos(aa) * m.len / 2, uy = Math.sin(aa) * m.len / 2; c.beginPath(); c.moveTo(m.cx - ux, m.cy - uy); c.lineTo(m.cx + ux, m.cy + uy); c.stroke(); } c.fillStyle = '#7c2d12'; c.beginPath(); c.arc(m.cx, m.cy, 9, 0, A.TAU); c.fill(); }
    c.lineCap = 'butt';
    /* flag */
    c.strokeStyle = '#e5e7eb'; c.lineWidth = 2; c.beginPath(); c.moveTo(H0.hole[0], H0.hole[1]); c.lineTo(H0.hole[0], H0.hole[1] - 38); c.stroke(); c.fillStyle = '#ef4444'; c.beginPath(); c.moveTo(H0.hole[0], H0.hole[1] - 38); c.lineTo(H0.hole[0] + 18, H0.hole[1] - 31 + Math.sin(g.t * 0.1) * 1.5); c.lineTo(H0.hole[0], H0.hole[1] - 24); c.fill();
    drawBall(c);
    if (state === 'aim') {
      let a = aimA, p = kp > 0 ? kp : 0.5, show = guideVisible();
      if (drag) { const dx = drag.x - ptr.x, dy = drag.y - ptr.y, len = Math.hypot(dx, dy); if (len > 6) { a = Math.atan2(dy, dx); p = Math.min(1, len / 150); } else show = false; }
      if (show) {
        const L = 24 + p * 130; c.setLineDash([6, 6]); c.strokeStyle = 'rgba(' + aim + ',.85)'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(ball.x, ball.y); c.lineTo(ball.x + Math.cos(a) * L, ball.y + Math.sin(a) * L); c.stroke(); c.setLineDash([]);
        c.fillStyle = 'rgba(0,0,0,.5)'; A.roundRect(c, ball.x - 30, ball.y + 18, 60, 8, 4); c.fill(); c.fillStyle = A.mix('#22c55e', '#ef4444', p); A.roundRect(c, ball.x - 30, ball.y + 18, 60 * Math.max(0.05, p), 8, 4); c.fill();
      }
    }
    g.drawFX(c);
    if (mode().wind) A.text(c, mode().wind > 0 ? 'WIND →' : 'WIND ←', 14, 74, 13, '#67e8f9', 'left', '800');
    if (msgT > 0) { c.save(); c.globalAlpha = Math.min(1, msgT / 20); const big = /HOLE IN|Eagle|Birdie|Par|Bogey|Pick|Splash/.test(msg); A.glowText(c, msg, 400, big ? 70 : 62, big ? 28 : 22, '#fbbf24', 'center'); c.restore(); }
    A.text(c, 'Total ' + totalS + ' strokes (par ' + totalPar + ')', 14, 466, 12, '#8b93b3', 'left', '700');
    if (g.t < 500 && state === 'aim') A.text(c, 'Drag back from anywhere and release — or ← → to aim, hold Space to charge', 400, 466, 13, 'rgba(255,255,255,.75)', 'center', '700');
  }
  const game = Arcade.game({ id: GAME_ID, title: 'Mini Golf', subtitle: 'Nine holes. Fewest strokes wins — par scores the most points.', w: W, h: H, color: '#84cc16',
    controls: [['Drag back & release', 'putt (longer pull = harder)'], ['← / →', 'aim'], ['Hold Space, release', 'charge and putt'], ['Hazards', 'water costs a stroke · sand slows the ball']], init, update, draw });

  game.ui = UI.mountGame(game, {
    id: GAME_ID, title: 'Mini Golf', subtitle: 'Nine holes, one club, and a cup that is smaller than it looks.', accent: '#84cc16',
    modes: [
      { id: 'classic', name: 'Classic Round', blurb: 'Nine holes. Fewest strokes takes the card.', seasonTargets: [250, 380, 500] },
      { id: 'sprint', name: 'Speed Golf', blurb: 'Five holes against a 90-second clock. 1.2× score.', seasonTargets: [120, 160, 190] },
      { id: 'windy', name: 'Windy Links', blurb: 'A crosswind bends every putt. 1.3× score.', seasonTargets: [250, 340, 400] },
      { id: 'tight', name: 'Tight Cup', blurb: 'A smaller cup and six strokes to pick up. 1.4× score.', seasonTargets: [280, 360, 430] },
      { id: 'master', name: 'Championship', blurb: 'Tight cups, crosswind, and no aim guide. 1.6× score.', lockedHint: 'Score 200 in Classic Round to unlock', requires: { stat: 'classicBest', gte: 200 }, seasonTargets: [300, 390, 460] },
    ],
    settings: [
      { key: 'difficulty', label: 'Difficulty', type: 'select', options: ['easy', 'normal', 'hard'], default: 'normal' },
      { key: 'trajectory', label: 'Aim guide', type: 'toggle', default: true },
    ],
    achievements: ACHIEVEMENTS,
    tutorial: { type: 'interactive', steps: [
      { text: 'Drag back from the ball and release to putt — longer pulls hit harder.' },
      { text: 'Or use ← / → to aim, then hold Space and release to charge the putt.' },
      { text: 'Water adds a stroke and sends you back; sand drags on the ball.' },
      { text: 'Speed Golf runs on a clock and Championship hides the aim guide — finish under par to climb the card.' },
    ] },
    chapter: 'PUTTING GREENS', levels: [{}, {}, {}],
    hooks: {
      applyMode: (next) => {
        const key = MODE[next] ? next : 'classic';
        if (key === 'master' && !(Number(stats().classicBest) >= 200)) {
          UI.toast('Score 200 in Classic Round to unlock Championship', { color: '#84cc16' });
          return false;
        }
        activeMode = key;
        if (game && lastInitMode !== activeMode) game.restart(false);
        return true;
      },
      applySetting: (key, value) => {
        if (key === 'trajectory') guideOn = value !== false;
        if (key === 'difficulty' && (value === 'easy' || value === 'normal' || value === 'hard')) {
          A.difficulty = value;
          A.speedMult = value === 'easy' ? 0.8 : value === 'hard' ? 1.35 : 1;
        }
      },
      applyCosmetic,
    },
  });

  if (/(\?|&)test=1(?:&|$)/.test(location.search)) {
    window.MiniGolfTest = {
      state() {
        return {
          mode: activeMode, state: G.state, phase: state, hole: h + 1, holes: holes().length, par: hole().par,
          strokes, totalS, totalPar, toPar: totalS - totalPar, score: G.score, hi: G.hi,
          aces: roundAces, birdies: roundBirdies, eagles: roundEagles, pars: roundPars, pickups: roundPickups,
          clock: timeLeft, cup: cup(), wind: mode().wind, guide: mode().guide && guideOn,
          msg, underParStreak, played: holesPlayed, title: G.title,
        };
      },
      modes() { return ['classic', 'sprint', 'windy', 'tight', 'master']; },
      setMode(id) { return game.ui.setMode(id); },
      getMode() { return activeMode; },
      restart(auto) { game.restart(auto === true); },
      begin() { if (G.state === 'ready') game.begin(); },
      finish(n, pickup) { strokes = Math.max(1, n | 0); finishHole(!!pickup); return this.state(); },
      setClock(n) { timeLeft = Math.max(0, n | 0); return timeLeft; },
      tick(n) { const count = n == null ? 1 : Math.max(1, n | 0); for (let i = 0; i < count; i++) update(G); return this.state(); },
      cosmetic(slot, id) { applyCosmetic(slot, id); },
      colors() { return { ball: look.ball.main, grass: look.grass, aim: look.aim, sky: look.sky }; },
      cosmeticList() { return window.Meta && typeof Meta.getCosmetics === 'function' ? Meta.getCosmetics(GAME_ID) : []; },
      stats() { return saved(); },
      modalOpen() { return G.state === 'won' || G.state === 'over'; },
    };
  }
})();
</script>
