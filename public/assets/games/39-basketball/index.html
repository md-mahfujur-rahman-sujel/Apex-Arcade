<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basketball Hoops</title>
<script src="../../kits/music-kit.js"></script><script src="../../kits/menu-kit.js"></script>
</head>
<body>

<script src="../../kits/perf-kit.js"></script>
<script src="../../kits/save-kit.js"></script>
<script src="../../kits/meta-config.js"></script>
<script src="../../kits/meta-kit.js"></script>
<script src="../../kits/arcade-core.js"></script>
<script src="../../kits/score-bridge.js"></script>
<script src="../../kits/ui-kit.js"></script>
<script>
(function () {
  const A = Arcade, W = 800, H = 480, FLOOR = 430, BR = 12, RIMY = 214, RL = 692, RR = 732, BBX = 742, GRAV = 0.32, THREE = 300, TIME = 60 * 60;
  let G, ball, st, drag = null, ptr = { x: 0, y: 0 }, kang = 55, kpow = 0, wasChg = false, shots, made, streak, timeLeft, msg, msgT, net, scored, touched, bounces, waitT, three, prevY, inited = false, spot;
  function spawn() { spot = A.rand(90, 480); ball = { x: spot, y: FLOOR - BR - 2, vx: 0, vy: 0 }; st = 'aim'; scored = false; touched = false; bounces = 0; three = spot < THREE; prevY = ball.y; drag = null; }
  function init(g) { G = g; shots = 0; made = 0; streak = 0; timeLeft = TIME; msg = ''; msgT = 0; net = 0; kang = 55; kpow = 0; wasChg = false; spawn(); if (!inited) { inited = true; bind(); } }
  const pt = (e) => { const r = G.canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  function bind() {
    const cv = G.canvas;
    cv.addEventListener('pointermove', (e) => { ptr = pt(e); });
    cv.addEventListener('pointerdown', (e) => { if (G.state !== 'playing' || st !== 'aim') return; ptr = pt(e); drag = { x: ptr.x, y: ptr.y }; });
    window.addEventListener('pointerup', () => {
      if (!drag) return; const d = drag; drag = null; if (G.state !== 'playing' || st !== 'aim') return;
      const dx = d.x - ptr.x, dy = d.y - ptr.y, len = Math.hypot(dx, dy); if (len < 14) return;
      const v = Math.min(len, 150) * 0.112; shoot(dx / len * v, dy / len * v);
    });
  }
  function shoot(vx, vy) { ball.vx = vx; ball.vy = vy; st = 'fly'; shots++; prevY = ball.y; A.sfx('flap'); }
  function result(ok) { waitT = ok ? 55 : 35; st = 'wait'; if (!ok) { streak = 0; msg = ''; } }
  function score() {
    scored = true; made++; streak++; const swish = !touched; let pts = three ? 3 : 2; if (swish) pts += 1; const bonus = streak >= 3 ? 1 : 0;
    G.addScore(pts + bonus); net = 30; A.sfx('coin'); G.burst((RL + RR) / 2, RIMY + 14, 18, { color: ['#fbbf24', '#fff', '#fb923c'], speed: 4, glow: true });
    msg = (swish ? 'SWISH! ' : '') + (three ? '3-pointer! ' : '') + '+' + (pts + bonus) + (bonus ? ' (streak bonus)' : ''); msgT = 80; G.popup((RL + RR) / 2, RIMY - 20, '+' + (pts + bonus), '#fbbf24', 22);
  }
  function step() {
    ball.vy += GRAV; prevY = ball.y; ball.x += ball.vx; ball.y += ball.vy;
    if (ball.y > FLOOR - BR) { ball.y = FLOOR - BR; ball.vy = -Math.abs(ball.vy) * 0.55; ball.vx *= 0.88; bounces++; if (Math.abs(ball.vy) > 1.5) A.sfx('bounce'); if (Math.abs(ball.vy) < 1.3) ball.vy = 0; }
    if (ball.x + BR > BBX && ball.y > 100 && ball.y < 262 && ball.vx > 0) { ball.x = BBX - BR; ball.vx = -ball.vx * 0.6; touched = true; A.sfx('thud'); }
    for (const rx of [RL, RR]) {
      const dx = ball.x - rx, dy = ball.y - RIMY, d = Math.hypot(dx, dy), m = BR + 3.5;
      if (d < m && d > 0.01) { const nx = dx / d, ny = dy / d; ball.x = rx + nx * m; ball.y = RIMY + ny * m; const dot = ball.vx * nx + ball.vy * ny; if (dot < 0) { ball.vx -= 1.7 * dot * nx; ball.vy -= 1.7 * dot * ny; ball.vx *= 0.9; ball.vy *= 0.9; } touched = true; A.sfx('pop'); }
    }
    if (!scored && prevY < RIMY && ball.y >= RIMY && ball.vy > 0 && ball.x > RL + 4 && ball.x < RR - 4) score();
  }
  function update(g) {
    if (g.state !== 'playing') return; if (msgT > 0) msgT--; if (net > 0) net--;
    timeLeft--; g.hudR = 'TIME ' + Math.max(0, Math.ceil(timeLeft / 60)); g.hudL = 'SCORE ' + g.score + (streak >= 2 ? '   STREAK ' + streak : '');
    if (timeLeft <= 0) { g.win('Buzzer!', made + ' of ' + shots + ' shots made'); return; }
    if (st === 'aim') {
      if (A.held('ArrowUp', 'KeyW')) kang = Math.min(80, kang + 0.8); if (A.held('ArrowDown', 'KeyS')) kang = Math.max(20, kang - 0.8);
      const chg = A.held('Space'); if (chg) kpow = Math.min(1, kpow + 0.017); else if (wasChg && kpow > 0.12) { const a = kang * Math.PI / 180, v = 5 + kpow * 11.5; shoot(Math.cos(a) * v, -Math.sin(a) * v); kpow = 0; } else kpow = 0;
      wasChg = chg;
    } else if (st === 'fly') {
      for (let k = 0; k < 2; k++) stepHalfCore();
      const out = ball.x > W + 30 || ball.x < -30 || bounces >= 2 || (ball.y > FLOOR - BR - 2 && Math.abs(ball.vx) < 0.3 && ball.vy === 0);
      if (scored && ball.y > FLOOR - 40) result(true); else if (out) result(scored);
    } else if (st === 'wait') { if (--waitT <= 0) spawn(); }
  }
  function stepHalfCore() {
    ball.vy += GRAV / 2; prevY = ball.y; ball.x += ball.vx / 2; ball.y += ball.vy / 2;
    if (ball.y > FLOOR - BR) { ball.y = FLOOR - BR; ball.vy = -Math.abs(ball.vy) * 0.55; ball.vx *= 0.94; bounces++; if (Math.abs(ball.vy) > 1.5) A.sfx('bounce'); if (Math.abs(ball.vy) < 1.3) ball.vy = 0; }
    if (ball.x + BR > BBX && ball.y > 100 && ball.y < 262 && ball.vx > 0) { ball.x = BBX - BR; ball.vx = -ball.vx * 0.6; touched = true; A.sfx('thud'); }
    for (const rx of [RL, RR]) {
      const dx = ball.x - rx, dy = ball.y - RIMY, d = Math.hypot(dx, dy), m = BR + 3.5;
      if (d < m && d > 0.01) { const nx = dx / d, ny = dy / d; ball.x = rx + nx * m; ball.y = RIMY + ny * m; const dot = ball.vx * nx + ball.vy * ny; if (dot < 0) { ball.vx -= 1.7 * dot * nx; ball.vy -= 1.7 * dot * ny; ball.vx *= 0.92; ball.vy *= 0.92; } touched = true; A.sfx('pop'); }
    }
    if (!scored && prevY < RIMY && ball.y >= RIMY && ball.vy > 0 && ball.x > RL + 4 && ball.x < RR - 4) score();
  }
  function aimVec() {
    if (drag) { const dx = drag.x - ptr.x, dy = drag.y - ptr.y, len = Math.hypot(dx, dy); if (len < 8) return null; const v = Math.min(len, 150) * 0.112; return { vx: dx / len * v, vy: dy / len * v, p: Math.min(len, 150) / 150 }; }
    const a = kang * Math.PI / 180, p = kpow > 0 ? kpow : 0.62, v = 5 + p * 11.5; return { vx: Math.cos(a) * v, vy: -Math.sin(a) * v, p: kpow, key: true };
  }
  function draw(g, c) {
    A.sky(c, W, H, ['#1b2340', '#2b1f3d', '#3a2a4a']);
    c.fillStyle = 'rgba(255,255,255,.05)'; for (let i = 0; i < 12; i++) c.fillRect(i * 70 + 10, 60, 50, 150);
    const fl = c.createLinearGradient(0, FLOOR, 0, H); fl.addColorStop(0, '#c8924f'); fl.addColorStop(1, '#8a5a24'); c.fillStyle = fl; c.fillRect(0, FLOOR, W, H - FLOOR);
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 3; c.beginPath(); c.moveTo(THREE, FLOOR); c.lineTo(THREE, H); c.stroke(); A.text(c, '3 PTS', THREE - 8, FLOOR + 30, 12, 'rgba(255,255,255,.8)', 'right', '800'); A.text(c, '2 PTS', THREE + 8, FLOOR + 30, 12, 'rgba(255,255,255,.8)', 'left', '800');
    /* hoop */
    c.fillStyle = '#334155'; c.fillRect(BBX + 8, 120, 6, FLOOR - 120);
    c.fillStyle = '#f8fafc'; A.roundRect(c, BBX, 100, 10, 160, 3); c.fill(); c.strokeStyle = '#ef4444'; c.lineWidth = 3; c.strokeRect(BBX + 1, 190, 8, 52);
    const sw = net > 0 ? Math.sin(net * 0.7) * 3 * (net / 30) : 0;
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.2; for (let i = 0; i <= 5; i++) { const t = i / 5; c.beginPath(); c.moveTo(RL + (RR - RL) * t, RIMY); c.lineTo(RL + 8 + (RR - RL - 16) * t + sw, RIMY + 38); c.stroke(); }
    for (let j = 1; j <= 3; j++) { const y = RIMY + j * 10, ins = j * 2.7; c.beginPath(); c.moveTo(RL + ins + sw * j / 3, y); c.lineTo(RR - ins + sw * j / 3, y); c.stroke(); }
    c.strokeStyle = '#f97316'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(RL - 3, RIMY); c.lineTo(RR + 3, RIMY); c.stroke(); c.lineCap = 'butt';
    /* ball + aim */
    if (st === 'aim') {
      A.shadow(c, ball.x, FLOOR + 3, 14, 4, 0.35);
      const v = aimVec();
      if (v) { for (let k = 2; k < 60; k += 3) { const x = ball.x + v.vx * k, y = ball.y + v.vy * k + 0.5 * GRAV * k * k; if (y > FLOOR) break; c.fillStyle = 'rgba(255,255,255,' + (0.85 - k * 0.012) + ')'; c.beginPath(); c.arc(x, y, 3, 0, A.TAU); c.fill(); }
        const p = v.key ? kpow : v.p; c.fillStyle = 'rgba(0,0,0,.5)'; A.roundRect(c, ball.x - 40, FLOOR + 44, 80, 10, 5); c.fill(); c.fillStyle = A.mix('#22c55e', '#ef4444', p); A.roundRect(c, ball.x - 40, FLOOR + 44, 80 * Math.max(0.04, p), 10, 5); c.fill(); }
    }
    if (st === 'fly') A.shadow(c, ball.x, FLOOR + 3, 12 * Math.max(0.3, 1 - (FLOOR - ball.y) / 500), 3, 0.25);
    c.save(); c.translate(ball.x, ball.y); c.rotate(ball.x * 0.05); const bg = c.createRadialGradient(-4, -4, 1, 0, 0, BR); bg.addColorStop(0, '#fdba74'); bg.addColorStop(1, '#c2410c'); c.fillStyle = bg; c.beginPath(); c.arc(0, 0, BR, 0, A.TAU); c.fill(); c.strokeStyle = '#431407'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-BR, 0); c.lineTo(BR, 0); c.moveTo(0, -BR); c.lineTo(0, BR); c.stroke(); c.beginPath(); c.arc(0, 0, BR * 0.7, 0.5, 2.6); c.stroke(); c.restore();
    g.drawFX(c);
    if (msgT > 0) { c.save(); c.globalAlpha = Math.min(1, msgT / 20); A.glowText(c, msg, 400, 150, 28, '#fbbf24', 'center'); c.restore(); }
    A.text(c, 'Shots ' + made + '/' + shots, 14, 52, 13, '#c8cde4', 'left', '700');
    if (st === 'aim' && !drag && g.t < 400) A.text(c, 'Drag back from anywhere and release — or ↑/↓ to angle, hold Space to charge', 400, 460, 13, 'rgba(255,255,255,.8)', 'center', '700');
  }
  Arcade.game({ id: 'basketball', title: 'Basketball Hoops', subtitle: 'Sixty seconds. Shoot for the net and chase a high score.', w: W, h: H, color: '#fb923c',
    controls: [['Drag back & release', 'shoot (longer pull = harder)'], ['↑ / ↓', 'raise or lower the angle'], ['Hold Space, release', 'charge and shoot'], ['Beyond the line', '3 points · swish +1 · 3 in a row +1']], init, update, draw });
})();
</script>
<script src="../../kits/menu-bootstrap.js"></script>
</body>
</html>
