<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mancala</title>
<style>
  .mc { display: grid; grid-template-columns: minmax(0, 760px) minmax(240px, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 1000px) { .mc { grid-template-columns: 1fr; } }
  #bd { display: grid; grid-template-columns: 1.15fr repeat(6, 1fr) 1.15fr; grid-template-rows: 1fr 1fr; gap: 10px; padding: 16px; border-radius: 22px; background: linear-gradient(var(--mc-board-a, #8a5a35), var(--mc-board-b, #5c3a1f)); box-shadow: 0 20px 50px -20px #000, 0 0 0 6px var(--mc-frame, #3b2412); user-select: none; touch-action: manipulation; }
  .pit, .store { position: relative; border-radius: 999px; background: radial-gradient(ellipse at 50% 30%, var(--mc-pit-a, #2e1c0e), var(--mc-pit-b, #170d05)); box-shadow: inset 0 6px 12px rgba(0,0,0,.65), 0 2px 0 rgba(255,255,255,.12); min-height: 0; }
  .pit { aspect-ratio: 1; align-self: center; cursor: default; }
  .store { grid-row: 1 / 3; border-radius: 999px / 40px; min-height: 160px; }
  .pit.ok { cursor: pointer; box-shadow: inset 0 6px 12px rgba(0,0,0,.65), 0 0 0 3px var(--mc-accent, #f59e0b); }
  .pit.ok:hover { box-shadow: inset 0 6px 12px rgba(0,0,0,.65), 0 0 0 4px var(--mc-accent, #fde047); }
  .pit.lm, .store.lm { outline: 3px solid var(--mc-last, #06b6d4); outline-offset: 2px; }
  .pit.pop { animation: pop .18s ease-out; }
  @keyframes pop { 50% { transform: scale(1.1); } }
  .n { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font: 700 13px/1 ui-monospace, Consolas, monospace; color: #fde68a; text-shadow: 0 1px 2px #000; }
  .store .n { bottom: 6px; font-size: 18px; }
  .st { position: absolute; width: 17%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: inset -2px -3px 0 rgba(0,0,0,.3), 0 2px 2px rgba(0,0,0,.5); }
  .store .st { width: 30%; }
  .lab { position: absolute; left: 12px; right: 12px; font: 700 12px/1 "Segoe UI", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: rgba(253, 230, 138, .7); pointer-events: none; }
  .side { display: grid; gap: 12px; }
  .capt { color: var(--muted); line-height: 1.7; }
  .capt b { color: #e6e9f5; }
  .clock { font: 700 15px ui-monospace, Consolas, monospace; color: #fde047; }
  .clock.low { color: #fb7185; }
  #bdw { padding-bottom: 8px; }
</style>
<script src="../../kits/music-kit.js"></script><script src="../../kits/menu-kit.js"></script>
</head>
<body>

<script src="../../kits/perf-kit.js"></script>
<script src="../../kits/save-kit.js"></script>
<script src="../../kits/meta-config.js"></script>
<script src="../../kits/meta-kit.js"></script>
<script src="../../kits/board-kit.js"></script>
<script src="../../kits/score-bridge.js"></script>
<script src="../../kits/ui-kit.js"></script>
<script>
const ui = Board.shell({
  id: 'mancala', cpu: true, title: 'Mancala', subtitle: 'Sow the stones, capture your rival\'s, fill your store',
  rules: 'Each side has six pits and a store (the big pit on that player\'s right). Pick one of your pits and sow its stones one by one counter-clockwise, dropping one into each pit and into your own store \u2014 but never into your rival\'s store. If your last stone lands in your store you move again. If it lands in an empty pit on your side and the pit across is not empty, you capture that pit plus your last stone into your store. When one side has no stones left, the other side banks theirs. Most stones in the store wins. Blitz adds a clock, Harvest starts with six stones per pit, and Sudden Death ends the moment one store reaches 25.',
  controls: [['Click', 'Sow from a highlighted pit'], ['1 \u2013 6', 'Sow from your pit 1\u20136 (left to right)'], ['U', 'Undo'], ['N', 'New game'], ['H / M', 'Toggle help / mute']],
});
ui.main.innerHTML = `
<div class="mc">
  <div id="bdw"><div id="bd"></div></div>
  <div class="side">
    <div class="bk-status" id="st"></div>
    <div class="bk-row">
      <label>Play <select class="bk-select" id="seat"><option value="a">You first vs computer</option><option value="b">Computer first</option><option value="two">Two players</option></select></label>
      <label>Level <select class="bk-select" id="lvl"><option value="0">Easy</option><option value="1" selected>Medium</option><option value="2">Hard</option></select></label>
    </div>
    <div class="bk-row"><button class="bk-btn bk-primary" id="new">New game</button><button class="bk-btn" id="undo">Undo</button></div>
    <div class="capt" id="cp"></div>
    <div id="md" style="color:var(--muted);font-size:13px;line-height:1.6"></div>
  </div>
</div>`;
const $ = (s) => ui.main.querySelector(s);

/* ---- rules: pits 0-5 + store 6 belong to side 0 (Amber); pits 7-12 + store 13 to side 1 (Violet) ---- */
const NAME = ['Amber', 'Violet'], COL = ['#f59e0b', '#a78bfa'];
const store = (s) => s * 7 + 6, mine = (i, s) => i >= s * 7 && i < s * 7 + 6;
const side = (b, s) => { let t = 0; for (let i = s * 7; i < s * 7 + 6; i++) t += b[i]; return t; };
function sim(b, i, s, steps) {
  let n = b[i], p = i; b[i] = 0;
  while (n--) { p = (p + 1) % 14; if (p === store(1 - s)) p = (p + 1) % 14; b[p]++; if (steps) steps.push(p); }
  if (p === store(s)) return true;
  if (mine(p, s) && b[p] === 1 && b[12 - p]) { b[store(s)] += b[12 - p] + 1; b[12 - p] = 0; b[p] = 0; if (steps) steps.cap = [p, 12 - p]; }
  return false;
}
function sweep(b) { if (!side(b, 0) || !side(b, 1)) { for (let s = 0; s < 2; s++) for (let i = s * 7; i < s * 7 + 6; i++) { b[store(s)] += b[i]; b[i] = 0; } return true; } return false; }
const legal = (b, s) => { const o = []; for (let i = s * 7; i < s * 7 + 6; i++) if (b[i]) o.push(i); return o; };
function nm(b, s, d, a, be) {
  if (sweep(b) || !d) return (b[store(s)] - b[store(1 - s)]) * 3 + side(b, s) - side(b, 1 - s);
  let best = -1e9; const ms = legal(b, s).reverse();
  for (const m of ms) {
    const b2 = b.slice(), ex = sim(b2, m, s), v = ex ? nm(b2, s, d - 1, a, be) : -nm(b2, 1 - s, d - 1, -be, -a);
    if (v > best) best = v; if (best > a) a = best; if (a >= be) break;
  }
  return best;
}

/* ---------------- modes, records, cosmetics ---------------- */
const MODE_NAMES = { classic: 'Classic', blitz: 'Blitz', harvest: 'Harvest', sudden: 'Sudden Death', grandmaster: 'Grandmaster' };
const MODE_KEY = { classic: 'Classic', blitz: 'Blitz', harvest: 'Harvest', sudden: 'Sudden', grandmaster: 'Grandmaster' };
const CFG = {
  classic: { stones: 4, clock: 0, target: 0, mult: 1, bonus: 1000 },
  blitz: { stones: 4, clock: 90000, target: 0, mult: 1.1, bonus: 900 },
  harvest: { stones: 6, clock: 0, target: 0, mult: 1.2, bonus: 1100 },
  sudden: { stones: 4, clock: 0, target: 25, mult: 1.3, bonus: 1200 },
  grandmaster: { stones: 4, clock: 0, target: 0, mult: 1.5, bonus: 1500 },
};
const MODES = [
  { id: 'classic', name: 'Classic', blurb: 'Four stones per pit. Most stones in the store wins.' },
  { id: 'blitz', name: 'Blitz', blurb: 'Ninety seconds each. Run out and you lose. 1.1\u00d7 score.' },
  { id: 'harvest', name: 'Harvest', blurb: 'Six stones per pit and a bigger store race. 1.2\u00d7 score.' },
  { id: 'sudden', name: 'Sudden Death', blurb: 'The first store to 25 stones wins instantly. 1.3\u00d7 score.' },
  { id: 'grandmaster', name: 'Grandmaster', blurb: 'The deepest sowing search at 1.5\u00d7 score.', requires: { stat: 'classicWins', gte: 1 }, lockedHint: 'Win a Classic game to unlock' },
];
const ACHIEVEMENTS = [
  { id: 'first-sow', name: 'First Sowing', desc: 'Sow from a pit.', rarity: 'common' },
  { id: 'first-capture', name: 'Harvested', desc: 'Capture stones from a rival pit.', rarity: 'common' },
  { id: 'extra-turn', name: 'Again', desc: 'Land your last stone in your store.', rarity: 'common' },
  { id: 'big-capture', name: 'Rich Vein', desc: 'Capture four or more stones in one move.', rarity: 'rare' },
  { id: 'classic-clear', name: 'Mancala Master', desc: 'Win a Classic game.', rarity: 'common' },
  { id: 'blitz-clear', name: 'Beat The Clock', desc: 'Win a Blitz game.', rarity: 'rare' },
  { id: 'harvest-clear', name: 'Bumper Crop', desc: 'Win a Harvest game.', rarity: 'rare' },
  { id: 'sudden-clear', name: 'Sudden Winner', desc: 'Win a Sudden Death game.', rarity: 'epic' },
  { id: 'grandmaster-clear', name: 'Grandmaster', desc: 'Win a Grandmaster game.', rarity: 'legendary' },
  { id: 'shutout', name: 'Empty Store', desc: 'Win with the rival store empty.', rarity: 'epic' },
  { id: 'landslide', name: 'Landslide', desc: 'Win by twenty or more stones.', rarity: 'rare' },
  { id: 'personal-best', name: 'Personal Best', desc: 'Set a new best score.', rarity: 'rare' },
];
const STONE_SETS = {
  'mancala:stones-classic': ['#fbbf24', '#f87171', '#34d399', '#60a5fa', '#e879f9', '#fde68a'],
  'mancala:stones-gem': ['#22d3ee', '#a78bfa', '#f472b6', '#4ade80', '#facc15', '#fb923c'],
  'mancala:stones-neon': ['#f0abfc', '#67e8f9', '#bef264', '#fde047', '#fb7185', '#a5b4fc'],
  'mancala:stones-pastel': ['#fda4af', '#c4b5fd', '#86efac', '#fdba74', '#93c5fd', '#f9a8d4'],
  'mancala:stones-mono': ['#f8fafc', '#cbd5e1', '#94a3b8', '#64748b', '#e2e8f0', '#a8b3c4'],
};
const BOARD_SETS = {
  'mancala:board-teak': { a: '#8a5a35', b: '#5c3a1f', frame: '#3b2412', pitA: '#2e1c0e', pitB: '#170d05' },
  'mancala:board-walnut': { a: '#6b4423', b: '#3f2612', frame: '#2a1809', pitA: '#241407', pitB: '#120a04' },
  'mancala:board-slate': { a: '#475569', b: '#273449', frame: '#111827', pitA: '#1e293b', pitB: '#0b1120' },
  'mancala:board-midnight': { a: '#1e3a5f', b: '#122033', frame: '#0a1220', pitA: '#0b1524', pitB: '#050a12' },
};
const ACCENTS = { 'mancala:accent-amber': '#f59e0b', 'mancala:accent-cyan': '#22d3ee', 'mancala:accent-lime': '#a3e635', 'mancala:accent-rose': '#fb7185' };
const THEMES = {
  'mancala:theme-night': '',
  'mancala:theme-desert': 'radial-gradient(1000px 500px at 10% -10%, #7c2d12, transparent 60%), radial-gradient(800px 500px at 100% 0, #422006, transparent 55%), #0a0705',
  'mancala:theme-dusk': 'radial-gradient(1000px 500px at 12% -8%, #4c1d3d, transparent 60%), radial-gradient(800px 500px at 100% 0, #1e3a5f, transparent 55%), #090a10',
};
const PALETTE = {
  stones: STONE_SETS['mancala:stones-classic'].slice(),
  board: Object.assign({}, BOARD_SETS['mancala:board-teak']),
  accent: ACCENTS['mancala:accent-amber'],
};
function paintPalette() {
  const el = document.getElementById('bd'); if (!el) return;
  el.style.setProperty('--mc-board-a', PALETTE.board.a);
  el.style.setProperty('--mc-board-b', PALETTE.board.b);
  el.style.setProperty('--mc-frame', PALETTE.board.frame);
  el.style.setProperty('--mc-pit-a', PALETTE.board.pitA);
  el.style.setProperty('--mc-pit-b', PALETTE.board.pitB);
  el.style.setProperty('--mc-accent', PALETTE.accent);
}
function applyCosmetic(slot, id) {
  if (slot === 'skin' && STONE_SETS[id]) PALETTE.stones = STONE_SETS[id].slice();
  else if (slot === 'palette' && BOARD_SETS[id]) PALETTE.board = Object.assign({}, BOARD_SETS[id]);
  else if (slot === 'effect' && ACCENTS[id]) PALETTE.accent = ACCENTS[id];
  else if (slot === 'theme' && THEMES[id] !== undefined) document.body.style.background = THEMES[id];
  paintPalette(); if (B) render();
}

/* ---- UI ---- */
let B, turn, over, mode = 'classic', seat = 'a', busy, hist, lm, flip, menuPaused = true, gen = 0;
let PS = [{ score: 0, caps: 0, moves: 0 }, { score: 0, caps: 0, moves: 0 }];
let clocks = [0, 0], clockTimer = null, clockLast = 0;
const bd = $('#bd'), els = Array(14);
const humanTurn = () => seat === 'two' || turn === (seat === 'a' ? 0 : 1);
const humanIndex = () => (seat === 'b' ? 1 : 0);
const humanSeatFor = (s) => seat === 'two' || s === (seat === 'a' ? 0 : 1);
const addScore = (s, n) => { if (PS[s]) PS[s].score += Math.max(0, Math.round(n)); };
const fmt = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
function place(i) {
  let row, col;
  if (i < 6) { row = 2; col = i + 2; } else { row = 1; col = 14 - i; }
  if (flip) { row = 3 - row; col = 9 - col; }
  return { r: row, c: col };
}
function build() {
  bd.innerHTML = '';
  for (let i = 0; i < 14; i++) {
    const d = document.createElement('div'); d.className = i % 7 === 6 ? 'store' : 'pit'; d.dataset.i = i;
    if (i === 6 || i === 13) { d.style.gridColumn = flip ? (i === 6 ? 1 : 8) : (i === 6 ? 8 : 1); d.style.gridRow = '1 / 3'; }
    else { const { r, c } = place(i); d.style.gridColumn = c; d.style.gridRow = r; }
    bd.appendChild(d); els[i] = d;
  }
}
function stones(d, n, seed) {
  let h = '', x = seed * 97 + 13;
  const rnd = () => { x = (x * 1103515245 + 12345) & 0x7fffffff; return x / 0x7fffffff; };
  for (let k = 0; k < Math.min(n, 18); k++) {
    const isStore = d.classList.contains('store'), a = rnd() * 6.283, rr = Math.sqrt(rnd()) * (isStore ? 28 : 30);
    const px = isStore ? 50 + Math.cos(a) * rr * 0.55 : 50 + Math.cos(a) * rr, py = isStore ? 30 + (k / 18) * 45 + rnd() * 6 : 50 + Math.sin(a) * rr;
    h += `<i class="st" style="left:${px}%;top:${py}%;background:${PALETTE.stones[(k + seed) % PALETTE.stones.length]}"></i>`;
  }
  return h + `<span class="n">${n}</span>`;
}
function render(b = B) {
  const ms = over || busy || !humanTurn() ? [] : legal(B, turn);
  els.forEach((d, i) => {
    d.innerHTML = stones(d, b[i], i) + (i === 6 || i === 13 ? `<span class="lab" style="top:8px;color:${COL[i === 6 ? 0 : 1]}">${NAME[i === 6 ? 0 : 1]}</span>` : '');
    d.classList.toggle('ok', b === B && ms.includes(i)); d.classList.toggle('lm', b === B && !!lm && lm.includes(i));
  });
  const t = turn;
  $('#st').textContent = over || (busy ? (humanTurn() ? 'Sowing\u2026' : 'Computer is thinking\u2026') : `${NAME[t]} to move${seat !== 'two' && humanTurn() ? ' \u2014 your turn' : ''}`);
  const clock = CFG[mode].clock ? `<div class="clock${clocks[0] < 15000 || clocks[1] < 15000 ? ' low' : ''}">Amber ${fmt(clocks[0])} \u00b7 Violet ${fmt(clocks[1])}</div>` : '';
  $('#cp').innerHTML = `${clock}Score: ${NAME[0]} <b>${B[6]}</b> \u2013 <b>${B[13]}</b> ${NAME[1]}<br>Stones in play: <b>${side(B, 0) + side(B, 1)}</b><br>Moves played: <b>${hist.length}</b>`;
  $('#md').textContent = MODE_NAMES[mode] + (CFG[mode].target ? ' \u00b7 first to ' + CFG[mode].target : '') + (CFG[mode].clock ? ' \u00b7 ninety seconds each' : '') + (CFG[mode].stones !== 4 ? ' \u00b7 ' + CFG[mode].stones + ' stones per pit' : '');
}
function newGame() {
  gen++; if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
  mode = ['classic', 'blitz', 'harvest', 'sudden', 'grandmaster'].includes(mode) ? mode : 'classic';
  seat = $('#seat').value; flip = seat === 'b';
  const cfg = CFG[mode];
  B = Array(14).fill(cfg.stones); B[6] = B[13] = 0;
  turn = 0; over = null; busy = false; hist = []; lm = null;
  PS = [{ score: 0, caps: 0, moves: 0 }, { score: 0, caps: 0, moves: 0 }];
  clocks = [cfg.clock, cfg.clock]; clockLast = Date.now();
  build(); paintPalette(); render();
  if (cfg.clock) clockTimer = setInterval(tickClock, 250);
  cpu();
}
function tickClock(step) {
  if (over) return;
  if (step == null) {
    const now = Date.now(), dt = now - clockLast; clockLast = now;
    if (busy || menuPaused || Board.paused()) return;
    clocks[turn] = Math.max(0, clocks[turn] - dt);
  } else clocks[turn] = Math.max(0, clocks[turn] - step);
  if (clocks[turn] <= 0) { conclude(1 - turn, 'on time'); return; }
  render();
}
async function move(i) {
  if (over || busy) return;
  const g = gen, s = turn, cfg = CFG[mode];
  hist.push({ B: B.slice(), turn, lm }); busy = true; render();
  const slow = !humanTurn(), steps = [], pre = B.slice(), extra = sim(B, i, s, steps);
  const disp = pre.slice(); disp[i] = 0; render(disp);
  for (const p of steps) {
    await Board.sleep(slow ? Board.pace(300) : 190); if (g !== gen) return;
    disp[p]++; Board.sfx('step'); render(disp); els[p].classList.remove('pop'); void els[p].offsetWidth; els[p].classList.add('pop');
  }
  if (steps.cap) { await Board.sleep(slow ? Board.pace(700) : 450); if (g !== gen) return; Board.sfx('capture'); }
  lm = [steps[steps.length - 1]]; if (steps.cap) lm.push(...steps.cap);
  const captured = steps.cap ? pre[steps.cap[1]] + 1 : 0;
  PS[s].moves += 1;
  if (humanSeatFor(s)) {
    GameUI.unlock('first-sow');
    if (captured) GameUI.unlock('first-capture');
    if (captured >= 4) GameUI.unlock('big-capture');
    if (extra) GameUI.unlock('extra-turn');
  }
  if (captured) { addScore(s, captured * 10); PS[s].caps += captured; }
  if (extra) addScore(s, 20);
  if (cfg.target && B[store(s)] >= cfg.target) { busy = false; render(); conclude(s, 'target'); return; }
  const ended = sweep(B); busy = false;
  if (ended) {
    const winner = B[6] === B[13] ? null : (B[6] > B[13] ? 0 : 1);
    render(); conclude(winner, 'final'); return;
  }
  if (!extra) turn = 1 - turn; else Board.sfx('ladder');
  render(); cpu();
}
function conclude(winner, reason) {
  if (over) return;
  over = winner == null ? 'Draw \u2014 equal stores' : `${NAME[winner]} wins!`;
  busy = false; gen++;
  if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
  const cfg = CFG[mode], h = humanIndex();
  const humanWon = winner != null && (seat === 'two' ? winner === 0 : winner === h);
  const base = PS[h].score + (humanWon ? cfg.bonus : 0);
  const finalScore = Math.round(base * cfg.mult);
  const records = {}; records['best' + MODE_KEY[mode] + 'Score'] = finalScore; records.mostCaptured = PS[h].caps;
  const counters = { stonesCaptured: PS[h].caps, movesPlayed: PS[h].moves };
  if (humanWon) { counters.wins = 1; counters[mode + 'Wins'] = 1; }
  const achievements = [];
  if (humanWon) {
    achievements.push(mode + '-clear');
    if (B[store(1 - h)] === 0) achievements.push('shutout');
    if (B[store(h)] - B[store(1 - h)] >= 20) achievements.push('landslide');
  }
  const prevBest = Number(GameUI.stats().bestScore) || 0;
  GameUI.record({
    score: finalScore,
    result: (winner == null ? 'Draw' : NAME[winner] + ' won') + ' ' + MODE_NAMES[mode] + (reason === 'on time' ? ' on time' : ''),
    records, counters,
    mins: humanWon ? { fewestMoves: PS[h].moves } : {},
    achievements,
  });
  if (finalScore > prevBest) GameUI.unlock('personal-best');
  render();
  const title = seat === 'two' ? (winner == null ? 'Draw' : NAME[winner] + ' wins!') : humanWon ? 'You won!' : winner != null ? 'Computer wins' : 'Draw';
  const detail = finalScore + ' pts \u00b7 ' + MODE_NAMES[mode] + (reason === 'on time' ? ' \u00b7 won on time' : '');
  Board.sfx(seat === 'two' || humanWon ? 'win' : winner != null ? 'lose' : 'move');
  Board.modal(title, detail, [['New game', newGame], ['Close']]);
}
function cpu() {
  if (over || busy || humanTurn()) return;
  const g = gen, s = turn; busy = true; render();
  const go = () => {
    if (g !== gen || over) return;
    if (menuPaused || Board.paused()) { Board.after(250, go); return; }
    Board.think(() => {
      const L = +$('#lvl').value, d = mode === 'grandmaster' ? 8 : [1, 5, 8][L], noise = mode === 'grandmaster' ? 0 : [6, 0, 0][L]; let bm = -1, bs = -1e9;
      for (const m of legal(B, s)) {
        const b2 = B.slice(), ex = sim(b2, m, s), v = (ex ? nm(b2, s, d - 1, -1e9, 1e9) : -nm(b2, 1 - s, d - 1, -1e9, 1e9)) + (ex ? 2 : 0) + Math.random() * noise;
        if (v > bs) { bs = v; bm = m; }
      }
      return bm;
    }, 1000).then(async (bm) => {
      if (g !== gen || bm < 0) return;
      els[bm].classList.add('ok'); await Board.sleep(Board.pace(450));
      if (g !== gen) return;
      busy = false; move(bm);
    });
  };
  go();
}
bd.addEventListener('click', (e) => {
  const d = e.target.closest('.pit'); if (!d || over || busy || !humanTurn()) return;
  const i = +d.dataset.i; if (!mine(i, turn) || !B[i]) { Board.sfx('error'); return; } move(i);
});
function undo() {
  if (busy || !hist.length) return;
  const pop = () => { const h = hist.pop(); B = h.B; turn = h.turn; lm = h.lm; };
  pop(); while (seat !== 'two' && hist.length && !humanTurn()) pop();
  over = null; render(); cpu();
}
$('#new').onclick = newGame; $('#undo').onclick = undo; $('#seat').onchange = newGame;
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  if (k === 'n') newGame(); else if (k === 'u') undo();
  else if (k >= '1' && k <= '6' && !over && !busy && humanTurn()) {
    const n = +k - 1, i = flip ? 7 + n : n; if (B[i]) move(i); else Board.sfx('error');
  }
});

/* ---------------- shared menu contract ---------------- */
const GameUI = Board.ui({
  id: 'mancala', title: 'Mancala', subtitle: 'Five ways to fill the store.', accent: '#a3e635',
  modes: MODES, achievements: ACHIEVEMENTS,
  tutorial: { type: 'interactive', steps: [
    { text: 'Pick one of your pits and sow its stones counter-clockwise, one per pit.' },
    { text: 'Never drop into the rival store. Landing in your own store grants another turn.' },
    { text: 'Landing in an empty pit on your side captures the stones opposite.' },
    { text: 'The round ends when one side empties; the fuller store wins.' },
  ] },
  hooks: {
    applyMode: (next) => { mode = MODES.some((m) => m.id === next) ? next : 'classic'; if (B) newGame(); },
    applyCosmetic,
    onStart: () => { menuPaused = false; clockLast = Date.now(); },
  },
});
window.ApexGameMenuActions = {
  play: function () { menuPaused = false; clockLast = Date.now(); },
  pause: function (value) { menuPaused = !!value; clockLast = Date.now(); },
  resume: function () { menuPaused = false; clockLast = Date.now(); },
  restart: function () { menuPaused = false; newGame(); }
};

paintPalette(); newGame();

if (/(\?|&)test=1(?:&|$)/.test(location.search)) {
  const snap = () => ({
    mode, seat, turn, over, busy, menuPaused, moves: hist.length,
    board: B.slice(), stores: [B[6], B[13]], scores: [PS[0].score, PS[1].score], caps: [PS[0].caps, PS[1].caps],
    clocks: clocks.slice(), legal: over ? [] : legal(B, turn),
  });
  window.MancalaTest = {
    state: snap,
    modes: () => MODES.map((m) => m.id),
    setMode: (id) => GameUI.setMode(id),
    getMode: () => GameUI.getMode(),
    restart: () => { newGame(); return true; },
    setSeat: (value) => { const s = $('#seat'); if (!Array.from(s.options).some((o) => o.value === value)) return false; s.value = value; newGame(); return true; },
    setLevel: (n) => { const s = $('#lvl'); s.value = String(Math.max(0, Math.min(2, Number(n) || 0))); return +s.value; },
    setDifficulty: (d) => Board.setDifficulty(d),
    level: () => Board.level(),
    setBoard: (cells) => { B = Array.isArray(cells) && cells.length === 14 ? cells.map((n) => Math.max(0, Number(n) || 0)) : Array(14).fill(CFG[mode].stones); over = null; lm = null; hist = []; render(); return B.slice(); },
    setTurn: (s) => { turn = Number(s) === 1 ? 1 : 0; render(); return turn; },
    play: async (i) => { await move(Number(i)); return snap(); },
    finish: (s) => { conclude(s === 'draw' ? null : Number(s), 'test'); return snap(); },
    setScore: (s, n) => { PS[Number(s) ? 1 : 0].score = Math.max(0, Number(n) || 0); render(); return PS[Number(s) ? 1 : 0].score; },
    setClock: (s, ms) => { clocks[Number(s) ? 1 : 0] = Math.max(0, Number(ms) || 0); render(); return clocks[Number(s) ? 1 : 0]; },
    tick: (ms) => { tickClock(Number(ms) || 0); return snap(); },
    menuPaused: (value) => { menuPaused = !!value; clockLast = Date.now(); return menuPaused; },
    start: () => { menuPaused = false; clockLast = Date.now(); },
    colors: () => ({ stones: PALETTE.stones.slice(), board: Object.assign({}, PALETTE.board), accent: PALETTE.accent, theme: document.body.style.background || 'auto' }),
    cosmetic: (slot, id) => { applyCosmetic(slot, id); return window.MancalaTest.colors(); },
    cosmeticList: () => (window.Meta && Meta.getCosmetics ? Meta.getCosmetics('mancala') : []).map((item) => ({ id: item.id, slot: item.slot })),
    achievements: () => (Save.load('mancala').achievements || []).slice(),
    stats: () => Save.load('mancala').stats || {},
    modalOpen: () => { const d = document.getElementById('bk-dlg'); return !!(d && d.open); },
    closeModal: () => { const d = document.getElementById('bk-dlg'); if (d && d.open) d.close(); },
  };
}
</script>
<script src="../../kits/menu-bootstrap.js"></script>
</body>
