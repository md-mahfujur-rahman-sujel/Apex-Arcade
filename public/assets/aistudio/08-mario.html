<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fox Courier</title>
</head>
<body>


<script src="perf-kit.js"></script>
<script src="save-kit.js"></script>
<script src="meta-config.js"></script>
<script src="meta-kit.js"></script>
<script src="arcade-core.js"></script>
<script src="platform-kit.js"></script>
<script src="score-bridge.js"></script>
<script src="ui-kit.js"></script>
<script>
/* Fox Courier — original side-scrolling platformer: three courses, stomp enemies, hit crates,
   bounce on springs, light checkpoints, reach the flag. Built on platform-kit.js. */
const A = Arcade, P = Plat, TAU = Math.PI * 2;

/* ---- course 1: Meadow Run ---- */
const L1 = P.make('1 \u00b7 Meadow Run', 100, (g) => {
  g.ground(0, 22); g.set(2, 11, 'P'); g.coins(7, 10, 5);
  g.set(10, 8, '?'); g.set(11, 8, '?'); g.set(12, 8, '?'); g.set(16, 11, 'w');
  g.ground(25, 52); g.set(29, 11, 'w'); g.plat(32, 9, 4); g.coins(32, 8, 4);
  g.set(38, 11, 'h'); g.set(44, 11, 'C'); g.set(47, 11, 'w');
  g.ground(55, 78); g.set(58, 11, 'S'); g.plat(58, 6, 5); g.coins(58, 5, 5);
  g.set(66, 11, '^'); g.set(67, 11, '^'); g.coins(65, 8, 4);
  g.set(72, 11, 'h'); g.set(75, 11, 'w');
  g.ground(81, 100); g.stairs(84, 5); g.set(95, 11, 'F');
});
L1.hint = 'Stomp the grubs, grab the crates, spring up high';

/* ---- course 2: Canyon Crossing ---- */
const L2 = P.make('2 \u00b7 Canyon Crossing', 110, (g) => {
  g.ground(0, 14); g.set(2, 11, 'P'); g.coins(6, 10, 4);
  g.plat(17, 10, 3); g.plat(22, 9, 3); g.coins(22, 8, 3);
  g.ground(26, 40, 11); g.set(30, 10, 'w'); g.set(33, 7, 'b'); g.set(36, 10, '?');
  g.set(44, 11, 'M'); g.coins(44, 9, 3);
  g.ground(52, 70, 11); g.set(55, 10, 'w'); g.set(60, 10, 'h'); g.set(64, 10, 'C');
  g.coins(57, 8, 6); g.set(61, 7, 'b'); g.set(67, 10, '^');
  g.plat(72, 10, 3); g.plat(77, 9, 3); g.plat(82, 8, 3); g.coins(77, 7, 3); g.set(79, 6, 'b');
  g.ground(86, 110, 11); g.set(90, 10, 's'); g.set(95, 10, 'w'); g.set(100, 10, 'h'); g.set(106, 10, 'F');
});
L2.hint = 'Ride the moving platform across the gap';

/* ---- course 3: Sunset Rooftops ---- */
const L3 = P.make('3 \u00b7 Sunset Rooftops', 120, (g) => {
  g.ground(0, 12, 11); g.set(2, 10, 'P');
  g.ground(15, 26, 10); g.set(18, 9, 'w'); g.coins(17, 7, 4);
  g.ground(29, 38, 11); g.set(32, 10, 's'); g.set(34, 10, 'C');
  g.ground(41, 52, 9); g.set(44, 8, 'h'); g.set(48, 8, 'S'); g.plat(48, 3, 4); g.coins(48, 2, 4);
  g.ground(55, 70, 11); g.set(58, 10, '^'); g.set(59, 10, '^'); g.coins(57, 8, 4);
  g.set(62, 10, 'w'); g.set(66, 10, 'h'); g.set(68, 10, 'C');
  g.set(73, 10, 'M'); g.coins(73, 8, 3);
  g.ground(80, 92, 10); g.stairs(83, 4, 10); g.set(88, 9, 'w');
  g.ground(95, 120, 11); g.set(100, 10, 'b'); g.set(104, 10, 's'); g.set(108, 10, 'h'); g.set(112, 10, '?'); g.set(116, 10, 'F');
});
L3.hint = 'Last delivery: the rooftops at dusk';

const PAL = [
  { sky: ['#38bdf8', '#bae6fd', '#fef9c3'], far: '#7dd3fc', mid: '#86efac', solid: '#92400e', top: '#4ade80', plat: '#c08457' },
  { sky: ['#f59e0b', '#fdba74', '#fef3c7'], far: '#fb923c', mid: '#c2410c', solid: '#9a3412', top: '#fbbf24', plat: '#7c2d12' },
  { sky: ['#1e1b4b', '#be185d', '#fb923c'], far: '#4c1d95', mid: '#1e1b4b', solid: '#374151', top: '#f472b6', plat: '#6b7280' },
];
L1.theme = PAL[0]; L2.theme = PAL[1]; L3.theme = PAL[2];

function ridge(c, W, H, base, amp, seed, off, color) {
  c.fillStyle = color; c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x <= W; x += 16) { const X = x + off; c.lineTo(x, base + Math.sin(X * 0.01 + seed) * amp + Math.sin(X * 0.027 + seed * 2.1) * amp * 0.5); }
  c.lineTo(W, H); c.closePath(); c.fill();
}
function bg(c, cam, t, lvl) {
  const pal = PAL[lvl], W = 800, H = 480;
  A.sky(c, W, H, pal.sky);
  c.save(); c.globalAlpha = 0.9; c.fillStyle = lvl === 2 ? '#fde68a' : '#fff7d6';
  c.beginPath(); c.arc(620 - cam.x * 0.02, lvl === 2 ? 300 : 90, lvl === 2 ? 60 : 38, 0, TAU); c.fill(); c.restore();
  if (lvl === 2) {
    for (let i = 0; i < 18; i++) {
      const x = ((i * 90 - cam.x * 0.25) % 1700 + 1700) % 1700 - 60, h = 90 + A.hash(i, 3) * 170;
      c.fillStyle = i % 2 ? '#2e1065' : '#3b0764'; c.fillRect(x, 400 - h, 70, h + 80);
      for (let wy = 410 - h; wy < 390; wy += 18) for (let wx = x + 8; wx < x + 62; wx += 14) if (A.hash(wx, wy) > 0.6) { c.fillStyle = '#fde68a'; c.fillRect(wx, wy, 5, 8); }
    }
  } else {
    ridge(c, W, H, 330, 30, 1, cam.x * 0.2, pal.far);
    ridge(c, W, H, 380, 26, 4, cam.x * 0.45, pal.mid);
    c.fillStyle = 'rgba(255,255,255,.75)';
    for (let i = 0; i < 6; i++) { const x = ((i * 220 - cam.x * 0.1 + t * 0.15) % 1400 + 1400) % 1400 - 150, y = 50 + (i % 3) * 40; c.beginPath(); c.ellipse(x, y, 46, 14, 0, 0, TAU); c.ellipse(x + 26, y - 8, 30, 12, 0, 0, TAU); c.fill(); }
  }
}

/* the courier: an original fox with a red scarf and a parcel satchel */
function drawFox(c, p, G) {
  const cx = p.x + p.w / 2, base = p.y + p.h, f = p.face, t = G.clock;
  const run = p.ground ? Math.sin(p.walk) : 0, air = !p.ground;
  A.shadow(c, cx, base + 1, 11, 3, 0.25);
  c.save(); c.translate(cx, base); c.scale(f * (1 + p.sq * 0.5), 1 - p.sq * 0.5);
  // tail
  const wag = Math.sin(t * 0.15) * 3 + (air ? -4 : run * 2);
  c.fillStyle = '#f97316'; c.beginPath(); c.ellipse(-12, -13 + wag * 0.3, 9, 5, -0.7 + wag * 0.04, 0, TAU); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(-17, -17 + wag * 0.3, 4, 3, -0.7, 0, TAU); c.fill();
  // legs
  c.fillStyle = '#7c2d12';
  const l1 = air ? 3 : run * 5, l2 = air ? -3 : -run * 5;
  c.fillRect(-6 + l1, -6, 5, 6); c.fillRect(2 + l2, -6, 5, 6);
  // body + chest
  c.fillStyle = '#fb923c'; A.roundRect(c, -8, -20, 16, 16, 6); c.fill();
  c.fillStyle = '#fff7ed'; c.beginPath(); c.ellipse(3, -11, 4, 6, 0, 0, TAU); c.fill();
  // satchel
  c.fillStyle = '#92400e'; A.roundRect(c, -11, -15, 8, 8, 2); c.fill();
  c.strokeStyle = '#78350f'; c.lineWidth = 2; c.beginPath(); c.moveTo(-7, -20); c.lineTo(5, -6); c.stroke();
  // head
  c.fillStyle = '#fb923c'; c.beginPath(); c.arc(3, -23, 8, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(-2, -29); c.lineTo(-3, -38); c.lineTo(4, -31); c.fill();
  c.beginPath(); c.moveTo(5, -30); c.lineTo(9, -38); c.lineTo(11, -27); c.fill();
  c.fillStyle = '#fff7ed'; c.beginPath(); c.ellipse(8, -21, 5, 4, 0, 0, TAU); c.fill();
  c.fillStyle = '#111'; c.beginPath(); c.arc(11, -22, 1.6, 0, TAU); c.fill();
  c.beginPath(); c.arc(5, -25, 1.6, 0, TAU); c.fill();
  // scarf streaming behind
  c.strokeStyle = '#ef4444'; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(-2, -16);
  c.quadraticCurveTo(-12, -16 + Math.sin(t * 0.3) * 3 - (air ? 4 : 0), -18 - Math.abs(p.vx) * 1.5, -14 + Math.sin(t * 0.3 + 1) * 3); c.stroke();
  c.restore();
}

P.game({
  id: 'fox-courier', title: 'Fox Courier', subtitle: 'Deliver the parcels across three courses', color: '#fb923c',
  controls: [['\u2190 \u2192  /  A D', 'Run'], ['Space  /  \u2191  /  W', 'Jump (hold for height)'], ['\u2193 + Jump', 'Drop through thin platforms'], ['Land on enemies', 'Stomp them (spikes hurt)'], ['Reach the flag', 'Checkpoints save your spot']],
  help: '\u2190 \u2192 or A D run \u00b7 Space, \u2191 or W jump (hold for height) \u00b7 \u2193 + jump drops through thin platforms \u00b7 stomp enemies, avoid spikes \u00b7 hit crates for coins \u00b7 springs launch you \u00b7 reach the flag',
  levels: [L1, L2, L3], bg, drawHero: drawFox, winTitle: 'Parcels Delivered!',
  phys: { run: 3.5, jump: 10.8 },
});
</script>
</body>
</html>
