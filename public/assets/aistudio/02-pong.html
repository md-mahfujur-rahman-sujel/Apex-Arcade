<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ion Rally</title>
</head>
<body>
<script src="arcade-core.js"></script>
<script>
/* Ion Rally — neon paddle duel. 1P vs adaptive CPU, or 2P (press 2). First to 7. */
const A = Arcade;
const W = 800, H = 480, TOP = 70, BOT = 432, PH = 80, PW = 14, R = 8, LX = 34, RX = W - 34 - PW, WIN = 7;
let L, Rt, ball, trail, mode, sc, serveT, serveDir, level, rally, cpu, ripples;

function resetMatch(G) {
  L = { x: LX, y: (TOP + BOT) / 2 - PH / 2, vy: 0 };
  Rt = { x: RX, y: (TOP + BOT) / 2 - PH / 2, vy: 0 };
  sc = [0, 0]; level = 1; rally = 0; trail = []; ripples = [];
  cpu = { target: (TOP + BOT) / 2, err: 0, wait: 0 };
  serve(G, Math.random() < 0.5 ? 1 : -1);
}
function serve(G, dir) {
  serveDir = dir; serveT = 100; rally = 0; trail = [];
  ball = { x: W / 2, y: (TOP + BOT) / 2, vx: 0, vy: 0, sp: 5.2 };
}
function launch() {
  const a = A.rand(-0.45, 0.45);
  ball.vx = Math.cos(a) * ball.sp * serveDir; ball.vy = Math.sin(a) * ball.sp;
}
function init(G) { mode = mode || 1; resetMatch(G); G.hudL = ''; }

function predictY() {
  // fold the ball's future y position back into the field to simulate wall bounces
  const h = BOT - TOP - 2 * R;
  const t = (Rt.x - R - ball.x) / ball.vx;
  let y = ball.y - TOP - R + ball.vy * t;
  y = ((y % (2 * h)) + 2 * h) % (2 * h);
  if (y > h) y = 2 * h - y;
  return y + TOP + R;
}

function movePaddle(p, dir, speed) {
  const oy = p.y;
  p.y = A.clamp(p.y + dir * speed, TOP, BOT - PH);
  p.vy = p.y - oy;
}

function pointScored(G, who) {
  sc[who]++;
  A.sfx('explode'); G.shake(10);
  const gx = who === 0 ? W - 10 : 10;
  G.burst(gx, ball.y, 34, { color: who === 0 ? ['#22d3ee', '#a5f3fc'] : ['#f472b6', '#fbcfe8'], speed: 6, glow: true, life: 40, angle: who === 0 ? Math.PI : 0, spread: 1.2 });
  G.ring(gx, ball.y, who === 0 ? '#22d3ee' : '#f472b6', 80);
  if (mode === 1 && who === 0) { G.addScore(100 + rally * 5); G.popup(W / 2, 150, 'POINT +' + (100 + rally * 5), '#fde68a', 22); }
  if (sc[who] >= WIN) {
    if (mode === 1) { G.addScore(500); return who === 0 ? G.win('You Win!', 'Final ' + sc[0] + ' – ' + sc[1]) : G.over('CPU Wins', 'Final ' + sc[0] + ' – ' + sc[1]); }
    return G.win((who === 0 ? 'Left' : 'Right') + ' Player Wins!', 'Final ' + sc[0] + ' – ' + sc[1]);
  }
  level = A.clamp(1 + sc[0] * 0.7 - sc[1] * 0.35, 0.6, 5.5);
  serve(G, who === 0 ? -1 : 1); // loser serves... ball heads toward the scorer's opponent
}

function paddleHit(G, p, dir) {
  const off = A.clamp((ball.y - (p.y + PH / 2)) / (PH / 2), -1, 1);
  ball.sp = Math.min(11.5, ball.sp + 0.35);
  const ang = off * 1.05;
  ball.vx = Math.cos(ang) * ball.sp * dir;
  ball.vy = Math.sin(ang) * ball.sp + p.vy * 0.25;
  rally++;
  A.sfx('blip'); G.freeze(2); G.shake(2 + ball.sp * 0.3);
  const col = dir > 0 ? '#22d3ee' : '#f472b6';
  G.burst(ball.x, ball.y, 10, { color: [col, '#fff'], speed: 3.5, glow: true, life: 24, angle: dir > 0 ? 0 : Math.PI, spread: 1 });
  ripples.push({ x: ball.x, y: ball.y, t: 0, c: col });
  if (mode === 1 && dir > 0) G.addScore(10);
  if (rally > 0 && rally % 8 === 0) G.popup(W / 2, 120, 'Rally ' + rally + '!', '#fde68a', 20);
}

function update(G) {
  if (A.hit('Digit2') && mode !== 2) { mode = 2; resetMatch(G); G.score = 0; return; }
  if (A.hit('Digit1') && mode !== 1) { mode = 1; resetMatch(G); G.score = 0; return; }
  // paddles
  if (mode === 1) movePaddle(L, A.axisY(), 6);
  else movePaddle(L, (A.held('KeyS') ? 1 : 0) - (A.held('KeyW') ? 1 : 0), 6);
  if (mode === 2) movePaddle(Rt, (A.held('ArrowDown') ? 1 : 0) - (A.held('ArrowUp') ? 1 : 0), 6);
  else {
    const sp = Math.min(6.2, 3.3 + level * 0.55);
    const react = Math.max(0.2, 0.62 - level * 0.07);
    if (ball.vx > 0 && ball.x > W * react) {
      if (--cpu.wait <= 0) { cpu.wait = 12; cpu.target = predictY() + cpu.err; }
    } else { cpu.target = (TOP + BOT) / 2; cpu.err = A.rand(-1, 1) * Math.max(8, 70 - level * 11); }
    const d = cpu.target - (Rt.y + PH / 2);
    movePaddle(Rt, Math.abs(d) < 5 ? 0 : A.sign(d), Math.min(sp, Math.abs(d)));
  }
  ball.sp = ball.sp || 5.2;
  if (serveT > 0) {
    serveT--;
    if (serveT === 99 || serveT === 66 || serveT === 33) A.sfx('tick');
    if (serveT === 0) { launch(); A.sfx('select'); }
    return;
  }
  for (let s = 0; s < 2; s++) {
    ball.x += ball.vx / 2; ball.y += ball.vy / 2;
    if (ball.y - R < TOP) { ball.y = TOP + R; ball.vy = Math.abs(ball.vy); A.sfx('tick'); G.burst(ball.x, TOP, 5, { color: '#a5f3fc', speed: 2, glow: true, life: 16, angle: Math.PI / 2, spread: 0.8 }); }
    if (ball.y + R > BOT) { ball.y = BOT - R; ball.vy = -Math.abs(ball.vy); A.sfx('tick'); G.burst(ball.x, BOT, 5, { color: '#a5f3fc', speed: 2, glow: true, life: 16, angle: -Math.PI / 2, spread: 0.8 }); }
    if (ball.vx < 0 && ball.x - R <= L.x + PW && ball.x + R >= L.x && ball.y > L.y - R * 0.6 && ball.y < L.y + PH + R * 0.6) { ball.x = L.x + PW + R; paddleHit(G, L, 1); }
    if (ball.vx > 0 && ball.x + R >= Rt.x && ball.x - R <= Rt.x + PW && ball.y > Rt.y - R * 0.6 && ball.y < Rt.y + PH + R * 0.6) { ball.x = Rt.x - R; paddleHit(G, Rt, -1); }
    if (ball.x < 4) return pointScored(G, 1);
    if (ball.x > W - 4) return pointScored(G, 0);
  }
  trail.push({ x: ball.x, y: ball.y });
  if (trail.length > 16) trail.shift();
  for (const r of ripples) r.t++;
  ripples = ripples.filter((r) => r.t < 22);
  G.hudL = (mode === 1 ? 'YOU vs CPU' : '2 PLAYERS') + '  ·  first to ' + WIN;
}

function draw(G, c) {
  const t = G.clock;
  A.sky(c, W, H, ['#07051a', '#150b38', '#2a0f4d']);
  A.grid3d(c, W, H, 56, t, 'rgba(244,114,182,.28)');
  // table
  c.fillStyle = A.vgrad(c, TOP, BOT, ['#0a1736', '#0c2350']); c.fillRect(0, TOP, W, BOT - TOP);
  c.save(); c.shadowColor = '#22d3ee'; c.shadowBlur = 14;
  A.block3d(c, 0, TOP - 12, W, 12, 6, '#155e75'); A.block3d(c, 0, BOT, W, 12, 6, '#155e75');
  c.restore();
  c.strokeStyle = 'rgba(103,232,249,.35)'; c.lineWidth = 3; c.setLineDash([14, 14]); c.lineDashOffset = -t * 0.3;
  c.beginPath(); c.moveTo(W / 2, TOP); c.lineTo(W / 2, BOT); c.stroke(); c.setLineDash([]);
  c.strokeStyle = 'rgba(103,232,249,.12)'; c.lineWidth = 2; c.beginPath(); c.arc(W / 2, (TOP + BOT) / 2, 56, 0, A.TAU); c.stroke();
  // big scores
  c.save(); c.globalAlpha = 0.28;
  A.text(c, String(sc[0]), W / 2 - 90, 230, 110, '#22d3ee', 'center', '900');
  A.text(c, String(sc[1]), W / 2 + 90, 230, 110, '#f472b6', 'center', '900');
  c.restore();
  for (const r of ripples) { c.strokeStyle = A.alpha(r.c, 1 - r.t / 22); c.lineWidth = 2; c.beginPath(); c.arc(r.x, r.y, 8 + r.t * 1.6, 0, A.TAU); c.stroke(); }
  // trail
  c.save(); c.globalCompositeOperation = 'lighter';
  trail.forEach((p, i) => { c.fillStyle = 'rgba(165,243,252,' + (i / trail.length * 0.5) + ')'; c.beginPath(); c.arc(p.x, p.y, R * (0.35 + i / trail.length * 0.65), 0, A.TAU); c.fill(); });
  c.restore();
  // paddles
  for (const [p, col] of [[L, '#22d3ee'], [Rt, mode === 2 ? '#f472b6' : '#fb923c']]) {
    A.shadow(c, p.x + PW / 2 + 8, p.y + PH + 8, 14, 4, 0.3);
    c.save(); c.shadowColor = col; c.shadowBlur = 18; A.block3d(c, p.x, p.y, PW, PH, 7, col); c.restore();
  }
  // ball with floor shadow
  A.shadow(c, ball.x + 7, ball.y + 11, R * 1.1, R * 0.5, 0.35);
  c.save(); c.shadowColor = '#fff'; c.shadowBlur = 22;
  const g = c.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, R); g.addColorStop(0, '#fff'); g.addColorStop(1, '#67e8f9');
  c.fillStyle = g; c.beginPath(); c.arc(ball.x, ball.y, R, 0, A.TAU); c.fill(); c.restore();
  if (serveT > 0 && G.state === 'playing') {
    const n = Math.ceil(serveT / 33);
    A.glowText(c, String(n), W / 2, (TOP + BOT) / 2 - 40, 64, '#fde68a', 'center', 20);
  }
  if (rally > 3 && G.state === 'playing') A.text(c, 'RALLY ' + rally, W / 2, BOT - 14, 14, '#fde68a', 'center', '800', A.MONO);
  A.text(c, mode === 1 ? 'Press 2 for two players' : 'Press 1 to play the CPU', W / 2, H - 12, 12, '#8b93b3', 'center', '600');
  if (mode === 1) A.text(c, 'CPU lv ' + level.toFixed(1), W - 150, 54, 13, '#fb923c', 'center', '800', A.MONO);
  A.vignette(c, W, H, 0.3);
  G.drawFX(c);
}

Arcade.game({
  id: 'ion-rally', title: 'Ion Rally', subtitle: 'Neon paddle duel — first to 7', color: '#22d3ee',
  help: 'One player: W/S or ↑/↓ move your paddle vs the CPU (it adapts to how you play). Press 2 for two players: W/S (left) and ↑/↓ (right); press 1 to return to the CPU. Hit with the paddle edge for steeper angles. P pauses, M mutes.',
  w: W, h: H, touchL: [['▲', 'ArrowUp'], ['▼', 'ArrowDown']], init, update, draw,
});
</script>
</body>
</html>
