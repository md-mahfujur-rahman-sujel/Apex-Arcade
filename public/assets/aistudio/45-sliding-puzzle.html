<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Tiles</title>
<style>
  .sp { display: grid; grid-template-columns: auto minmax(220px, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .sp { grid-template-columns: 1fr; } }
  #bd { --s: max(280px, min(100vw - 40px, 520px, 100vh - 220px)); width: var(--s); height: var(--s); position: relative; background: #2a2f45; border-radius: 14px; box-shadow: 0 20px 50px -20px #000; user-select: none; touch-action: manipulation; }
  .t { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 10px; font: 800 calc(var(--s) / var(--n) * .42) "Segoe UI", sans-serif; color: #0b1220; cursor: pointer; transition: left .13s ease-out, top .13s ease-out; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
  .t.ok { box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 0 0 3px rgba(74,222,128,.7); }
  .side { display: grid; gap: 12px; } .stats { display: flex; gap: 18px; color: var(--muted); font: 600 14px ui-monospace, Consolas, monospace; } .stats b { color: var(--text); }
</style>
</head>
<body>

<script src="perf-kit.js"></script>
<script src="save-kit.js"></script>
<script src="meta-config.js"></script>
<script src="meta-kit.js"></script>
<script src="board-kit.js"></script>
<script src="score-bridge.js"></script>
<script src="ui-kit.js"></script>
<script>
const ui = Board.shell({
  id: 'sliding-puzzle', title: 'Slide Tiles', subtitle: 'Slide the numbered tiles back into order',
  rules: 'Slide the tiles into the empty space to put the numbers in order from 1, left to right and top to bottom, with the gap in the bottom-right corner. Click a tile to slide it — and any tiles between it and the gap — or use the arrow keys to move the tiles next to the gap. Tiles already in their final place glow green. Every puzzle is solvable.',
  controls: [['Click a tile', 'Slide it (and the row/column towards the gap)'], ['← ↑ ↓ →', 'Slide the neighbouring tile into the gap'], ['N', 'Shuffle a new puzzle'], ['H / M', 'Toggle help / mute']],
});
ui.main.innerHTML = `<div class="sp"><div id="bd"></div><div class="side">
  <div class="stats"><span>Moves <b id="mv">0</b></span><span>Time <b id="tm">0:00</b></span><span>Best <b id="bs">–</b></span></div>
  <div class="bk-status" id="st"></div>
  <div class="bk-row"><label>Size <select class="bk-select" id="size"><option value="3">3 × 3</option><option value="4" selected>4 × 4</option><option value="5">5 × 5</option></select></label><button class="bk-btn bk-primary" id="new">Shuffle</button></div></div></div>`;
const $ = (s) => ui.main.querySelector(s);
let N, B, moves, t0, tick, done, started;
const bd = $('#bd');
const hue = (v) => `hsl(${(v - 1) / (N * N - 1) * 300 + 190} 75% 68%)`;
const fmt = (ms) => { const s = ms / 1000 | 0; return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
function newGame() {
  N = +$('#size').value; B = [...Array(N * N).keys()].map((i) => (i + 1) % (N * N)); moves = 0; done = started = false; clearInterval(tick); $('#tm').textContent = '0:00';
  let z = N * N - 1, last = -1; for (let k = 0; k < N * N * 40; k++) { const r = z / N | 0, c = z % N, o = []; if (r > 0) o.push(z - N); if (r < N - 1) o.push(z + N); if (c > 0) o.push(z - 1); if (c < N - 1) o.push(z + 1); const f = o.filter((x) => x !== last), n = f[Board.rand(f.length)]; B[z] = B[n]; B[n] = 0; last = z; z = n; }
  if (solved()) return newGame();
  bd.style.setProperty('--n', N); bd.innerHTML = '';
  for (let v = 1; v < N * N; v++) { const d = document.createElement('div'); d.className = 't'; d.dataset.v = v; d.textContent = v; d.style.background = hue(v); d.style.width = d.style.height = `calc(100% / ${N} - 6px)`; bd.appendChild(d); }
  const b = Board.ls.get('apex:slide:' + N); $('#bs').textContent = b ? b + ' moves' : '–'; $('#mv').textContent = 0; layout();
}
const solved = () => B.every((v, i) => v === (i + 1) % (N * N));
function layout() {
  B.forEach((v, i) => { if (!v) return; const d = bd.querySelector(`[data-v="${v}"]`), r = i / N | 0, c = i % N; d.style.left = `calc(${c} * 100% / ${N} + 3px)`; d.style.top = `calc(${r} * 100% / ${N} + 3px)`; d.classList.toggle('ok', v === i + 1); });
  $('#mv').textContent = moves;
  $('#st').textContent = done ? 'Solved in ' + moves + ' moves! 🎉' : B.filter((v, i) => v && v === i + 1).length + ' of ' + (N * N - 1) + ' tiles in place';
}
function slide(i) { /* slide tile at i toward the gap if they share a line */
  if (done) return false; const z = B.indexOf(0), r = i / N | 0, c = i % N, zr = z / N | 0, zc = z % N; if (i === z || (r !== zr && c !== zc)) { Board.sfx('error'); return false; }
  const step = r === zr ? (zc > c ? 1 : -1) : (zr > r ? N : -N); let k = z; while (k !== i) { B[k] = B[k - step]; k -= step; } B[i] = 0; moves++;
  if (!started) { started = true; t0 = Date.now(); tick = setInterval(() => { $('#tm').textContent = fmt(Date.now() - t0); }, 500); }
  Board.sfx('step'); if (solved()) { done = true; clearInterval(tick); const b = +Board.ls.get('apex:slide:' + N) || 1e9; if (moves < b) { Board.ls.set('apex:slide:' + N, moves); $('#bs').textContent = moves + ' moves'; } Board.sfx('win'); layout(); setTimeout(() => Board.modal('Solved!', moves + ' moves in ' + fmt(Date.now() - t0) + '.', [['New puzzle', newGame], ['Close']]), 400); } else layout();
  return true;
}
bd.addEventListener('click', (e) => { const d = e.target.closest('.t'); if (d) slide(B.indexOf(+d.dataset.v)); });
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || document.getElementById('bk-dlg')?.open) return; const k = e.key.toLowerCase(), z = B.indexOf(0), r = z / N | 0, c = z % N;
  const m = { arrowleft: c < N - 1 ? z + 1 : -1, a: c < N - 1 ? z + 1 : -1, arrowright: c > 0 ? z - 1 : -1, d: c > 0 ? z - 1 : -1, arrowup: r < N - 1 ? z + N : -1, w: r < N - 1 ? z + N : -1, arrowdown: r > 0 ? z - N : -1, s: r > 0 ? z - N : -1 };
  if (k in m) { e.preventDefault(); if (m[k] >= 0) slide(m[k]); } else if (k === 'n') newGame();
});
$('#new').onclick = newGame; $('#size').onchange = (e) => { e.target.blur(); newGame(); };
newGame();
</script>
</body>
</html>
