</style>

  if (window.Apex && Apex.report) Apex.report({ gameId: GAME_ID, type: 'score', score: wins });
  if (humanWon) {
    announceAchievement('first-line', 'First Line');
    if (!threatenedThisGame) announceAchievement('clean-sweep', 'Clean Sweep');
    if (threatenedThisGame) announceAchievement('comeback', 'Comeback');
    if (gameFormat === 'four') announceAchievement('four-across', 'Four Across');
    if (gameFormat === 'ultimate') announceAchievement('ultimate-strategist', 'Ultimate Strategist');
    if (streak >= 3) announceAchievement('win-streak', 'Win Streak');
  }
  if (!w && draws >= 3) announceAchievement('draw-specialist', 'Draw Specialist');
  if (!w && mode !== 'two' && activeLevel() === 5) announceAchievement('perfect-defense', 'Perfect Defense');
}
function cpu() {
  if (paused || over || human()) return; busy = true; render();
  const g = gen;
  const state = { board: B.slice(), boardWins: boardWins.slice(), forcedBoard, format: gameFormat, size, need: target };
  Board.think(() => cpuMove(state, turn, activeLevel()), 850).then(async (m) => {
    if (g !== gen) return;
    if (paused) { busy = false; render(); return; }
    if (m < 0 || !cells[m]) { busy = false; render(); return; }
    cells[m].classList.add('pick'); await Board.sleep(Board.pace(450));   /* highlight the square it chose before marking it */
    if (g !== gen) return;
    if (paused) { busy = false; render(); return; }
    busy = false; play(m, true);
  });
}
function showHint() {
  if (!Board.hints() || levelOverride != null || !human() || busy || over) { Board.sfx('error'); return; }
  const state = { board: B.slice(), boardWins: boardWins.slice(), forcedBoard, format: gameFormat, size, need: target };
  hintIndex = cpuMove(state, turn, 5);
  if (hintIndex >= 0) { render(); Board.sfx('hint'); }
}
function winnerFromState() {
  if (!over) return null;
  const p = over[0].toLowerCase();
  return p === 'x' || p === 'o' ? { p, line: wl || [] } : null;
}
function undo() {
  if (busy || !hist.length) return; hintIndex = null;
  if (over) { const winnerState = winnerFromState(); if (winnerState) score[winnerState.p]--; else score.d--; }
  Board.sfx('undo'); hist.pop(); if (mode !== 'two' && hist.length && turn === mode) hist.pop();
  const kept = hist.slice(); B = Array(B.length).fill(''); boardWins = Array(9).fill(''); forcedBoard = null; turn = 'x'; over = ''; wl = null;
  for (const i of kept) applyMove(i);
  gen++; render(); cpu();
}
function resumeMatch() { const dialog = document.getElementById('bk-dlg'); if (dialog?.open) dialog.close(); paused = false; $('#pause').textContent = 'Pause'; render(); if (!over && !human()) cpu(); }
function togglePause() {
  if (paused) { const dialog = document.getElementById('bk-dlg'); if (dialog?.open) dialog.close(); resumeMatch(); return; }
  if (over) return;
  // Invalidate a pending CPU timer/search; resumeMatch starts it again if needed.
  if (busy) { gen++; busy = false; render(); }
  paused = true; $('#pause').textContent = 'Resume';
  Board.modal('Paused', 'Your match is safe. Resume when you are ready.', [['Resume', resumeMatch], ['New game', newGame]]);
  const dialog = document.getElementById('bk-dlg');
  if (dialog) dialog.addEventListener('cancel', (event) => { event.preventDefault(); resumeMatch(); }, { once: true });
}
function go(i) { if (paused || over || busy || !human()) return; if (B[i] || gameFormat === 'ultimate' && forcedBoard != null && Math.floor(Math.floor(i / 9) / 3) * 3 + Math.floor((i % 9) / 3) !== forcedBoard) { Board.sfx('error'); return; } play(i); }
bd.addEventListener('click', (e) => { const d = e.target.closest('.cl'); if (d) go(+d.dataset.i); });
$('#new').onclick = newGame; $('#pause').onclick = togglePause; $('#undo').onclick = undo; $('#hint').onclick = showHint; $('#mode').onchange = () => { Board.sfx('click'); newGame(); }; $('#format').onchange = () => { Board.sfx('click'); newGame(); };
$('#stats').onclick = () => { const s = readSave().stats.ticTacToe || {}; Board.modal('Match statistics', `Matches: ${s.rounds || 0}<br>Wins: ${s.wins || 0} · Losses: ${s.losses || 0} · Draws: ${s.draws || 0}<br>Current streak: ${s.streak || 0} · Best streak: ${s.bestStreak || 0}<br>Achievements: ${(readSave().achievements || []).length}`, [['Close']]); };
$('#lvl').onchange = () => { levelOverride = $('#lvl').value === 'auto' ? null : +$('#lvl').value; syncContractLevel(); render(); };
window.addEventListener('apex:board-difficulty', () => { if (levelOverride == null) { syncContractLevel(); render(); } });
$('#rs').onclick = () => {
  score.x = score.o = score.d = 0;
  if (window.Save && Save.update) Save.update(GAME_ID, { stats: { ticTacToe: { x: 0, o: 0, draws: 0 } } });
  render();
};
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(); if (k === 'escape') { e.preventDefault(); togglePause(); return; } if (paused) return;
  if (k === 'n') newGame(); else if (k === 'u') undo();
  else if (k >= '1' && k <= '9') go(KEY2IDX[+k]);
});
syncContractLevel();
newGame();
</script>
