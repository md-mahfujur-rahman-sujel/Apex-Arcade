<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge 2048</title>
<style>
  .g48 { display: grid; grid-template-columns: auto minmax(220px, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .g48 { grid-template-columns: 1fr; } }
  #bd { --s: max(280px, min(100vw - 40px, 520px, 100vh - 220px)); width: var(--s); height: var(--s); position: relative; background: #2a2f45; border-radius: 14px; padding: 10px; box-shadow: 0 20px 50px -20px #000; touch-action: none; user-select: none; }
  .bg, .tl { position: absolute; width: calc((100% - 20px - 30px) / 4); height: calc((100% - 20px - 30px) / 4); border-radius: 10px; }
  .bg { background: rgba(255,255,255,.07); }
  .tl { display: flex; align-items: center; justify-content: center; font: 800 calc(var(--s) / 4 * .36) "Segoe UI", sans-serif; color: #1b1320; transition: left .11s ease-out, top .11s ease-out; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .tl.big { font-size: calc(var(--s) / 4 * .3); } .tl.huge { font-size: calc(var(--s) / 4 * .24); }
  .tl.new { animation: pop .16s ease-out; } .tl.mrg { animation: bump .18s ease-out; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } } @keyframes bump { 50% { transform: scale(1.18); } }
  .side { display: grid; gap: 12px; }
  .sc { display: flex; gap: 10px; } .sc div { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; } .sc b { display: block; font-size: 26px; color: var(--text); letter-spacing: 0; }
</style>
</head>
<body>
<script src="board-kit.js"></script>
<script>
const ui = Board.shell({
  id: '2048', title: 'Merge 2048', subtitle: 'Slide the tiles, merge the twins, reach 2048',
  rules: 'Every move slides all tiles as far as they will go. When two tiles with the same number collide they merge into one with the sum. A new 2 or 4 appears after each move. Reach the 2048 tile to win — then keep going for a higher score. The game ends when the board is full and no merges remain.',
  controls: [['← ↑ ↓ → / WASD', 'Slide the tiles'], ['Swipe', 'Slide on touch screens'], ['U', 'Undo the last move'], ['N', 'New game'], ['H / M', 'Toggle help / mute']],
});
ui.main.innerHTML = `
<div class="g48">
  <div id="bd"></div>
  <div class="side">
    <div class="sc"><div>Score<b id="sc">0</b></div><div>Best<b id="best">0</b></div></div>
    <div class="bk-status" id="st"></div>
    <div class="bk-row"><label>Grid <select class="bk-select" id="size"><option value="4" selected>4 × 4</option><option value="5">5 × 5</option><option value="3">3 × 3</option></select></label>
      <button class="bk-btn bk-primary" id="new">New game</button><button class="bk-btn" id="undo">Undo</button></div>
  </div>
</div>`;
const $ = (s) => ui.main.querySelector(s);
const COL = { 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e' };
let N, G, score, best, hist, won, keep, over, id = 0;
const bd = $('#bd');
const bk = () => 'apex:2048:best' + N;
function newGame() {
  N = +$('#size').value; G = []; score = 0; hist = []; won = keep = over = false; best = +(Board.ls.get(bk()) || 0);
  bd.innerHTML = ''; for (let i = 0; i < N * N; i++) { const d = document.createElement('div'); d.className = 'bg'; place(d, i / N | 0, i % N); bd.appendChild(d); }
  add(); add(); draw(); }
const gap = 10;
function place(d, r, c) {
  const cell = `((100% - ${gap * 2}px - ${gap * (N - 1)}px) / ${N})`; d.style.width = d.style.height = `calc${cell}`;
  d.style.left = `calc(${gap}px + ${c} * (${cell} + ${gap}px))`; d.style.top = `calc(${gap}px + ${r} * (${cell} + ${gap}px))`;
}
function add() { const e = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!G.find((t) => t.r === r && t.c === c)) e.push([r, c]); if (!e.length) return; const [r, c] = e[Board.rand(e.length)]; G.push({ id: ++id, v: Math.random() < 0.9 ? 2 : 4, r, c, n: 1 }); }
function move(dir) { /* 0 left 1 up 2 right 3 down; returns true if anything moved */
  const snap = JSON.stringify({ G, score }); let gain = 0;
  const along = () => { const L = []; for (let i = 0; i < N; i++) { const line = []; for (let j = 0; j < N; j++) { const r = dir === 0 || dir === 2 ? i : (dir === 1 ? j : N - 1 - j), c = dir === 1 || dir === 3 ? i : (dir === 0 ? j : N - 1 - j); line.push([r, c]); } L.push(line); } return L; };
  for (const line of along()) {
    const ts = line.map(([r, c]) => G.find((t) => t.r === r && t.c === c)).filter(Boolean); let k = 0;
    for (let i = 0; i < ts.length; i++) {
      const t = ts[i], nx = ts[i + 1];
      if (nx && nx.v === t.v) { t.v *= 2; gain += t.v; t.m = 1; nx.dead = 1; nx.to = line[k]; ts.splice(i + 1, 1); }
      t.to = line[k]; k++;
    }
  }
  if (!G.some((t) => t.to && (t.dead || t.r !== t.to[0] || t.c !== t.to[1]))) { G.forEach((t) => { delete t.to; delete t.m; }); return false; }
  hist.push(snap); if (hist.length > 30) hist.shift();
  const dead = G.filter((t) => t.dead); G.forEach((t) => { if (t.to) { t.r = t.to[0]; t.c = t.to[1]; } delete t.to; });
  score += gain; G = G.filter((t) => !t.dead); draw(dead); Board.sfx(gain ? 'capture' : 'step');
  setTimeout(() => { add(); draw(); check(); }, 115);
  return true;
}
function draw(dead) {
  (dead || []).forEach((t) => { const e = document.getElementById('t' + t.id); if (e) { place(e, t.r, t.c); e.dataset.dy = 1; setTimeout(() => e.remove(), 130); } });
  [...bd.querySelectorAll('.tl')].forEach((e) => { if (!e.dataset.dy && !G.find((t) => 't' + t.id === e.id)) e.remove(); });
  for (const t of G) {
    let e = document.getElementById('t' + t.id);
    if (!e) { e = document.createElement('div'); e.id = 't' + t.id; bd.appendChild(e); e.className = 'tl' + (t.n ? ' new' : ''); place(e, t.r, t.c); delete t.n; }
    else { place(e, t.r, t.c); e.classList.remove('new', 'mrg'); if (t.m) { void e.offsetWidth; e.classList.add('mrg'); delete t.m; } }
    e.textContent = t.v; e.style.background = COL[t.v] || '#3c3a32'; e.style.color = t.v > 4 ? '#fff' : '#1b1320'; e.classList.toggle('big', t.v >= 128 && t.v < 1024); e.classList.toggle('huge', t.v >= 1024);
  }
  $('#sc').textContent = score; if (score > best) { best = score; Board.ls.set(bk(), best); } $('#best').textContent = best;
  $('#st').textContent = over ? 'No moves left — game over' : won && !keep ? 'You made 2048!' : 'Biggest tile: ' + Math.max(0, ...G.map((t) => t.v));
}
function canMove() { if (G.length < N * N) return true; for (const t of G) for (const [dr, dc] of [[0, 1], [1, 0]]) { const o = G.find((q) => q.r === t.r + dr && q.c === t.c + dc); if (o && o.v === t.v) return true; } return false; }
function check() {
  if (!won && G.some((t) => t.v >= 2048)) { won = true; Board.sfx('win'); Board.modal('2048!', 'You built the 2048 tile. Keep going for a bigger score?', [['Keep going', () => { keep = true; draw(); }], ['New game', newGame]]); }
  else if (!canMove()) { over = true; draw(); Board.sfx('lose'); Board.modal('Game over', 'Final score ' + score + '.', [['New game', newGame], ['Close']]); }
}
function undo() { if (!hist.length) return; const s = JSON.parse(hist.pop()); G = s.G; score = s.score; over = false; bd.querySelectorAll('.tl').forEach((e) => e.remove()); draw(); }
const K = { arrowleft: 0, a: 0, arrowup: 1, w: 1, arrowright: 2, d: 2, arrowdown: 3, s: 3 };
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey) return; const k = e.key.toLowerCase();
  if (k in K) { e.preventDefault(); if (!over && !document.getElementById('bk-dlg')?.open) move(K[k]); } else if (k === 'u') undo(); else if (k === 'n') newGame();
});
let sx0, sy0;
bd.addEventListener('pointerdown', (e) => { sx0 = e.clientX; sy0 = e.clientY; });
bd.addEventListener('pointerup', (e) => { if (sx0 == null) return; const dx = e.clientX - sx0, dy = e.clientY - sy0; sx0 = null; if (Math.max(Math.abs(dx), Math.abs(dy)) < 24 || over) return; move(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 0 : 2) : (dy < 0 ? 1 : 3)); });
$('#new').onclick = newGame; $('#undo').onclick = undo; $('#size').onchange = (e) => { e.target.blur(); newGame(); };
newGame();
</script>
</body>
</html>
