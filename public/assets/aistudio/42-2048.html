function merge2048MenuScene(c, frame) {
  const w = frame.width, h = frame.height, t = frame.time, quality = frame.quality || { layers: 3 };
  const bg = c.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, '#101421'); bg.addColorStop(.56, '#171b2a'); bg.addColorStop(1, '#0d1220');
  c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const glow = c.createRadialGradient(w * .76, h * .28, 0, w * .76, h * .28, Math.max(w, h) * .7);
  glow.addColorStop(0, 'rgba(167,139,250,.18)'); glow.addColorStop(.42, 'rgba(103,232,249,.055)'); glow.addColorStop(1, 'rgba(16,20,33,0)'); c.fillStyle = glow; c.fillRect(0, 0, w, h);
  if (frame.static || quality.layers < 2) {
    const cell = Math.min(w, h) * .105, left = w * .77 - cell * 1.5, top = h * .36 - cell * 1.5;
    [['2','#eee4da'],['4','#ede0c8'],['8','#a78bfa']].forEach((tile, i) => {
      const x = left + (i % 2) * cell, y = top + Math.floor(i / 2) * cell;
      c.fillStyle = 'rgba(255,255,255,.07)'; c.strokeStyle = 'rgba(227,232,255,.24)'; c.lineWidth = 1;
      c.beginPath(); c.roundRect(x, y, cell * .88, cell * .88, Math.max(4,cell*.14)); c.fill(); c.stroke();
      c.fillStyle = tile[1]; c.globalAlpha = .86; c.beginPath(); c.roundRect(x + cell*.12, y + cell*.12, cell*.64, cell*.64, Math.max(4,cell*.1)); c.fill();
      c.globalAlpha = .9; c.fillStyle = i < 2 ? '#39303b' : '#17222b'; c.font = '700 ' + Math.max(11,cell*.27) + 'px ui-monospace,monospace'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(tile[0], x + cell*.44, y + cell*.46);
    });
    c.globalAlpha = 1; return;
  }
  const unit = Math.min(w, h) * .11, drift = frame.reducedMotion ? 0 : Math.sin(t * .00035) * unit * .14;
  const tiles = [[.78,.22,2,'#eee4da'],[.91,.34,4,'#ede0c8'],[.84,.47,8,'#a78bfa'],[.71,.39,16,'#67d9da']];
  tiles.slice(0, Math.min(quality.layers + 1, tiles.length)).forEach((tile, i) => {
    const size = unit * (i === 2 ? 1.08 : .82), x = w * tile[0] + (i % 2 ? -drift : drift), y = h * tile[1] + (frame.reducedMotion ? 0 : Math.cos(t * .00028 + i) * unit * .08);
    c.save(); c.translate(x, y); c.rotate((i - 1.5) * .035); c.shadowColor = tile[3]; c.shadowBlur = quality.layers > 2 ? 18 : 0;
    c.fillStyle = 'rgba(255,255,255,.075)'; c.strokeStyle = 'rgba(227,232,255,.3)'; c.lineWidth = 1;
    c.beginPath(); c.roundRect(-size/2, -size/2, size, size, Math.max(5,size*.16)); c.fill(); c.stroke(); c.shadowBlur = 0;
    c.fillStyle = tile[3]; c.globalAlpha = .86; c.beginPath(); c.roundRect(-size*.36, -size*.36, size*.72, size*.72, Math.max(4,size*.12)); c.fill();
    c.globalAlpha = .84; c.fillStyle = i < 2 ? '#39303b' : '#17222b'; c.font = '700 ' + Math.max(11, size*.3) + 'px ui-monospace,monospace'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(tile[2]), 0, 1); c.restore();
  });
}

function menuSelect(id, value) {
  const control = document.getElementById(id);
  if (!control || control.value === value) return;
  control.value = value; control.dispatchEvent(new Event('change', { bubbles: true }));
}
function menuChoice(doc, label, controlId, value) {
  const button = doc.createElement('button'), control = document.getElementById(controlId);
  button.type = 'button'; button.className = 'apex-menu-control-button'; button.textContent = label;
  button.dataset.menuControl = controlId; button.dataset.menuValue = value;
  button.setAttribute('aria-pressed', String(!!control && control.value === value));
  button.addEventListener('click', function () {
    menuSelect(controlId, value);
    Array.from(button.parentNode.querySelectorAll('[data-menu-control="' + controlId + '"]')).forEach(function (choice) { choice.setAttribute('aria-pressed', String(choice === button)); });
  });
  return button;
}
