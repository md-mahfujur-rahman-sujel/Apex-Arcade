<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Sprite</title>
</head>
<body>
<script src="arcade-core.js"></script>
<script src="act-kit.js"></script>
<script>
/* Lumen Sprite — a glowing forest spirit: double jump, light dash, a soft lantern of light in the dark,
   and a final escape up a tower while the darkness tide rises. Built on act-kit.js. */
const A = Arcade, K = Act, TAU = Math.PI * 2;
let darkness = 0.6;

const GROVE = K.make('The Whispering Grove', 110, 15, (g) => {
  g.ground(0, 28); g.set(2, 12, 'P'); g.coins(8, 11, 4); g.set(14, 12, 'J'); g.set(20, 12, 'k'); g.coins(22, 10, 3); g.plat(24, 9, 3);
  g.ground(31, 50); g.set(33, 12, 'C'); g.set(38, 12, 'k'); g.set(40, 7, 'v'); g.set(44, 12, 'k'); g.set(46, 12, 'D'); g.plat(36, 9, 3); g.coins(36, 8, 3);
  g.plat(53, 10, 2); g.coins(53, 9, 2);
  g.ground(57, 80); g.set(60, 12, 'C'); g.set(64, 12, 'k'); g.set(68, 12, '^'); g.set(69, 12, '^'); g.set(72, 7, 'v'); g.plat(66, 9, 4); g.coins(66, 8, 4); g.set(76, 12, 'k');
  g.ground(83, 110); g.set(86, 12, 'k'); g.set(90, 8, 'v'); g.plat(92, 9, 3); g.set(96, 12, 'k'); g.set(100, 12, 'C'); g.set(106, 12, 'F');
});
GROVE.hint = 'Find the double jump and the light dash';
GROVE.theme = { solid: '#1e3a34', top: '#5eead4', plat: '#2f6f62', accent: '#fde68a', spike: '#fbcfe8' };

const TOWER = K.make('The Rising Dark', 25, 40, (g) => {
  g.fill(0, 0, 1, 40, '#'); g.fill(24, 0, 1, 40, '#'); g.ground(0, 25, 37); g.set(12, 36, 'P');
  for (let i = 0; i < 12; i++) { const x = i % 2 ? 13 : 2, y = 34 - 3 * i; g.plat(x, y, 9); g.coins(x + 3, y - 1, 3); if (i % 3 === 1) g.set(x + 4, y - 3, 'v'); if (i % 4 === 2) g.set(x + 7, y - 1, 'C'); }
  g.set(15, 0, 'F');
});
TOWER.hint = 'Climb! The darkness is rising';
TOWER.theme = { solid: '#2b2150', top: '#c4b5fd', plat: '#6d5bc7', accent: '#fde68a' };
TOWER.rise = { sp: 0.55, delay: 180 };

function bg(c, cam, t, lvl) {
  darkness = lvl ? 0.8 : 0.6;
  A.sky(c, 800, 480, lvl ? ['#0b0720', '#1d1243', '#3b2475'] : ['#04141a', '#0a2a2c', '#134e4a']);
  A.drawStars(c, bg.st || (bg.st = A.makeStars(60, 800, 400)), t, 800, 480, 0.03, '#fef9c3');
  if (!lvl) { for (let i = 0; i < 10; i++) { const x = ((i * 170 - cam.x * 0.3) % 1700 + 1700) % 1700 - 100; c.fillStyle = 'rgba(6,40,40,.9)'; c.fillRect(x, 120 + (i % 3) * 30, 26, 360); c.beginPath(); c.arc(x + 13, 120 + (i % 3) * 30, 56, 0, TAU); c.fill(); } K.ridge(c, 420, 24, 3, cam.x * 0.5, '#031a1a'); }
  for (let i = 0; i < 30; i++) { const x = ((i * 83 - cam.x * 0.4 + Math.sin(t * 0.01 + i) * 26) % 860 + 860) % 860 - 30, y = ((i * 57 - cam.y * 0.3 - t * 0.2) % 520 + 520) % 520 - 20; c.globalAlpha = 0.2 + 0.3 * Math.sin(t * 0.05 + i); c.fillStyle = '#fde68a'; c.fillRect(x, y, 2, 2); } c.globalAlpha = 1;
}
function post(c, cam, G, p) {
  const x = p.x + 10 - cam.x, y = p.y + 14 - cam.y, g = c.createRadialGradient(x, y, 40, x, y, 300);
  g.addColorStop(0, 'rgba(2,6,20,0)'); g.addColorStop(1, 'rgba(2,6,20,' + darkness + ')'); c.fillStyle = g; c.fillRect(0, 0, 800, 480);
  c.save(); c.globalCompositeOperation = 'lighter'; const h = c.createRadialGradient(x, y, 0, x, y, 90); h.addColorStop(0, 'rgba(253,230,138,.28)'); h.addColorStop(1, 'rgba(253,230,138,0)'); c.fillStyle = h; c.fillRect(x - 90, y - 90, 180, 180); c.restore();
}
function drawSprite(c, p, G) {
  const cx = p.x + p.w / 2, f = p.face, t = G.clock, cy = p.y + 14;
  if (p.dashT > 0) { c.save(); for (let i = 1; i < 5; i++) { c.globalAlpha = 0.4 - i * 0.07; c.fillStyle = '#fde68a'; c.beginPath(); c.arc(cx - f * i * 11, cy, 9 - i, 0, TAU); c.fill(); } c.restore(); }
  c.save(); c.translate(cx, cy); c.scale(f * (1 + p.sq * 0.3), 1 - p.sq * 0.3);
  c.shadowColor = '#fde68a'; c.shadowBlur = 22; c.fillStyle = '#fffbeb';
  const wag = Math.sin(t * 0.2) * 3;
  c.beginPath(); c.moveTo(-6, 6); c.quadraticCurveTo(-24, 6 + wag, -30, -2 + wag * 1.5); c.quadraticCurveTo(-20, 12, -6, 12); c.fill();
  c.beginPath(); c.ellipse(0, 2, 11, 12, 0, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(-5, -8); c.lineTo(-10, -22 - wag * 0.4); c.lineTo(0, -10); c.moveTo(3, -9); c.lineTo(8, -23 + wag * 0.4); c.lineTo(8, -8); c.fill();
  c.shadowBlur = 0; c.fillStyle = '#1e293b'; c.beginPath(); c.ellipse(-2, -2, 2, 3, 0, 0, TAU); c.ellipse(6, -2, 2, 3, 0, 0, TAU); c.fill();
  if (p.atk > 0) { c.strokeStyle = 'rgba(254,243,199,.9)'; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.arc(4, 2, 24 + (8 - p.atk) * 1.5, -0.8, 0.8); c.stroke(); }
  c.restore();
}
function drawEnemy(c, e, G) {
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2, t = G.clock, f = e.face, hit = e.hurt > 0;
  if (e.k === 'k') { A.shadow(c, cx, e.y + e.h + 1, 12, 3, 0.25); c.fillStyle = hit ? '#fff' : '#4c1d95'; c.beginPath(); c.ellipse(cx, cy + 3, 14, 11, 0, Math.PI, 0); c.fill(); c.fillRect(e.x, cy + 3, e.w, 7); for (let i = 0; i < 4; i++) c.fillRect(e.x + 3 + i * 6, e.y + e.h - 3 + Math.sin(t * 0.4 + i * 2) * 2, 3, 4); c.fillStyle = '#f0abfc'; c.fillRect(cx + f * 5 - 2, cy - 1, 4, 4); return true; }
  const fl = Math.sin(t * 0.35 + e.x) * 8; c.fillStyle = hit ? '#fff' : '#6d28d9'; c.beginPath(); c.moveTo(cx - 3, cy); c.lineTo(cx - 18, cy - fl - 6); c.lineTo(cx - 9, cy + 6); c.fill(); c.beginPath(); c.moveTo(cx + 3, cy); c.lineTo(cx + 18, cy - fl - 6); c.lineTo(cx + 9, cy + 6); c.fill(); c.beginPath(); c.arc(cx, cy, 8, 0, TAU); c.fill(); c.fillStyle = '#f0abfc'; c.fillRect(cx - 4, cy - 2, 3, 3); c.fillRect(cx + 1, cy - 2, 3, 3); return true;
}

K.game({
  id: 'lumen-sprite', title: 'Lumen Sprite', subtitle: 'Carry the light through the dark wood', color: '#fde68a',
  controls: [['← →  /  A D', 'Glide along the ground'], ['Space  /  ↑  /  W  /  Z', 'Jump — press again in the air (after the Leaf Charm)'], ['Shift  /  L', 'Light dash (after the Star Charm)'], ['X  /  J', 'Flare — harms dark creatures'], ['Land on creatures', 'Bounce on them'], ['P / M', 'Pause / mute']],
  help: '← → move · Space jump (again in mid-air for a double jump) · Shift light dash · X flare · bounce on creatures · in the tower, never let the darkness catch you',
  levels: [GROVE, TOWER], bg, post, hero: { hp: 5, run: 3.4, jump: 10.6, stomp: true, dashInv: true, dashSpd: 9.5, ab: {}, weapon: { type: 'melee', dmg: 1, range: 46, h: 38, cd: 26, dur: 9 } },
  pickups: { J: { ab: 'dj', msg: 'LEAF CHARM — jump again in mid-air', icon: 'J' }, D: { ab: 'dash', msg: 'STAR CHARM — press Shift to dash', icon: 'D' } },
  enemies: {
    k: { w: 28, h: 22, hp: 2, ai: 'walk', sp: 0.7, sight: 120, score: 80, color: '#4c1d95' },
    v: { w: 24, h: 18, hp: 1, ai: 'fly', sp: 1.4, sight: 190, range: 60, bob: 22, score: 80, color: '#6d28d9' },
  },
  hazColor: 'rgba(76,29,149,.88)', hazColor2: 'rgba(15,5,40,.97)', drawEnemy, drawHero: drawSprite, clear: 'THE LIGHT RETURNS', winTitle: 'Dawn Breaks', winSub: (G, coins) => 'The forest glows again · ' + coins + ' motes · Score ' + G.score,
});
</script>
</body>
</html>
