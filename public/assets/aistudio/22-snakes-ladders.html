<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snakes &amp; Ladders</title>
<style>
  .sl { display: grid; grid-template-columns: minmax(280px, 640px) minmax(250px, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .sl { grid-template-columns: 1fr; } }
  #cv { width: 100%; max-width: 640px; height: auto; border-radius: 12px; box-shadow: 0 20px 50px -20px #000, 0 0 0 6px #2a2f45; touch-action: manipulation; }
  .side { display: grid; gap: 12px; }
  .die { font-size: 92px; line-height: 1; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 0 18px; user-select: none; }
  .die.roll { animation: shake .12s linear infinite; }
  @keyframes shake { 0% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } 100% { transform: rotate(-6deg); } }
  .big { font-size: 18px !important; padding: 12px 18px !important; }
  .pl { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .pl.on { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
  .pl i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; border: 2px solid #fff; }
  .pl span { margin-left: auto; color: var(--muted); font: 600 13px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>

<script src="perf-kit.js"></script>
<script src="save-kit.js"></script>
<script src="meta-config.js"></script>
<script src="meta-kit.js"></script>
<script src="board-kit.js"></script>
<script src="score-bridge.js"></script>
<script src="ui-kit.js"></script>
<script>
const ui = Board.shell({
  id: 'snakes-ladders', cpu: true, title: 'Snakes & Ladders', subtitle: 'Race to 100 — climb the ladders, dodge the snakes',
  rules: 'Roll the die and move that many squares. Land at the foot of a ladder to climb it; land on a snake\'s head and you slide down to its tail. Roll a 6 for another turn. You must roll the exact number to land on 100. First to 100 wins. Easy shortens snake drops, Normal uses the printed board, and Hard extends each snake drop by five squares. The selected rule applies to every player.',
  controls: [['Space / Enter / R','Roll the die'], ['Roll button','Roll the die (touch)'], ['N','Start a new game'], ['H / M','Toggle help / mute']],
});
ui.main.innerHTML = `
<div class="sl">
  <canvas id="cv" width="600" height="650"></canvas>
  <div class="side">
    <div class="bk-status" id="status"></div>
    <div class="die" id="die">\u2680</div>
    <button class="bk-btn bk-primary big" id="roll">Roll the die</button>
    <div class="bk-row"><label>Players <select class="bk-select" id="mode">
      <option value="2c">You vs 1 computer</option><option value="3c">You vs 2 computers</option><option value="4c">You vs 3 computers</option>
      <option value="2">2 players</option><option value="3">3 players</option><option value="4">4 players</option></select></label>
      <button class="bk-btn" id="new">New game</button></div>
    <div id="plist" style="display:grid;gap:8px"></div>
  </div>
</div>`;
const $ = (s) => ui.main.querySelector(s);
const cv = $('#cv'), c = cv.getContext('2d');

const COLORS = ['#f43f5e', '#22d3ee', '#facc15', '#4ade80'], NAMES = ['Red', 'Cyan', 'Gold', 'Green'];
const FACES = ['\u2680', '\u2681', '\u2682', '\u2683', '\u2684', '\u2685'];
const LAD = { 1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100 };
const SNK = { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 };
const SNAKE_COL = ['#ef4444', '#a855f7', '#22c55e', '#f97316', '#3b82f6', '#ec4899', '#14b8a6', '#eab308', '#8b5cf6', '#f43f5e'];
const CELL = 60, OFF = [[-12, -12], [12, -12], [-12, 12], [12, 12]];
let players, cur, busy, over, difficulty = Board.difficulty();
function snakeTarget(from) {
  const target = SNK[from];
  if (target == null) return null;
  if (difficulty === 'easy') return Math.ceil((from + target) / 2);
  if (difficulty === 'hard') return Math.max(1, target - 5);
  return target;
}
window.addEventListener('apex:board-difficulty', (event) => { difficulty = event.detail?.difficulty || 'normal'; draw(); });

function pt(n, i) {
  if (n <= 0) return [34 + i * 30, 625];
  const k = n - 1, r = Math.floor(k / 10), cc = r % 2 === 0 ? k % 10 : 9 - (k % 10);
  return [cc * CELL + CELL / 2, (9 - r) * CELL + CELL / 2];
}
function draw() {
  c.clearRect(0, 0, 600, 650);
  for (let n = 1; n <= 100; n++) {
    const [x, y] = pt(n); c.fillStyle = (Math.floor((n - 1) / 10) + n) % 2 ? '#222a45' : '#1a2038';
    if (n === 100) c.fillStyle = '#5b4a14';
    c.fillRect(x - 30, y - 30, 60, 60);
    c.fillStyle = 'rgba(230,233,245,.55)'; c.font = '600 11px ui-monospace, Consolas, monospace'; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(n === 100 ? '100 ★' : n, x - 27, y - 27);
  }
  c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 1;
  for (let i = 0; i <= 10; i++) { c.beginPath(); c.moveTo(i * CELL, 0); c.lineTo(i * CELL, 600); c.moveTo(0, i * CELL); c.lineTo(600, i * CELL); c.stroke(); }
  c.fillStyle = '#0f1322'; c.fillRect(0, 600, 600, 50); c.fillStyle = '#8b93b3'; c.font = '600 11px ui-monospace, Consolas, monospace'; c.textBaseline = 'middle'; c.fillText('START', 540, 625);
  for (const a in LAD) ladder(pt(+a), pt(LAD[a]));
  Object.keys(SNK).forEach((a, i) => snake(pt(+a), pt(snakeTarget(+a)), SNAKE_COL[i % SNAKE_COL.length], i));
  players.forEach((p, i) => {
    const [bx, by] = p.ax != null ? [p.ax, p.ay] : pt(p.pos, i), o = p.pos <= 0 ? [0, 0] : OFF[i];
    const x = bx + o[0], y = by + o[1];
    c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.ellipse(x + 2, y + 9, 11, 5, 0, 0, 7); c.fill();
    c.fillStyle = p.col; c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.beginPath(); c.arc(x, y, 11, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x - 3, y - 4, 3, 0, 7); c.fill();
  });
}
function ladder([x1, y1], [x2, y2]) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = -uy * 8, ny = ux * 8;
  c.lineCap = 'round';
  c.strokeStyle = '#7c4a1c'; c.lineWidth = 9; c.beginPath(); c.moveTo(x1 + nx, y1 + ny); c.lineTo(x2 + nx, y2 + ny); c.moveTo(x1 - nx, y1 - ny); c.lineTo(x2 - nx, y2 - ny); c.stroke();
  c.strokeStyle = '#d6a56b'; c.lineWidth = 5; c.beginPath(); c.moveTo(x1 + nx, y1 + ny); c.lineTo(x2 + nx, y2 + ny); c.moveTo(x1 - nx, y1 - ny); c.lineTo(x2 - nx, y2 - ny); c.stroke();
  c.lineWidth = 4; c.strokeStyle = '#b9824a'; c.beginPath();
  for (let d = 18; d < L - 8; d += 22) { c.moveTo(x1 + ux * d + nx, y1 + uy * d + ny); c.lineTo(x1 + ux * d - nx, y1 + uy * d - ny); }
  c.stroke();
}
function snake([hx, hy], [tx, ty], col, k) {
  const dx = tx - hx, dy = ty - hy, L = Math.hypot(dx, dy), nx = -dy / L * (k % 2 ? 42 : -42), ny = dx / L * (k % 2 ? 42 : -42);
  const path = () => { c.beginPath(); c.moveTo(hx, hy); c.bezierCurveTo(hx + dx * 0.33 + nx, hy + dy * 0.33 + ny, hx + dx * 0.66 - nx, hy + dy * 0.66 - ny, tx, ty); };
  c.lineCap = 'round';
  path(); c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 16; c.stroke();
  path(); c.strokeStyle = col; c.lineWidth = 11; c.stroke();
  path(); c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 3; c.setLineDash([2, 12]); c.stroke(); c.setLineDash([]);
  const a = Math.atan2(dy * 0.33 + ny, dx * 0.33 + nx);
  c.save(); c.translate(hx, hy); c.rotate(a + Math.PI);
  c.fillStyle = col; c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 2; c.beginPath(); c.ellipse(0, 0, 13, 10, 0, 0, 7); c.fill(); c.stroke();
  c.strokeStyle = '#ef4444'; c.lineWidth = 2; c.beginPath(); c.moveTo(-12, 0); c.lineTo(-20, 0); c.lineTo(-23, -3); c.moveTo(-20, 0); c.lineTo(-23, 3); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(-3, -5, 3.2, 0, 7); c.arc(-3, 5, 3.2, 0, 7); c.fill();
  c.fillStyle = '#111'; c.beginPath(); c.arc(-4, -5, 1.5, 0, 7); c.arc(-4, 5, 1.5, 0, 7); c.fill();
  c.restore();
}

function newGame() {
  const m = $('#mode').value, n = +m[0], cpu = m.length > 1;
  players = Array.from({ length: n }, (_, i) => ({ pos: 0, col: COLORS[i], cpu: cpu && i > 0, name: cpu ? (i === 0 ? 'You' : 'Computer ' + i) : NAMES[i], ax: null, ay: null }));
  cur = 0; busy = false; over = false; $('#die').textContent = FACES[0];
  ui_update(); draw(); autoplay();
}
function ui_update(msg) {
  const p = players[cur];
  $('#status').textContent = msg || (over ? p.name + ' won!' : (p.cpu ? p.name + ' is rolling…' : (players.length > 1 && !players.some((q) => q.cpu) ? p.name + ', ' : '') + (players.some((q) => q.cpu) ? 'Your turn — ' : '') + 'roll the die'));
  $('#roll').disabled = busy || over || p.cpu;
  $('#plist').innerHTML = players.map((q, i) => `<div class="pl ${i === cur && !over ? 'on' : ''}"><i style="background:${q.col}"></i>${q.name}<span>${q.pos === 0 ? 'start' : 'square ' + q.pos}</span></div>`).join('');
}
function autoplay() { if (!over && players[cur].cpu) setTimeout(roll, Board.pace(1300)); }
async function roll() {
  if (busy || over) return; busy = true;
  const p = players[cur]; ui_update(p.name + ' rolls…');
  const T = (ms) => Board.sleep(p.cpu ? Board.pace(ms * 1.6) : ms);   /* the computer takes its time */
  $('#die').classList.add('roll'); Board.sfx('dice');
  for (let i = 0; i < 9; i++) { $('#die').textContent = FACES[Board.rand(6)]; await T(70); }
  const r = 1 + Board.rand(6); $('#die').textContent = FACES[r - 1]; $('#die').classList.remove('roll');
  await T(450);
  let msg = '';
  if (p.pos + r > 100) { Board.sfx('error'); msg = p.name + ' rolled ' + r + ' — needs exactly ' + (100 - p.pos) + ' to finish'; }
  else {
    ui_update(p.name + ' rolled ' + r);
    for (let s = 0; s < r; s++) { p.pos++; Board.sfx('step'); draw(); await T(200); }
    const jump = LAD[p.pos] || snakeTarget(p.pos);
    if (jump) {
      const up = !!LAD[p.pos]; msg = up ? 'A ladder! ' + p.name + ' climbs to ' + jump : 'A snake! ' + p.name + ' slides to ' + jump;
      ui_update(msg); await T(450); Board.sfx(up ? 'ladder' : 'snake');
      const a = pt(p.pos, cur), b = pt(jump, cur);
      for (let i = 1; i <= 26; i++) { const t = i / 26; p.ax = a[0] + (b[0] - a[0]) * t; p.ay = a[1] + (b[1] - a[1]) * t; draw(); await T(30); }
      p.ax = p.ay = null; p.pos = jump; draw();
    }
    if (p.pos === 100) {
      over = true; busy = false; ui_update(); Board.sfx(players.some((q) => q.cpu) && p.cpu ? 'lose' : 'win');
      Board.modal(p.cpu ? 'Computer wins' : 'You win!', p.name + ' reached square 100.', [['Play again', newGame], ['Close']]); return;
    }
  }
  if (r !== 6 || p.pos + 0 > 100) cur = (cur + 1) % players.length; else msg = (msg ? msg + ' · ' : '') + 'Rolled a 6 — roll again!';
  busy = false; ui_update(msg || undefined); draw();
  if (msg && !players[cur].cpu && !over) $('#status').textContent = msg + ' — ' + (players.some((q) => q.cpu) ? 'your turn' : players[cur].name + ' to roll');
  autoplay();
}

$('#roll').onclick = roll; $('#new').onclick = newGame; $('#mode').onchange = newGame;
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter' || k === 'r') { e.preventDefault(); if (!players[cur].cpu) roll(); } else if (k === 'n') newGame();
});
newGame();
</script>
</body>
</html>
