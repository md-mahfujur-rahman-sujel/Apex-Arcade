<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchard Drop</title>
<style>
  .fm { display: grid; grid-template-columns: auto minmax(220px, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .fm { grid-template-columns: 1fr; } }
  #cv { --h: max(420px, min(100vh - 150px, 720px)); height: var(--h); width: calc(var(--h) * 400 / 600); max-width: calc(100vw - 36px); max-height: calc((100vw - 36px) * 1.5); display: block; border-radius: 14px; box-shadow: 0 20px 50px -20px #000; touch-action: none; cursor: crosshair; }
  .side { display: grid; gap: 12px; } .sc { display: flex; gap: 10px; } .sc div { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; } .sc b { display: block; font-size: 26px; color: var(--text); letter-spacing: 0; }
  .chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; color: var(--muted); font-size: 22px; } .chain i { font-style: normal; font-size: 12px; }
</style>
</head>
<body>
<script src="board-kit.js"></script>
<script>
const ui = Board.shell({
  id: 'fruit-merge', title: 'Orchard Drop', subtitle: 'Drop fruit, merge matching pairs, grow the biggest melon',
  rules: 'Move left and right, then drop a fruit into the basket. When two fruits of the same kind touch, they merge into the next bigger fruit and score points. Cherry → strawberry → grape → orange → apple → pear → peach → pineapple → melon → watermelon. Two watermelons vanish for a big bonus. Do not let the pile climb above the red line for more than a couple of seconds — that ends the game.',
  controls: [['Mouse / touch drag', 'Aim the fruit'], ['Click / tap / Space / ↓', 'Drop it'], ['← →  /  A D', 'Move the aim'], ['N', 'New game'], ['H / M', 'Toggle help / mute']],
});
ui.main.innerHTML = `<div class="fm"><canvas id="cv" width="400" height="600"></canvas><div class="side">
  <div class="sc"><div>Score<b id="sc">0</b></div><div>Best<b id="best">0</b></div></div>
  <div class="bk-status" id="st"></div>
  <div class="bk-row"><button class="bk-btn bk-primary" id="new">New game</button></div>
  <div><div style="color:var(--muted);font-size:12px;margin-bottom:4px">MERGE CHAIN</div><div class="chain" id="chain"></div></div></div></div>`;
const $ = (s) => ui.main.querySelector(s);
const cv = $('#cv'), cx = cv.getContext('2d');
const F = [['🍒', 15, '#ef4444'], ['🍓', 21, '#fb7185'], ['🍇', 27, '#a855f7'], ['🍊', 33, '#fb923c'], ['🍎', 41, '#dc2626'], ['🍐', 49, '#a3e635'], ['🍑', 58, '#fdba74'], ['🍍', 68, '#facc15'], ['🍈', 80, '#4ade80'], ['🍉', 94, '#16a34a']];
$('#chain').innerHTML = F.map((f, i) => f[0] + (i < F.length - 1 ? '<i>→</i>' : '')).join('');
const L = 20, R = 380, FLOOR = 580, LINE = 120, G = 1500;
let fr, score, best, over, cur, nextL, aimX, cool, t0, parts, id = 0, overT;
function newGame() { fr = []; score = 0; over = false; parts = []; best = +Board.ls.get('apex:fm:best') || 0; aimX = 200; cool = 0; cur = rl(); nextL = rl(); overT = 0; upd(); }
const rl = () => Board.rand(4);
function upd() { $('#sc').textContent = score; $('#best').textContent = best; $('#st').textContent = over ? 'The pile is too high — game over' : 'Aim and drop. Biggest so far: ' + (fr.length ? F[Math.max(...fr.map((f) => f.l))][0] : '—'); }
function drop() { if (over || cool > 0) return; const r = F[cur][1]; fr.push({ id: ++id, l: cur, x: Math.max(L + r, Math.min(R - r, aimX)), y: LINE - 40, vx: 0, vy: 0, r, age: 0, m: r * r }); cur = nextL; nextL = rl(); cool = 0.55; Board.sfx('click'); }
function step(dt) {
  const n = fr.length; for (const f of fr) { f.vy += G * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.9985; f.age += dt; }
  const merge = [];
  for (let it = 0; it < 4; it++) {
    for (const f of fr) { if (f.x < L + f.r) { f.x = L + f.r; if (f.vx < 0) f.vx *= -0.2; } if (f.x > R - f.r) { f.x = R - f.r; if (f.vx > 0) f.vx *= -0.2; } if (f.y > FLOOR - f.r) { f.y = FLOOR - f.r; if (f.vy > 0) f.vy *= -0.15; f.vx *= 0.985; } }
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = fr[i], b = fr[j]; if (a.dead || b.dead) continue; const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r; if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
      const d2 = dx * dx + dy * dy; if (d2 >= rr * rr) continue; const d = Math.sqrt(d2) || 0.01, nx = dx / d, ny = dy / d, ov = rr - d, im = 1 / a.m + 1 / b.m;
      if (a.l === b.l && a.age > 0.05 && b.age > 0.05) { a.dead = b.dead = true; merge.push([a, b]); continue; }
      a.x -= nx * ov * (1 / a.m) / im; a.y -= ny * ov * (1 / a.m) / im; b.x += nx * ov * (1 / b.m) / im; b.y += ny * ov * (1 / b.m) / im;
      const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny; if (vn < 0) { const j2 = -(1.05) * vn / im; a.vx -= j2 * nx / a.m; a.vy -= j2 * ny / a.m; b.vx += j2 * nx / b.m; b.vy += j2 * ny / b.m; const tx = -ny, ty = nx, vt = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty, jt = vt * 0.04 / im; a.vx += jt * tx / a.m; a.vy += jt * ty / a.m; b.vx -= jt * tx / b.m; b.vy -= jt * ty / b.m; }
    }
  }
  for (const [a, b] of merge) {
    const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
    if (a.l === F.length - 1) { score += 200; pop(x, y, F[a.l][2], 30); Board.sfx('win'); }
    else { const l = a.l + 1, r = F[l][1]; fr.push({ id: ++id, l, x, y, vx: (a.vx + b.vx) / 2, vy: (a.vy + b.vy) / 2, r, age: 0, m: r * r, big: 1 }); score += (l + 1) * 2 - 1 + l; pop(x, y, F[l][2], 12 + l * 2); Board.sfx(l > 5 ? 'win' : 'capture'); }
  }
  if (merge.length) { fr = fr.filter((f) => !f.dead); if (score > best) { best = score; Board.ls.set('apex:fm:best', best); } upd(); }
}
function pop(x, y, c, n) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.3, s = 60 + Math.random() * 160; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5, c }); } }
function tick(dt) {
  if (over) return; cool -= dt; for (let k = 0; k < 3; k++) step(dt / 3);
  const hi = fr.some((f) => f.age > 1 && f.y - f.r < LINE && Math.hypot(f.vx, f.vy) < 60); overT = hi ? overT + dt : Math.max(0, overT - dt * 2);
  if (overT > 2.2) { over = true; Board.sfx('lose'); upd(); setTimeout(() => Board.modal('Basket full!', 'Score ' + score + (score >= best && score > 0 ? ' — a new best!' : '') + '.', [['Play again', newGame], ['Close']]), 500); }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; } parts = parts.filter((p) => p.life > 0);
}
function draw() {
  const g = cx.createLinearGradient(0, 0, 0, 600); g.addColorStop(0, '#2a1f3d'); g.addColorStop(1, '#171229'); cx.fillStyle = g; cx.fillRect(0, 0, 400, 600);
  cx.fillStyle = 'rgba(255,255,255,.06)'; cx.fillRect(L, 0, R - L, FLOOR); cx.fillStyle = '#7c4a21'; cx.fillRect(L - 8, 100, 8, FLOOR - 92); cx.fillRect(R, 100, 8, FLOOR - 92); cx.fillRect(L - 8, FLOOR, R - L + 16, 14);
  cx.setLineDash([8, 7]); cx.strokeStyle = overT > 0.2 ? '#f87171' : 'rgba(248,113,113,.45)'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(L, LINE); cx.lineTo(R, LINE); cx.stroke(); cx.setLineDash([]);
  for (const f of fr) fruit(f.x, f.y, f.l, f.r * (f.big && f.age < 0.15 ? 1 + 0.15 * Math.sin(f.age / 0.15 * 3.1) : 1));
  if (!over) { const r = F[cur][1], x = Math.max(L + r, Math.min(R - r, aimX)); if (cool <= 0) { cx.strokeStyle = 'rgba(255,255,255,.25)'; cx.setLineDash([4, 6]); cx.beginPath(); cx.moveTo(x, LINE - 40 + r); cx.lineTo(x, FLOOR); cx.stroke(); cx.setLineDash([]); fruit(x, LINE - 40, cur, r); } }
  cx.fillStyle = 'rgba(255,255,255,.6)'; cx.font = '600 11px sans-serif'; cx.fillText('NEXT', 340, 24); fruit(358, 52, nextL, F[nextL][1] * 0.8);
  for (const p of parts) { cx.globalAlpha = Math.max(0, p.life * 2); cx.fillStyle = p.c; cx.fillRect(p.x - 2, p.y - 2, 4, 4); } cx.globalAlpha = 1;
}
function fruit(x, y, l, r) { const f = F[l]; cx.fillStyle = 'rgba(0,0,0,.3)'; cx.beginPath(); cx.arc(x + 2, y + 4, r, 0, 6.3); cx.fill(); const g = cx.createRadialGradient(x - r * .3, y - r * .35, r * .1, x, y, r); g.addColorStop(0, '#fff'); g.addColorStop(.25, f[2]); g.addColorStop(1, f[2]); cx.fillStyle = f[2]; cx.beginPath(); cx.arc(x, y, r, 0, 6.3); cx.fill(); cx.fillStyle = 'rgba(255,255,255,.22)'; cx.beginPath(); cx.arc(x - r * .28, y - r * .3, r * .5, 0, 6.3); cx.fill(); cx.strokeStyle = 'rgba(0,0,0,.25)'; cx.lineWidth = 2; cx.beginPath(); cx.arc(x, y, r, 0, 6.3); cx.stroke(); cx.font = Math.round(r * 1.1) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillStyle = '#000'; cx.fillText(f[0], x, y + r * 0.06); }
const px = (e) => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) * 400 / r.width; };
cv.addEventListener('pointermove', (e) => { aimX = px(e); }); cv.addEventListener('pointerdown', (e) => { aimX = px(e); });
cv.addEventListener('pointerup', (e) => { aimX = px(e); drop(); });
$('#new').onclick = (e) => { e.target.blur(); newGame(); };
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey) return; const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') { aimX -= 16; e.preventDefault(); } else if (k === 'arrowright' || k === 'd') { aimX += 16; e.preventDefault(); } else if (k === ' ' || k === 'arrowdown' || k === 's') { e.preventDefault(); drop(); } else if (k === 'n') newGame();
});
newGame();
let last = 0; (function loop(t) { requestAnimationFrame(loop); const dt = Math.min(0.033, (t - last) / 1000 || 0); last = t; if (!document.getElementById('bk-dlg')?.open) tick(dt); draw(); })(0);
</script>
</body>
</html>
