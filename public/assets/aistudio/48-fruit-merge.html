<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchard Drop</title>
<style>
  .fm { display: grid; grid-template-columns: auto minmax(220px, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .fm { grid-template-columns: 1fr; } }
  #cv { --h: max(420px, min(100vh - 150px, 720px)); height: var(--h); width: calc(var(--h) * 400 / 600); max-width: calc(100vw - 36px); max-height: calc((100vw - 36px) * 1.5); display: block; border-radius: 14px; box-shadow: 0 20px 50px -20px #000; touch-action: none; cursor: crosshair; }
  .side { display: grid; gap: 12px; } .sc { display: flex; gap: 10px; } .sc div { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; } .sc b { display: block; font-size: 26px; color: var(--text); letter-spacing: 0; }
  .chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; color: var(--muted); font-size: 22px; } .chain i { font-style: normal; font-size: 12px; }
</style>
<script src="music-kit.js"></script><script src="menu-kit.js"></script>
</head>
<body>


<script src="perf-kit.js"></script>
<script src="save-kit.js"></script>
<script src="meta-config.js"></script>
<script src="meta-kit.js"></script>
<script src="board-kit.js"></script>
<script src="score-bridge.js"></script>
<script src="ui-kit.js"></script>
<script src="fx-kit.js"></script>
<script>
/* Orchard Drop — visual pass: painted dusk orchard backdrop with drifting fireflies, wooden glass-front basket,
   baked glossy fruit sprites (crisp, cheap to draw), merge shockwaves, juice droplets, score floaters and a soft screen shake.
   Game rules and physics are unchanged. */
const ui = Board.shell({
  id: 'fruit-merge', title: 'Orchard Drop', subtitle: 'Drop fruit, merge matching pairs, grow the biggest melon',
  rules: 'Move left and right, then drop a fruit into the basket. When two fruits of the same kind touch, they merge into the next bigger fruit and score points. Cherry → strawberry → grape → orange → apple → pear → peach → pineapple → melon → watermelon. Two watermelons vanish for a big bonus. Do not let the pile climb above the red line for more than a couple of seconds — that ends the game.',
  controls: [['Mouse / touch drag', 'Aim the fruit'], ['Click / tap / Space / ↓', 'Drop it'], ['← →  /  A D', 'Move the aim'], ['N', 'New game'], ['H / M', 'Toggle help / mute']],
});
ui.main.innerHTML = `<div class="fm"><canvas id="cv" width="400" height="600"></canvas><div class="side">
  <div class="sc"><div>Score<b id="sc">0</b></div><div>Best<b id="best">0</b></div></div>
  <div class="bk-status" id="st"></div>
  <div class="bk-row"><button class="bk-btn bk-primary" id="new">New game</button></div>
  <div><div style="color:var(--muted);font-size:12px;margin-bottom:4px">MERGE CHAIN</div><div class="chain" id="chain"></div></div></div></div>`;
const $ = (s) => ui.main.querySelector(s);
const cv = $('#cv'), cx = cv.getContext('2d');
const F = [['🍒', 15, '#ef4444'], ['🍓', 21, '#fb7185'], ['🍇', 27, '#a855f7'], ['🍊', 33, '#fb923c'], ['🍎', 41, '#dc2626'], ['🍐', 49, '#a3e635'], ['🍑', 58, '#fdba74'], ['🍍', 68, '#facc15'], ['🍈', 80, '#4ade80'], ['🍉', 94, '#16a34a']];
$('#chain').innerHTML = F.map((f, i) => f[0] + (i < F.length - 1 ? '<i>→</i>' : '')).join('');
const L = 20, R = 380, FLOOR = 580, LINE = 120, G = 1500;
let fr, score, best, over, cur, nextL, aimX, cool, t0, parts, id = 0, overT;
let rings = [], floaters = [], shake = 0, clock = 0;
let difficulty = Board.difficulty();
window.addEventListener('apex:board-difficulty', (event) => { difficulty = event.detail?.difficulty || 'normal'; });
const still = () => Fx.reducedMotion('fruit-merge');
function newGame() { fr = []; score = 0; over = false; parts = []; rings = []; floaters = []; shake = 0; best = +Board.ls.get('apex:fm:best') || 0; aimX = 200; cool = 0; cur = rl(); nextL = rl(); overT = 0; upd(); }
const rl = () => Board.rand(4);
function upd() { $('#sc').textContent = score; $('#best').textContent = best; $('#st').textContent = over ? 'The pile is too high — game over' : 'Aim and drop. Biggest so far: ' + (fr.length ? F[Math.max(...fr.map((f) => f.l))][0] : '—'); }
function drop() { if (over || cool > 0) return; const r = F[cur][1]; fr.push({ id: ++id, l: cur, x: Math.max(L + r, Math.min(R - r, aimX)), y: LINE - 40, vx: 0, vy: 0, r, age: 0, m: r * r }); cur = nextL; nextL = rl(); cool = difficulty === 'easy' ? 0.75 : difficulty === 'hard' ? 0.35 : 0.55; Board.sfx('click'); }
function step(dt) {
  const n = fr.length; for (const f of fr) { f.vy += G * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.9985; f.age += dt; }
  const merge = [];
  for (let it = 0; it < 4; it++) {
    for (const f of fr) { if (f.x < L + f.r) { f.x = L + f.r; if (f.vx < 0) f.vx *= -0.2; } if (f.x > R - f.r) { f.x = R - f.r; if (f.vx > 0) f.vx *= -0.2; } if (f.y > FLOOR - f.r) { f.y = FLOOR - f.r; if (f.vy > 0) f.vy *= -0.15; f.vx *= 0.985; } }
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = fr[i], b = fr[j]; if (a.dead || b.dead) continue; const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r; if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
      const d2 = dx * dx + dy * dy; if (d2 >= rr * rr) continue; const d = Math.sqrt(d2) || 0.01, nx = dx / d, ny = dy / d, ov = rr - d, im = 1 / a.m + 1 / b.m;
      if (a.l === b.l && a.age > 0.05 && b.age > 0.05) { a.dead = b.dead = true; merge.push([a, b]); continue; }
      a.x -= nx * ov * (1 / a.m) / im; a.y -= ny * ov * (1 / a.m) / im; b.x += nx * ov * (1 / b.m) / im; b.y += ny * ov * (1 / b.m) / im;
      const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny; if (vn < 0) { const j2 = -(1.05) * vn / im; a.vx -= j2 * nx / a.m; a.vy -= j2 * ny / a.m; b.vx += j2 * nx / b.m; b.vy += j2 * ny / b.m; const tx = -ny, ty = nx, vt = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty, jt = vt * 0.04 / im; a.vx += jt * tx / a.m; a.vy += jt * ty / a.m; b.vx -= jt * tx / b.m; b.vy -= jt * ty / b.m; }
    }
  }
  for (const [a, b] of merge) {
    const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
    if (a.l === F.length - 1) { score += 200; pop(x, y, F[a.l][2], 30); ring(x, y, F[a.l][2], 160); ring(x, y, '#fff', 110); floaters.push({ x, y, t: 0, txt: '+200', c: '#fde68a' }); shake = Math.max(shake, 8); Board.sfx('win'); }
    else { const l = a.l + 1, r = F[l][1], gain = (l + 1) * 2 - 1 + l; fr.push({ id: ++id, l, x, y, vx: (a.vx + b.vx) / 2, vy: (a.vy + b.vy) / 2, r, age: 0, m: r * r, big: 1 }); score += gain; pop(x, y, F[l][2], 12 + l * 2); ring(x, y, F[l][2], r * 2.1); floaters.push({ x, y: y - r * 0.4, t: 0, txt: '+' + gain, c: '#fff' }); shake = Math.max(shake, Math.min(6, 1 + l * 0.5)); Board.sfx(l > 5 ? 'win' : 'capture'); }
  }
  if (merge.length) { fr = fr.filter((f) => !f.dead); if (score > best) { best = score; Board.ls.set('apex:fm:best', best); } upd(); }
}
function ring(x, y, c, r) { rings.push({ x, y, c, r, t: 0 }); }
function pop(x, y, c, n) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.3, s = 60 + Math.random() * 190; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: .45 + Math.random() * .35, max: .8, c, sz: 2 + Math.random() * 3.2 }); }
  for (let i = 0; i < Math.ceil(n / 3); i++) { const a = Math.random() * 6.3, s = 30 + Math.random() * 90; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .6, max: .6, c: '#fff', sz: 1.5, spark: 1 }); }
}
function tick(dt) {
  clock += dt;
  if (over) return; cool -= dt; for (let k = 0; k < 3; k++) step(dt / 3);
  const hi = fr.some((f) => f.age > 1 && f.y - f.r < LINE && Math.hypot(f.vx, f.vy) < 60); overT = hi ? overT + dt : Math.max(0, overT - dt * 2);
  if (overT > 2.2) { over = true; Board.sfx('lose'); upd(); Board.after(500, () => over && Board.modal('Basket full!', 'Score ' + score + (score >= best && score > 0 ? ' — a new best!' : '') + '.', [['Play again', newGame], ['Close']])); }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; } parts = parts.filter((p) => p.life > 0);
  for (const r of rings) r.t += dt; rings = rings.filter((r) => r.t < 0.5);
  for (const f of floaters) f.t += dt; floaters = floaters.filter((f) => f.t < 0.9);
  shake *= 0.88; if (shake < 0.2) shake = 0;
}

/* ---------- baked art ---------- */
function shade(hex, amt) {
  const h = hex.replace('#', ''), v = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
  return 'rgb(' + v.map((c) => Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt)).join(',') + ')';
}
function bgSprite() {
  return Fx.bake('orch-bg', 400, 600, (c) => {
    const g = c.createLinearGradient(0, 0, 0, 600); g.addColorStop(0, '#1b2547'); g.addColorStop(0.45, '#3a2b5c'); g.addColorStop(1, '#1d1530');
    c.fillStyle = g; c.fillRect(0, 0, 400, 600);
    for (let i = 0; i < 60; i++) { c.fillStyle = 'rgba(255,255,255,' + (0.2 + Math.random() * 0.5).toFixed(2) + ')'; c.fillRect(Math.random() * 400, Math.random() * 180, 1.4, 1.4); }
    const mg = c.createRadialGradient(320, 70, 4, 320, 70, 90); mg.addColorStop(0, 'rgba(253,230,138,.55)'); mg.addColorStop(1, 'rgba(253,230,138,0)');
    c.fillStyle = mg; c.fillRect(220, 0, 180, 170);
    c.fillStyle = '#fde68a'; c.beginPath(); c.arc(320, 70, 16, 0, 6.3); c.fill();
    // rolling hills and orchard trees
    const hill = (base, amp, col, seed) => { c.fillStyle = col; c.beginPath(); c.moveTo(0, 600); for (let x = 0; x <= 400; x += 10) c.lineTo(x, base - Math.sin(x * 0.02 + seed) * amp - Math.sin(x * 0.05 + seed * 2) * amp * 0.4); c.lineTo(400, 600); c.closePath(); c.fill(); };
    hill(330, 22, '#241a3d', 1); hill(390, 26, '#1f1836', 3);
    for (let i = 0; i < 9; i++) { const x = 20 + i * 46 + (i % 2) * 10, y = 372 + (i % 3) * 10; c.fillStyle = '#17112b'; c.fillRect(x - 2, y, 4, 26); c.beginPath(); c.arc(x, y - 2, 15 + (i % 3) * 2, 0, 6.3); c.fill(); }
  });
}
function basketSprite() {
  return Fx.bake('orch-basket', 420, 620, (c) => {
    // glass back panel
    const g = c.createLinearGradient(0, 0, 0, FLOOR); g.addColorStop(0, 'rgba(255,255,255,.04)'); g.addColorStop(1, 'rgba(255,255,255,.10)');
    c.fillStyle = g; c.fillRect(L, 0, R - L, FLOOR);
    const sh = c.createLinearGradient(L, 0, R, FLOOR); sh.addColorStop(0, 'rgba(255,255,255,.10)'); sh.addColorStop(0.4, 'rgba(255,255,255,0)');
    c.fillStyle = sh; c.fillRect(L, 0, R - L, FLOOR);
    // wooden planks
    const wood = (x, y, w, h, vertical) => {
      const wg = vertical ? c.createLinearGradient(x, 0, x + w, 0) : c.createLinearGradient(0, y, 0, y + h);
      wg.addColorStop(0, '#a8692f'); wg.addColorStop(0.5, '#7c4a21'); wg.addColorStop(1, '#5a3416');
      c.fillStyle = wg; c.fillRect(x, y, w, h);
      c.strokeStyle = 'rgba(40,20,5,.35)'; c.lineWidth = 1;
      for (let i = 0; i < (vertical ? h : w); i += 14) { c.beginPath(); if (vertical) { c.moveTo(x, y + i); c.lineTo(x + w, y + i + 3); } else { c.moveTo(x + i, y); c.lineTo(x + i + 3, y + h); } c.stroke(); }
    };
    wood(L - 10, 100, 10, FLOOR - 92, true); wood(R, 100, 10, FLOOR - 92, true); wood(L - 10, FLOOR, R - L + 20, 18, false);
    c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(L - 10, 100, 2, FLOOR - 92); c.fillRect(R, 100, 2, FLOOR - 92); c.fillRect(L - 10, FLOOR, R - L + 20, 2);
    // brass rivets
    c.fillStyle = '#facc15'; for (const [x, y] of [[L - 5, 110], [L - 5, 330], [L - 5, 560], [R + 5, 110], [R + 5, 330], [R + 5, 560]]) { c.beginPath(); c.arc(x, y, 2.4, 0, 6.3); c.fill(); }
    // floor shine
    const fg = c.createLinearGradient(0, FLOOR - 40, 0, FLOOR); fg.addColorStop(0, 'rgba(255,200,120,0)'); fg.addColorStop(1, 'rgba(255,200,120,.12)');
    c.fillStyle = fg; c.fillRect(L, FLOOR - 40, R - L, 40);
  });
}
function fruitSprite(l) {
  const r = F[l][1], pad = 6, size = (r + pad) * 2, S = 2;
  return Fx.bake('fruit' + l, size * S, size * S, (c) => {
    c.scale(S, S);
    const x = size / 2, y = size / 2, col = F[l][2];
    const g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
    g.addColorStop(0, shade(col, 0.55)); g.addColorStop(0.45, col); g.addColorStop(1, shade(col, -0.4));
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 6.3); c.fill();
    // soft rim light and under-glow
    c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, r - 1.2, 3.4, 4.9); c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.28)'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, r - 0.5, 0, 6.3); c.stroke();
    // glossy highlight
    const hg = c.createLinearGradient(x - r * 0.5, y - r * 0.6, x, y - r * 0.1); hg.addColorStop(0, 'rgba(255,255,255,.55)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = hg; c.beginPath(); c.ellipse(x - r * 0.3, y - r * 0.4, r * 0.42, r * 0.26, -0.6, 0, 6.3); c.fill();
    c.font = Math.round(r * 1.1) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000';
    c.fillText(F[l][0], x, y + r * 0.06);
  });
}
function fruit(x, y, l, r, sq) {
  const spr = fruitSprite(l), base = F[l][1], size = (base + 6) * 2, k = r / base;
  cx.fillStyle = 'rgba(0,0,0,.28)'; cx.beginPath(); cx.ellipse(x + 2, y + r * 0.92, r * 0.85, r * 0.22, 0, 0, 6.3); cx.fill();
  const sx = k * (sq || 1), sy = k * (sq ? 2 - sq : 1);
  cx.drawImage(spr, x - size * sx / 2, y - size * sy / 2, size * sx, size * sy);
}

function draw() {
  const mv = still() ? 0 : clock;
  cx.save();
  if (shake > 0 && !still()) cx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  cx.drawImage(bgSprite(), 0, 0);
  // drifting fireflies
  if (!still()) { cx.save(); cx.globalCompositeOperation = 'lighter'; for (let i = 0; i < 16; i++) { const x = (i * 97.3 + Math.sin(mv * 0.4 + i) * 22 + 400) % 400, y = 200 + ((i * 53.7 + mv * (6 + (i % 5))) % 360), a = 0.25 + 0.5 * Math.abs(Math.sin(mv * 1.3 + i * 2)); cx.fillStyle = 'rgba(253,230,138,' + a.toFixed(2) + ')'; cx.beginPath(); cx.arc(x, 560 - (y - 200), 1.6, 0, 6.3); cx.fill(); } cx.restore(); }
  cx.drawImage(basketSprite(), 0, 0);
  // danger line with glow
  const danger = overT > 0.2, pulse = 0.5 + 0.5 * Math.sin(clock * 10);
  if (danger) { const dg = cx.createLinearGradient(0, LINE - 26, 0, LINE + 6); dg.addColorStop(0, 'rgba(248,113,113,0)'); dg.addColorStop(1, 'rgba(248,113,113,' + (0.15 + 0.25 * pulse).toFixed(2) + ')'); cx.fillStyle = dg; cx.fillRect(L, LINE - 26, R - L, 32); }
  cx.setLineDash([8, 7]); cx.lineDashOffset = -mv * 14; cx.strokeStyle = danger ? '#f87171' : 'rgba(248,113,113,.45)'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(L, LINE); cx.lineTo(R, LINE); cx.stroke(); cx.setLineDash([]); cx.lineDashOffset = 0;
  for (const f of fr) {
    const pul = f.big && f.age < 0.15 ? 1 + 0.15 * Math.sin(f.age / 0.15 * 3.1) : 1;
    const spd = Math.min(1, Math.hypot(f.vx, f.vy) / 700), sq = f.age < 0.2 ? 1 + 0.08 * Math.sin(f.age / 0.2 * 6.3) * (1 - f.age / 0.2) : 1 - spd * 0.05;
    fruit(f.x, f.y, f.l, f.r * pul, sq);
  }
  if (!over) {
    const r = F[cur][1], x = Math.max(L + r, Math.min(R - r, aimX));
    if (cool <= 0) {
      const lg = cx.createLinearGradient(0, LINE - 40 + r, 0, FLOOR); lg.addColorStop(0, 'rgba(255,255,255,.4)'); lg.addColorStop(1, 'rgba(255,255,255,.04)');
      cx.strokeStyle = lg; cx.lineWidth = 2; cx.setLineDash([4, 6]); cx.lineDashOffset = -mv * 20; cx.beginPath(); cx.moveTo(x, LINE - 40 + r); cx.lineTo(x, FLOOR); cx.stroke(); cx.setLineDash([]); cx.lineDashOffset = 0;
      cx.save(); cx.globalCompositeOperation = 'lighter'; const gl = cx.createRadialGradient(x, LINE - 40, r * 0.5, x, LINE - 40, r * 1.9); gl.addColorStop(0, F[cur][2] + '55'); gl.addColorStop(1, F[cur][2] + '00'); cx.fillStyle = gl; cx.fillRect(x - r * 2, LINE - 40 - r * 2, r * 4, r * 4); cx.restore();
      fruit(x, LINE - 40 + Math.sin(mv * 3) * 1.5, cur, r);
    }
  }
  // next-fruit pill
  cx.fillStyle = 'rgba(10,8,24,.55)'; cx.beginPath(); cx.roundRect ? cx.roundRect(300, 8, 90, 64, 14) : cx.rect(300, 8, 90, 64); cx.fill();
  cx.strokeStyle = 'rgba(255,255,255,.14)'; cx.lineWidth = 1; cx.stroke();
  cx.fillStyle = 'rgba(255,255,255,.65)'; cx.font = '700 10px sans-serif'; cx.textAlign = 'center'; cx.fillText('NEXT', 345, 22); fruit(345, 48, nextL, F[nextL][1] * 0.8 > 24 ? 24 : F[nextL][1] * 0.8);
  // merge shockwaves
  for (const rg of rings) { const k = rg.t / 0.5, e = 1 - Math.pow(1 - k, 3); cx.save(); cx.globalCompositeOperation = 'lighter'; cx.strokeStyle = rg.c; cx.globalAlpha = 1 - k; cx.lineWidth = 5 * (1 - k) + 1; cx.beginPath(); cx.arc(rg.x, rg.y, rg.r * 0.3 + rg.r * 0.7 * e, 0, 6.3); cx.stroke(); cx.restore(); }
  // juice droplets and sparks
  cx.save(); cx.globalCompositeOperation = 'lighter';
  for (const p of parts) { cx.globalAlpha = Math.max(0, p.life / p.max); cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.sz * (p.spark ? 1 : 0.5 + 0.5 * p.life / p.max), 0, 6.3); cx.fill(); }
  cx.restore(); cx.globalAlpha = 1;
  // score floaters
  for (const fl of floaters) { const k = fl.t / 0.9; cx.save(); cx.globalAlpha = 1 - k * k; cx.font = '800 ' + Math.round(16 + 6 * (1 - k)) + 'px sans-serif'; cx.textAlign = 'center'; cx.shadowColor = 'rgba(0,0,0,.6)'; cx.shadowBlur = 4; cx.fillStyle = fl.c; cx.fillText(fl.txt, fl.x, fl.y - k * 34); cx.restore(); }
  cx.restore();
  Fx.vignette(cx, 400, 600, 0.35);
}
const px = (e) => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) * 400 / r.width; };
cv.addEventListener('pointermove', (e) => { aimX = px(e); }); cv.addEventListener('pointerdown', (e) => { aimX = px(e); });
cv.addEventListener('pointerup', (e) => { aimX = px(e); drop(); });
$('#new').onclick = (e) => { e.target.blur(); newGame(); };
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey) return; const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') { aimX -= 16; e.preventDefault(); } else if (k === 'arrowright' || k === 'd') { aimX += 16; e.preventDefault(); } else if (k === ' ' || k === 'arrowdown' || k === 's') { e.preventDefault(); drop(); } else if (k === 'n') newGame();
});
newGame();
let last = 0; (function loop(t) { requestAnimationFrame(loop); const dt = Math.min(0.033, (t - last) / 1000 || 0); last = t; if (Board.paused()) return; if (!document.getElementById('bk-dlg')?.open) tick(dt); draw(); })(0);
</script>
<script src="menu-bootstrap.js"></script>
</body>
</html>
