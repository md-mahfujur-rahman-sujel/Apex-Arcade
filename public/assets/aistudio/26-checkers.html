<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkers</title>
<style>
  .ck { display: grid; grid-template-columns: auto minmax(240px, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .ck { grid-template-columns: 1fr; } }
  #bd { --s: max(240px, min(100vw - 40px, 600px, 100vh - 200px)); width: var(--s); height: var(--s); flex: none; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); border-radius: 10px; overflow: hidden; box-shadow: 0 20px 50px -20px #000, 0 0 0 6px #2a2f45; user-select: none; touch-action: manipulation; }
  .q { position: relative; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .q.l { background: #d9b38c; } .q.d { background: #3f2a1d; }
  .q.lm { background-image: linear-gradient(rgba(245,158,11,.38), rgba(245,158,11,.38)); }
  .q.sel { box-shadow: inset 0 0 0 4px #06b6d4; }
  .q.tg::after { content: ""; position: absolute; width: 26%; height: 26%; border-radius: 50%; background: rgba(16,185,129,.85); }
  .q.mv .pc { outline: 3px solid #f59e0b; outline-offset: -3px; }
  .pc { width: 78%; height: 78%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--s) / 8 * .42); color: #fde047; box-shadow: 0 4px 0 rgba(0,0,0,.4), inset 0 0 0 4px rgba(255,255,255,.22), inset 0 0 0 9px rgba(0,0,0,.14); }
  .pc.r { background: radial-gradient(circle at 35% 30%, #fb7185, #be123c); }
  .pc.b { background: radial-gradient(circle at 35% 30%, #71717a, #09090b); }
  .side { display: grid; gap: 12px; }
  .capt { color: var(--muted); line-height: 1.7; }
</style>
</head>
<body>

<script src="perf-kit.js"></script>
<script src="save-kit.js"></script>
<script src="meta-config.js"></script>
<script src="meta-kit.js"></script>
<script src="board-kit.js"></script>
<script src="score-bridge.js"></script>
<script src="ui-kit.js"></script>
<script>
const ui = Board.shell({
  id: 'checkers', cpu: true, title: 'Checkers', subtitle: 'Jump, capture and crown — captures are mandatory',
  rules: 'Move diagonally forward onto empty dark squares. If you can capture, you must, and you keep jumping while another jump is available. A piece that reaches the far row is crowned a king (♛) and may move and capture backwards too. Capture or block every enemy piece to win. Red moves first.',
  controls: [['Click', 'Select a piece, then a green square'], ['U', 'Undo'], ['F', 'Flip the board'], ['N', 'New game'], ['H / M', 'Toggle help / mute']],
});
ui.main.innerHTML = `
<div class="ck">
  <div><div id="bd"></div></div>
  <div class="side">
    <div class="bk-status" id="st"></div>
    <div class="bk-row">
      <label>Play <select class="bk-select" id="mode"><option value="r">Red (first) vs computer</option><option value="b">Black vs computer</option><option value="two">Two players</option></select></label>
      <label>Level <select class="bk-select" id="lvl"><option value="0">Easy</option><option value="1" selected>Medium</option><option value="2">Hard</option></select></label>
    </div>
    <div class="bk-row"><button class="bk-btn bk-primary" id="new">New game</button><button class="bk-btn" id="undo">Undo</button><button class="bk-btn" id="flip">Flip</button></div>
    <div class="capt" id="cp"></div>
  </div>
</div>`;
const $ = (s) => ui.main.querySelector(s);

/* ---- rules: red moves up the board, black moves down; capital letters are kings ---- */
const mk = () => { const b = Array(64).fill(0); for (let i = 0; i < 64; i++) if (((i >> 3) + (i & 7)) % 2) { if (i >> 3 < 3) b[i] = 'b'; else if (i >> 3 > 4) b[i] = 'r'; } return b; };
const opp = (s) => (s === 'r' ? 'b' : 'r');
function jumps(b, i, s, caps, path, out) {
  const p = b[i], K = p < 'a', dirs = K ? [[-1, -1], [-1, 1], [1, -1], [1, 1]] : s === 'r' ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]]; let any = 0;
  for (const [dr, dc] of dirs) {
    const r = (i >> 3) + dr, c = (i & 7) + dc, r2 = r + dr, c2 = c + dc; if (r2 < 0 || r2 > 7 || c2 < 0 || c2 > 7) continue;
    const m = r * 8 + c, l = r2 * 8 + c2, q = b[m];
    if (q && q.toLowerCase() !== s && !b[l]) {
      any = 1; const b2 = b.slice(); b2[l] = p; b2[i] = 0; b2[m] = 0; const nc = [...caps, m], np = [...path, l];
      if (!K && (s === 'r' ? r2 === 0 : r2 === 7)) out.push({ path: np, caps: nc }); else jumps(b2, l, s, nc, np, out);
    }
  }
  if (!any && caps.length) out.push({ path, caps });
}
function moves(b, s) {
  const J = [], M = [];
  for (let i = 0; i < 64; i++) { const p = b[i]; if (p && p.toLowerCase() === s) jumps(b, i, s, [], [i], J); }
  if (J.length) return J;
  for (let i = 0; i < 64; i++) {
    const p = b[i]; if (!p || p.toLowerCase() !== s) continue;
    const K = p < 'a', dirs = K ? [[-1, -1], [-1, 1], [1, -1], [1, 1]] : s === 'r' ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]];
    for (const [dr, dc] of dirs) { const r = (i >> 3) + dr, c = (i & 7) + dc; if (r >= 0 && r < 8 && c >= 0 && c < 8 && !b[r * 8 + c]) M.push({ path: [i, r * 8 + c], caps: [] }); }
  }
  return M;
}
function ap(b, m) {
  const b2 = b.slice(), f = m.path[0], t = m.path[m.path.length - 1]; let p = b2[f]; b2[f] = 0; m.caps.forEach((x) => { b2[x] = 0; });
  if (p >= 'a' && (p === 'r' ? t >> 3 === 0 : t >> 3 === 7)) p = p.toUpperCase(); b2[t] = p; return b2;
}
function ev(b, s) {
  let v = 0;
  for (let i = 0; i < 64; i++) { const p = b[i]; if (!p) continue; const o = p.toLowerCase(), r = i >> 3; let x = p < 'a' ? 170 : 100 + (o === 'r' ? 7 - r : r) * 4; if (p >= 'a' && (o === 'r' ? r === 7 : r === 0)) x += 10; v += o === s ? x : -x; }
  return v;
}
function nm(b, s, d, a, be) {
  const ms = moves(b, s); if (!ms.length) return -1e5 - d; if (!d) return ev(b, s);
  ms.sort((x, y) => y.caps.length - x.caps.length); let best = -1e9;
  for (const m of ms) { const v = -nm(ap(b, m), opp(s), d - 1, -be, -a); if (v > best) best = v; if (best > a) a = best; if (a >= be) break; }
  return best;
}

/* ---- game state & UI ---- */
let B, turn, sel, tg, lm, over, flip, mode, busy, hist, np, gen = 0;
const bd = $('#bd'), sqs = [];
for (let k = 0; k < 64; k++) { const d = document.createElement('div'); d.dataset.k = k; bd.appendChild(d); sqs.push(d); }
const human = () => mode === 'two' || turn === mode;
function newGame() { gen++; mode = $('#mode').value; B = mk(); turn = 'r'; sel = -1; tg = []; lm = null; over = null; busy = false; hist = []; np = 0; flip = mode === 'b'; render(); cpu(); }
function render() {
  const ms = over ? [] : moves(B, turn), from = new Set(ms.map((m) => m.path[0])), tset = new Set(tg.map((m) => m.path[m.path.length - 1]));
  sqs.forEach((d, k) => {
    const i = flip ? 63 - k : k, r = i >> 3, c = i & 7, p = B[i];
    d.className = 'q ' + ((r + c) % 2 ? 'd' : 'l') + (lm && lm.includes(i) ? ' lm' : '') + (i === sel ? ' sel' : '') + (tset.has(i) ? ' tg' : '') + (sel < 0 && !over && !busy && human() && from.has(i) ? ' mv' : '');
    d.innerHTML = p ? `<div class="pc ${p.toLowerCase()}">${p < 'a' ? '\u265B' : ''}</div>` : '';
  });
  const who = turn === 'r' ? 'Red' : 'Black', cap = ms.length && ms[0].caps.length;
  $('#st').textContent = over || (busy ? who + ' (computer) is thinking…' : who + ' to move' + (cap ? ' — you must capture!' : '') + (mode !== 'two' && human() ? ' — your turn' : ''));
  const n = (s) => B.filter((p) => p && p.toLowerCase() === s).length, k = (s) => B.filter((p) => p === s.toUpperCase()).length;
  $('#cp').innerHTML = `Red: <b>${n('r')}</b> pieces (${k('r')} kings)<br>Black: <b>${n('b')}</b> pieces (${k('b')} kings)`;
}
function play(m) {
  hist.push({ B, turn, lm, np }); const king = B[m.path[0]] < 'a';
  np = king && !m.caps.length ? np + 1 : 0; B = ap(B, m); lm = [m.path[0], m.path[m.path.length - 1]]; turn = opp(turn); sel = -1; tg = [];
  Board.sfx(m.caps.length ? 'capture' : 'move');
  if (!moves(B, turn).length) over = (turn === 'r' ? 'Black' : 'Red') + ' wins!'; else if (np >= 80) over = 'Draw — no progress in 40 moves';
  render();
  if (over) { const w = mode !== 'two' && over.includes(mode === 'r' ? 'Red' : 'Black'); Board.sfx(over.startsWith('Draw') ? 'move' : mode === 'two' || w ? 'win' : 'lose'); Board.modal(over.startsWith('Draw') ? 'Draw' : mode === 'two' ? over : w ? 'You won!' : 'Computer wins', over, [['New game', newGame], ['Close']]); }
  else cpu();
}
function cpu() {
  if (over || human()) return; busy = true; render();
  const g = gen, s = turn;
  Board.think(() => {
    const ms = moves(B, s), L = +$('#lvl').value, d = [2, 4, 6][L], noise = [40, 0, 0][L]; let bm = ms[0], bs = -1e9;
    for (const m of ms) { const v = -nm(ap(B, m), opp(s), d - 1, -1e9, 1e9) + Math.random() * noise; if (v > bs) { bs = v; bm = m; } }
    return bm;
  }, 1000).then(async (bm) => {
    if (g !== gen || !bm) return;
    const el = (i) => sqs[flip ? 63 - i : i];
    sel = bm.path[0]; render(); await Board.sleep(Board.pace(380));          /* show which piece it picked */
    if (g !== gen) return;
    await Board.glide(el(bm.path[0]), bm.path.slice(1).map(el), 460, '.pc', (h) => {   /* hop along the whole jump path */
      if (bm.caps[h]) { const c = el(bm.caps[h]).querySelector('.pc'); if (c) c.style.visibility = 'hidden'; Board.sfx('capture'); }
    });
    if (g !== gen) return;
    busy = false; play(bm);
  });
}
bd.addEventListener('click', (e) => {
  const d = e.target.closest('.q'); if (!d || over || busy || !human()) return;
  const i = flip ? 63 - +d.dataset.k : +d.dataset.k;
  if (sel >= 0) { const m = tg.find((x) => x.path[x.path.length - 1] === i); if (m) return play(m); }
  const ms = moves(B, turn).filter((m) => m.path[0] === i);
  if (B[i] && B[i].toLowerCase() === turn && ms.length) { sel = i; tg = ms; Board.sfx('click'); } else { sel = -1; tg = []; Board.sfx('error'); }
  render();
});
function undo() {
  if (busy || !hist.length) return;
  const pop = () => { const h = hist.pop(); B = h.B; turn = h.turn; lm = h.lm; np = h.np; };
  pop(); if (mode !== 'two' && !human() && hist.length) pop();
  over = null; sel = -1; tg = []; render(); cpu();
}
$('#new').onclick = newGame; $('#undo').onclick = undo; $('#flip').onclick = () => { flip = !flip; render(); }; $('#mode').onchange = newGame;
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase(); if (k === 'n') newGame(); else if (k === 'u') undo(); else if (k === 'f') { flip = !flip; render(); }
});
newGame();
</script>
</body>
</html>
