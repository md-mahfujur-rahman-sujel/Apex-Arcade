<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Golf</title>
</head>
<body>
<script src="arcade-core.js"></script>
<script>
(function () {
  const A = Arcade, W = 800, H = 480, BR = 7, HR = 12, MAXV = 11.5, WALL = 4;
  const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  const HOLES = [
    { par: 2, tee: [160, 240], hole: [640, 240], poly: rect(100, 180, 600, 120), name: 'Warm-up' },
    { par: 3, tee: [150, 140], hole: [630, 400], poly: [[100, 80], [700, 80], [700, 440], [560, 440], [560, 200], [100, 200]], name: 'The Dogleg' },
    { par: 3, tee: [150, 240], hole: [650, 240], poly: rect(100, 140, 600, 200), bumpers: [[320, 200, 22], [400, 290, 22], [480, 200, 22]], name: 'Bumper Alley' },
    { par: 3, tee: [150, 240], hole: [650, 240], poly: rect(100, 160, 600, 160), sand: [[330, 160, 140, 160]], name: 'Sand Trap' },
    { par: 3, tee: [150, 240], hole: [650, 240], poly: rect(100, 130, 600, 220), mill: { cx: 400, cy: 240, len: 150, spd: 0.035 }, name: 'The Windmill' },
    { par: 3, tee: [150, 200], hole: [650, 200], poly: rect(100, 120, 600, 240), water: [[360, 120, 100, 170]], name: 'Water Hazard' },
    { par: 3, tee: [150, 240], hole: [650, 240], poly: rect(100, 150, 600, 180), slides: [{ x: 300, y: 240, len: 110, amp: 55, spd: 0.03, ph: 0 }, { x: 500, y: 240, len: 110, amp: 55, spd: 0.03, ph: Math.PI }], name: 'Moving Walls' },
    { par: 4, tee: [150, 160], hole: [640, 390], poly: rect(100, 100, 600, 340), walls: [[100, 230, 560, 230], [240, 330, 700, 330]], name: 'The Zigzag' },
    { par: 4, tee: [150, 270], hole: [650, 270], poly: rect(100, 100, 600, 340), mill: { cx: 400, cy: 270, len: 170, spd: 0.04 }, bumpers: [[260, 170, 20], [540, 370, 20], [260, 370, 20], [540, 170, 20]], name: 'Grand Finale' },
  ];
  let G, h, segs, ball, last, strokes, state, drag = null, ptr = { x: 0, y: 0 }, aimA, kp, wasChg, sinkT, between, msg, msgT, totalS, totalPar, hitCd = 0, inited = false, held0 = false;
  const hole = () => HOLES[h];
  function load(i) {
    h = i; const H0 = hole(); segs = [];
    H0.poly.forEach((p, k) => { const q = H0.poly[(k + 1) % H0.poly.length]; segs.push([p[0], p[1], q[0], q[1]]); }); (H0.walls || []).forEach((w) => segs.push(w));
    ball = { x: H0.tee[0], y: H0.tee[1], vx: 0, vy: 0, s: 1 }; last = { x: ball.x, y: ball.y }; strokes = 0; state = 'aim'; aimA = Math.atan2(H0.hole[1] - ball.y, H0.hole[0] - ball.x); kp = 0; wasChg = false; sinkT = 0; drag = null;
    msg = 'Hole ' + (i + 1) + ' — ' + H0.name + ' · Par ' + H0.par; msgT = 120;
  }
  function init(g) { G = g; totalS = 0; totalPar = 0; between = 0; load(0); if (!inited) { inited = true; bind(); } }
  const pt = (e) => { const r = G.canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  function bind() {
    G.canvas.addEventListener('pointermove', (e) => { ptr = pt(e); });
    G.canvas.addEventListener('pointerdown', (e) => { if (G.state !== 'playing' || state !== 'aim') return; ptr = pt(e); drag = { x: ptr.x, y: ptr.y }; });
    window.addEventListener('pointerup', () => {
      if (!drag) return; const d = drag; drag = null; if (G.state !== 'playing' || state !== 'aim') return;
      const dx = d.x - ptr.x, dy = d.y - ptr.y, len = Math.hypot(dx, dy); if (len < 10) return; putt(Math.atan2(dy, dx), Math.min(1, len / 150));
    });
  }
  function putt(a, p) { last = { x: ball.x, y: ball.y }; const v = Math.max(1.2, p * MAXV); ball.vx = Math.cos(a) * v; ball.vy = Math.sin(a) * v; strokes++; state = 'roll'; A.sfx('thud'); aimA = a; }
  const inR = (r) => ball.x > r[0] && ball.x < r[0] + r[2] && ball.y > r[1] && ball.y < r[1] + r[3];
  function hitSeg(x1, y1, x2, y2, half, o) {
    const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy; let t = ((ball.x - x1) * dx + (ball.y - y1) * dy) / L2; t = A.clamp(t, 0, 1);
    const cx = x1 + dx * t, cy = y1 + dy * t; let nx = ball.x - cx, ny = ball.y - cy; const d = Math.hypot(nx, ny), m = BR + half; if (d >= m || d < 1e-6) return false;
    nx /= d; ny /= d; ball.x = cx + nx * m; ball.y = cy + ny * m; let sx = 0, sy = 0;
    if (o) { if (o.w) { sx = -o.w * (cy - o.py); sy = o.w * (cx - o.px); } else { sx = o.vx || 0; sy = o.vy || 0; } }
    const rx = ball.vx - sx, ry = ball.vy - sy, vn = rx * nx + ry * ny;
    if (vn < 0) { const e = 0.8; ball.vx = rx - (1 + e) * vn * nx + sx; ball.vy = ry - (1 + e) * vn * ny + sy; if (-vn > 1.5 && hitCd <= 0) { A.sfx('blip'); hitCd = 5; } }
    return true;
  }
  function hitCirc(cx, cy, r, e) {
    let nx = ball.x - cx, ny = ball.y - cy; const d = Math.hypot(nx, ny), m = BR + r; if (d >= m || d < 1e-6) return false;
    nx /= d; ny /= d; ball.x = cx + nx * m; ball.y = cy + ny * m; const vn = ball.vx * nx + ball.vy * ny;
    if (vn < 0) { ball.vx -= (1 + e) * vn * nx; ball.vy -= (1 + e) * vn * ny; if (hitCd <= 0) { A.sfx('pop'); hitCd = 5; } }
    return true;
  }
  function slideY(s) { return s.y + Math.sin(G.t * s.spd + s.ph) * s.amp; }
  function physics() {
    const H0 = hole();
    for (let k = 0; k < 3; k++) {
      ball.x += ball.vx / 3; ball.y += ball.vy / 3;
      for (const s of segs) hitSeg(s[0], s[1], s[2], s[3], WALL, null);
      for (const b of H0.bumpers || []) if (hitCirc(b[0], b[1], b[2], 1.1)) { G.burst(b[0], b[1], 3, { color: '#fca5a5', speed: 2 }); }
      for (const s of H0.slides || []) { const y = slideY(s), vy = Math.cos(G.t * s.spd + s.ph) * s.amp * s.spd; hitSeg(s.x, y - s.len / 2, s.x, y + s.len / 2, WALL + 1, { vx: 0, vy }); }
      if (H0.mill) {
        const m = H0.mill, a = G.t * m.spd; hitCirc(m.cx, m.cy, 9, 0.6);
        for (let q = 0; q < 2; q++) { const aa = a + q * Math.PI / 2, ux = Math.cos(aa) * m.len / 2, uy = Math.sin(aa) * m.len / 2; hitSeg(m.cx - ux, m.cy - uy, m.cx + ux, m.cy + uy, WALL, { w: m.spd, px: m.cx, py: m.cy }); }
      }
    }
    const sand = (H0.sand || []).some(inR), f = sand ? 0.935 : 0.988; ball.vx *= f; ball.vy *= f;
    const sp = Math.hypot(ball.vx, ball.vy); if (sp < 0.07) { ball.vx = ball.vy = 0; }
    if ((H0.water || []).some(inR)) { A.sfx('hurt'); G.burst(ball.x, ball.y, 16, { color: ['#60a5fa', '#fff'], speed: 3, grav: 0.1 }); ball.x = last.x; ball.y = last.y; ball.vx = ball.vy = 0; strokes++; msg = 'Splash! +1 stroke'; msgT = 80; state = 'aim'; return; }
    const d = Math.hypot(ball.x - H0.hole[0], ball.y - H0.hole[1]);
    if (d < HR - 3 && sp < 6.5) { state = 'sink'; sinkT = 0; ball.vx = ball.vy = 0; A.sfx('coin'); return; }
    if (d < HR + 6 && sp < 3 && sp > 0) { ball.vx += (H0.hole[0] - ball.x) * 0.012; ball.vy += (H0.hole[1] - ball.y) * 0.012; }
    if (ball.vx === 0 && ball.vy === 0) { state = 'aim'; aimA = Math.atan2(H0.hole[1] - ball.y, H0.hole[0] - ball.x); if (strokes >= 8) finishHole(true); }
  }
  function finishHole(pickup) {
    const par = hole().par, s = pickup ? 8 : strokes, d = s - par; let name, pts;
    if (!pickup && s === 1) { name = 'HOLE IN ONE!'; pts = 80; } else { name = pickup ? 'Pick up (8 strokes)' : d <= -2 ? 'Eagle!' : d === -1 ? 'Birdie!' : d === 0 ? 'Par' : d === 1 ? 'Bogey' : 'Double bogey+'; pts = pickup ? 0 : Math.max(0, (par + 3 - s) * 10); }
    totalS += s; totalPar += par; G.addScore(pts); msg = name + (pts ? '  +' + pts : ''); msgT = 110; between = 100; state = 'between';
    if (!pickup) { A.sfx(d <= 0 ? 'win' : 'coin'); G.burst(hole().hole[0], hole().hole[1], 26, { color: ['#fbbf24', '#fff', '#22c55e'], speed: 4, glow: true }); }
  }
  function update(g) {
    if (g.state !== 'playing') return; if (hitCd > 0) hitCd--; if (msgT > 0) msgT--;
    g.hudL = 'HOLE ' + (h + 1) + '/9 · PAR ' + hole().par; g.hudR = 'STROKES ' + strokes;
    if (state === 'aim') {
      const s = A.axisX(); aimA += s * 0.03;
      const chg = A.held('Space'); if (chg) kp = Math.min(1, kp + 0.014); else if (wasChg && kp > 0.08) { putt(aimA, kp); kp = 0; } else kp = 0; wasChg = chg;
    } else if (state === 'roll') physics();
    else if (state === 'sink') {
      sinkT++; const H0 = hole(); ball.x += (H0.hole[0] - ball.x) * 0.25; ball.y += (H0.hole[1] - ball.y) * 0.25; ball.s = Math.max(0, 1 - sinkT / 18); if (sinkT >= 20) finishHole(false);
    } else if (state === 'between') {
      if (--between <= 0) { if (h >= HOLES.length - 1) { const dd = totalS - totalPar; state = 'done'; g.win('Course complete!', totalS + ' strokes (' + (dd === 0 ? 'level par' : (dd > 0 ? '+' : '') + dd + ' vs par') + ')'); } else load(h + 1); }
    }
  }
  function drawBall(c) { if (ball.s <= 0) return; A.shadow(c, ball.x + 2, ball.y + 3, BR * ball.s, BR * 0.5 * ball.s, 0.3); c.fillStyle = '#f8fafc'; c.beginPath(); c.arc(ball.x, ball.y, BR * ball.s, 0, A.TAU); c.fill(); c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.arc(ball.x + 1.5, ball.y + 1.5, BR * ball.s * 0.6, 0, A.TAU); c.fill(); }
  function draw(g, c) {
    A.sky(c, W, H, ['#0f1a2e', '#08111f']);
    const H0 = hole();
    c.beginPath(); H0.poly.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.closePath();
    const gr = c.createLinearGradient(0, 80, 0, 440); gr.addColorStop(0, '#22a55f'); gr.addColorStop(1, '#168247'); c.fillStyle = gr; c.fill();
    c.save(); c.clip(); c.strokeStyle = 'rgba(255,255,255,.045)'; c.lineWidth = 12; for (let x = 60; x < 780; x += 24) { c.beginPath(); c.moveTo(x, 60); c.lineTo(x, 460); c.stroke(); }
    for (const s of H0.sand || []) { c.fillStyle = '#e8d48a'; c.fillRect(s[0], s[1], s[2], s[3]); c.fillStyle = 'rgba(160,120,40,.35)'; for (let i = 0; i < 40; i++) c.fillRect(s[0] + A.hash(i, h) * s[2], s[1] + A.hash(h, i) * s[3], 2, 2); }
    for (const s of H0.water || []) { c.fillStyle = '#2563eb'; c.fillRect(s[0], s[1], s[2], s[3]); c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; for (let y = s[1] + 12; y < s[1] + s[3]; y += 18) { c.beginPath(); for (let x = 0; x <= s[2]; x += 8) c.lineTo(s[0] + x, y + Math.sin((x + g.t * 2) * 0.12) * 3); c.stroke(); } }
    c.restore();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(H0.tee[0], H0.tee[1], 9, 0, A.TAU); c.fill();
    c.fillStyle = '#05070b'; c.beginPath(); c.arc(H0.hole[0], H0.hole[1], HR, 0, A.TAU); c.fill(); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 2; c.stroke();
    c.lineCap = 'round'; c.strokeStyle = '#8b5a2b'; c.lineWidth = WALL * 2 + 2; c.lineJoin = 'round';
    for (const s of segs) { c.beginPath(); c.moveTo(s[0], s[1]); c.lineTo(s[2], s[3]); c.stroke(); }
    c.strokeStyle = '#c08a4a'; c.lineWidth = 2; for (const s of segs) { c.beginPath(); c.moveTo(s[0], s[1] - 2); c.lineTo(s[2], s[3] - 2); c.stroke(); }
    for (const b of H0.bumpers || []) { c.fillStyle = '#ef4444'; c.beginPath(); c.arc(b[0], b[1], b[2], 0, A.TAU); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke(); c.fillStyle = '#fff'; c.beginPath(); c.arc(b[0], b[1], b[2] * 0.35, 0, A.TAU); c.fill(); }
    c.strokeStyle = '#b45309'; c.lineWidth = (WALL + 1) * 2; for (const s of H0.slides || []) { const y = slideY(s); c.beginPath(); c.moveTo(s.x, y - s.len / 2); c.lineTo(s.x, y + s.len / 2); c.stroke(); }
    if (H0.mill) { const m = H0.mill, a = g.t * m.spd; c.strokeStyle = '#fbbf24'; c.lineWidth = WALL * 2; for (let q = 0; q < 2; q++) { const aa = a + q * Math.PI / 2, ux = Math.cos(aa) * m.len / 2, uy = Math.sin(aa) * m.len / 2; c.beginPath(); c.moveTo(m.cx - ux, m.cy - uy); c.lineTo(m.cx + ux, m.cy + uy); c.stroke(); } c.fillStyle = '#7c2d12'; c.beginPath(); c.arc(m.cx, m.cy, 9, 0, A.TAU); c.fill(); }
    c.lineCap = 'butt';
    /* flag */
    c.strokeStyle = '#e5e7eb'; c.lineWidth = 2; c.beginPath(); c.moveTo(H0.hole[0], H0.hole[1]); c.lineTo(H0.hole[0], H0.hole[1] - 38); c.stroke(); c.fillStyle = '#ef4444'; c.beginPath(); c.moveTo(H0.hole[0], H0.hole[1] - 38); c.lineTo(H0.hole[0] + 18, H0.hole[1] - 31 + Math.sin(g.t * 0.1) * 1.5); c.lineTo(H0.hole[0], H0.hole[1] - 24); c.fill();
    drawBall(c);
    if (state === 'aim') {
      let a = aimA, p = kp > 0 ? kp : 0.5, show = true;
      if (drag) { const dx = drag.x - ptr.x, dy = drag.y - ptr.y, len = Math.hypot(dx, dy); if (len > 6) { a = Math.atan2(dy, dx); p = Math.min(1, len / 150); } else show = false; }
      if (show) {
        const L = 24 + p * 130; c.setLineDash([6, 6]); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(ball.x, ball.y); c.lineTo(ball.x + Math.cos(a) * L, ball.y + Math.sin(a) * L); c.stroke(); c.setLineDash([]);
        c.fillStyle = 'rgba(0,0,0,.5)'; A.roundRect(c, ball.x - 30, ball.y + 18, 60, 8, 4); c.fill(); c.fillStyle = A.mix('#22c55e', '#ef4444', p); A.roundRect(c, ball.x - 30, ball.y + 18, 60 * Math.max(0.05, p), 8, 4); c.fill();
      }
    }
    g.drawFX(c);
    if (msgT > 0) { c.save(); c.globalAlpha = Math.min(1, msgT / 20); const big = /HOLE IN|Eagle|Birdie|Par|Bogey|Pick|Splash/.test(msg); A.glowText(c, msg, 400, big ? 70 : 62, big ? 28 : 22, '#fbbf24', 'center'); c.restore(); }
    A.text(c, 'Total ' + totalS + ' strokes (par ' + totalPar + ')', 14, 466, 12, '#8b93b3', 'left', '700');
    if (g.t < 500 && state === 'aim') A.text(c, 'Drag back from anywhere and release — or ← → to aim, hold Space to charge', 400, 466, 13, 'rgba(255,255,255,.75)', 'center', '700');
  }
  Arcade.game({ id: 'minigolf', title: 'Mini Golf', subtitle: 'Nine holes. Fewest strokes wins — par scores the most points.', w: W, h: H, color: '#84cc16',
    controls: [['Drag back & release', 'putt (longer pull = harder)'], ['← / →', 'aim'], ['Hold Space, release', 'charge and putt'], ['Hazards', 'water costs a stroke · sand slows the ball']], init, update, draw });
})();
</script>
