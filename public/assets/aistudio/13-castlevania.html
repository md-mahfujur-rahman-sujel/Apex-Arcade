<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanternbound</title>

<body>


<script src="perf-kit.js"></script>
<script src="save-kit.js"></script>
<script src="meta-config.js"></script>
<script src="meta-kit.js"></script>

<script>
/* Lanternbound — gothic action platformer: a lantern-bearing knight, a flicking chain-whip, candles that
   drop ammo for the throwing axe, three haunted stages and a floating duke at the end. Built on act-kit.js. */
const A = Arcade, K = Act, TAU = Math.PI * 2;

const S1 = K.make('Stage 1 · Moonlit Courtyard', 112, 15, (g) => {
  g.ground(0, 22); g.set(2, 11, 'P'); g.set(8, 11, 'i'); g.set(14, 11, 'i'); g.set(17, 11, 'k'); g.coins(10, 10, 3);
  g.ground(25, 48); g.plat(27, 9, 3); g.set(28, 8, 'i'); g.set(33, 11, 'k'); g.set(38, 6, 'v'); g.set(41, 11, 'i'); g.set(45, 11, '^'); g.set(46, 11, '^');
  g.ground(51, 71); g.plat(54, 9, 3); g.plat(58, 7, 3); g.set(60, 11, 'C'); g.set(66, 11, 'u'); g.set(63, 11, 'k'); g.set(55, 8, 'i'); g.coins(58, 6, 3);
  g.ground(74, 94); g.fill(79, 10, 3, 2, '#'); g.set(85, 11, 'k'); g.set(89, 11, 'w'); g.set(77, 11, 'i'); g.set(81, 9, 'i');
  g.ground(97, 112); g.set(100, 11, 'k'); g.set(103, 11, 'i'); g.set(108, 11, 'F');
});
S1.hint = 'X whip · light candles for axe ammo · C throw axe';

const S2 = K.make('Stage 2 · Haunted Library', 124, 15, (g) => {
  g.ground(0, 14); g.set(2, 11, 'P'); g.set(9, 11, 'k'); g.set(6, 11, 'i');
  g.plat(17, 10, 3); g.plat(22, 8, 3); g.plat(27, 6, 3); g.set(28, 5, 'i'); g.set(23, 7, 'v');
  g.ground(31, 52, 9); g.set(36, 8, 'k'); g.set(40, 8, 'w'); g.set(44, 8, 'C'); g.set(47, 8, 'i'); g.set(50, 8, 'u');
  g.fill(52, 6, 2, 6, '#'); g.plat(54, 8, 3);
  g.ground(57, 76, 11); g.set(60, 10, 'k'); g.set(63, 10, 'k'); g.set(67, 5, 'v'); g.set(70, 10, '^'); g.set(71, 10, '^'); g.set(73, 10, 'i'); g.coins(60, 8, 4);
  g.plat(79, 9, 2); g.plat(83, 7, 2); g.plat(87, 9, 2); g.set(84, 6, 'i');
  g.ground(91, 112, 11); g.set(94, 10, 'w'); g.set(98, 10, 'k'); g.set(101, 10, 'C'); g.set(104, 10, 'u'); g.set(107, 10, 'k'); g.set(96, 10, 'i');
  g.ground(113, 124, 11); g.set(120, 10, 'F');
});
S2.hint = 'Wraiths drift toward you — whip them from range';

const S3 = K.make('Stage 3 · Clock Tower', 128, 15, (g) => {
  g.ground(0, 12); g.set(2, 11, 'P'); g.set(8, 11, 'k'); g.set(10, 11, 'i');
  g.plat(15, 10, 2); g.plat(19, 8, 2); g.plat(23, 6, 2); g.plat(27, 8, 2); g.set(24, 5, 'i'); g.set(20, 5, 'v');
  g.ground(31, 50); g.set(35, 11, 'k'); g.set(39, 11, 'w'); g.set(43, 11, 'C'); g.set(46, 11, 'i'); g.set(48, 11, 'u'); g.fill(40, 8, 3, 1, '=');
  g.plat(53, 9, 2); g.plat(57, 7, 2); g.plat(61, 9, 2); g.set(58, 6, 'v');
  g.ground(65, 84); g.set(68, 11, 'k'); g.set(71, 11, 'k'); g.set(75, 11, 'u'); g.set(78, 11, 'w'); g.set(80, 11, 'C'); g.set(82, 11, 'i'); g.set(69, 11, 'i');
  g.ground(87, 128); g.set(90, 11, 'i'); g.set(93, 11, 'i'); g.set(96, 11, 'C'); g.set(108, 11, 'B'); g.set(125, 11, 'F'); g.fill(87, 5, 1, 7, '#');
  g.fill(88, 5, 1, 1, '#');
});
S3.hint = 'The Hollow Duke waits in the belfry';
S1.theme = { solid: '#3b3a52', top: '#6b7280', plat: '#78716c', accent: '#fbbf24' };
S2.theme = { solid: '#4a3326', top: '#92400e', plat: '#a16207', accent: '#fbbf24' };
S3.theme = { solid: '#2b3350', top: '#94a3b8', plat: '#64748b', accent: '#fbbf24' };

const SKY = [['#0b1026', '#2a1b4a', '#6d3a5a'], ['#1a0f0a', '#3b1d12', '#7c3a1a'], ['#050816', '#1b2559', '#3f2b79']];
function bg(c, cam, t, lvl) {
  A.sky(c, 800, 480, SKY[lvl]);
  A.drawStars(c, bg.st || (bg.st = A.makeStars(70, 800, 300)), t, 800, 480, 0.04, '#fef3c7');
  c.fillStyle = '#fef9c3'; c.beginPath(); c.arc(620, 90, 34, 0, TAU); c.fill(); c.fillStyle = SKY[lvl][1]; c.beginPath(); c.arc(634, 82, 30, 0, TAU); c.fill();
  K.ridge(c, 330, 30, 2 + lvl, cam.x * 0.12, 'rgba(10,8,25,.7)');
  for (let i = 0; i < 6; i++) { const x = ((i * 300 - cam.x * 0.3) % 1800 + 1800) % 1800 - 150; c.fillStyle = '#0c0a1f'; c.fillRect(x, 260, 70, 220); c.fillRect(x + 10, 230, 14, 40); c.fillRect(x + 46, 240, 14, 30); c.beginPath(); c.moveTo(x + 7, 230); c.lineTo(x + 17, 205); c.lineTo(x + 27, 230); c.fill(); c.fillStyle = 'rgba(251,191,36,.5)'; c.fillRect(x + 28, 300, 8, 14); }
  K.ridge(c, 400, 22, 6 + lvl, cam.x * 0.4, '#0a0818');
}
function drawKnight(c, p, G, wp) {
  const cx = p.x + p.w / 2, f = p.face, b = p.y + p.h, run = p.ground ? Math.sin(p.walk) : 0, air = !p.ground;
  A.shadow(c, cx, b + 1, 11, 3, 0.25);
  c.save(); c.translate(cx, b); c.scale(f * (1 + p.sq * 0.4), 1 - p.sq * 0.4);
  c.fillStyle = '#7f1d1d'; c.beginPath(); c.moveTo(-5, -24); c.lineTo(-15 - Math.min(5, Math.abs(p.vx) * 1.5), air ? -10 : -4); c.lineTo(-4, -4); c.fill();
  c.fillStyle = '#1e293b'; c.fillRect(-7 + (air ? 0 : run * 3), -9, 6, 9); c.fillRect(1 - (air ? 3 : run * 3), -9, 6, 9);
  c.fillStyle = '#94a3b8'; A.roundRect(c, -8, -25, 16, 17, 4); c.fill(); c.fillStyle = '#64748b'; c.fillRect(-8, -14, 16, 3);
  c.fillStyle = '#cbd5e1'; A.roundRect(c, -7, -34, 14, 11, 4); c.fill(); c.fillStyle = '#0f172a'; c.fillRect(0, -30, 7, 3);
  c.fillStyle = '#dc2626'; c.fillRect(-3, -39, 5, 6);
  c.fillStyle = '#92400e'; c.fillRect(6, -22, 3, 8); const fl = Math.sin(G.clock * 0.3) * 1.5;
  c.save(); c.shadowColor = '#fbbf24'; c.shadowBlur = 14; c.fillStyle = '#fbbf24'; c.beginPath(); c.arc(8, -12 + fl * 0.3, 4.2, 0, TAU); c.fill(); c.restore();
  if (p.atk > 0 && wp.type === 'melee') {
    const k = 1 - p.atk / wp.dur, L = wp.range * Math.min(1, k * 2.5); c.strokeStyle = '#fef3c7'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath();
    if (p.atkDir) { c.moveTo(6, -14); c.lineTo(8, -14 + L * 0.8); } else { c.moveTo(6, -18); c.quadraticCurveTo(6 + L * 0.5, -18 - 10 * (1 - k), 6 + L, -16); }
    c.stroke(); c.fillStyle = '#fff'; c.beginPath(); c.arc(p.atkDir ? 8 : 6 + L, p.atkDir ? -14 + L * 0.8 : -16, 3, 0, TAU); c.fill();
  }
  c.restore();
}
function drawEnemy(c, e, G) {
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2, t = G.clock, f = e.face, hit = e.hurt > 0, k = e.k;
  if (k === 'k') {
    A.shadow(c, cx, e.y + e.h + 1, 11, 3, 0.25); c.save(); c.translate(cx, e.y + e.h); c.scale(f, 1); const w = Math.sin(t * 0.2 + e.x) * 3; c.fillStyle = hit ? '#fff' : '#e5e7eb';
    c.fillRect(-6 + w, -10, 4, 10); c.fillRect(2 - w, -10, 4, 10); c.fillRect(-6, -22, 12, 12); c.fillStyle = 'rgba(0,0,0,.35)'; for (let i = 0; i < 3; i++) c.fillRect(-5, -20 + i * 4, 10, 1.5);
    A.roundRect(c, -7, -32, 14, 11, 4); c.fill(); c.fillStyle = '#111'; c.fillRect(1, -28, 3, 3); c.fillRect(-3, -28, 3, 3); c.fillStyle = '#fca5a5'; c.fillRect(7, -20, 10, 3); c.restore(); return true;
  }
  if (k === 'v') { const fl = Math.sin(t * 0.4 + e.x) * 9; c.fillStyle = hit ? '#fff' : '#6d28d9'; c.beginPath(); c.moveTo(cx - 3, cy); c.lineTo(cx - 20, cy - fl - 5); c.lineTo(cx - 10, cy + 6); c.fill(); c.beginPath(); c.moveTo(cx + 3, cy); c.lineTo(cx + 20, cy - fl - 5); c.lineTo(cx + 10, cy + 6); c.fill(); c.beginPath(); c.arc(cx, cy, 8, 0, TAU); c.fill(); c.fillStyle = '#fde047'; c.fillRect(cx - 4, cy - 2, 2, 2); c.fillRect(cx + 2, cy - 2, 2, 2); return true; }
  if (k === 'w') { c.save(); c.globalAlpha = 0.8; c.fillStyle = hit ? '#fff' : '#a5b4fc'; c.shadowColor = '#818cf8'; c.shadowBlur = 14; c.beginPath(); c.moveTo(cx - 14, cy + 16); c.quadraticCurveTo(cx - 16, cy - 18, cx, cy - 16); c.quadraticCurveTo(cx + 16, cy - 18, cx + 14, cy + 16); for (let i = 0; i < 4; i++) c.lineTo(cx + 14 - (i + 1) * 7, cy + 16 + (i % 2 ? 0 : 6) + Math.sin(t * 0.2 + i) * 2); c.fill(); c.fillStyle = '#1e1b4b'; c.fillRect(cx - 7, cy - 6, 4, 6); c.fillRect(cx + 3, cy - 6, 4, 6); c.restore(); return true; }
  if (k === 'u') { c.fillStyle = hit ? '#fff' : '#64748b'; A.roundRect(c, e.x, e.y + 6, e.w, e.h - 6, 6); c.fill(); c.beginPath(); c.moveTo(e.x + 2, e.y + 8); c.lineTo(e.x + 6, e.y - 2); c.lineTo(e.x + 12, e.y + 8); c.moveTo(e.x + e.w - 12, e.y + 8); c.lineTo(e.x + e.w - 6, e.y - 2); c.lineTo(e.x + e.w - 2, e.y + 8); c.fill(); c.fillStyle = '#f87171'; c.fillRect(cx - 7, cy - 2, 4, 4); c.fillRect(cx + 3, cy - 2, 4, 4); return true; }
  if (k === 'B') {
    const bob = Math.sin(t * 0.08) * 3; c.save(); c.translate(cx, cy + bob); c.scale(f, 1); c.fillStyle = hit ? '#fff' : '#4c1d95'; c.shadowColor = '#a78bfa'; c.shadowBlur = 20;
    c.beginPath(); c.moveTo(-26, 34); c.quadraticCurveTo(-34, -30, 0, -36); c.quadraticCurveTo(34, -30, 26, 34); for (let i = 0; i < 5; i++) c.lineTo(26 - (i + 1) * 10.4, 34 + (i % 2 ? 0 : 10)); c.fill();
    c.shadowBlur = 0; c.fillStyle = '#ddd6fe'; A.roundRect(c, -14, -30, 28, 24, 8); c.fill(); c.fillStyle = '#f43f5e'; c.fillRect(-9, -22, 6, 6); c.fillRect(3, -22, 6, 6);
    c.fillStyle = '#fbbf24'; for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 6 - 3, -30); c.lineTo(i * 6, -42 - (i === 0 ? 5 : 0)); c.lineTo(i * 6 + 3, -30); c.fill(); }
    c.restore(); return true;
  }
}
function boss(e, x) {
  const p = x.p; e.t++; const low = e.hp < e.hmax * 0.5, per = low ? 120 : 160, ph = e.t % per;
  if (ph < per - 70) { e.vx = A.approach(e.vx, A.clamp((p.x - e.x) * 0.02, -2.5, 2.5), 0.1); e.vy = (e.y0 - 70 + Math.sin(e.t * 0.05) * 30 - e.y) * 0.06; const every = low ? 32 : 48; if (ph > 20 && ph % every === 0) { const a = Math.atan2(p.y + 10 - e.y, p.x - e.x); for (let i = -1; i <= 1; i++) x.shoot(e, Math.cos(a + i * 0.28) * 3.6, Math.sin(a + i * 0.28) * 3.6, { color: '#c084fc', r: 7 }); x.G.shake(2); A.sfx('shoot'); } }
  else if (ph === per - 70) { e.vx = (p.x < e.x ? -1 : 1) * 6.5; e.vy = (p.y - e.y) * 0.03; A.sfx('charge'); }
  else if (ph < per - 30) { /* dash */ } else { e.vx *= 0.88; e.vy *= 0.88; }
}

K.game({
  id: 'lanternbound', title: 'Lanternbound', subtitle: 'Whip, burn and axe your way through the manor', color: '#fbbf24',
  controls: [['← →  /  A D', 'Walk'], ['Space  /  ↑  /  W  /  Z', 'Jump (hold for height)'], ['X  /  J', 'Whip (hits candles too)'], ['C  /  K', 'Throw axe (uses ammo)'], ['↓ + Jump', 'Drop through thin floors'], ['P / M', 'Pause / mute']],
  help: '← → walk · Space jump · X whip · C throw axe (ammo from candles) · ↓+Jump drops through thin floors · Defeat the Hollow Duke',
  levels: [S1, S2, S3], bg, hero: { hp: 6, run: 3.2, jump: 10.4, ammo: 5, stomp: false, weapon: { type: 'melee', dmg: 1, range: 74, h: 22, cd: 22, dur: 11 }, sub: { name: 'axe', cost: 1, dmg: 3, vx: 4.2, vy: -8, grav: 0.35, life: 140, size: 8, color: '#e2e8f0', pierce: true, spin: true, sfx: 'slash' } },
  enemies: {
    k: { w: 24, h: 32, hp: 2, ai: 'walk', sp: 0.8, sight: 140, score: 100, color: '#e5e7eb' },
    v: { w: 26, h: 18, hp: 1, ai: 'fly', sp: 1.6, sight: 200, range: 70, bob: 22, score: 80, color: '#7c3aed' },
    w: { w: 28, h: 32, hp: 3, ai: 'fly', sp: 0.9, sight: 260, range: 40, bob: 30, score: 200, color: '#a5b4fc', shoot: { speed: 2.6, color: '#a5b4fc' }, every: 120, aim: true },
    u: { w: 28, h: 30, hp: 4, ai: 'turret', fixed: true, score: 150, color: '#64748b', sight: 380, shoot: { speed: 3.2, color: '#f87171' }, every: 100, aim: true },
    B: { w: 56, h: 74, hp: 30, ai: 'boss', name: 'THE HOLLOW DUKE', wake: 380, grav: false, score: 3000, color: '#7c3aed', dmg: 2 },
  },
  boss, drawEnemy, drawHero: drawKnight, winTitle: 'The Manor Is Silent', winSub: (G) => 'The Hollow Duke is no more · Score ' + G.score,
});
</script>
