<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clockwork Dawn</title>
</head>
<body>
<script src="arcade-core.js"></script>
<script>
/* Clockwork Dawn — a compact turn-based adventure. Explore the village and the wilds, fight in
   party battles (Attack / Skill / Item / Flee), shop and rest, then break the Clockwork Warden
   in the Gear Gate and step through the portal to restart the dawn. */
const A = Arcade, W = 800, H = 480, T = 32, MW = 40, MH = 24, TAU = Math.PI * 2;
const OK = ['Space', 'Enter', 'KeyZ'], BACK = ['Escape', 'KeyX', 'Backspace'], UP = ['ArrowUp', 'KeyW'], DN = ['ArrowDown', 'KeyS'], LT = ['ArrowLeft', 'KeyA'], RT = ['ArrowRight', 'KeyD'];
const hit = (a) => A.hit.apply(null, a), held = (a) => A.held.apply(null, a);

/* ---------- world ---------- */
let map, mode, hero, party, inv, gold, flags, dlg, menu, bat, steps, cam, status, G0;
function buildMap() {
  map = Array.from({ length: MH }, (_, y) => Array.from({ length: MW }, (_, x) => (x === 0 || y === 0 || x === MW - 1 || y === MH - 1 ? '#' : '.')));
  const f = (x0, y0, x1, y1, ch) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) map[y][x] = ch; };
  f(2, 3, 13, 12, 'p'); f(3, 4, 6, 6, 'H'); map[7][4] = 'I'; f(9, 4, 12, 6, 'H'); map[7][10] = 'S';
  f(14, 1, 15, MH - 2, '~'); f(14, 11, 15, 12, 'b'); f(16, 2, 23, 21, ','); f(13, 11, 13, 12, 'p'); f(16, 11, 24, 12, 'p');
  for (let i = 0; i < 40; i++) { const x = A.randi(2, 12), y = A.randi(13, 21); if (map[y][x] === '.') map[y][x] = '#'; }
  for (let i = 0; i < 30; i++) { const x = A.randi(16, 23), y = A.randi(2, 21); if (map[y][x] === ',' && y !== 11 && y !== 12) map[y][x] = A.pick(['#', '.']); }
  f(25, 2, 38, 2, 'W'); f(25, 20, 38, 20, 'W'); f(25, 2, 25, 20, 'W'); f(38, 2, 38, 20, 'W'); f(26, 3, 37, 19, 'f'); map[11][25] = 'f'; map[12][25] = 'f';
  for (const [x, y] of [[29, 8], [29, 15], [34, 8], [34, 15], [32, 11]]) map[y][x] = 'W';
  map[2][31] = 'X';
}
const BLOCK = '#~HWX';
const NPCS = [
  { x: 7, y: 9, c: '#fbbf24', n: 'Elder Orrin', lines: ['The Clockwork Warden stopped the sunrise.', 'Cross the bridge, cross the wilds, and break it in the Gear Gate to the east.', 'Fight, level up, and carry potions — the Warden hits hard.'] },
  { x: 11, y: 10, c: '#f9a8d4', n: 'Pip', lines: ['Tall grass in the wilds hides monsters.', 'Mira’s Mend spell heals the whole party’s favourite — you!'] },
  { x: 4, y: 8, c: '#a7f3d0', n: 'Innkeeper', inn: true, lines: ['Rest for 10 gold? Heals everyone fully.'] },
  { x: 10, y: 8, c: '#93c5fd', n: 'Shopkeeper', shop: true, lines: ['Potions and ethers! Take a look.'] },
  { x: 23, y: 11, c: '#cbd5e1', n: 'Gate Guard', lines: ['The Gear Gate lies ahead. Monsters inside are tougher.', 'Be at least level 4 before you face the Warden.'] },
];
const BOSS = { x: 31, y: 5 };

/* ---------- party ---------- */
const mk = (n, hp, mp, atk, def, mag, col, skills) => ({ n, hp, mhp: hp, mp, mmp: mp, atk, def, mag, lvl: 1, xp: 0, col, skills });
function newParty() {
  return [
    mk('Kai', 44, 12, 10, 3, 3, '#38bdf8', [{ n: 'Slash Wave', cost: 3, pow: 1.9, t: 'foe', lv: 1 }, { n: 'Gale Cut', cost: 7, pow: 1.1, t: 'all', lv: 3 }]),
    mk('Mira', 34, 22, 6, 2, 10, '#f472b6', [{ n: 'Spark', cost: 3, pow: 1.3, t: 'foe', magic: true, lv: 1 }, { n: 'Mend', cost: 4, heal: 28, t: 'ally', lv: 1 }, { n: 'Nova', cost: 9, pow: 1.1, t: 'all', magic: true, lv: 4 }]),
  ];
}
const needXp = (m) => m.lvl * 28;
const ENEMY = {
  moss: { n: 'Mossling', hp: 18, atk: 8, def: 1, xp: 10, gold: 6, col: '#65a30d' },
  wisp: { n: 'Gloomwisp', hp: 15, atk: 10, def: 0, xp: 12, gold: 7, col: '#a78bfa' },
  bat: { n: 'Burrbat', hp: 13, atk: 9, def: 0, xp: 9, gold: 5, col: '#78716c' },
  gear: { n: 'Gearling', hp: 32, atk: 13, def: 3, xp: 22, gold: 13, col: '#f59e0b' },
  knight: { n: 'Rustknight', hp: 44, atk: 15, def: 5, xp: 30, gold: 18, col: '#b45309' },
  boss: { n: 'Clockwork Warden', hp: 210, atk: 17, def: 4, xp: 200, gold: 150, col: '#fbbf24', boss: true },
};

/* ---------- helpers ---------- */
const blocked = (x, y) => x < 0 || y < 0 || x >= MW || y >= MH || BLOCK.includes(map[y][x]);
const npcAt = (x, y) => NPCS.find((n) => n.x === x && n.y === y) || (!flags.boss && x === BOSS.x && y === BOSS.y ? { boss: true } : null);
function say(lines, after) { dlg = { lines, i: 0, after }; A.sfx('blip'); }
function openMenu(title, opts) { menu = { title, opts, sel: 0 }; A.sfx('select'); }

function init(G) {
  G0 = G; buildMap(); party = newParty(); inv = { potion: 3, ether: 1 }; gold = 30; flags = { boss: false }; dlg = null; menu = null; bat = null; status = false; steps = 0; mode = 'field';
  hero = { x: 8, y: 9, tx: 8, ty: 9, dir: 2, moving: false, mt: 0 }; cam = { x: 0, y: 0 }; place(true);
  say(['Welcome, Kai. Elder Orrin is waiting in the village square.', 'Arrows / WASD to move · Space to talk · X for status.']);
}
function place(snap) {
  const px = (hero.moving ? hero.x + (hero.tx - hero.x) * hero.mt / 9 : hero.x) * T + 16, py = (hero.moving ? hero.y + (hero.ty - hero.y) * hero.mt / 9 : hero.y) * T + 16;
  const tx = A.clamp(px - W / 2, 0, MW * T - W), ty = A.clamp(py - H / 2, 0, MH * T - H);
  if (snap) { cam.x = tx; cam.y = ty; } else { cam.x += (tx - cam.x) * 0.2; cam.y += (ty - cam.y) * 0.2; }
}

/* ---------- field ---------- */
function fieldUpdate(G) {
  place(false);
  if (dlg) { if (hit(OK) || hit(BACK)) { A.sfx('blip'); if (++dlg.i >= dlg.lines.length) { const cb = dlg.after; dlg = null; if (cb) cb(G); } } return; }
  if (menu) { menuInput(G); return; }
  if (status) { if (hit(BACK) || hit(OK)) { status = false; A.sfx('select'); } if (hit(['Digit1'])) usePotion(); if (hit(['Digit2'])) useEther(); return; }
  if (hero.moving) { if (++hero.mt >= 9) { hero.x = hero.tx; hero.y = hero.ty; hero.moving = false; stepEffects(G); } return; }
  let dx = 0, dy = 0;
  if (held(LT)) { dx = -1; hero.dir = 1; } else if (held(RT)) { dx = 1; hero.dir = 3; } else if (held(UP)) { dy = -1; hero.dir = 0; } else if (held(DN)) { dy = 1; hero.dir = 2; }
  if (dx || dy) { const nx = hero.x + dx, ny = hero.y + dy; if (!blocked(nx, ny) && !npcAt(nx, ny)) { hero.tx = nx; hero.ty = ny; hero.moving = true; hero.mt = 0; if (G.t % 2 === 0) A.sfx('step'); } }
  if (hit(OK)) {
    const d = [[0, -1], [-1, 0], [0, 1], [1, 0]][hero.dir], n = npcAt(hero.x + d[0], hero.y + d[1]);
    if (n && n.boss) say(['A towering machine of brass and gears. Its eye turns toward you.', '“DAWN IS ABOLISHED.”'], () => startBattle(G, ['boss'], true));
    else if (n) talk(G, n);
  }
  if (hit(BACK)) { status = true; A.sfx('select'); }
}
function talk(G, n) {
  if (n.inn) say(n.lines, () => openMenu('Rest for 10G?', [{ t: 'Yes', f: () => { if (gold >= 10) { gold -= 10; for (const m of party) { m.hp = m.mhp; m.mp = m.mmp; } A.sfx('heal'); menu = null; say(['You rest. Everyone is fully restored.']); } else { menu = null; say(['Not enough gold.']); } } }, { t: 'No', f: () => { menu = null; } }]));
  else if (n.shop) say(n.lines, () => shopMenu());
  else say(n.lines);
}
function shopMenu() {
  openMenu('Shop · ' + gold + 'G', [
    { t: 'Potion  20G  (have ' + inv.potion + ')', f: () => { if (gold >= 20) { gold -= 20; inv.potion++; A.sfx('coin'); shopMenu(); menu.sel = 0; } else A.sfx('blip'); } },
    { t: 'Ether  35G  (have ' + inv.ether + ')', f: () => { if (gold >= 35) { gold -= 35; inv.ether++; A.sfx('coin'); shopMenu(); menu.sel = 1; } else A.sfx('blip'); } },
    { t: 'Leave', f: () => { menu = null; } },
  ]);
}
function menuInput(G) {
  if (hit(UP)) { menu.sel = (menu.sel + menu.opts.length - 1) % menu.opts.length; A.sfx('tick'); }
  if (hit(DN)) { menu.sel = (menu.sel + 1) % menu.opts.length; A.sfx('tick'); }
  if (hit(BACK)) { menu = null; return; }
  if (hit(OK)) { const o = menu.opts[menu.sel]; A.sfx('select'); o.f(); }
}
function usePotion() { const m = party.filter((q) => q.hp > 0 && q.hp < q.mhp).sort((a, b) => a.hp / a.mhp - b.hp / b.mhp)[0]; if (inv.potion > 0 && m) { inv.potion--; m.hp = Math.min(m.mhp, m.hp + 30); A.sfx('heal'); } }
function useEther() { const m = party.filter((q) => q.mp < q.mmp).sort((a, b) => a.mp / a.mmp - b.mp / b.mmp)[0]; if (inv.ether > 0 && m) { inv.ether--; m.mp = Math.min(m.mmp, m.mp + 12); A.sfx('heal'); } }
function stepEffects(G) {
  const ch = map[hero.y][hero.x]; steps++;
  if (ch === 'O') { A.sfx('win'); G.addScore(1000 + gold * 5); G.win('The Dawn Returns', 'Party level ' + party[0].lvl + ' · ' + gold + ' gold · Score ' + G.score); return; }
  const rate = ch === ',' ? 0.1 : ch === 'f' ? 0.09 : 0;
  if (rate && steps > 3 && Math.random() < rate) startBattle(G, ch === ',' ? [A.pick(['moss', 'wisp', 'bat']), ...(Math.random() < 0.6 ? [A.pick(['moss', 'wisp', 'bat'])] : []), ...(Math.random() < 0.25 ? ['moss'] : [])] : [A.pick(['gear', 'knight']), ...(Math.random() < 0.6 ? [A.pick(['gear', 'knight'])] : [])], false);
}

/* ---------- battle ---------- */
function startBattle(G, kinds, boss) {
  A.sfx(boss ? 'charge' : 'wave'); G.shake(5);
  bat = { foes: kinds.map((k, i) => Object.assign({ k, hp: 0, flash: 0, dead: false, x: 130 + i * 110 - (kinds.length - 1) * 30 + (boss ? 60 : 0), y: 170 + (i % 2) * 40 }, ENEMY[k], { hp: ENEMY[k].hp, mhp: ENEMY[k].hp })), actor: 0, phase: 'menu', sel: 0, sel2: 0, tgt: 0, pend: null, wait: 0, log: boss ? ['The Clockwork Warden blocks the way!'] : ['Monsters appear!'], turn: 0, boss, eIdx: 0, enter: 24, rewards: null, zone: boss ? 2 : map[hero.y][hero.x] === 'f' ? 1 : 0 };
  mode = 'battle'; nextActor(true);
}
const alive = (a) => a.filter((m) => m.hp > 0 && !m.dead);
function nextActor(first) {
  if (first) bat.actor = -1;
  for (let i = bat.actor + 1; i < party.length; i++) if (party[i].hp > 0) { bat.actor = i; bat.phase = 'menu'; bat.sel = 0; return; }
  bat.phase = 'enemy'; bat.eIdx = 0; bat.wait = 24;
}
function logMsg(t) { bat.log.push(t); if (bat.log.length > 3) bat.log.shift(); }
function dmgFoe(G, f, amount, magic) {
  const d = Math.max(1, Math.round(amount - (magic ? 0 : f.def * 0.5))); f.hp -= d; f.flash = 10; A.sfx('hit'); G.burst(f.x, f.y, 8, { color: ['#fff', f.col], speed: 3, life: 18 }); G.popup(f.x, f.y - 40, d, '#fff', 20);
  if (f.hp <= 0) { f.dead = true; A.sfx('explode'); G.burst(f.x, f.y, 18, { color: [f.col, '#fff'], speed: 4, life: 28, glow: true }); }
  return d;
}
function afterPlayer(G) {
  if (!alive(bat.foes).length) { victory(G); return; }
  bat.wait = 36; bat.phase = 'wait';
}
function victory(G) {
  const xp = bat.foes.reduce((a, f) => a + f.xp, 0), gd = bat.foes.reduce((a, f) => a + f.gold, 0); gold += gd; G.addScore(xp * 10);
  const ups = []; for (const m of party) if (m.hp > 0) { m.xp += xp; while (m.xp >= needXp(m)) { m.xp -= needXp(m); m.lvl++; m.mhp += 8; m.mmp += 3; m.atk += 2; m.def += 1; m.mag += 2; m.hp = Math.min(m.mhp, m.hp + 10); m.mp = Math.min(m.mmp, m.mp + 5); ups.push(m.n + ' → Lv ' + m.lvl); } }
  bat.phase = 'win'; bat.rewards = ['Victory!  +' + xp + ' XP  +' + gd + ' gold'].concat(ups); A.sfx('win');
  if (bat.boss) { flags.boss = true; map[BOSS.y - 3][31] = 'O'; }
}
function battleUpdate(G) {
  const b = bat; if (b.enter > 0) b.enter--; for (const f of b.foes) if (f.flash > 0) f.flash--;
  if (b.phase === 'win') { if (hit(OK)) { mode = 'field'; bat = null; if (flags.boss && !hero.saidPortal) { hero.saidPortal = true; say(['The Warden crumbles. A portal opens at the far end of the Gear Gate.', 'Step into it to bring the dawn back!']); } } return; }
  if (b.phase === 'wait') { if (--b.wait <= 0) nextActor(); return; }
  if (b.phase === 'enemy') {
    if (--b.wait > 0) return;
    if (b.eIdx >= b.foes.length) { b.turn++; nextActor(true); return; }
    const f = b.foes[b.eIdx++]; if (f.dead) return;
    const targets = alive(party); if (!targets.length) return;
    const tgt = A.pick(targets);
    if (f.boss) {
      const m = b.turn % 3;
      if (m === 0) { const d = Math.max(2, Math.round(f.atk * A.rand(0.9, 1.15) - tgt.def)); tgt.hp = Math.max(0, tgt.hp - d); logMsg('Warden strikes ' + tgt.n + ' for ' + d + '!'); G.shake(6); G.popup(W - 180, 250, d, '#fca5a5', 20); }
      else if (m === 1) { logMsg('Gear Storm hits everyone!'); for (const t of targets) { const d = Math.max(2, Math.round(f.atk * 0.6 * A.rand(0.9, 1.1) - t.def)); t.hp = Math.max(0, t.hp - d); } G.shake(8); }
      else { const d = Math.max(3, Math.round(f.atk * 1.5 * A.rand(0.9, 1.1) - tgt.def)); tgt.hp = Math.max(0, tgt.hp - d); logMsg('Piston Slam crushes ' + tgt.n + ' for ' + d + '!'); G.shake(10); }
      A.sfx('boom');
    } else { const d = Math.max(1, Math.round(f.atk * A.rand(0.85, 1.15) - tgt.def)); tgt.hp = Math.max(0, tgt.hp - d); logMsg(f.n + ' attacks ' + tgt.n + ' for ' + d + '.'); A.sfx('hurt'); G.shake(3); }
    b.wait = 44;
    if (!alive(party).length) { b.phase = 'lose'; b.wait = 60; }
    return;
  }
  if (b.phase === 'lose') { if (--b.wait <= 0) G.over('The Party Fell', 'Warden defeated you · Score ' + G.score); return; }
  const me = party[b.actor];
  if (b.phase === 'menu') {
    const opts = ['Attack', 'Skill', 'Item', 'Flee'];
    if (hit(UP)) { b.sel = (b.sel + 3) % 4; A.sfx('tick'); } if (hit(DN)) { b.sel = (b.sel + 1) % 4; A.sfx('tick'); }
    if (hit(OK)) {
      A.sfx('select'); const o = opts[b.sel];
      if (o === 'Attack') { b.pend = { type: 'atk' }; b.phase = 'target'; b.tgt = b.foes.findIndex((f) => !f.dead); }
      else if (o === 'Skill') { b.list = me.skills.filter((s) => s.lv <= me.lvl); b.sel2 = 0; b.phase = 'skill'; }
      else if (o === 'Item') { b.sel2 = 0; b.phase = 'item'; }
      else { if (b.boss) logMsg('Cannot flee from the Warden!'); else if (Math.random() < 0.65) { logMsg('Got away safely!'); mode = 'field'; bat = null; A.sfx('step'); return; } else { logMsg('Could not escape!'); afterPlayer(G); } }
    }
  } else if (b.phase === 'skill') {
    if (hit(BACK)) b.phase = 'menu';
    if (hit(UP)) b.sel2 = (b.sel2 + b.list.length - 1) % b.list.length; if (hit(DN)) b.sel2 = (b.sel2 + 1) % b.list.length;
    if (hit(OK)) { const s = b.list[b.sel2]; if (me.mp < s.cost) { A.sfx('blip'); return; } A.sfx('select'); b.pend = { type: 'skill', s }; if (s.t === 'all') doSkill(G, me, s, null); else { b.phase = 'target'; b.tgt = s.t === 'ally' ? b.actor : b.foes.findIndex((f) => !f.dead); } }
  } else if (b.phase === 'item') {
    const items = [['potion', 'Potion (+30 HP)'], ['ether', 'Ether (+12 MP)']];
    if (hit(BACK)) b.phase = 'menu'; if (hit(UP) || hit(DN)) b.sel2 = 1 - b.sel2;
    if (hit(OK)) { const k = items[b.sel2][0]; if (inv[k] <= 0) { A.sfx('blip'); return; } b.pend = { type: 'item', k }; b.phase = 'target'; b.tgt = b.actor; }
  } else if (b.phase === 'target') {
    const ally = b.pend.type === 'item' || (b.pend.type === 'skill' && b.pend.s.t === 'ally'), pool = ally ? party : b.foes;
    if (hit(BACK)) { b.phase = 'menu'; return; }
    const step = hit(LT) || hit(UP) ? -1 : hit(RT) || hit(DN) ? 1 : 0;
    if (step) { let i = b.tgt; do { i = (i + step + pool.length) % pool.length; } while ((ally ? pool[i].hp <= 0 && b.pend.type !== 'item' : pool[i].dead)); b.tgt = i; A.sfx('tick'); }
    if (hit(OK)) {
      const t = pool[b.tgt]; A.sfx('select');
      if (b.pend.type === 'atk') { const d = dmgFoe(G, t, me.atk * A.rand(0.9, 1.12), false); logMsg(me.n + ' attacks ' + t.n + ' for ' + d + '.'); A.sfx('slash'); afterPlayer(G); }
      else if (b.pend.type === 'skill') doSkill(G, me, b.pend.s, t);
      else { inv[b.pend.k]--; if (b.pend.k === 'potion') { t.hp = Math.min(t.mhp, t.hp + 30); logMsg(me.n + ' uses a Potion on ' + t.n + '.'); } else { t.mp = Math.min(t.mmp, t.mp + 12); logMsg(me.n + ' uses an Ether on ' + t.n + '.'); } A.sfx('heal'); afterPlayer(G); }
    }
  }
}
function doSkill(G, me, s, t) {
  me.mp -= s.cost;
  if (s.heal) { t.hp = Math.min(t.mhp, t.hp + s.heal); logMsg(me.n + ' casts ' + s.n + ': ' + t.n + ' +' + s.heal + ' HP.'); A.sfx('heal'); G.ring(W - 160, 250, '#86efac', 60, 22); }
  else {
    const base = (s.magic ? me.mag : me.atk) * s.pow * A.rand(0.92, 1.12), foes = s.t === 'all' ? alive(bat.foes) : [t];
    let total = 0; for (const f of foes) total += dmgFoe(G, f, base, !!s.magic);
    logMsg(me.n + ' uses ' + s.n + '! ' + total + ' damage.'); A.sfx(s.magic ? 'laser' : 'slash'); G.ring(W / 2 - 100, 220, s.magic ? '#c4b5fd' : '#fde047', 90, 22);
  }
  afterPlayer(G);
}
function update(G) {
  G.hudL = mode === 'field' ? gold + ' GOLD  ·  Lv ' + party[0].lvl : 'BATTLE'; G.hudR = 'SCORE ' + G.score;
  if (mode === 'field') fieldUpdate(G); else battleUpdate(G);
}

/* ---------- drawing ---------- */
function panel(c, x, y, w, h, a) { c.fillStyle = 'rgba(12,16,40,' + (a || 0.92) + ')'; A.roundRect(c, x, y, w, h, 10); c.fill(); c.strokeStyle = '#8ea0ff'; c.lineWidth = 2; A.roundRect(c, x, y, w, h, 10); c.stroke(); }
function person(c, x, y, col, dir, t, hair) { A.shadow(c, x, y + 14, 9, 3, 0.3); c.fillStyle = col; A.roundRect(c, x - 8, y - 8, 16, 20, 6); c.fill(); c.fillStyle = '#fde68a'; c.beginPath(); c.arc(x, y - 12, 8, 0, TAU); c.fill(); c.fillStyle = hair || '#78350f'; c.beginPath(); c.arc(x, y - 15, 8.5, Math.PI, 0); c.fill(); if (dir !== 0) { c.fillStyle = '#111'; const ex = dir === 1 ? -3 : dir === 3 ? 3 : 0; c.fillRect(x - 3 + ex, y - 12, 2, 3); c.fillRect(x + 2 + ex, y - 12, 2, 3); } }
function drawField(c, G) {
  const t = G.clock; c.fillStyle = '#4a8f4a'; c.fillRect(0, 0, W, H);
  c.save(); c.translate(-Math.round(cam.x), -Math.round(cam.y));
  const c0 = Math.max(0, Math.floor(cam.x / T)), c1 = Math.min(MW - 1, Math.ceil((cam.x + W) / T)), r0 = Math.max(0, Math.floor(cam.y / T)), r1 = Math.min(MH - 1, Math.ceil((cam.y + H) / T));
  for (let y = r0; y <= r1; y++) for (let x = c0; x <= c1; x++) {
    const ch = map[y][x], px = x * T, py = y * T, h = A.hash(x, y);
