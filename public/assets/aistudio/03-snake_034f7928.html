<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Serpent</title>
</head>
<body>
<script src="arcade-core.js"></script>
<script>
/* Ember Serpent — grid-snake with smooth movement, bonus fruit, levels and rock hazards. */
const A = Arcade;
const COLS = 25, ROWS = 16, C = 28, OX = 10, OY = 46, W = 720, H = 520, PER_LEVEL = 6, MAX_LEVEL = 10;
const DIRS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
let cur, prev, dir, queue, grow, tickT, interval, food, bonus, rocks, level, eaten, wrap, flick, dead;

const px = (x) => OX + (x + 0.5) * C, py = (y) => OY + (y + 0.5) * C;
const occupied = (x, y) => cur.some((s) => s.x === x && s.y === y) || rocks.some((r) => r.x === x && r.y === y) ||
  (food && food.x === x && food.y === y) || (bonus && bonus.x === x && bonus.y === y);
function freeCell() {
  for (let i = 0; i < 400; i++) { const x = A.randi(0, COLS - 1), y = A.randi(0, ROWS - 1); if (!occupied(x, y)) return { x, y }; }
  return { x: 0, y: 0 };
}
function speedFor(l) { return Math.max(4, 10 - Math.floor((l - 1) * 0.7)); }
function buildRocks() {
  rocks = [];
  const n = Math.min(26, (level - 1) * 3), h = cur[0];
  for (let i = 0; i < n; i++) {
    for (let k = 0; k < 60; k++) {
      const x = A.randi(0, COLS - 1), y = A.randi(0, ROWS - 1);
      let ok = !occupied(x, y) && Math.abs(x - h.x) + Math.abs(y - h.y) > 5;
      for (let s = 1; s <= 6 && ok; s++) if (x === h.x + dir[0] * s && y === h.y + dir[1] * s) ok = false;
      if (ok) { rocks.push({ x, y, v: A.randi(0, 2) }); break; }
    }
  }
}

function init(G) {
  cur = [{ x: 12, y: 8 }, { x: 11, y: 8 }, { x: 10, y: 8 }, { x: 9, y: 8 }];
  prev = cur.map((s) => ({ ...s }));
  dir = [1, 0]; queue = []; grow = 0; tickT = 0; level = 1; eaten = 0; interval = speedFor(1);
  rocks = []; bonus = null; food = null; flick = 0; dead = false;
  if (wrap === undefined) wrap = false;
  food = freeCell();
}

function levelUp(G) {
  if (level >= MAX_LEVEL) { G.addScore(500); return G.win('Serpent Supreme!', 'You cleared all ' + MAX_LEVEL + ' levels'); }
  level++; eaten = 0; interval = speedFor(level);
  buildRocks();
  A.sfx('power'); G.shake(5);
  G.popup(W / 2, H / 2 - 20, 'LEVEL ' + level, '#fde68a', 34);
  G.ring(px(cur[0].x), py(cur[0].y), '#fde68a', 110, 34);
}

function die(G) {
  dead = true; A.sfx('hurt'); A.sfx('boom'); G.shake(14); G.freeze(8);
  for (const s of cur) G.burst(px(s.x), py(s.y), 4, { color: ['#fb923c', '#fbbf24', '#f87171'], speed: 4, glow: true, life: 36, grav: 0.05 });
  G.over('Burned Out', 'Level ' + level + ' · length ' + cur.length);
}

function tick(G) {
  if (queue.length) dir = queue.shift();
  const old = cur.map((s) => ({ ...s }));
  let nx = cur[0].x + dir[0], ny = cur[0].y + dir[1];
  if (wrap) { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }
  else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return die(G);
  const body = grow > 0 ? cur : cur.slice(0, -1);
  if (body.some((s) => s.x === nx && s.y === ny) || rocks.some((r) => r.x === nx && r.y === ny)) return die(G);
  cur.unshift({ x: nx, y: ny });
  if (grow > 0) grow--; else cur.pop();
  prev = cur.map((s, i) => (old[i] ? old[i] : { ...s }));
  const hx = px(nx), hy = py(ny);
  if (food && nx === food.x && ny === food.y) {
    const pts = Math.round(10 * level * (wrap ? 1 : 1.5));
    G.addScore(pts); grow++; eaten++; A.sfx('eat');
    G.popup(hx, hy - 14, '+' + pts, '#fecaca', 16);
    G.burst(hx, hy, 14, { color: ['#f87171', '#fca5a5', '#fff'], speed: 3.5, glow: true, life: 26 });
    food = null; food = freeCell();
    if (eaten % 5 === 0 && !bonus) { bonus = { ...freeCell(), t: 540 }; A.sfx('select'); }
    if (eaten >= PER_LEVEL) levelUp(G);
  } else if (bonus && nx === bonus.x && ny === bonus.y) {
    const pts = 50 * level;
    G.addScore(pts); grow += 2; A.sfx('gem'); A.sfx('coin');
    G.popup(hx, hy - 14, 'BONUS +' + pts, '#fde68a', 18);
    G.burst(hx, hy, 24, { color: ['#fde68a', '#fbbf24', '#fff'], speed: 4.5, glow: true, life: 34 });
    G.ring(hx, hy, '#fde68a', 70); bonus = null;
  }
}

function update(G) {
  for (const k in DIRS) {
    if (A.hit(k)) {
      const d = DIRS[k], last = queue.length ? queue[queue.length - 1] : dir;
      if (queue.length < 3 && !(d[0] === -last[0] && d[1] === -last[1]) && !(d[0] === last[0] && d[1] === last[1])) { queue.push(d); A.sfx('tick'); }
    }
  }
  if (A.hit('KeyT')) { wrap = !wrap; A.sfx('select'); G.popup(W / 2, 70, wrap ? 'Wrap-around ON' : 'Solid walls (+50% score)', '#a5f3fc', 18); }
  flick++;
  if (bonus && --bonus.t <= 0) bonus = null;
  if (++tickT >= interval) { tickT = 0; tick(G); }
  G.hudL = 'LV ' + level + ' · ' + eaten + '/' + PER_LEVEL + ' · ' + (wrap ? 'WRAP' : 'WALLS') + ' · SCORE ' + G.score;
}

function seg(c, p0, p1, f) {
  let dx = p1.x - p0.x, dy = p1.y - p0.y;
  if (Math.abs(dx) > 1.5 || Math.abs(dy) > 1.5) { dx = 0; dy = 0; f = 1; } // wrapped: snap
  return { x: px(p0.x + dx * f), y: py(p0.y + dy * f) };
}

function draw(G, c) {
  const t = G.clock, f = G.state === 'playing' ? tickT / interval : 1;
  A.sky(c, W, H, ['#0b1220', '#101a2e']);
  // board
  c.save(); c.shadowColor = wrap ? '#38bdf8' : '#fb923c'; c.shadowBlur = 20;
  c.fillStyle = '#0a1a14'; c.fillRect(OX - 4, OY - 4, COLS * C + 8, ROWS * C + 8); c.restore();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { c.fillStyle = (x + y) % 2 ? '#10281f' : '#0d2219'; c.fillRect(OX + x * C, OY + y * C, C, C); }
  c.strokeStyle = wrap ? 'rgba(56,189,248,.7)' : 'rgba(251,146,60,.8)'; c.lineWidth = 3;
  if (wrap) c.setLineDash([10, 8]); c.strokeRect(OX - 2, OY - 2, COLS * C + 4, ROWS * C + 4); c.setLineDash([]);
  // rocks (3D blocks)
  for (const r of rocks) {
    const x = OX + r.x * C + 2, y = OY + r.y * C + 6;
    A.shadow(c, x + C / 2 + 4, y + C - 2, 12, 4, 0.35);
    A.block3d(c, x, y, C - 8, C - 10, 7, ['#64748b', '#78716c', '#6b7280'][r.v]);
  }
  // fruit
  const pulse = 1 + Math.sin(t * 0.12) * 0.08;
  if (food) {
    const x = px(food.x), y = py(food.y);
    A.shadow(c, x + 3, y + 11, 9, 3, 0.35);
    c.save(); c.shadowColor = '#f87171'; c.shadowBlur = 16;
    const g = c.createRadialGradient(x - 3, y - 3, 1, x, y, 11 * pulse); g.addColorStop(0, '#fecaca'); g.addColorStop(1, '#dc2626');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, 10 * pulse, 0, A.TAU); c.fill(); c.restore();
    c.fillStyle = '#4ade80'; c.beginPath(); c.ellipse(x + 3, y - 11, 5, 2.5, -0.5, 0, A.TAU); c.fill();
  }
  if (bonus) {
    const x = px(bonus.x), y = py(bonus.y), k = bonus.t / 540;
    c.save(); c.shadowColor = '#fde68a'; c.shadowBlur = 22;
    c.fillStyle = '#fbbf24'; c.beginPath(); c.moveTo(x, y - 13 * pulse); c.lineTo(x + 10, y); c.lineTo(x, y + 13 * pulse); c.lineTo(x - 10, y); c.closePath(); c.fill();
    c.fillStyle = '#fff7c2'; c.beginPath(); c.moveTo(x, y - 8); c.lineTo(x + 4, y); c.lineTo(x, y + 8); c.lineTo(x - 4, y); c.closePath(); c.fill();
    c.strokeStyle = k < 0.25 && t % 20 < 10 ? '#f87171' : '#fde68a'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 17, -Math.PI / 2, -Math.PI / 2 + A.TAU * k); c.stroke();
    c.restore();
  }
  // serpent body (interpolated)
  const pts = cur.map((s, i) => seg(c, prev[i] || s, s, f));
  for (const p of pts) A.shadow(c, p.x + 3, p.y + 9, 10, 4, 0.3);
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i], k = i / Math.max(1, pts.length - 1);
    const rad = 12.5 - k * 3.5;
    if (i < pts.length - 1) {
      const q = pts[i + 1];
      if (Math.hypot(p.x - q.x, p.y - q.y) < C * 1.4) {
        c.strokeStyle = A.mix('#22c55e', '#0f766e', k); c.lineWidth = rad * 1.9; c.lineCap = 'round';
        c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(q.x, q.y); c.stroke();
      }
    }
    c.fillStyle = A.mix('#4ade80', '#14b8a6', k); c.beginPath(); c.arc(p.x, p.y, rad, 0, A.TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,.14)'; c.beginPath(); c.arc(p.x - 3, p.y - 4, rad * 0.5, 0, A.TAU); c.fill();
    if (i % 2 === 0 && i > 0) { c.fillStyle = 'rgba(15,60,40,.35)'; c.beginPath(); c.arc(p.x, p.y, rad * 0.35, 0, A.TAU); c.fill(); }
  }
  // head
  const h = pts[0], d = dir, ang = Math.atan2(d[1], d[0]);
  c.save(); c.translate(h.x, h.y); c.rotate(ang);
  c.fillStyle = '#86efac'; c.beginPath(); c.ellipse(2, 0, 14, 12, 0, 0, A.TAU); c.fill();
  if (Math.floor(t / 22) % 3 === 0) { c.strokeStyle = '#f43f5e'; c.lineWidth = 2; c.beginPath(); c.moveTo(14, 0); c.lineTo(22, 0); c.moveTo(22, 0); c.lineTo(26, -3); c.moveTo(22, 0); c.lineTo(26, 3); c.stroke(); }
  for (const s of [-1, 1]) {
    c.fillStyle = '#fff'; c.beginPath(); c.arc(7, s * 6, 4, 0, A.TAU); c.fill();
    c.fillStyle = '#052e16'; c.beginPath(); c.arc(8.5, s * 6, 2, 0, A.TAU); c.fill();
  }
  c.restore();
  A.vignette(c, W, H, 0.4);
  G.drawFX(c);
  A.text(c, 'T: toggle wrap/walls · food ×' + (wrap ? '1' : '1.5'), W / 2, H - 8, 12, '#8b93b3', 'center', '600');
}

Arcade.game({
  id: 'ember-serpent', title: 'Ember Serpent', subtitle: 'Eat, grow, survive ten levels', color: '#4ade80',
  help: 'Arrow keys or WASD steer (you can queue turns). Eat fruit; golden gems are timed bonuses. Rocks appear each level. T toggles wrap-around vs solid walls (walls score +50%). P pauses, M mutes.',
  w: W, h: H, touchL: [['◀', 'ArrowLeft'], ['▲', 'ArrowUp']], touchR: [['▼', 'ArrowDown'], ['▶', 'ArrowRight']], init, update, draw,
});
</script>
</body>
</html>
