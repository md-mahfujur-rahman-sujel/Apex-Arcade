<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludo</title>
<style>
  .lu { display: grid; grid-template-columns: minmax(280px, 620px) minmax(240px, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .lu { grid-template-columns: 1fr; } }
  #cv { width: 100%; max-width: 620px; height: auto; border-radius: 14px; box-shadow: 0 20px 50px -20px #000, 0 0 0 6px #2a2f45; cursor: pointer; touch-action: manipulation; }
  .side { display: grid; gap: 12px; }
  .die { font-size: 88px; line-height: 1; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 0 16px; user-select: none; }
  .die.roll { animation: sh .12s linear infinite; }
  @keyframes sh { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  .pl { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .pl.on { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
  .pl i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; }
  .pl span { margin-left: auto; color: var(--muted); font: 600 13px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>

<script src="perf-kit.js"></script>
<script src="save-kit.js"></script>
<script src="meta-config.js"></script>
<script src="meta-kit.js"></script>
<script src="board-kit.js"></script>
<script src="score-bridge.js"></script>
<script src="ui-kit.js"></script>
<script>
const ui = Board.shell({
  id: 'ludo', cpu: true, title: 'Ludo', subtitle: 'Roll a 6 to leave the yard, then race all four tokens home',
  rules: 'Roll a 6 to bring a token onto your start square. Move tokens clockwise round the track, then up your coloured lane; you need the exact number to reach the centre. Landing on a rival (outside a start square or a ★) sends it back to its yard. A 6, a capture or reaching home gives another roll. First to bring all four tokens home wins.',
  controls: [['Space / R', 'Roll the die'], ['1–4 / click', 'Move that token'], ['N', 'New game'], ['H / M', 'Toggle help / mute']],
});
ui.main.innerHTML = `
<div class="lu">
  <canvas id="cv" width="600" height="600"></canvas>
  <div class="side">
    <div class="bk-status" id="status"></div>
    <div class="die" id="die">\u2680</div>
    <button class="bk-btn bk-primary" id="roll" style="font-size:18px;padding:12px 18px">Roll the die</button>
    <div class="bk-row"><label>Opponents <select class="bk-select" id="mode"><option value="1">1 computer</option><option value="2">2 computers</option><option value="3">3 computers</option><option value="0">Local (4 humans)</option></select></label>
      <button class="bk-btn" id="new">New game</button></div>
    <div id="plist" style="display:grid;gap:8px"></div>
  </div>
</div>`;
const $ = (s) => ui.main.querySelector(s), cv = $('#cv'), c = cv.getContext('2d'), U = 40;
const COL = ['#ef4444', '#22c55e', '#eab308', '#3b82f6'], NM = ['Red', 'Green', 'Yellow', 'Blue'];
const FACES = ['\u2680', '\u2681', '\u2682', '\u2683', '\u2684', '\u2685'];
const rot = (x, y, k) => { for (let i = 0; i < k; i++) [x, y] = [14 - y, x]; return [x, y]; };      // rotate a cell 90° clockwise k times
const rotc = (x, y, k) => { for (let i = 0; i < k; i++) [x, y] = [15 - y, x]; return [x, y]; };    // same for a point
const Q = [[1, 6], [2, 6], [3, 6], [4, 6], [5, 6], [6, 5], [6, 4], [6, 3], [6, 2], [6, 1], [6, 0], [7, 0], [8, 0]];
const TRK = [0, 1, 2, 3].flatMap((k) => Q.map(([x, y]) => rot(x, y, k)));                         // 52 track cells, clockwise
const SAFE = new Set([0, 8, 13, 21, 26, 34, 39, 47]), BASE = [[2, 2], [4, 2], [2, 4], [4, 4]];
let players, cur, die, phase, busy, over, moves = [], cpuSel = -1;

const trk = (s, v) => (13 * s + v - 1) % 52;   // track index of a seat's step v (1..51)
function xy(p, i) {
  const s = p.s, v = p.t[i]; let x, y;
  if (v === 0) [x, y] = rotc(BASE[i][0], BASE[i][1], s);
  else if (v <= 51) { [x, y] = TRK[trk(s, v)]; x += .5; y += .5; }
  else if (v <= 56) { [x, y] = rot(v - 51, 7, s); x += .5; y += .5; }
  else [x, y] = rotc(6.45, 6.8 + .4 * i, s);
  return [x, y];
}
function draw() {
  c.fillStyle = '#151a2e'; c.fillRect(0, 0, 600, 600);
  for (let k = 0; k < 4; k++) {
    c.save(); c.translate(300, 300); c.rotate(k * Math.PI / 2); c.translate(-300, -300);
    const col = COL[k]; c.fillStyle = col; c.fillRect(0, 0, 6 * U, 6 * U);
    c.fillStyle = 'rgba(255,255,255,.88)'; c.fillRect(U, U, 4 * U, 4 * U);
    BASE.forEach(([x, y]) => { c.fillStyle = col; c.globalAlpha = .35; c.beginPath(); c.arc(x * U, y * U, 17, 0, 7); c.fill(); c.globalAlpha = 1; });
    c.fillStyle = col; for (let j = 1; j <= 5; j++) c.fillRect(j * U + 1, 7 * U + 1, U - 2, U - 2);
    c.beginPath(); c.moveTo(6 * U, 6 * U); c.lineTo(6 * U, 9 * U); c.lineTo(7.5 * U, 7.5 * U); c.fill(); c.restore();
  }
  TRK.forEach(([x, y], i) => {
    c.fillStyle = i % 13 === 0 ? COL[i / 13] : '#e8ebf6'; c.fillRect(x * U + 1, y * U + 1, U - 2, U - 2);
    if (SAFE.has(i) && i % 13) { c.fillStyle = '#8b93b3'; c.font = '20px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('\u2605', x * U + U / 2, y * U + U / 2 + 1); }
  });
  const items = [], seen = {}, t = Date.now() / 300, me = players[cur];
  players.forEach((p) => p.t.forEach((v, i) => { const [x, y] = xy(p, i); items.push({ p, i, v, x: x * U, y: y * U }); }));
  items.forEach((o) => { if (!o.v || o.v === 57) return; const k = Math.round(o.x) + ',' + Math.round(o.y), n = (seen[k] = (seen[k] || 0) + 1); o.x += (n - 1) * 6; o.y -= (n - 1) * 6; });
  items.forEach((o) => {
    const mv = phase === 'pick' && o.p === me && (me.cpu ? o.i === cpuSel : moves.includes(o.i)), r = o.v === 57 ? 8 : 13;
    c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(o.x + 2, o.y + r * .7, r, r * .45, 0, 0, 7); c.fill();
    c.fillStyle = COL[o.p.s]; c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.beginPath(); c.arc(o.x, o.y, r, 0, 7); c.fill(); c.stroke();
    if (o.v !== 57) { c.fillStyle = 'rgba(0,0,0,.65)'; c.font = '700 12px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(o.i + 1, o.x, o.y + 1); }
    if (mv) { c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.arc(o.x, o.y, r + 4 + Math.sin(t * 3) * 2.5, 0, 7); c.stroke(); }
  });
}
(function loop() { if (players) draw(); requestAnimationFrame(loop); })();

function newGame() {
  const n = +$('#mode').value, seats = n === 0 ? [0, 1, 2, 3] : n === 1 ? [0, 2] : [0, 1, 2, 3].slice(0, n + 1);
  players = seats.map((s, i) => ({ s, t: [0, 0, 0, 0], cpu: n > 0 && i > 0, name: n > 0 ? (i ? 'Computer ' + i : 'You') : NM[s] }));
  cur = 0; die = 0; phase = 'roll'; busy = false; over = false; moves = []; $('#die').textContent = FACES[0];
  upd(); auto();
}
function upd(m) {
  const p = players[cur], vs = players.some((q) => q.cpu);
  $('#status').textContent = m || (over ? p.name + ' won!' : p.cpu ? p.name + ' is rolling…' : (vs ? 'Your turn' : p.name + "'s turn") + ' — roll the die');
  $('#roll').disabled = busy || over || phase !== 'roll' || p.cpu;
  $('#plist').innerHTML = players.map((q, i) => `<div class="pl ${i === cur && !over ? 'on' : ''}"><i style="background:${COL[q.s]}"></i>${q.name}<span>${q.t.filter((v) => v === 57).length}/4 home</span></div>`).join('');
}
const ok = (p, i) => (p.t[i] === 0 ? die === 6 : p.t[i] + die <= 57);
const foe = (p, k) => players.some((q) => q !== p && q.t.some((w) => w >= 1 && w <= 51 && trk(q.s, w) === k));
function auto() { if (!over && players[cur].cpu && phase === 'roll') setTimeout(roll, Board.pace(1300)); }
function cpuPick(p) {
  const skill = Board.level();
  if (skill === 1) return moves[Board.rand(moves.length)];
  const sc = (i) => {
    const v = p.t[i], n = v ? v + die : 1; let s = v;
    if (n === 57) s += skill === 3 ? 180 : 100;
    if (n <= 51) { const k = trk(p.s, n); if (SAFE.has(k)) s += skill === 3 ? 30 : 15; else if (foe(p, k)) s += skill === 3 ? 150 : 80; }
    if (v === 0) s += skill === 3 ? 55 : 40;
    return s + Math.random();
  };
  return moves.slice().sort((a, b) => sc(b) - sc(a))[0];
}
async function roll() {
  if (busy || over || phase !== 'roll') return; busy = true;
  const p = players[cur], d = $('#die'); upd(p.name + ' rolls…'); d.classList.add('roll'); Board.sfx('dice');
  const T = (ms) => Board.sleep(p.cpu ? Board.pace(ms * 1.6) : ms);   /* the computer takes its time */
  for (let i = 0; i < 9; i++) { d.textContent = FACES[Board.rand(6)]; await T(70); }
  die = 1 + Board.rand(6); d.textContent = FACES[die - 1]; d.classList.remove('roll'); await T(350);
  moves = p.t.map((v, i) => i).filter((i) => ok(p, i));
  if (!moves.length) { upd(p.name + ' rolled ' + die + ' — no move'); Board.sfx('error'); await T(1000); return next(false); }
  phase = 'pick'; busy = false;
  if (p.cpu) { const ch = cpuPick(p); cpuSel = ch; upd(p.name + ' rolled ' + die); await T(700); cpuSel = -1; return move(ch); }   /* ring the token it will move */
  if (moves.length === 1) { upd('You rolled ' + die); await T(450); return move(moves[0]); }
  upd(p.name + ' rolled ' + die + ' — pick a token (1–4 or click)');
}
async function move(i) {
  busy = true; phase = 'anim'; upd(); const p = players[cur]; let extra = die === 6, msg = '';
  const T = (ms) => Board.sleep(p.cpu ? Board.pace(ms * 1.6) : ms);
  if (p.t[i] === 0) { p.t[i] = 1; Board.sfx('move'); }
  else for (let s = 0; s < die; s++) { p.t[i]++; Board.sfx('step'); await T(190); }
  const v = p.t[i];
  if (v <= 51) {
    const k = trk(p.s, v);
    if (!SAFE.has(k)) players.forEach((q) => { if (q !== p) q.t.forEach((w, j) => { if (w >= 1 && w <= 51 && trk(q.s, w) === k) { q.t[j] = 0; extra = true; msg = p.name + ' captured ' + q.name + '!'; Board.sfx('capture'); } }); });
  } else if (v === 57) { extra = true; msg = p.name + ' got a token home!'; Board.sfx('ladder'); }
  if (p.t.every((w) => w === 57)) {
    over = true; busy = false; upd(); Board.sfx(p.cpu ? 'lose' : 'win');
    Board.modal(p.cpu ? p.name + ' wins' : p.name === 'You' ? 'You win!' : p.name + ' wins!', 'All four tokens made it home.', [['Play again', newGame], ['Close']]); return;
  }
  next(extra, msg);
}
function next(extra, msg) {
  if (!extra) cur = (cur + 1) % players.length;
  phase = 'roll'; busy = false; moves = [];
  upd(msg || (extra ? players[cur].name + ' rolls again' : undefined)); auto();
}
function pick(i) { if (phase === 'pick' && !busy && !players[cur].cpu && moves.includes(i)) move(i); }

cv.addEventListener('click', (e) => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * 600 / r.width, y = (e.clientY - r.top) * 600 / r.height, p = players[cur];
  let best = -1, bd = 22;
  p.t.forEach((v, i) => { const [a, b] = xy(p, i), d = Math.hypot(a * U - x, b * U - y); if (d < bd) { bd = d; best = i; } });
  if (best >= 0) pick(best);
});
$('#roll').onclick = roll; $('#new').onclick = newGame; $('#mode').onchange = newGame;
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter' || k === 'r') { e.preventDefault(); if (!players[cur].cpu) roll(); }
  else if (k >= '1' && k <= '4') pick(+k - 1);
  else if (k === 'n') newGame();
});
newGame();
</script>
</body>
</html>
